/* ================================================================
   2. UTILITIES — tiny helper functions used everywhere
   ================================================================ */

function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { return a + Math.random() * (b - a); }
function sign(v) { return v < 0 ? -1 : (v > 0 ? 1 : 0); }
// Deterministic "random" from a number, so decorations stay in the same spot each frame.
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
// Do two rectangles overlap? (AABB = axis-aligned bounding box)
function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
// Draw a filled ellipse quickly.
function ellipse(ctx, x, y, rx, ry, rot) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); ctx.fill(); }
// Draw a rounded rectangle path.
function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ================================================================
   3. AUDIO — beeps and boops made with code (no sound files!)
   ================================================================ */

let audioCtx = null;
let muted = false;

// Make the sound engine ready. Browsers only allow sound after a key press.
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

// The magic beep machine: sweeps from one note to another.
function beep(f1, f2, dur, type, vol) {
  if (!audioCtx || muted) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(f1, t);
  if (f2 !== f1) osc.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t + dur);
  gain.gain.setValueAtTime(vol || 0.12, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + dur + 0.03);
}

const SFX = {
  jump()   { beep(220, 520, 0.14, 'square', 0.10); },

  chomp()   { beep(90, 40, 0.12, 'square', 0.14); },                                           // shark snap
  bounce()  { beep(220, 120, 0.12, 'sine', 0.14); },                                           // basketball boing

};

// ---- Very quiet rain hiss (Level 3). Made from code: white noise -> lowpass -> quiet gain.
// M mutes it (we set the gain to 0 when the player mutes).
let rainSrc = null, rainGain = null;
function startRain() {
  if (!audioCtx || rainSrc) return;   // no sound engine yet, or already raining
  try {
    const len = audioCtx.sampleRate * 2;                       // 2 seconds of noise
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;   // random = noise
    rainSrc = audioCtx.createBufferSource();
    rainSrc.buffer = buf; rainSrc.loop = true;
    const filt = audioCtx.createBiquadFilter();
    filt.type = 'lowpass'; filt.frequency.value = 1800;        // softens the hiss
    rainGain = audioCtx.createGain();
    rainGain.gain.value = muted ? 0 : 0.025;                   // VERY quiet
    rainSrc.connect(filt); filt.connect(rainGain); rainGain.connect(audioCtx.destination);
    rainSrc.start();
  } catch (e) { rainSrc = null; rainGain = null; }
}
function stopRain() {
  if (rainSrc) { try { rainSrc.stop(); } catch (e) {} try { rainSrc.disconnect(); } catch (e) {} rainSrc = null; }
  rainGain = null;
}
function setRainMuted() { if (rainGain) rainGain.gain.value = muted ? 0 : 0.025; }

/* ================================================================
   4. ASSET & ANIMATION SYSTEM  (sprite-sheet ready!)
   A "frame" can be:
     { kind:'proc',  draw(ctx, ent) }                         -> drawn with code (what we use now)
     { kind:'sheet', src, sx, sy, sw, sh }                     -> a piece of a picture (plug in later)
   Both kinds travel through the SAME render path, so swapping
   in real sprite sheets later needs zero changes to the game loop.
   ================================================================ */

// Small helper to build a procedural frame.
function procFrame(draw) { return { kind: 'proc', draw: draw }; }

// AssetLoader: looks through every animation, finds any 'sheet' frames,
// and pre-loads those pictures before the game starts.
const AssetLoader = {
  images: {},
  ready: true,
  _pending: 0,
  collect(anims) {
    for (const key in anims) {
      for (const frame of anims[key].frames) {
        if (frame.kind === 'sheet' && !this.images[frame.src]) {
          this._pending++;
          this.ready = false;
          const img = new Image();
          img.onload = img.onerror = () => {
            this.images[frame.src] = img;
            this._pending--;
            if (this._pending <= 0) this.ready = true;
          };
          img.src = frame.src;
          this.images[frame.src] = img;
        }
      }
    }
  }
};

// Advance the animation clock for an entity.
function advanceAnim(ent, dt) {
  ent.animTime += dt;
}
// Switch to a new animation state (resets the clock only when it changes).
function setAnim(ent, state) {
  if (ent.state !== state) { ent.state = state; ent.animTime = 0; }
}
// Work out which frame to show right now.
function currentFrame(ent) {
  const anim = ent.anims[ent.state] || ent.anims.idle;
  let i = Math.floor(ent.animTime * anim.fps);
  if (anim.loop) i = ((i % anim.frames.length) + anim.frames.length) % anim.frames.length;
  else i = clamp(i, 0, anim.frames.length - 1);
  return anim.frames[i];
}

/* ================================================================
   5. PROCEDURAL ART LIBRARY
   Pure drawing functions. They never change game logic — they only paint.
   ================================================================ */

/* ---------------- FIN (the hero) ----------------
   A fluffy royal-blue cube shark with a big friendly red smile. */
function drawFin(ctx, w, h, p) {
  p = p || {};
  const run = p.run || 0;
  const bob = p.bob || 0;
  const blink = !!p.blink;

  const swing = [0, 1, 0, -1][run % 4];

  // little feet (they wiggle when running)
  ctx.fillStyle = COL.blueDark;
  ellipse(ctx, w * 0.34, h - 2.5 + (run ? swing * 1.2 : 0), 5.5, 3.2);
  ellipse(ctx, w * 0.66, h - 2.5 - (run ? swing * 1.2 : 0), 5.5, 3.2);

  // stubby arms
  ellipse(ctx, 2.0, h * 0.62 + bob, 3.6, 6.2);
  ellipse(ctx, w - 2.0, h * 0.62 + bob, 3.6, 6.2);

  // body: a soft rounded cube
  const bx = 2, by = 3 + bob, bw = w - 4, bh = h - 7;
  const g = ctx.createLinearGradient(bx, by, bx + bw, by + bh);
  g.addColorStop(0, COL.blueLight); g.addColorStop(0.55, COL.blue); g.addColorStop(1, COL.blueDark);
  ctx.fillStyle = g;
  roundRect(ctx, bx, by, bw, bh, 9); ctx.fill();

  // fluffy bumps around the edge so it looks fuzzy
  ctx.fillStyle = COL.blue;
  ellipse(ctx, bx + 3, by + 5, 3, 3);
  ellipse(ctx, bx + bw - 3, by + 5, 3, 3);
  ellipse(ctx, bx + 3, by + bh - 5, 3, 3);
  ellipse(ctx, bx + bw - 3, by + bh - 5, 3, 3);

  // top fin (the little shark fin on his head)
  ctx.fillStyle = COL.blueDark;
  ctx.beginPath();
  ctx.moveTo(w * 0.48, by + 2);
  ctx.quadraticCurveTo(w * 0.66, by - 7, w * 0.74, by + 2);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = COL.blueLight;
  ctx.beginPath();
  ctx.moveTo(w * 0.52, by + 1);
  ctx.quadraticCurveTo(w * 0.64, by - 4, w * 0.68, by + 1);
  ctx.closePath(); ctx.fill();

  // cozy red scarf (winter levels only!) — a collar near the top, with a tail
  if (theme && theme.scarf) {
    const sy0 = by + bh * 0.08;
    ctx.fillStyle = '#e03030';
    roundRect(ctx, bx - 1, sy0, bw + 2, 6, 3); ctx.fill();
    ctx.fillStyle = '#a01010';
    ctx.fillRect(bx - 1, sy0 + 1.8, bw + 2, 1.4);
    // a little tail hanging off the back (left) side, swaying as Fin runs
    ctx.fillStyle = '#e03030';
    const sw = Math.sin(time0 * 6) * 1.5;
    ctx.beginPath();
    ctx.moveTo(bx - 1, sy0 + 3);
    ctx.quadraticCurveTo(bx - 7 + sw, sy0 + 10, bx - 3 + sw, sy0 + 17);
    ctx.lineTo(bx + 3, sy0 + 4);
    ctx.closePath(); ctx.fill();
  }

  // pale belly
  ctx.fillStyle = COL.belly;
  ellipse(ctx, w * 0.5, h * 0.74 + bob, w * 0.26, h * 0.19);

  // big friendly red mouth
  const mx = w * 0.5, my = h * 0.68 + bob, mrx = w * 0.33, mry = h * 0.185;
  ctx.fillStyle = COL.red;
  ellipse(ctx, mx, my, mrx, mry);
  ctx.fillStyle = '#b3142a';
  ellipse(ctx, mx, my + mry * 0.5, mrx * 0.85, mry * 0.35);

  // zig-zag teeth (top row points down, bottom row points up)
  ctx.fillStyle = COL.teeth;
  for (let i = -2; i <= 2; i++) {
    const tx = mx + i * mrx * 0.34;
    const ty = my - mry * 0.82;
    ctx.beginPath(); ctx.moveTo(tx - 2.3, ty - 1); ctx.lineTo(tx + 2.3, ty - 1); ctx.lineTo(tx, ty + 3.6); ctx.closePath(); ctx.fill();
  }
  for (let i = -1; i <= 1; i++) {
    const tx = mx + i * mrx * 0.42;
    const ty = my + mry * 0.85;
    ctx.beginPath(); ctx.moveTo(tx - 2.0, ty + 1); ctx.lineTo(tx + 2.0, ty + 1); ctx.lineTo(tx, ty - 3.2); ctx.closePath(); ctx.fill();
  }

  // eyes (low and wide apart, with a sparkle)
  if (blink) {
    ctx.strokeStyle = '#111'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(w * 0.28, h * 0.46 + bob); ctx.lineTo(w * 0.40, h * 0.46 + bob); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(w * 0.60, h * 0.46 + bob); ctx.lineTo(w * 0.72, h * 0.46 + bob); ctx.stroke();
  } else {
    ctx.fillStyle = '#111';
    ellipse(ctx, w * 0.34, h * 0.45 + bob, 2.4, 3.0);
    ellipse(ctx, w * 0.66, h * 0.45 + bob, 2.4, 3.0);
    ctx.fillStyle = '#fff';
    ellipse(ctx, w * 0.34 + 0.9, h * 0.45 + bob - 1, 0.9, 0.9);
    ellipse(ctx, w * 0.66 + 0.9, h * 0.45 + bob - 1, 0.9, 0.9);
  }

  // rim light on the sunny side (top-right)
  ctx.strokeStyle = 'rgba(255,255,255,0.30)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(w * 0.62, by + 6, bw * 0.30, -1.9, -0.7); ctx.stroke();
}

/* ---------------- PUPPY (enemy #1) ----------------
   A tiny round ball puppy: cream face stripe, tan side patches,
   huge blue sparkly eyes and pink blush cheeks. */
function drawPuppy(ctx, w, h, p) {
  p = p || {};
  const walk = p.walk || 0;
  const wob = [0, 1, 0, -1][walk % 4] * 0.6;

  // feet nubs
  ctx.fillStyle = '#efe6cd';
  ellipse(ctx, w * 0.34, h - 2, 4.5, 3);
  ellipse(ctx, w * 0.66, h - 2, 4.5, 3);

  // ears behind the body
  ctx.fillStyle = '#6b4226';
  ellipse(ctx, w * 0.14 + wob, h * 0.42, 5.5, 7);
  ellipse(ctx, w * 0.86 - wob, h * 0.42, 5.5, 7);

  // round cream body
  const cx = w * 0.5, cy = h * 0.52;
  const g = ctx.createRadialGradient(cx - 3, cy - 4, 2, cx, cy, w * 0.55);
  g.addColorStop(0, '#fffaf0'); g.addColorStop(1, '#e8dcbe');
  ctx.fillStyle = g;
  ellipse(ctx, cx, cy + wob, w * 0.46, h * 0.46);

  // tan side patches
  ctx.fillStyle = '#c98a3d';
  ellipse(ctx, w * 0.26, cy + wob, w * 0.24, h * 0.34);
  ellipse(ctx, w * 0.74, cy + wob, w * 0.24, h * 0.34);
  // golden outline
  ctx.strokeStyle = '#e0a24b'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(w * 0.26, cy + wob, w * 0.24, h * 0.34, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(w * 0.74, cy + wob, w * 0.24, h * 0.34, 0, 0, Math.PI * 2); ctx.stroke();

  // HUGE sparkly blue eyes
  ctx.fillStyle = '#1b2a5b';
  ellipse(ctx, w * 0.26, cy + wob, 4.6, 5.4);
  ellipse(ctx, w * 0.74, cy + wob, 4.6, 5.4);
  ctx.fillStyle = '#2f7bd8';
  ellipse(ctx, w * 0.26, cy + wob, 3.4, 4.2);
  ellipse(ctx, w * 0.74, cy + wob, 3.4, 4.2);
  ctx.fillStyle = '#0a1020';
  ellipse(ctx, w * 0.26, cy + wob + 0.6, 1.7, 2.1);
  ellipse(ctx, w * 0.74, cy + wob + 0.6, 1.7, 2.1);
  ctx.fillStyle = '#fff';
  ellipse(ctx, w * 0.26 - 1.2, cy + wob - 1.6, 1.1, 1.3);
  ellipse(ctx, w * 0.74 - 1.2, cy + wob - 1.6, 1.1, 1.3);

  // pink blush
  ctx.fillStyle = 'rgba(240,140,160,0.7)';
  ellipse(ctx, w * 0.26, cy + wob + 5, 3, 2);
  ellipse(ctx, w * 0.74, cy + wob + 5, 3, 2);

  // little nose and w-smile
  ctx.fillStyle = '#5a3a20';
  ctx.beginPath(); ctx.moveTo(cx - 1.8, cy + 4 + wob); ctx.lineTo(cx + 1.8, cy + 4 + wob); ctx.lineTo(cx, cy + 6.4 + wob); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#5a3a20'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx - 4, cy + 7 + wob); ctx.quadraticCurveTo(cx - 2, cy + 9.5 + wob, cx, cy + 7 + wob);
  ctx.quadraticCurveTo(cx + 2, cy + 9.5 + wob, cx + 4, cy + 7 + wob);
  ctx.stroke();
  ctx.fillStyle = '#f08a9a';
  ellipse(ctx, cx, cy + 9.6 + wob, 1.8, 1.3);
}

/* ---------------- BEE (enemy #2) ----------------
   A plump sunshine-yellow bumblebee with fluttery white wings. */
function drawBee(ctx, w, h, p) {
  p = p || {};
  const flap = p.flap || 0;   // 0 or 1
  const wob = p.wob || 0;

  // white wings on top (they flap)
  const wingTilt = flap ? -0.5 : -0.1;
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.save(); ctx.translate(w * 0.5, h * 0.22); ctx.rotate(wingTilt);
  ellipse(ctx, -5, -6, 5, 8); ctx.restore();
  ctx.save(); ctx.translate(w * 0.5, h * 0.22); ctx.rotate(wingTilt * 0.7);
  ellipse(ctx, 5, -7, 5, 8); ctx.restore();
  ctx.strokeStyle = 'rgba(180,200,220,0.8)'; ctx.lineWidth = 0.8;
  ctx.save(); ctx.translate(w * 0.5, h * 0.22); ctx.rotate(wingTilt); ctx.beginPath(); ctx.ellipse(-5, -6, 5, 8, 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore();

  // yellow egg body
  const cx = w * 0.5, cy = h * 0.55 + wob;
  const g = ctx.createRadialGradient(cx - 3, cy - 3, 2, cx, cy, w * 0.55);
  g.addColorStop(0, '#ffe86a'); g.addColorStop(1, '#f2c400');
  ctx.fillStyle = g;
  ellipse(ctx, cx, cy, w * 0.42, h * 0.40);

  // two black stripes wrapping the back
  ctx.strokeStyle = '#222'; ctx.lineWidth = 3.2;
  ctx.beginPath(); ctx.ellipse(cx + 3, cy, w * 0.40, h * 0.34, 0, -0.9, 0.9); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(cx + 7, cy, w * 0.40, h * 0.34, 0, -0.6, 0.6); ctx.stroke();

  // low, far-apart bead eyes
  ctx.fillStyle = '#111';
  ellipse(ctx, w * 0.34, cy + 1, 1.9, 1.9);
  ellipse(ctx, w * 0.66, cy + 1, 1.9, 1.9);
  ctx.fillStyle = '#fff';
  ellipse(ctx, w * 0.34 + 0.6, cy + 0.3, 0.6, 0.6);
  ellipse(ctx, w * 0.66 + 0.6, cy + 0.3, 0.6, 0.6);

  // simple smile
  ctx.strokeStyle = '#111'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.arc(cx, cy + 2.5, 3.4, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();

  // crochet swirl
  ctx.strokeStyle = 'rgba(200,160,0,0.6)'; ctx.lineWidth = 0.9;
  ctx.beginPath(); ctx.arc(cx + 4, cy + 4, 2.2, 0, Math.PI * 1.6); ctx.stroke();
}

/* ---------------- BOOMER (level 1 BOSS) ----------------
   A giant marbled-green dragon plush: cream belly + snout,
   big black dot eyes, silver horns and little bat wings. */
function drawBoomer(ctx, w, h, p) {
  p = p || {};
  const angry = p.angry;
  const flash = p.flash || 0;     // 0..1 white flash when hit
  const squash = p.squash || 1;   // used when defeated
  const cx = w * 0.5, cy = h * 0.55;

  ctx.save();
  ctx.translate(cx, h);
  ctx.scale(1, squash);
  ctx.translate(-cx, -h);

  // little bat wings low on the sides
  ctx.fillStyle = '#2e6b34';
  ctx.beginPath();
  ctx.moveTo(w * 0.18, cy + 6);
  ctx.quadraticCurveTo(w * -0.02, cy - 14, w * 0.06, cy + 16);
  ctx.quadraticCurveTo(w * 0.12, cy + 22, w * 0.20, cy + 16);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(w * 0.82, cy + 6);
  ctx.quadraticCurveTo(w * 1.02, cy - 14, w * 0.94, cy + 16);
  ctx.quadraticCurveTo(w * 0.88, cy + 22, w * 0.80, cy + 16);
  ctx.closePath(); ctx.fill();
  // bronze glitter panels
  ctx.fillStyle = '#c9a86a';
  ellipse(ctx, w * 0.11, cy + 8, 4, 7);
  ellipse(ctx, w * 0.89, cy + 8, 4, 7);

  // big marbled green body
  const g = ctx.createRadialGradient(cx - 14, cy - 16, 6, cx, cy, w * 0.55);
  g.addColorStop(0, '#6fae4a'); g.addColorStop(0.6, '#4c9a3a'); g.addColorStop(1, '#1f6b2e');
  ctx.fillStyle = g;
  ellipse(ctx, cx, cy, w * 0.47, h * 0.47);

  // watercolor blotches
  ctx.fillStyle = 'rgba(166,200,74,0.55)';
  ellipse(ctx, cx - w * 0.18, cy - h * 0.16, w * 0.11, h * 0.10);
  ellipse(ctx, cx + w * 0.16, cy - h * 0.02, w * 0.13, h * 0.11);
  ctx.fillStyle = 'rgba(31,107,46,0.45)';
  ellipse(ctx, cx + w * 0.02, cy + h * 0.22, w * 0.16, h * 0.10);
  ellipse(ctx, cx - w * 0.20, cy + h * 0.10, w * 0.10, h * 0.08);

  // cream belly
  ctx.fillStyle = '#f3efe0';
  ellipse(ctx, cx, cy + h * 0.24, w * 0.24, h * 0.20);

  // rounded cow-like ears
  ctx.fillStyle = '#3f8a37';
  ellipse(ctx, cx - w * 0.34, cy - h * 0.30, w * 0.10, h * 0.09);
  ellipse(ctx, cx + w * 0.34, cy - h * 0.30, w * 0.10, h * 0.09);
  ctx.fillStyle = '#efe6d0';
  ellipse(ctx, cx - w * 0.34, cy - h * 0.30, w * 0.05, h * 0.05);
  ellipse(ctx, cx + w * 0.34, cy - h * 0.30, w * 0.05, h * 0.05);

  // three silver glitter horns
  ctx.fillStyle = '#cfd6dc';
  ctx.beginPath(); ctx.moveTo(cx - w * 0.16, cy - h * 0.38); ctx.lineTo(cx - w * 0.10, cy - h * 0.56); ctx.lineTo(cx - w * 0.04, cy - h * 0.40); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx + w * 0.04, cy - h * 0.40); ctx.lineTo(cx + w * 0.11, cy - h * 0.56); ctx.lineTo(cx + w * 0.16, cy - h * 0.38); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx - w * 0.02, cy - h * 0.40); ctx.lineTo(cx + w * 0.01, cy - h * 0.50); ctx.lineTo(cx + w * 0.04, cy - h * 0.40); ctx.closePath(); ctx.fill();
  // sparkles
  ctx.fillStyle = '#fff';
  ellipse(ctx, cx - w * 0.11, cy - h * 0.48, 1.2, 1.2);
  ellipse(ctx, cx + w * 0.10, cy - h * 0.48, 1.2, 1.2);

  // cream snout with two little nostrils
  ctx.fillStyle = '#f3efe0';
  ellipse(ctx, cx, cy + h * 0.06, w * 0.15, h * 0.11);
  ctx.strokeStyle = '#4c9a3a'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(cx - w * 0.045, cy + h * 0.05, 2, 0.2 * Math.PI, 1.1 * Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx + w * 0.045, cy + h * 0.05, 2, 1.9 * Math.PI, 2.8 * Math.PI); ctx.stroke();

  // big black dot eyes (one a touch higher)
  ctx.fillStyle = '#0c0c0c';
  ellipse(ctx, cx - w * 0.18, cy - h * 0.12, w * 0.045, w * 0.045);
  ellipse(ctx, cx + w * 0.18, cy - h * 0.16, w * 0.045, w * 0.045);

  // angry eyebrows once he has been stomped
  if (angry) {
    ctx.strokeStyle = '#1f4a22'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx - w * 0.25, cy - h * 0.24); ctx.lineTo(cx - w * 0.11, cy - h * 0.19); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + w * 0.25, cy - h * 0.28); ctx.lineTo(cx + w * 0.11, cy - h * 0.22); ctx.stroke();
  }

  // rim light
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, w * 0.47, -1.8, -0.9); ctx.stroke();

  // white hit flash
  if (flash > 0) {
    ctx.globalAlpha = flash * 0.75;
    ctx.fillStyle = '#fff';
    ellipse(ctx, cx, cy, w * 0.47, h * 0.47);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/* ---------------- Coins, pumpkins, trees, signs ---------------- */
function drawCoin(ctx, cx, cy, r, spin) {
  const sx = Math.abs(Math.cos(spin));           // makes the coin look like it is spinning
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(Math.max(0.15, sx), 1);
  ctx.fillStyle = '#f2c94c'; ellipse(ctx, 0, 0, r, r);
  ctx.fillStyle = '#e0a92f'; ellipse(ctx, 0, 0, r * 0.68, r * 0.68);
  // winter coins have a tiny snowflake stamped on them!
  if (theme && theme.coin === 'snowcoin') {
    ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 1.1;
    for (let k = 0; k < 3; k++) {
      const a = k * Math.PI / 3;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * -r * 0.5, Math.sin(a) * -r * 0.5);
      ctx.lineTo(Math.cos(a) * r * 0.5, Math.sin(a) * r * 0.5);
      ctx.stroke();
    }
  }
  ctx.fillStyle = '#fff6c0'; ellipse(ctx, -r * 0.25, -r * 0.25, r * 0.22, r * 0.3);
  ctx.restore();
}

/* ---------------- WINTER ART ---------------- */

// A snow-covered pine tree for the background tree line.
function drawSnowyPine(ctx, x, baseY, s, seed) {
  ctx.save(); ctx.translate(x, baseY); ctx.scale(s, s);
  // trunk
  ctx.fillStyle = '#6f4a24';
  ctx.fillRect(-5, -34, 10, 34);
  // three stacked green tiers, each with a snow cap on top
  const tiers = [
    { y: -30, hw: 34, hh: 32 },
    { y: -54, hw: 27, hh: 26 },
    { y: -74, hw: 20, hh: 22 }
  ];
  for (const t of tiers) {
    ctx.fillStyle = '#2f6b46';
    ctx.beginPath();
    ctx.moveTo(0, t.y - t.hh);
    ctx.lineTo(-t.hw, t.y);
    ctx.lineTo(t.hw, t.y);
    ctx.closePath(); ctx.fill();
    // white snow sitting on the upper part of the tier
    ctx.fillStyle = '#f4faff';
    ctx.beginPath();
    ctx.moveTo(0, t.y - t.hh);
    ctx.lineTo(-t.hw * 0.55, t.y - t.hh * 0.32);
    ctx.lineTo(-t.hw * 0.18, t.y - t.hh * 0.42);
    ctx.lineTo(0, t.y - t.hh * 0.16);
    ctx.lineTo(t.hw * 0.3, t.y - t.hh * 0.46);
    ctx.lineTo(t.hw * 0.55, t.y - t.hh * 0.32);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

// A friendly snowman with a hat or scarf (varies with the seed).
function drawSnowman(ctx, x, baseY, s, seed) {
  ctx.save(); ctx.translate(x, baseY); ctx.scale(s, s);
  // stick arms behind the body
  ctx.strokeStyle = '#6f4a24'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-9, -22); ctx.lineTo(-24, -30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(9, -22); ctx.lineTo(24, -30); ctx.stroke();
  // two stacked snowballs
  ctx.fillStyle = '#f4faff'; ellipse(ctx, 0, -14, 16, 14);
  ctx.fillStyle = '#ffffff'; ellipse(ctx, 0, -36, 11, 10);
  ctx.strokeStyle = 'rgba(160,200,225,0.5)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(0, -14, 16, 14, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, -36, 11, 10, 0, 0, Math.PI * 2); ctx.stroke();
  // coal eyes, carrot nose, buttons
  ctx.fillStyle = '#222';
  ellipse(ctx, -4, -38, 1.7, 1.7); ellipse(ctx, 4, -38, 1.7, 1.7);
  ellipse(ctx, 0, -22, 1.6, 1.6); ellipse(ctx, 0, -15, 1.6, 1.6);
  ctx.fillStyle = '#e8802a';
  ctx.beginPath(); ctx.moveTo(0, -35); ctx.lineTo(9, -33); ctx.lineTo(0, -31); ctx.closePath(); ctx.fill();
  // hat OR scarf for variety
  if (hash(seed) > 0.5) {
    ctx.fillStyle = '#d02030';
    roundRect(ctx, -10, -47, 20, 6, 2); ctx.fill();
    ctx.fillRect(-8, -54, 16, 8);
    ctx.fillStyle = '#fff'; ellipse(ctx, 0, -55, 4, 4);
  } else {
    ctx.fillStyle = '#d02030';
    roundRect(ctx, -10, -47, 20, 5, 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillRect(-3, -47, 4, 5);
    ctx.fillRect(5, -47, 4, 5);
  }
  ctx.restore();
}

// A candy-cane checkpoint pole with a little flag.
function drawCandyCane(ctx, x, baseY, active) {
  ctx.save();
  // striped pole
  for (let i = 0; i < 11; i++) {
    ctx.fillStyle = (i % 2) ? '#e03030' : '#f8f8f8';
    ctx.fillRect(x, baseY - 44 + i * 4, 5, 4);
  }
  // hook at the top
  ctx.strokeStyle = '#f8f8f8'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(x + 8, baseY - 44, 8, Math.PI, 0); ctx.stroke();
  ctx.strokeStyle = '#e03030'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x + 8, baseY - 44, 8, Math.PI, 0); ctx.stroke();
  // small flag (green when this checkpoint is switched on)
  ctx.fillStyle = active ? '#5fbf4a' : '#c0c0c0';
  ctx.beginPath();
  ctx.moveTo(x + 5, baseY - 40);
  ctx.lineTo(x + 30, baseY - 32);
  ctx.lineTo(x + 5, baseY - 24);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// Ice-block tile (used for frozen platforms and the slippery arena floor).
function drawIceBlockTile(ctx, sx, sy, top) {
  ctx.fillStyle = '#8ec9e8';
  roundRect(ctx, sx + 1, sy + 1, TILE - 2, TILE - 2, 5); ctx.fill();
  ctx.fillStyle = '#b8e0f2';
  roundRect(ctx, sx + 2, sy + 2, TILE - 4, TILE - 5, 5); ctx.fill();
  // white corner shine + gloss streak
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.beginPath();
  ctx.moveTo(sx + 5, sy + TILE - 6);
  ctx.lineTo(sx + TILE - 8, sy + 5);
  ctx.lineTo(sx + TILE - 4, sy + 9);
  ctx.lineTo(sx + 9, sy + TILE - 3);
  ctx.closePath(); ctx.fill();
  // a couple of little cracks
  ctx.strokeStyle = 'rgba(120,180,210,0.7)'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(sx + 10, sy + 6); ctx.lineTo(sx + 15, sy + 14);
  ctx.moveTo(sx + 24, sy + 20); ctx.lineTo(sx + 28, sy + 28);
  ctx.stroke();
  if (top) {
    ctx.fillStyle = '#f4faff';
    roundRect(ctx, sx - 1, sy - 3, TILE + 2, 7, 3); ctx.fill();
  }
}

// Snow-topped ground tile.
function drawSnowGroundTile(ctx, sx, sy, hasSolidAbove, col, row) {
  ctx.fillStyle = '#bfe4f2';
  ctx.fillRect(sx, sy, TILE, TILE);
  const v = hash(col * 3.1 + row * 7.7);
  ctx.fillStyle = 'rgba(255,255,255,' + (0.05 + v * 0.06).toFixed(3) + ')';
  ellipse(ctx, sx + 9 + v * 18, sy + 14 + v * 12, 7 + v * 5, 4 + v * 4);
  ctx.fillStyle = 'rgba(120,170,205,0.25)';
  ellipse(ctx, sx + 24 - v * 10, sy + 27, 5, 3);
  if (!hasSolidAbove) {
    ctx.fillStyle = 'rgba(150,195,220,0.35)';
    ctx.fillRect(sx, sy + 7, TILE, 4);
    ctx.fillStyle = '#f4faff';
    roundRect(ctx, sx - 1, sy - 5, TILE + 2, 14, 5); ctx.fill();
    ctx.fillStyle = '#ffffff';
    roundRect(ctx, sx - 1, sy - 5, TILE + 2, 6, 4); ctx.fill();
  }
}

/* ---------------- TURNIP (winter enemy) ----------------
   A little egg-shaped penguin plush with a big silver face patch
   and huge star-sparkle eyes. Black one is slow; red one is angry + fast. */
function drawTurnip(ctx, w, h, p) {
  p = p || {};
  const kind = p.kind || 'black';
  const walk = p.walk || 0;
  const angry = p.angry;
  const dark = kind === 'black';
  const body = dark ? '#1c2440' : '#e03028';
  const bodyHi = dark ? '#2c3c66' : '#f05040';
  const bodyLo = dark ? '#11172c' : '#a01c16';
  const patch = dark ? '#d8dee8' : '#f0eadf';
  const beak = dark ? '#b8c840' : '#e8d040';
  const foot = dark ? '#11172c' : '#e8d040';

  const wob = [0, 1, 0, -1][walk % 4];
  const lean = angry ? 0.09 : 0;   // red turnip leans forward (angry!)

  ctx.save();
  ctx.translate(w * 0.5, h);
  ctx.rotate(lean * (p.flipLean === false ? 1 : 1));
  ctx.translate(-w * 0.5, -h);

  // tiny feet
  ctx.fillStyle = foot;
  ellipse(ctx, w * 0.36, h - 2 + wob * 0.8, 4.5, 3);
  ellipse(ctx, w * 0.64, h - 2 - wob * 0.8, 4.5, 3);

  // little flippers at the sides
  ctx.fillStyle = bodyLo;
  ellipse(ctx, w * 0.10, h * 0.66, 4, 6.5);
  ellipse(ctx, w * 0.90, h * 0.66, 4, 6.5);

  // egg body
  const cx = w * 0.5, cy = h * 0.54;
  const g = ctx.createRadialGradient(cx - 4, cy - 5, 2, cx, cy, w * 0.6);
  g.addColorStop(0, bodyHi); g.addColorStop(0.6, body); g.addColorStop(1, bodyLo);
  ctx.fillStyle = g;
  ellipse(ctx, cx, cy, w * 0.46, h * 0.5);

  // big pale face/belly patch, shaped like the top of a heart
  ctx.fillStyle = patch;
  ctx.beginPath();
  ctx.moveTo(cx, cy - h * 0.05);
  ctx.quadraticCurveTo(cx - w * 0.30, cy - h * 0.42, cx - w * 0.34, cy - h * 0.12);
  ctx.quadraticCurveTo(cx - w * 0.36, cy + h * 0.30, cx, cy + h * 0.46);
  ctx.quadraticCurveTo(cx + w * 0.36, cy + h * 0.30, cx + w * 0.34, cy - h * 0.12);
  ctx.quadraticCurveTo(cx + w * 0.30, cy - h * 0.42, cx, cy - h * 0.05);
  ctx.closePath(); ctx.fill();
  // stitch outline
  ctx.strokeStyle = dark ? 'rgba(150,160,185,0.9)' : 'rgba(200,180,160,0.9)';
  ctx.lineWidth = 1; ctx.stroke();

  // huge sparkly eyes with a star twinkle
  const ex = w * 0.30, ex2 = w * 0.70, ey = cy - h * 0.08;
  for (const X of [ex, ex2]) {
    ctx.fillStyle = '#101828'; ellipse(ctx, X, ey, 4.2, 5.0);
    ctx.fillStyle = '#3f8fe0'; ellipse(ctx, X, ey + 1.2, 3.0, 3.4);
    ctx.fillStyle = '#0a1020'; ellipse(ctx, X, ey + 0.4, 1.5, 1.9);
    ctx.fillStyle = '#fff'; ellipse(ctx, X - 1.2, ey - 1.6, 1.0, 1.2);
    // star sparkle (twinkles over time)
    const tw = 1.4 + Math.sin(time0 * 6 + X) * 0.6;
    ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(X - tw, ey - 2.6); ctx.lineTo(X + tw, ey - 2.6);
    ctx.moveTo(X, ey - 2.6 - tw); ctx.lineTo(X, ey - 2.6 + tw);
    ctx.stroke();
  }

  // pink blush cheeks
  ctx.fillStyle = 'rgba(240,150,170,0.6)';
  ellipse(ctx, ex, ey + 6, 2.6, 1.8);
  ellipse(ctx, ex2, ey + 6, 2.6, 1.8);

  // tiny beak
  ctx.fillStyle = beak;
  ellipse(ctx, cx, cy + h * 0.10, 3.0, 1.8);

  // angry eyebrows for the red turnip
  if (angry) {
    ctx.strokeStyle = '#7a1010'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ex - 4, ey - 7); ctx.lineTo(ex + 3, ey - 4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ex2 + 4, ey - 7); ctx.lineTo(ex2 - 3, ey - 4); ctx.stroke();
  }

  // rim light
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, w * 0.46, -1.9, -0.8); ctx.stroke();

  ctx.restore();
}

/* ---------------- PUFFY PENGUIN (Level 2 BOSS) ----------------
   A giant fluffy blue-and-white penguin: turquoise fur, a huge
   shaggy white belly-bib, tiny black eyes and a golden beak nub. */
function drawPuffy(ctx, w, h, p) {
  p = p || {};
  const angry = p.angry;
  const slide = p.slide;
  const windup = p.windup;
  const bob = p.bob || 0;
  const flash = p.flash || 0;
  const cx = w * 0.5, cy = h * 0.55;

  ctx.save();
  if (slide) {
    // squashed low + leaning forward when belly-sliding
    ctx.translate(cx, h);
    ctx.scale(1.06, 0.9);
    ctx.translate(-cx, -h);
  }

  // big round turquoise body (bottom sits on the ground)
  const g = ctx.createRadialGradient(cx - 16, cy - 18, 8, cx, cy, w * 0.55);
  g.addColorStop(0, '#7fd8f4'); g.addColorStop(0.55, '#33b0dc'); g.addColorStop(1, '#1d7fb0');
  ctx.fillStyle = g;
  ellipse(ctx, cx, cy, w * 0.47, h * 0.46);

  // orange feet in front of the belly at the bottom
  ctx.fillStyle = '#e8a030';
  ellipse(ctx, cx - w * 0.17, h - 3, 12, 6);
  ellipse(ctx, cx + w * 0.17, h - 3, 12, 6);
  ctx.fillStyle = '#c9861f';
  ellipse(ctx, cx - w * 0.17, h - 1, 7, 3);
  ellipse(ctx, cx + w * 0.17, h - 1, 7, 3);

  // floppy side flippers sticking out past the body
  ctx.fillStyle = '#1d7fb0';
  const flip = slide ? 1.0 : 0.35;
  ctx.save(); ctx.translate(w * 0.03, cy + 4); ctx.rotate(flip); ellipse(ctx, 0, 0, 9, 17); ctx.restore();
  ctx.save(); ctx.translate(w * 0.97, cy + 4); ctx.rotate(-flip); ellipse(ctx, 0, 0, 9, 17); ctx.restore();
  ctx.fillStyle = 'rgba(248,252,255,0.85)';
  ctx.save(); ctx.translate(w * 0.03, cy + 8); ctx.rotate(flip); ellipse(ctx, 0, 2, 5, 10); ctx.restore();
  ctx.save(); ctx.translate(w * 0.97, cy + 8); ctx.rotate(-flip); ellipse(ctx, 0, 2, 5, 10); ctx.restore();

  // shaggy fur tufts around the outline
  ctx.fillStyle = '#33b0dc';
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 + 0.4;
    const tx = cx + Math.cos(a) * w * 0.44, ty = cy + Math.sin(a) * h * 0.43;
    ctx.beginPath();
    ctx.moveTo(tx - 5, ty + 5); ctx.lineTo(tx + 2, ty - 7); ctx.lineTo(tx + 6, ty + 5);
    ctx.closePath(); ctx.fill();
  }

  // HUGE white fluffy belly bib
  ctx.fillStyle = '#f8fcff';
  ellipse(ctx, cx, cy + h * 0.14, w * 0.34, h * 0.30);
  for (let i = 0; i < 8; i++) {
    const a = Math.PI * (0.12 + 0.76 * (i / 7));
    ellipse(ctx, cx + Math.cos(a) * w * 0.30, cy + h * 0.14 + Math.sin(a) * h * 0.29, 5.5, 5.5);
  }
  // two tall white lobes around the eyes
  ellipse(ctx, cx - w * 0.14, cy - h * 0.17, w * 0.16, h * 0.17);
  ellipse(ctx, cx + w * 0.14, cy - h * 0.17, w * 0.16, h * 0.17);

  // big glossy eyes with a sparkle
  ctx.fillStyle = '#0c0c0c';
  ellipse(ctx, cx - w * 0.14, cy - h * 0.17, 6.0, 6.2);
  ellipse(ctx, cx + w * 0.14, cy - h * 0.19, 6.0, 6.2);
  ctx.fillStyle = '#fff';
  ellipse(ctx, cx - w * 0.14 - 1.8, cy - h * 0.17 - 2.2, 2.1, 2.2);
  ellipse(ctx, cx + w * 0.14 - 1.8, cy - h * 0.19 - 2.2, 2.1, 2.2);

  // little golden beak nub
  ctx.fillStyle = '#f0c030';
  ellipse(ctx, cx, cy - h * 0.05, 5, 3.6);
  ctx.fillStyle = '#d9a010';
  ellipse(ctx, cx, cy - h * 0.05 + 1.5, 3.4, 1.7);

  // angry brows after the first stomp
  if (angry) {
    ctx.strokeStyle = '#134a6a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx - w * 0.21, cy - h * 0.25); ctx.lineTo(cx - w * 0.08, cy - h * 0.21); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + w * 0.21, cy - h * 0.27); ctx.lineTo(cx + w * 0.08, cy - h * 0.22); ctx.stroke();
  }

  // wobbly spiky crown tuft
  ctx.save();
  ctx.translate(cx, cy - h * 0.43);
  ctx.rotate(Math.sin(time0 * 6) * 0.15);
  ctx.fillStyle = '#33b0dc';
  ctx.beginPath();
  ctx.moveTo(-8, 4); ctx.lineTo(-3, -12); ctx.lineTo(1, 2);
  ctx.lineTo(6, -10); ctx.lineTo(9, 4); ctx.closePath(); ctx.fill();
  ctx.restore();

  // rim light
  ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, w * 0.47, -1.9, -0.8); ctx.stroke();

  // slide wind-up warning: a red "!" plus a puff at his feet
  if (windup) {
    const wob = Math.sin(time0 * 30) * 3;
    ctx.font = 'bold 36px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff';
    ctx.strokeText('!', cx + wob, cy - h * 0.62);
    ctx.fillStyle = '#ff3b30';
    ctx.fillText('!', cx + wob, cy - h * 0.62);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ellipse(ctx, cx - w * 0.22, h - 6, 7, 4);
    ellipse(ctx, cx + w * 0.22, h - 6, 7, 4);
  }

  // white hit flash
  if (flash > 0) {
    ctx.globalAlpha = flash * 0.7;
    ctx.fillStyle = '#fff';
    ellipse(ctx, cx, cy, w * 0.47, h * 0.46);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

// Animated pit liquid for the gaps (ice, ocean water, or a shallow city puddle).
function drawWater(ctx) {
  for (const z of waterZones) {
    const x = z.x - cam.x, w = z.w;
    if (x > VIEW_W || x + w < 0) continue;
    if (z.kind === 'quicksand') continue;     // quicksand is drawn over Fin later
    const y = z.surfaceY - cam.y;
    const g = ctx.createLinearGradient(0, y, 0, VIEW_H);
    if (z.kind === 'puddle') {
      g.addColorStop(0, 'rgba(150,175,200,0.75)');
      g.addColorStop(1, 'rgba(90,110,135,0.85)');
    } else if (z.kind === 'water') {
      g.addColorStop(0, 'rgba(90,180,230,0.85)');
      g.addColorStop(1, 'rgba(30,110,180,0.92)');
    } else {
      g.addColorStop(0, 'rgba(127,208,240,0.85)');
      g.addColorStop(1, 'rgba(47,143,208,0.92)');
    }
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, VIEW_H - y);
    // wavy white surface line
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let px = 0; px <= w; px += 6) {
      const wy = y + Math.sin((px + x) * 0.05 + time0 * 3) * 3;
      if (px === 0) ctx.moveTo(x + px, wy); else ctx.lineTo(x + px, wy);
    }
    ctx.stroke();
    // twinkling sparkles
    for (let i = 0; i < 6; i++) {
      const gx = x + hash(z.colA * 7 + i) * w;
      const gy = y + 8 + hash(z.colA * 3 + i) * Math.max(4, VIEW_H - y) * 0.7;
      ctx.globalAlpha = 0.25 + 0.55 * Math.abs(Math.sin(time0 * 4 + i));
      ctx.fillStyle = '#ffffff';
      ellipse(ctx, gx, gy, 2, 2);
      ctx.globalAlpha = 1;
    }
    // a lighter reflection streak on puddles
    if (z.kind === 'puddle') {
      ctx.fillStyle = 'rgba(220,235,250,0.25)';
      ellipse(ctx, x + w * 0.5, y + 8, w * 0.4, 3);
    }
  }
}

// The see-through ice cube Fin gets trapped in when he falls in the water.
function drawIceCube(ctx) {
  const sx = player.x - cam.x - 4, sy = player.y - cam.y - 4;
  const w = player.w + 8, h = player.h + 8;
  ctx.save();
  ctx.fillStyle = 'rgba(205,238,255,0.55)';
  roundRect(ctx, sx, sy, w, h, 6); ctx.fill();
  ctx.strokeStyle = '#eaf8ff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(sx + 4, sy + h - 6); ctx.lineTo(sx + w * 0.5, sy + 4); ctx.stroke();
  if (player.frozen < 0.45) {
    ctx.strokeStyle = 'rgba(127,184,216,0.95)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(sx + w * 0.4, sy + 2); ctx.lineTo(sx + w * 0.5, sy + h * 0.5); ctx.lineTo(sx + w * 0.3, sy + h - 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx + w * 0.72, sy + 2); ctx.lineTo(sx + w * 0.6, sy + h * 0.6); ctx.stroke();
  }
  ctx.restore();
}

function drawPumpkin(ctx, x, baseY, s) {
  ctx.save(); ctx.translate(x, baseY); ctx.scale(s, s);
  // stem
  ctx.fillStyle = '#5a7a2a';
  ctx.fillRect(-2.5, -30, 5, 8);
  // body: several rounded ribs
  ctx.fillStyle = '#e07b1e';
  ellipse(ctx, 0, -12, 18, 15);
  ctx.fillStyle = '#c9621a';
  ellipse(ctx, -8, -12, 8, 15);
  ellipse(ctx, 8, -12, 8, 15);
  ctx.fillStyle = '#f0942e';
  ellipse(ctx, 0, -12, 9, 15);
  // cute friendly face
  ctx.fillStyle = '#7a3a10';
  ctx.beginPath(); ctx.moveTo(-7, -15); ctx.lineTo(-3, -15); ctx.lineTo(-5, -11); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(7, -15); ctx.lineTo(3, -15); ctx.lineTo(5, -11); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#7a3a10'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(0, -10, 6, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  ctx.restore();
}

function drawFallTree(ctx, x, baseY, s, seed) {
  const colors = ['#e8792b', '#d94f2b', '#f2b134', '#e0632a'];
  const c1 = colors[Math.floor(hash(seed) * colors.length)];
  const c2 = colors[Math.floor(hash(seed + 5) * colors.length)];
  ctx.save(); ctx.translate(x, baseY); ctx.scale(s, s);
  // trunk
  ctx.fillStyle = '#6f4a24';
  ctx.fillRect(-5, -46, 10, 46);
  ctx.fillStyle = '#8a5a2b';
  ctx.fillRect(-5, -46, 4, 46);
  // canopy: three fluffy circles
  ctx.fillStyle = c1;
  ellipse(ctx, 0, -58, 30, 26);
  ctx.fillStyle = c2;
  ellipse(ctx, -18, -50, 20, 18);
  ellipse(ctx, 18, -52, 19, 17);
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ellipse(ctx, -8, -66, 14, 10);
  ctx.restore();
}

function drawSign(ctx, x, baseY, text) {
  ctx.save(); ctx.translate(x, baseY);
  const long = text.length > 10;
  const bw = long ? 94 : 68;
  const fs = long ? 10 : 11;
  ctx.fillStyle = '#6f4a24';
  ctx.fillRect(-3, -26, 6, 26);
  ctx.fillStyle = '#9a6b3a';
  roundRect(ctx, -bw / 2, -52, bw, 28, 5); ctx.fill();
  ctx.fillStyle = '#b98247';
  roundRect(ctx, -bw / 2, -52, bw, 28, 5); ctx.strokeStyle = '#6f4a24'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#3a2410';
  ctx.font = 'bold ' + fs + 'px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 0, -38);
  ctx.restore();
}

/* ---------------- MONKEY (enemy, L3 + L4) ----------------
   A tiny squishy plush monkey: one round purple blob, a heart-shaped cream
   face patch with a stitched edge, big glossy eyes and pink blush. */
function drawMonkey(ctx, w, h, p) {
  p = p || {};
  const walk = p.walk || 0;
  const angry = p.angry;
  const wob = [0, 1, 0, -1][walk % 4] * 0.7;
  const cx = w * 0.5, cy = h * 0.52;

  // stub cream feet (they shuffle when running)
  ctx.fillStyle = '#EFE8C8';
  ellipse(ctx, w * 0.36, h - 2 + wob * 0.8, 4.2, 2.8);
  ellipse(ctx, w * 0.64, h - 2 - wob * 0.8, 4.2, 2.8);

  // little flipper arms on the sides (cream)
  ctx.fillStyle = '#EFE8C8';
  ellipse(ctx, 2.2, h * 0.60 + wob, 3.2, 5.2);
  ellipse(ctx, w - 2.2, h * 0.60 - wob, 3.2, 5.2);

  // round ears behind the head (cream inside; one grayish, one pinkish)
  ctx.fillStyle = '#9B59D0';
  ellipse(ctx, w * 0.17, h * 0.19, 5.4, 5.4);
  ellipse(ctx, w * 0.83, h * 0.19, 5.4, 5.4);
  ctx.fillStyle = '#C9C3D9'; ellipse(ctx, w * 0.17, h * 0.19, 5.4, 5.4);
  ctx.fillStyle = '#D9C3BE'; ellipse(ctx, w * 0.83, h * 0.19, 5.4, 5.4);
  ctx.fillStyle = '#EFE8C8';
  ellipse(ctx, w * 0.17, h * 0.19, 2.6, 2.6);
  ellipse(ctx, w * 0.83, h * 0.19, 2.6, 2.6);

  // squashed sphere body
  const g = ctx.createRadialGradient(cx - 4, cy - 5, 2, cx, cy, w * 0.6);
  g.addColorStop(0, '#A56BDB'); g.addColorStop(0.6, '#9B59D0'); g.addColorStop(1, '#7d43ad');
  ctx.fillStyle = g;
  ellipse(ctx, cx, cy, w * 0.46, h * 0.47);

  // faint vertical seam on top
  ctx.strokeStyle = 'rgba(120,70,160,0.5)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx, cy - h * 0.44); ctx.lineTo(cx, cy - h * 0.18); ctx.stroke();

  // heart-shaped cream face patch (notch dip at the top)
  ctx.fillStyle = '#EFE8C8';
  ctx.beginPath();
  ctx.moveTo(cx, cy - h * 0.02);
  ctx.quadraticCurveTo(cx - w * 0.34, cy - h * 0.40, cx - w * 0.35, cy + h * 0.02);
  ctx.quadraticCurveTo(cx - w * 0.34, cy + h * 0.38, cx, cy + h * 0.44);
  ctx.quadraticCurveTo(cx + w * 0.34, cy + h * 0.38, cx + w * 0.35, cy + h * 0.02);
  ctx.quadraticCurveTo(cx + w * 0.34, cy - h * 0.40, cx, cy - h * 0.02);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#8B6A2B'; ctx.lineWidth = 1.2; ctx.stroke();

  // big round glossy eyes with a purple ring + sparkle
  const ex = w * 0.30, ex2 = w * 0.70, ey = cy - h * 0.04;
  for (const X of [ex, ex2]) {
    ctx.fillStyle = '#8E4FC8'; ellipse(ctx, X, ey, 4.5, 4.5);
    ctx.fillStyle = '#111'; ellipse(ctx, X, ey, 3.6, 3.6);
    ctx.fillStyle = '#fff'; ellipse(ctx, X - 1.1, ey - 1.2, 1.1, 1.1);
  }
  // pink blush at the lower-outer edge
  ctx.fillStyle = 'rgba(244,182,190,0.8)';
  ellipse(ctx, w * 0.16, ey + 5.5, 2.6, 1.8);
  ellipse(ctx, w * 0.84, ey + 5.5, 2.6, 1.8);

  // tiny brown "w" smile low and centered
  ctx.strokeStyle = '#6b4a24'; ctx.lineWidth = 1.1;
  ctx.beginPath();
  ctx.moveTo(cx - 3.4, cy + h * 0.16);
  ctx.quadraticCurveTo(cx - 1.7, cy + h * 0.24, cx, cy + h * 0.16);
  ctx.quadraticCurveTo(cx + 1.7, cy + h * 0.24, cx + 3.4, cy + h * 0.16);
  ctx.stroke();

  // angry slanted red "V" eyebrows
  if (angry) {
    ctx.strokeStyle = '#b3202a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ex - 4, ey - 8); ctx.lineTo(ex + 3, ey - 4.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ex2 + 4, ey - 8); ctx.lineTo(ex2 - 3, ey - 4.5); ctx.stroke();
  }

  // soft rim light
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(cx, cy, w * 0.46, -1.9, -0.8); ctx.stroke();
}

/* ---------------- SHARKY (enemy, L3 + L4) ----------------
   A chubby plush shark. Underwater only a dorsal fin + ripples show (warning);
   when he leaps, the whole body pops out with a big toothy mouth. */
function drawSharky(ctx, w, h, p) {
  p = p || {};
  if (p.hidden) {
    // ripple rings on the water surface
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    for (let i = 0; i < 2; i++) {
      ctx.globalAlpha = 0.5 - i * 0.18;
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.ellipse(w * 0.5, h - 5, 11 + i * 7, 3 + i * 2, 0, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // the fin, shaking while warning
    const sh = p.warn ? Math.sin(time0 * 40) * 2 : 0;
    ctx.fillStyle = '#8f8d78';
    ctx.beginPath();
    ctx.moveTo(w * 0.40 + sh, h * 0.32);
    ctx.quadraticCurveTo(w * 0.54 + sh, -6, w * 0.68 + sh, h * 0.32);
    ctx.closePath(); ctx.fill();
    if (p.warn) {
      const bob = Math.sin(time0 * 10) * 3;
      ctx.font = 'bold 20px system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 3; ctx.strokeStyle = '#fff';
      ctx.strokeText('!', w * 0.54, -14 + bob);
      ctx.fillStyle = '#ff3b30';
      ctx.fillText('!', w * 0.54, -14 + bob);
    }
    return;
  }

  // whole shark, tilted to match the leap (nose up rising, nose down falling)
  ctx.save();
  ctx.translate(w * 0.5, h * 0.5);
  ctx.rotate(clamp((p.vy || 0) / 1500, -0.9, 0.9));
  ctx.translate(-w * 0.5, -h * 0.5);

  // tail fin
  ctx.fillStyle = '#8f8d78';
  ctx.beginPath();
  ctx.moveTo(w * 0.06, h * 0.5);
  ctx.lineTo(-w * 0.22, h * 0.14);
  ctx.lineTo(-w * 0.16, h * 0.52);
  ctx.lineTo(-w * 0.24, h * 0.86);
  ctx.closePath(); ctx.fill();

  // egg-shaped body
  const g = ctx.createRadialGradient(w * 0.42, h * 0.36, 2, w * 0.5, h * 0.5, w * 0.6);
  g.addColorStop(0, '#b8b6a0'); g.addColorStop(0.6, '#A8A68F'); g.addColorStop(1, '#8a8874');
  ctx.fillStyle = g;
  ellipse(ctx, w * 0.5, h * 0.5, w * 0.46, h * 0.44);

  // cream belly + lower jaw
  ctx.fillStyle = '#E8E4D4';
  ellipse(ctx, w * 0.62, h * 0.64, w * 0.34, h * 0.30);

  // dorsal fin on top
  ctx.fillStyle = '#8f8d78';
  ctx.beginPath();
  ctx.moveTo(w * 0.36, h * 0.16);
  ctx.quadraticCurveTo(w * 0.5, -h * 0.18, w * 0.64, h * 0.16);
  ctx.closePath(); ctx.fill();

  // pectoral flipper
  ctx.fillStyle = '#8f8d78';
  ctx.beginPath();
  ctx.moveTo(w * 0.5, h * 0.68);
  ctx.quadraticCurveTo(w * 0.34, h * 0.94, w * 0.58, h * 0.82);
  ctx.closePath(); ctx.fill();

  // gill stitches
  ctx.strokeStyle = '#6E6B5C'; ctx.lineWidth = 1.2;
  for (let i = 0; i < 3; i++) {
    const gx = w * 0.30 + i * 3;
    ctx.beginPath(); ctx.moveTo(gx, h * 0.34); ctx.quadraticCurveTo(gx - 2, h * 0.46, gx, h * 0.58); ctx.stroke();
  }

  // one big glossy black bead eye
  ctx.fillStyle = '#111'; ellipse(ctx, w * 0.30, h * 0.36, 2.6, 2.6);
  ctx.fillStyle = '#fff'; ellipse(ctx, w * 0.30 - 0.8, h * 0.36 - 0.8, 0.9, 0.9);

  // huge bright-red crescent mouth with zig-zag teeth
  const open = p.open || 0;
  const mh = h * (0.10 + 0.22 * open);
  ctx.fillStyle = '#E8261C';
  ctx.beginPath();
  ctx.moveTo(w * 0.42, h * 0.44);
  ctx.quadraticCurveTo(w * 0.90, h * 0.40, w * 0.86, h * (0.70 + open * 0.10));
  ctx.quadraticCurveTo(w * 0.62, h * (0.70 + open * 0.14), w * 0.42, h * 0.60);
  ctx.closePath(); ctx.fill();
  // teeth (top row points down, bottom row points up)
  ctx.fillStyle = '#fdf6e3';
  const tx0 = w * 0.48, tx1 = w * 0.82;
  for (let i = 0; i <= 4; i++) {
    const tx = lerp(tx0, tx1, i / 4);
    const ty = h * (0.46 + i * 0.012);
    ctx.beginPath(); ctx.moveTo(tx - 2, ty); ctx.lineTo(tx + 2, ty); ctx.lineTo(tx, ty + 3.6); ctx.closePath(); ctx.fill();
  }
  for (let i = 0; i <= 3; i++) {
    const tx = lerp(tx0 + 3, tx1 - 2, i / 3);
    const ty = h * (0.58 + i * 0.02);
    ctx.beginPath(); ctx.moveTo(tx - 1.8, ty); ctx.lineTo(tx + 1.8, ty); ctx.lineTo(tx, ty - 3.2); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

/* ---------------- BASKETBALL (Level 3 boss) ----------------
   A huge plush basketball with a calm little face and two noodle legs. */
function drawBasketball(ctx, w, h, p) {
  p = p || {};
  const cx = w * 0.5, cy = h * 0.41, r = w * 0.47;   // ball in the top part of the box
  const angry = p.angry;
  const flash = p.flash || 0;

  // noodle legs (flail while airborne)
  const flail = p.air ? Math.sin((p.t || 0) * 18) * 0.5 : 0;
  function leg(lx, dir) {
    ctx.save();
    ctx.translate(lx, h * 0.80);
    ctx.rotate(flail * dir);
    ctx.fillStyle = '#8A8A8A'; roundRect(ctx, -3, 0, 6, 20, 3); ctx.fill();
    ctx.fillStyle = '#F4F1EA'; roundRect(ctx, -4.5, 18, 9, 8, 3); ctx.fill();       // sock
    // chunky sneaker
    ctx.fillStyle = '#D8202F'; roundRect(ctx, -7, 24, 16, 9, 4); ctx.fill();
    ctx.fillStyle = '#F0ECE0'; roundRect(ctx, -7, 26, 16, 4, 3); ctx.fill();
    ctx.fillStyle = '#1A1A22'; roundRect(ctx, -7, 31, 16, 4, 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(-5 + (dir > 0 ? 2 : 0), 25, 3, 3);
    ctx.restore();
  }
  leg(cx - 10, 1); leg(cx + 10, -1);

  // the big ball
  const g = ctx.createRadialGradient(cx - 16, cy - 18, 6, cx, cy, r);
  g.addColorStop(0, '#D9623A'); g.addColorStop(0.6, '#C8502A'); g.addColorStop(1, '#9c3a1e');
  ctx.fillStyle = g;
  ellipse(ctx, cx, cy, r, r);

  // classic navy seam lines
  ctx.strokeStyle = '#151520'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(cx, cy - 4, r * 0.98, r * 0.55, 0, 0, Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(cx, cy + 8, r * 0.98, r * 0.55, 0, Math.PI, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - r, cy - 6); ctx.quadraticCurveTo(cx - r * 0.55, cy, cx - r + 2, cy + 6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + r, cy - 6); ctx.quadraticCurveTo(cx + r * 0.55, cy, cx + r - 2, cy + 6); ctx.stroke();

  // tiny face on the middle band
  ctx.fillStyle = '#111';
  ellipse(ctx, cx - 11, cy + 2, 2.2, 2.4);
  ellipse(ctx, cx + 11, cy + 2, 2.2, 2.4);
  ctx.fillStyle = '#fff';
  ellipse(ctx, cx - 11.8, cy + 1, 0.8, 0.8);
  ellipse(ctx, cx + 10.2, cy + 1, 0.8, 0.8);
  ctx.strokeStyle = '#151520'; ctx.lineWidth = 1.6;
  ctx.beginPath();
  if (angry) ctx.arc(cx, cy + 12, 6, 1.15 * Math.PI, 1.85 * Math.PI);
  else ctx.arc(cx, cy + 5, 6, 0.15 * Math.PI, 0.85 * Math.PI);
  ctx.stroke();
  if (angry) {
    ctx.strokeStyle = '#151520'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx - 15, cy - 3); ctx.lineTo(cx - 7, cy - 1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + 15, cy - 3); ctx.lineTo(cx + 7, cy - 1); ctx.stroke();
  }

  if (flash > 0) { ctx.globalAlpha = flash * 0.7; ctx.fillStyle = '#fff'; ellipse(ctx, cx, cy, r, r); ctx.globalAlpha = 1; }
}

/* ---------------- BLUE BEAR (Level 4 boss) ----------------
   A big old fluffy teddy with sausage-mitten arms he swats with. */
function drawBlueBear(ctx, w, h, p) {
  p = p || {};
  const angry = p.angry;
  const flash = p.flash || 0;
  const cx = w * 0.5, cy = h * 0.55;
  const fur = '#A8D5D0', furDark = '#8FC2BE', cream = '#F3EBD3';

  // fluffy scribble bumps around the silhouette
  ctx.fillStyle = furDark;
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2;
    ellipse(ctx, cx + Math.cos(a) * w * 0.40, cy + Math.sin(a) * h * 0.42, 8, 8);
  }

  // pear-shaped body
  const g = ctx.createRadialGradient(cx - 14, cy - 16, 6, cx, cy, w * 0.55);
  g.addColorStop(0, '#B6DED9'); g.addColorStop(0.6, fur); g.addColorStop(1, furDark);
  ctx.fillStyle = g;
  ellipse(ctx, cx, cy + h * 0.06, w * 0.42, h * 0.40);

  // big round head sitting right on the body
  ctx.fillStyle = fur;
  ellipse(ctx, cx, cy - h * 0.22, w * 0.32, h * 0.28);
  // ears
  ctx.fillStyle = fur;
  ellipse(ctx, cx - w * 0.24, cy - h * 0.42, w * 0.10, h * 0.09);
  ellipse(ctx, cx + w * 0.24, cy - h * 0.42, w * 0.10, h * 0.09);
  ctx.fillStyle = cream;
  ellipse(ctx, cx - w * 0.24, cy - h * 0.42, w * 0.05, h * 0.045);
  ellipse(ctx, cx + w * 0.24, cy - h * 0.42, w * 0.05, h * 0.045);

  // cream muzzle + nose + mouth
  ctx.fillStyle = cream;
  ellipse(ctx, cx, cy - h * 0.10, w * 0.16, h * 0.12);
  ctx.fillStyle = '#8A4B55';
  ellipse(ctx, cx, cy - h * 0.15, 4, 3);
  ctx.strokeStyle = '#6b3a44'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(cx, cy - h * 0.12); ctx.quadraticCurveTo(cx - 4, cy - h * 0.06, cx - 6, cy - h * 0.08); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy - h * 0.12); ctx.quadraticCurveTo(cx + 4, cy - h * 0.06, cx + 6, cy - h * 0.08); ctx.stroke();

  // tiny black-brown bead eyes
  ctx.fillStyle = '#1E1A1A';
  ellipse(ctx, cx - w * 0.12, cy - h * 0.26, 2.6, 2.6);
  ellipse(ctx, cx + w * 0.12, cy - h * 0.26, 2.6, 2.6);
  // stitch at the top corners
  ctx.strokeStyle = '#5a4a44'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx - w * 0.15, cy - h * 0.30); ctx.lineTo(cx - w * 0.10, cy - h * 0.31); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + w * 0.15, cy - h * 0.30); ctx.lineTo(cx + w * 0.10, cy - h * 0.31); ctx.stroke();

  // long cream belly patch
  ctx.fillStyle = cream;
  ellipse(ctx, cx, cy + h * 0.10, w * 0.20, h * 0.26);

  // grumpy brows after the first stomp
  if (angry) {
    ctx.strokeStyle = '#5a7f7a'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(cx - w * 0.19, cy - h * 0.31); ctx.lineTo(cx - w * 0.06, cy - h * 0.28); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + w * 0.19, cy - h * 0.31); ctx.lineTo(cx + w * 0.06, cy - h * 0.28); ctx.stroke();
  }

  // ---- SAUSAGE MITTEN ARMS (pivot at the shoulders) ----
  function arm(sx, sy, angle, len) {
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(angle);
    ctx.fillStyle = fur;
    roundRect(ctx, 0, -11, len, 22, 10); ctx.fill();
    ctx.strokeStyle = furDark; ctx.lineWidth = 1.2;
    roundRect(ctx, 0, -11, len, 22, 10); ctx.stroke();
    ctx.fillStyle = cream; ellipse(ctx, len - 4, 0, 6, 6);   // cream paw tip
    ctx.restore();
  }
  let aL, aR;
  if (p.slam) { aL = Math.PI - 0.9; aR = -0.9; }        // both arms up (overhead slam)
  else {
    aL = Math.PI + (p.armL !== undefined ? p.armL : 0.5);   // left arm hangs down-left
    aR = (p.armR !== undefined ? p.armR : -0.5);            // right arm extends right
  }
  const armLen = p.swat ? w * 0.62 : w * 0.30;             // reach stretches out during a swat
  arm(cx - w * 0.26, cy - h * 0.06, aL, armLen);
  arm(cx + w * 0.26, cy - h * 0.06, aR, armLen);
  // a light sweep streak so the swat's reach is easy to see
  if (p.swat) {
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(cx + w * 0.1, cy - h * 0.06, w * 0.62, -0.55, 0.55); ctx.stroke();
  }

  // short stubby legs with round cream foot pads
  ctx.fillStyle = furDark;
  ellipse(ctx, cx - w * 0.14, h - 6, 11, 8);
  ellipse(ctx, cx + w * 0.14, h - 6, 11, 8);
  ctx.fillStyle = cream;
  ellipse(ctx, cx - w * 0.14, h - 5, 6, 4.5);
  ellipse(ctx, cx + w * 0.14, h - 5, 6, 4.5);

  // a bobbing red "!" while he winds up
  if (p.alert) {
    const bob = Math.sin(time0 * 14) * 3;
    ctx.font = 'bold 30px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 4; ctx.strokeStyle = '#fff';
    ctx.strokeText('!', cx, cy - h * 0.66 + bob);
    ctx.fillStyle = '#ff3b30';
    ctx.fillText('!', cx, cy - h * 0.66 + bob);
  }

  if (flash > 0) { ctx.globalAlpha = flash * 0.7; ctx.fillStyle = '#fff'; ellipse(ctx, cx, cy, w * 0.42, h * 0.5); ctx.globalAlpha = 1; }
}

/* ---------------- ACCESSORIES (hats / shades / shovel+pail) ----------------
   Drawn on top of an enemy in its local box (0,0 top-left, facing right).
   The anchor spots come from a table so they line up nicely. */
const ACC_ANCHORS = {
  puppy:   { eyes: [7.8, 22.2, 13.5], head: [15, 3], hand: [26, 20] },
  bee:     { eyes: [8.8, 17.2, 13],   head: [13, 4], hand: [22, 16] },
  turnip:  { eyes: [9, 21, 12],       head: [15, 2], hand: [27, 17] },
  monkey:  { eyes: [9, 21, 14],       head: [15, 1], hand: [27, 19] },
  sharky:  { eyes: [21, 11.4],        head: [17, 2], hand: [28, 22] }
};
function drawAccessory(ctx, acc, type, w, h) {
  if (!acc) return;
  const A = ACC_ANCHORS[type] || ACC_ANCHORS.puppy;
  if (acc === 'shades') {
    ctx.fillStyle = '#222';
    if (type === 'sharky') {
      // one lens on his single eye + a temple arm
      ctx.fillStyle = '#1a1a1a';
      roundRect(ctx, A.eyes[0] - 5, A.eyes[1] - 3, 11, 6, 3); ctx.fill();
      ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(A.eyes[0] + 6, A.eyes[1]); ctx.lineTo(A.eyes[0] + 13, A.eyes[1] - 1); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.8)'; ellipse(ctx, A.eyes[0] - 1, A.eyes[1] - 1, 1.4, 1.0);
    } else {
      const [x1, x2, y] = A.eyes;
      ctx.fillStyle = '#1a1a1a';
      roundRect(ctx, x1 - 4.5, y - 3, 9, 6, 3); ctx.fill();
      roundRect(ctx, x2 - 4.5, y - 3, 9, 6, 3); ctx.fill();
      ctx.fillRect(x1 + 4, y - 1, x2 - x1 - 8, 1.8);   // little bridge
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ellipse(ctx, x1 - 1.5, y - 1, 1.3, 1.0);
      ellipse(ctx, x2 - 1.5, y - 1, 1.3, 1.0);
    }
  } else if (acc === 'hat') {
    const [hx, hy] = A.head;
    ctx.fillStyle = '#e8cf8a';   // straw brim
    ellipse(ctx, hx, hy + 2, 12, 4);
    ctx.fillStyle = '#f0dca0';
    roundRect(ctx, hx - 7, hy - 7, 14, 9, 4); ctx.fill();
    ctx.fillStyle = '#4a9ad0';   // colored band
    ctx.fillRect(hx - 7, hy - 1, 14, 3);
    ctx.strokeStyle = '#c9b070'; ctx.lineWidth = 1;
    ellipse(ctx, hx, hy + 2, 12, 4);
  } else if (acc === 'shovel') {
    const [wx, wy] = A.hand;
    // little red pail near the hand
    ctx.fillStyle = '#d8402f';
    ctx.beginPath(); ctx.moveTo(wx - 5, wy - 2); ctx.lineTo(wx + 5, wy - 2); ctx.lineTo(wx + 4, wy + 7); ctx.lineTo(wx - 4, wy + 7); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#f0b0a0'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(wx, wy - 2, 4, Math.PI, 0); ctx.stroke();
    // thin shovel handle + blue blade over the shoulder
    ctx.strokeStyle = '#c9a86a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(wx - 2, wy); ctx.lineTo(wx - 10, wy - 16); ctx.stroke();
    ctx.fillStyle = '#3f78d8';
    roundRect(ctx, wx - 14, wy - 22, 8, 8, 2); ctx.fill();
  }
}

/* ---------------- Ground / platform / brick tiles ---------------- */

// ---- City: wet asphalt pavement ----
function drawPavementTile(ctx, sx, sy, hasSolidAbove, col, row) {
  ctx.fillStyle = '#4f5560';
  ctx.fillRect(sx, sy, TILE, TILE);
  const v = hash(col * 3.1 + row * 7.7);
  // faint wet gloss streak
  ctx.fillStyle = 'rgba(150,170,190,' + (0.05 + v * 0.06).toFixed(3) + ')';
  ellipse(ctx, sx + 10 + v * 16, sy + 18, 8 + v * 5, 3 + v * 3);
  // tiny speck of grit
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  ctx.fillRect(sx + ((col * 13) % 24) + 4, sy + ((row * 17) % 22) + 6, 3, 3);
  if (!hasSolidAbove) {
    // lighter curb strip along the top
    ctx.fillStyle = '#8b929c'; roundRect(ctx, sx - 1, sy - 4, TILE + 2, 10, 3); ctx.fill();
    ctx.fillStyle = '#a7aeb8'; roundRect(ctx, sx - 1, sy - 4, TILE + 2, 4, 3); ctx.fill();
  }
  // a dashed painted line here and there
  if (hash(col * 5.5) > 0.6) { ctx.fillStyle = 'rgba(240,220,120,0.5)'; ctx.fillRect(sx + TILE * 0.44, sy + TILE - 9, TILE * 0.12, 6); }
  // a little puddle
  if (hash(col * 9.1 + row) > 0.72) { ctx.fillStyle = 'rgba(150,175,200,0.35)'; ellipse(ctx, sx + 18, sy + 7, 7, 3); }
}

// ---- City park: bright grass over dirt ----
function drawParkGrassTile(ctx, sx, sy, hasSolidAbove, col, row) {
  ctx.fillStyle = '#7a5a2b';
  ctx.fillRect(sx, sy, TILE, TILE);
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  ellipse(ctx, sx + 12, sy + 20, 8, 5);
  if (!hasSolidAbove) {
    ctx.fillStyle = '#5aa84a'; roundRect(ctx, sx - 1, sy - 4, TILE + 2, 14, 4); ctx.fill();
    ctx.fillStyle = '#6fcf6a'; roundRect(ctx, sx - 1, sy - 4, TILE + 2, 8, 4); ctx.fill();
    // tiny flowers (pink / yellow / white)
    const f = ['#ff9ec4', '#ffe066', '#ffffff'][Math.floor(hash(col * 7.3) * 3)];
    ctx.fillStyle = f; ellipse(ctx, sx + 9 + hash(col * 3) * 14, sy + 2, 2, 2);
  }
}

// ---- City: basketball court floor ----
function drawCourtTile(ctx, sx, sy, hasSolidAbove, col, row) {
  ctx.fillStyle = '#c8803a';
  ctx.fillRect(sx, sy, TILE, TILE);
  ctx.strokeStyle = 'rgba(120,70,20,0.5)'; ctx.lineWidth = 1.5;
  for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.moveTo(sx, sy + i * TILE / 4); ctx.lineTo(sx + TILE, sy + i * TILE / 4); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(sx + TILE * 0.5, sy); ctx.lineTo(sx + TILE * 0.5, sy + TILE); ctx.stroke();
  if (!hasSolidAbove) { ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(sx, sy, TILE, 3); }
}

// ---- City: building block facade with lit/dark windows ----
function drawBuildingTile(ctx, sx, sy, hasSolidAbove, col, row) {
  const group = Math.floor(col / 4);
  const palette = ['#c97b63', '#7f9db8', '#d5b96e', '#8fae8f', '#a8a1b8'];
  ctx.fillStyle = palette[Math.floor(hash(group * 13.7) * palette.length)];
  ctx.fillRect(sx, sy, TILE, TILE);
  ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 1;
  ctx.strokeRect(sx + 0.5, sy + 0.5, TILE - 1, TILE - 1);
  // a 2x2 window (lit ~40% of the time)
  const wx = sx + 9, wy = sy + 9, ww = TILE - 18;
  ctx.fillStyle = (hash(col * 3.3 + row * 7.1) < 0.4) ? '#ffe9a8' : '#3d4a5c';
  ctx.fillRect(wx, wy, ww, ww);
  ctx.strokeStyle = 'rgba(20,25,35,0.8)'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(wx + ww / 2, wy); ctx.lineTo(wx + ww / 2, wy + ww);
  ctx.moveTo(wx, wy + ww / 2); ctx.lineTo(wx + ww, wy + ww / 2);
  ctx.stroke();
  if (!hasSolidAbove) {
    ctx.fillStyle = '#3a3f47'; roundRect(ctx, sx - 1, sy - 4, TILE + 2, 9, 3); ctx.fill();
    ctx.fillStyle = '#4a505a'; roundRect(ctx, sx - 1, sy - 4, TILE + 2, 4, 3); ctx.fill();
  }
}

// ---- City: metal fire-escape ladder ----
function drawLadderTile(ctx, sx, sy) {
  ctx.fillStyle = '#8a9099';
  ctx.fillRect(sx + 6, sy, 4, TILE);
  ctx.fillRect(sx + TILE - 10, sy, 4, TILE);
  ctx.fillStyle = '#6d747d';
  for (let y = sy + 5; y < sy + TILE; y += 9) ctx.fillRect(sx + 6, y, TILE - 12, 3);
}

// ---- City: striped awning platform ----
function drawAwningTile(ctx, sx, sy, hasSolidAbove, col, row) {
  const c1 = hash(col * 4.2) > 0.5 ? '#e0533f' : '#4a9a55';
  ctx.fillStyle = '#efe6d0'; ctx.fillRect(sx, sy + 4, TILE, TILE - 12);
  ctx.fillStyle = c1;
  for (let i = 0; i < TILE; i += 12) ctx.fillRect(sx + i, sy + 4, 6, TILE - 12);
  for (let i = 0; i < TILE; i += 12) ellipse(ctx, sx + i + 6, sy + TILE - 8, 6, 4);   // scalloped edge
  ctx.fillStyle = '#c9bfa6'; ctx.fillRect(sx, sy + 2, TILE, 4);
}

// ---- City: concrete block ----
function drawConcreteTile(ctx, sx, sy) {
  ctx.fillStyle = '#9aa0a6'; ctx.fillRect(sx, sy, TILE, TILE);
  ctx.fillStyle = '#8a9096'; ctx.fillRect(sx + 1, sy + 1, TILE - 2, TILE - 2);
  ctx.strokeStyle = 'rgba(70,75,80,0.6)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(sx, sy + TILE / 2); ctx.lineTo(sx + TILE, sy + TILE / 2);
  ctx.moveTo(sx + TILE / 2, sy); ctx.lineTo(sx + TILE / 2, sy + TILE / 2);
  ctx.stroke();
}

// ---- Beach: sand ground with speckles and shells ----
function drawSandTile(ctx, sx, sy, hasSolidAbove, col, row) {
  ctx.fillStyle = '#e0be6a';
  ctx.fillRect(sx, sy, TILE, TILE);
  const v = hash(col * 3.1 + row * 7.7);
  ctx.fillStyle = 'rgba(120,90,40,' + (0.05 + v * 0.06).toFixed(3) + ')';
  ellipse(ctx, sx + 9 + v * 18, sy + 14 + v * 12, 6 + v * 5, 4 + v * 4);
  if (!hasSolidAbove) {
    ctx.fillStyle = '#f2d98b'; roundRect(ctx, sx - 1, sy - 4, TILE + 2, 12, 4); ctx.fill();
    ctx.fillStyle = '#ffeaa8'; roundRect(ctx, sx - 1, sy - 4, TILE + 2, 6, 4); ctx.fill();
    // tiny shell / starfish dot
    const hv = hash(col * 5.3);
    if (hv > 0.6) { ctx.fillStyle = '#f6b6c0'; ellipse(ctx, sx + 10 + hv * 12, sy + 2, 2.4, 2.0); }
    else if (hv > 0.42) { ctx.fillStyle = '#ffd9a0'; ellipse(ctx, sx + 8 + hv * 16, sy + 2, 1.8, 1.8); }
  }
}

// ---- Beach: driftwood platform ----
function drawDriftwoodTile(ctx, sx, sy) {
  ctx.fillStyle = '#a58b66'; ctx.fillRect(sx, sy + 5, TILE, TILE - 12);
  ctx.fillStyle = '#8c7350'; ctx.fillRect(sx, sy + 5, TILE, 3);
  ctx.strokeStyle = 'rgba(80,60,35,0.5)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(sx, sy + TILE / 2); ctx.lineTo(sx + TILE, sy + TILE / 2); ctx.stroke();
  ctx.fillStyle = '#5a4a30';
  ellipse(ctx, sx + 7, sy + 10, 1.5, 1.5); ellipse(ctx, sx + TILE - 7, sy + 10, 1.5, 1.5);
}

// ---- Beach: pale sandstone blocks ----
function drawSandstoneTile(ctx, sx, sy) {
  ctx.fillStyle = '#e6cf9a'; ctx.fillRect(sx, sy, TILE, TILE);
  ctx.fillStyle = '#d8bd82'; ctx.fillRect(sx + 2, sy + 2, TILE - 4, TILE - 4);
  ctx.strokeStyle = 'rgba(150,120,70,0.5)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(sx, sy + TILE / 2); ctx.lineTo(sx + TILE, sy + TILE / 2); ctx.stroke();
}

function drawTile(ctx, ch, sx, sy, hasSolidAbove, col, row) {
  if (ch === 'H') { drawLadderTile(ctx, sx, sy); return; }
  if (ch === 'M') return;   // merry-go-round deck is drawn by its deco, not here
  if (ch === 'G') { drawParkGrassTile(ctx, sx, sy, hasSolidAbove, col, row); return; }
  if (ch === 'C') { drawCourtTile(ctx, sx, sy, hasSolidAbove, col, row); return; }
  if (ch === 'R') { drawBuildingTile(ctx, sx, sy, hasSolidAbove, col, row); return; }
  if (ch === '#') {
    if (theme.ground === 'snow') { drawSnowGroundTile(ctx, sx, sy, hasSolidAbove, col, row); return; }
    if (theme.ground === 'pavement') { drawPavementTile(ctx, sx, sy, hasSolidAbove, col, row); return; }
    if (theme.ground === 'sand') { drawSandTile(ctx, sx, sy, hasSolidAbove, col, row); return; }
    // dirt block — a solid earthy brown with natural little patches
    ctx.fillStyle = COL.dirt;
    ctx.fillRect(sx, sy, TILE, TILE);
    const v = hash(col * 3.1 + row * 7.7);
    ctx.fillStyle = 'rgba(0,0,0,' + (0.04 + v * 0.06).toFixed(3) + ')';
    ellipse(ctx, sx + 9 + v * 18, sy + 12 + v * 14, 6 + v * 5, 4 + v * 4);
    ctx.fillStyle = 'rgba(255,220,170,0.06)';
    ellipse(ctx, sx + 24 - v * 10, sy + 26, 5, 3);
    // tiny pebbles
    ctx.fillStyle = 'rgba(0,0,0,0.10)';
    ctx.fillRect(sx + ((col * 13) % 24) + 4, sy + ((row * 17) % 22) + 6, 4, 4);
    // grass cap on top when nothing is above
    if (!hasSolidAbove) {
      ctx.fillStyle = 'rgba(0,0,0,0.16)';
      ctx.fillRect(sx, sy + 6, TILE, 4);
      ctx.fillStyle = COL.grass;
      roundRect(ctx, sx - 1, sy - 4, TILE + 2, 12, 4); ctx.fill();
      ctx.fillStyle = COL.grassLight;
      roundRect(ctx, sx - 1, sy - 4, TILE + 2, 5, 3); ctx.fill();
    }
  } else if (ch === '=') {
    if (theme.platform === 'ice') { drawIceBlockTile(ctx, sx, sy, true); return; }
    if (theme.platform === 'awning') { drawAwningTile(ctx, sx, sy, hasSolidAbove, col, row); return; }
    if (theme.platform === 'driftwood') { drawDriftwoodTile(ctx, sx, sy); return; }
    // wooden log platform
    ctx.fillStyle = COL.woodDark;
    roundRect(ctx, sx, sy + 6, TILE, TILE - 10, 8); ctx.fill();
    ctx.fillStyle = COL.wood;
    roundRect(ctx, sx, sy + 4, TILE, TILE - 12, 8); ctx.fill();
    ctx.strokeStyle = 'rgba(90,60,30,0.6)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(sx + 8, sy + 8); ctx.lineTo(sx + 8, sy + TILE - 10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx + TILE - 8, sy + 8); ctx.lineTo(sx + TILE - 8, sy + TILE - 10); ctx.stroke();
    // grass tuft on top
    ctx.fillStyle = COL.grassLight;
    ellipse(ctx, sx + TILE * 0.3, sy + 4, 5, 3);
    ellipse(ctx, sx + TILE * 0.7, sy + 4, 5, 3);
  } else if (ch === 'B' || ch === 'I') {
    if (theme.brick === 'iceblock') { drawIceBlockTile(ctx, sx, sy, ch === 'I' || !hasSolidAbove); return; }
    if (theme.brick === 'concrete') { drawConcreteTile(ctx, sx, sy); return; }
    if (theme.brick === 'sandstone') { drawSandstoneTile(ctx, sx, sy); return; }
    // brick block
    ctx.fillStyle = COL.brickDark;
    ctx.fillRect(sx, sy, TILE, TILE);
    ctx.fillStyle = COL.brick;
    ctx.fillRect(sx + 1, sy + 1, TILE - 2, TILE - 2);
    ctx.strokeStyle = 'rgba(80,30,15,0.55)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(sx, sy + TILE / 2); ctx.lineTo(sx + TILE, sy + TILE / 2);
    ctx.moveTo(sx + TILE / 2, sy); ctx.lineTo(sx + TILE / 2, sy + TILE / 2);
    ctx.moveTo(sx + TILE * 0.25, sy + TILE / 2); ctx.lineTo(sx + TILE * 0.25, sy + TILE);
    ctx.moveTo(sx + TILE * 0.75, sy + TILE / 2); ctx.lineTo(sx + TILE * 0.75, sy + TILE);
    ctx.stroke();
  }
}

/* ---------------- CITY DECORATIONS (sit on the ground) ---------------- */
function drawLamp(ctx, x, baseY) {
  ctx.save(); ctx.translate(x, baseY);
  ctx.fillStyle = '#3a3f47'; ctx.fillRect(-3, -64, 6, 64);
  ctx.fillStyle = '#2a2f37'; ctx.fillRect(-8, -3, 16, 5);
  ctx.strokeStyle = '#3a3f47'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, -64); ctx.quadraticCurveTo(0, -76, 13, -76); ctx.stroke();
  const glow = ctx.createRadialGradient(13, -72, 2, 13, -72, 26);
  glow.addColorStop(0, 'rgba(255,235,150,0.8)'); glow.addColorStop(1, 'rgba(255,235,150,0)');
  ctx.fillStyle = glow; ellipse(ctx, 13, -72, 26, 26);
  ctx.fillStyle = '#ffe9a8'; ellipse(ctx, 13, -72, 6, 7);

// A palm tree (interactive ones add coconuts in drawPalms).
function drawPalm(ctx, x, baseY, s, sway) {
  ctx.save(); ctx.translate(x, baseY); ctx.scale(s, s);
  sway = sway || 0;
  ctx.strokeStyle = '#9a6b3a'; ctx.lineWidth = 8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(sway, -80, sway * 1.8, -150); ctx.stroke();
  ctx.strokeStyle = 'rgba(110,74,36,0.6)'; ctx.lineWidth = 1.6;
  for (let i = 1; i <= 6; i++) {
    const t = i / 7;
    const px = sway * t + (sway * 1.8 - sway) * t * t, py = -150 * t;
    ctx.beginPath(); ctx.moveTo(px - 4, py); ctx.lineTo(px + 4, py); ctx.stroke();
  }
  const topX = sway * 1.8, topY = -150;
  for (let i = 0; i < 7; i++) {
    const a = -Math.PI * 0.5 + (i - 3) * 0.42;
    ctx.save(); ctx.translate(topX, topY); ctx.rotate(a);
    ctx.fillStyle = i % 2 ? '#3f9d4a' : '#4bb055';
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.quadraticCurveTo(30, -8, 58, 8); ctx.quadraticCurveTo(30, 4, 0, 5);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = '#7a5028'; ellipse(ctx, topX, topY + 6, 9, 6);
  ctx.restore();
}

// Interactive coconut palms: hang -> shake (telegraph) -> fall -> cool -> hang.
function updatePalms(dt) {
  if (!LEVEL || !LEVEL.palms) return;
  const cx = player.x + player.w / 2;
  for (const p of LEVEL.palms) {
    if (Math.abs(p.x - (cam.x + VIEW_W / 2)) > 900) continue;   // off-screen: skip
    if (p.state === 'hang') {
      const nearX = Math.abs(cx - p.x) <= 44;
      const onGroundBand = player.y + player.h >= 405 && player.y + player.h <= 448;
      if (nearX && onGroundBand && !player.sliding && player.frozen <= 0 && !player.climbing && !player.riding) {
        p.state = 'shake'; p.t = 0.55;
      }
    } else if (p.state === 'shake') {
      p.t -= dt;
      if (p.t <= 0) { p.state = 'fall'; p.vy = 0; p.cocoX = p.x + (hash(p.x) > 0.5 ? 8 : -8); p.cocoY = 300; }
    } else if (p.state === 'fall') {
      p.vy += 1800 * dt;
      p.cocoY += p.vy * dt;
      const rect = { x: p.cocoX - 7, y: p.cocoY - 7, w: 14, h: 14 };
      if (player.frozen <= 0 && !player.sliding && player.invuln <= 0 && aabb(player, rect)) {
        hurtByEnemy(rect);
        spawnBurst(p.cocoX, p.cocoY, '#8a5a2b', 10, 'poof');
        p.state = 'cool'; p.t = 6;
      } else if (p.cocoY >= 422) {
        spawnBurst(p.cocoX, 422, '#8a5a2b', 10, 'poof');
        p.state = 'cool'; p.t = 6;
      }
    } else if (p.state === 'cool') {
      p.t -= dt;
      if (p.t <= 0) { p.state = 'hang'; p.cocoY = 300; }
    }
  }
}
function drawPalms(ctx) {
  if (!LEVEL || !LEVEL.palms) return;
  const baseY = 432 - cam.y;
  for (const p of LEVEL.palms) {
    const sx = p.x - cam.x;
    if (sx < -200 || sx > VIEW_W + 200) continue;
    const sway = (p.state === 'shake') ? Math.sin(time0 * 40) * 4 : Math.sin(time0 * 1.1 + p.x) * 1.4;
    drawPalm(ctx, sx, baseY, 1, sway);
    if (p.state === 'hang' || p.state === 'shake') {
      const cy = 300 - cam.y + (p.state === 'shake' ? Math.sin(time0 * 40) * 2 : 0);
      ctx.fillStyle = '#6b4a24'; ellipse(ctx, sx - 5, cy, 4.5, 4.5); ellipse(ctx, sx + 5, cy + 1, 4.5, 4.5);
    }
    if (p.state === 'shake') {
      const t = 1 - p.t / 0.55;   // growing shadow telegraph
      ctx.globalAlpha = 0.25 + t * 0.4;
      ctx.fillStyle = '#000';
      ellipse(ctx, sx, baseY - 2, 8 + t * 12, 3 + t * 5);
      ctx.globalAlpha = 1;
    }
    if (p.state === 'fall') {
      ctx.fillStyle = '#6b4a24'; ellipse(ctx, p.cocoX - cam.x, p.cocoY - cam.y, 5, 5);
      ctx.fillStyle = '#4a3018'; ellipse(ctx, p.cocoX - cam.x - 1, p.cocoY - cam.y - 1, 3, 3);
    }
  }
}

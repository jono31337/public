/* ---------------- SLIDE / MERRY-GO-ROUND / QUICKSAND / RIPPLES ---------------- */
// Where is the slide's surface at this x?
function slideY(s, x) { return s.y0 + (x - s.x0) * (s.y1 - s.y0) / (s.x1 - s.x0); }

function drawSlide(ctx, s) {
  const x0 = s.x0 - cam.x, y0 = s.y0 - cam.y, x1 = s.x1 - cam.x, y1 = s.y1 - cam.y;
  // support legs
  ctx.strokeStyle = '#6d747d'; ctx.lineWidth = 4;
  for (let i = 1; i < 4; i++) { const t = i / 4; const px = lerp(x0, x1, t), py = lerp(y0, y1, t); ctx.beginPath(); ctx.moveTo(px, py + 4); ctx.lineTo(px, y1 + 20); ctx.stroke(); }
  // the chute
  ctx.strokeStyle = '#c9922a'; ctx.lineWidth = 16; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  ctx.strokeStyle = '#f2d060'; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  // two darker side rails
  ctx.strokeStyle = '#c9922a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x0, y0 - 8); ctx.lineTo(x1, y1 - 8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x0, y0 + 8); ctx.lineTo(x1, y1 + 8); ctx.stroke();
}

// The merry-go-round is drawn in TWO layers so Fin can look like he circles the middle.
function drawMerryBack(ctx, m) {
  const x = m.x - cam.x, y = m.topY - cam.y, w = m.w, cx = x + w / 2;
  ctx.fillStyle = '#8a5a2b'; ctx.fillRect(cx - 6, y + 6, 12, 26);               // base post
  ctx.fillStyle = '#c94f3f'; roundRect(ctx, x, y - 6, w, 12, 4); ctx.fill();    // deck
  ctx.fillStyle = '#f2b134'; roundRect(ctx, x, y - 6, w, 4, 3); ctx.fill();
  // back poles
  ctx.strokeStyle = 'rgba(208,208,208,0.85)'; ctx.lineWidth = 3;
  for (let i = 0; i < 3; i++) { const px = x + 22 + i * (w - 44) / 2; ctx.beginPath(); ctx.moveTo(cx, y - 66); ctx.lineTo(px, y - 8); ctx.stroke(); }
  // striped canopy cone
  const apexY = y - 88, baseY2 = y - 62;
  ctx.save();
  ctx.beginPath(); ctx.moveTo(cx, apexY); ctx.lineTo(x - 8, baseY2); ctx.lineTo(x + w + 8, baseY2); ctx.closePath(); ctx.clip();
  ctx.fillStyle = '#e0533f'; ctx.fillRect(x - 10, apexY, w + 20, baseY2 - apexY + 2);
  ctx.fillStyle = '#f4f1ea';
  const n = 6;
  for (let i = 0; i < n; i += 2) { const fx = x - 8 + (w + 16) * i / n; ctx.beginPath(); ctx.moveTo(cx, apexY); ctx.lineTo(fx, baseY2); ctx.lineTo(fx + (w + 16) / n, baseY2); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  ctx.fillStyle = '#f2b134'; ellipse(ctx, cx, apexY - 2, 4, 4);
}
function drawMerryFront(ctx, m) {
  const x = m.x - cam.x, y = m.topY - cam.y, w = m.w, cx = x + w / 2;
  // front poles + little horses that turn with the ride
  for (let i = 0; i < 2; i++) {
    const ang = m.angle + i * Math.PI;
    if (Math.sin(ang) < 0) continue;                       // front half only
    const px = cx + Math.cos(ang) * w * 0.26;
    ctx.strokeStyle = 'rgba(208,208,208,0.95)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(px, y - 62); ctx.lineTo(px, y - 8); ctx.stroke();
    ctx.fillStyle = '#f4f1ea'; roundRect(ctx, px - 7, y - 34, 14, 12, 4); ctx.fill();
    ctx.fillStyle = '#d8d8d8'; ellipse(ctx, px - 7, y - 22, 3, 4); ellipse(ctx, px + 7, y - 22, 3, 4);
    ctx.fillStyle = '#3f78d8'; roundRect(ctx, px - 8, y - 32, 16, 5, 2); ctx.fill();
  }
  // front rim of the deck
  ctx.strokeStyle = '#c94f3f'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.ellipse(cx, y - 4, w * 0.5, 8, 0, 0, Math.PI); ctx.stroke();
}

// Quicksand is drawn OVER Fin so he looks half-buried.
function drawQuicksandOverlay(ctx) {
  for (const z of waterZones) {
    if (z.kind !== 'quicksand') continue;
    const x = z.x - cam.x, w = z.w;
    if (x > VIEW_W || x + w < 0) continue;
    const y = z.surfaceY - cam.y;
    const g = ctx.createLinearGradient(0, y, 0, VIEW_H);
    g.addColorStop(0, '#c19338'); g.addColorStop(1, '#9c7226');
    ctx.fillStyle = g; ctx.fillRect(x, y, w, VIEW_H - y);
    // concentric swirl rings so quicksand clearly reads as a hazard, not flat sand
    ctx.strokeStyle = 'rgba(115,84,28,0.55)'; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.ellipse(x + w / 2, y + 14 + i * 18 + Math.sin(time0 * 1.5 + i) * 3, Math.max(4, w * 0.42 - i * 7), Math.max(2, 8 - i * 1.6), 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    // a darker lip at the top so the pit reads as a hole, not flat sand
    ctx.fillStyle = 'rgba(90,64,26,0.6)'; ctx.fillRect(x, y, w, 4);
    ctx.fillStyle = 'rgba(150,110,50,0.35)';
    for (let i = 0; i < 3; i++) { const sy = y + 10 + i * 24 + Math.sin(time0 * 1.5 + i) * 3; ellipse(ctx, x + w * 0.3 + i * 11, sy, 12, 3); }
    ctx.strokeStyle = '#e8c96a'; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let px = 0; px <= w; px += 6) { const wy = y + Math.sin((px + x) * 0.08 + time0 * 2) * 2; if (px === 0) ctx.moveTo(x + px, wy); else ctx.lineTo(x + px, wy); }
    ctx.stroke();
    const bt = (time0 * 0.7) % 1;
    ctx.fillStyle = 'rgba(180,140,70,0.7)';
    ellipse(ctx, x + w * 0.35, y - bt * 10, 3, 4);
    ellipse(ctx, x + w * 0.7, y - ((bt * 1.4) % 1) * 10, 2.5, 3.5);
  }
}

// Rain ripples on the ground / puddles.
function updateRipples(dt) {
  for (let i = ripples.length - 1; i >= 0; i--) { const r = ripples[i]; r.t += dt; if (r.t >= r.max) ripples.splice(i, 1); }
}
function drawRipples(ctx) {
  for (const r of ripples) {
    const a = 1 - r.t / r.max;
    ctx.save(); ctx.globalAlpha = a * 0.7; ctx.strokeStyle = 'rgba(220,235,250,0.9)'; ctx.lineWidth = 1.2;
    const k = r.t / r.max;
    ctx.beginPath(); ctx.ellipse(r.x - cam.x, r.y - cam.y, 2 + 10 * k, 1 + 3 * k, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}

/* ================================================================
   6. INPUT MANAGER — which keys are being held right now?
   ================================================================ */

const keys = {};          // keys currently held down
const pressed = {};       // keys pressed this exact frame (edge detection)

const KEY_LEFT = ['ArrowLeft', 'a', 'A'];
const KEY_RIGHT = ['ArrowRight', 'd', 'D'];
const KEY_JUMP = [' ', 'ArrowUp', 'w', 'W'];

function anyDown(list) { return list.some(k => keys[k]); }
function anyPressed(list) { return list.some(k => pressed[k]); }

window.addEventListener('keydown', (e) => {
  initAudio();
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
  if (e.key === 'm' || e.key === 'M') { muted = !muted; setRainMuted(); }   // M toggles sound on/off (and silences rain)
  if (!keys[e.key]) pressed[e.key] = true;
  keys[e.key] = true;
});
window.addEventListener('keyup', (e) => { keys[e.key] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

/* ================================================================
   7. LEVEL BUILDER + LEVEL 1 DATA
   Tiny helper functions let us "paint" the level in plain English.
   ================================================================ */

class LevelBuilder {
  constructor(cols, rows) {
    this.cols = cols; this.rows = rows;
    this.grid = [];
    for (let r = 0; r < rows; r++) this.grid.push(new Array(cols).fill('.'));
    this.coinList = []; this.decoList = []; this.spawnList = [];
    this.checkpointList = []; this.goalCol = null;
    // Extra lists used by the new levels (slides, merry-go-rounds, palms, pit kinds).
    this.slides = []; this.merries = []; this.palms = []; this.pitKinds = [];
  }
  _fill(cA, cB, rA, rB, ch) {
    for (let c = cA; c <= cB; c++)
      for (let r = rA; r <= rB; r++)
        if (c >= 0 && c < this.cols && r >= 0 && r < this.rows) this.grid[r][c] = ch;
    return this;
  }
  ground(cA, cB, topRow) { return this._fill(cA, cB, topRow === undefined ? 12 : topRow, this.rows - 1, '#'); }
  platform(col, row, len) { return this._fill(col, col + len - 1, row, row, '='); }
  brick(col, row, len) { return this._fill(col, col + len - 1, row, row, 'B'); }
  coins(col, row, count) { for (let i = 0; i < count; i++) this.coinList.push({ col: col + i, row: row }); return this; }
  deco(type, col, row) { this.decoList.push({ type: type, col: col, row: row === undefined ? 11 : row }); return this; }
  // Spawn an enemy. acc = 'shovel' | 'shades' | 'hat' | null. opts = extra settings.
  enemy(type, col, row, acc, opts) {
    this.spawnList.push({ type: type, col: col, row: row, acc: acc || null, opts: opts || null });
    return this;
  }
  checkpoint(col) { this.checkpointList.push(col); return this; }
  goal(col) { this.goalCol = col; return this; }
  // Turn the top row of ground into slick ice ('I' = solid + slippery + ice look).
  iceFloor(colA, colB) {
    for (let c = colA; c <= colB; c++) if (this.grid[12][c] === '#') this.grid[12][c] = 'I';
    return this;
  }
  // A climbable ladder in one column, from rowTop down to rowBottom ('H' = climbable, not solid).
  ladder(col, rowTop, rowBottom) { return this._fill(col, col, rowTop, rowBottom, 'H'); }
  // A tall city building: solid 'R' from topRow down to row 11 (the ground rows stay).
  building(colA, colB, topRow) { return this._fill(colA, colB, topRow, 11, 'R'); }
  // Park grass ground: rows 12-14 become 'G' (solid green grass).
  parkGround(colA, colB) { return this._fill(colA, colB, 12, this.rows - 1, 'G'); }
  // Court floor: the top ground row becomes 'C' (solid wooden court).
  court(colA, colB) {
    for (let c = colA; c <= colB; c++) if (this.grid[12][c] === '#') this.grid[12][c] = 'C';
    return this;
  }
  // Merry-go-round deck: solid 'M' on row 11, 4 tiles wide (144px). Drawn by the deco, not drawTile.
  merry(col) {
    this._fill(col, col + 3, 11, 11, 'M');
    this.merries.push({ x: col * TILE, w: 144, topY: 11 * TILE });
    return this;
  }
  // A slide ramp from the top of a tower down to the ground.
  slide(colStart, topRow, colEnd) {
    this.slides.push({ x0: colStart * TILE, y0: topRow * TILE, x1: colEnd * TILE, y1: 12 * TILE });
    return this;
  }
  // An interactive coconut palm at one column (beach levels).
  palm(col) { this.palms.push({ col: col }); return this; }
  // Force the pit-liquid kind for the gap columns colA..colB ('puddle' | 'water' | 'quicksand').
  pitKind(colA, colB, kind) { this.pitKinds.push({ colA: colA, colB: colB, kind: kind }); return this; }
  isSolid(col, row) {
    if (col < 0 || col >= this.cols || row < 0 || row >= this.rows) return false;
    const ch = this.grid[row][col];
    // 'H' (ladder) is climbable and NOT solid on purpose, so Fin can walk into it.
    return ch === '#' || ch === '=' || ch === 'B' || ch === 'I' ||
           ch === 'G' || ch === 'M' || ch === 'C' || ch === 'R';
  }
}

// Turn the builder data into simple lists the game can use.
let LEVEL = null;
function parseLevel(L) {
  LEVEL = {
    grid: L.grid,
    isSolid: (c, r) => L.isSolid(c, r),
    coins: L.coinList.map(c => ({ x: (c.col + 0.5) * TILE, y: (c.row + 0.5) * TILE })),
    decos: L.decoList.map(d => ({ type: d.type, x: d.col * TILE + TILE / 2, baseY: (d.row + 1) * TILE })),
    spawns: L.spawnList,
    checkpoints: L.checkpointList,
    goalX: L.goalCol * TILE + TILE / 2,
    slides: L.slides,
    merries: L.merries,
    palms: L.palms,
    pitKinds: L.pitKinds
  };
  // Find the gaps (columns with no ground in the bottom rows). Each gap becomes a
  // "pit zone" with a kind (ice/puddle/water/quicksand) and a surface height.
  const SURFACE = { ice: 424, puddle: 500, water: 492, quicksand: 436 };
  waterZones = [];
  let start = -1;
  for (let c = 0; c <= LEVEL_COLS; c++) {
    const isGap = c < LEVEL_COLS && !L.isSolid(c, 12) && !L.isSolid(c, 13) && !L.isSolid(c, 14);
    if (isGap && start < 0) start = c;
    if (!isGap && start >= 0) {
      // Which kind of liquid fills this pit? A pitKind override wins, else the theme default.
      let kind = (theme && theme.defaultPit) ? theme.defaultPit : 'puddle';
      for (const pk of L.pitKinds) { if (start >= pk.colA && start <= pk.colB) kind = pk.kind; }
      waterZones.push({
        colA: start, colB: c - 1, x: start * TILE, w: (c - start) * TILE,
        kind: kind, surfaceY: (SURFACE[kind] !== undefined ? SURFACE[kind] : 12 * TILE - 8)
      });
      start = -1;
    }
  }
}

/* ---- Helper: is a point inside a solid tile? ---- */
function solidAtPx(px, py) {
  return LEVEL.isSolid(Math.floor(px / TILE), Math.floor(py / TILE));
}

/* ---- Helper: what kind of tile is at this point? ('.' = empty) ---- */
function tileCharAtPx(px, py) {
  const c = Math.floor(px / TILE), r = Math.floor(py / TILE);
  if (c < 0 || c >= LEVEL_COLS || r < 0 || r >= LEVEL_ROWS) return '.';
  return LEVEL.grid[r][c];
}

/* ---- Physics + collision: move an entity and stop it at walls/floors ---- */
function moveAndCollide(ent, dt) {
  // ---- move sideways ----
  ent.x += ent.vx * dt;
  let c0 = Math.floor(ent.x / TILE), c1 = Math.floor((ent.x + ent.w - 0.001) / TILE);
  let r0 = Math.floor(ent.y / TILE), r1 = Math.floor((ent.y + ent.h - 0.001) / TILE);
  for (let c = c0; c <= c1; c++) {
    for (let r = r0; r <= r1; r++) {
      if (LEVEL.isSolid(c, r)) {
        if (ent.vx > 0) ent.x = c * TILE - ent.w;
        else if (ent.vx < 0) ent.x = (c + 1) * TILE;
        ent.vx = 0;
      }
    }
  }

  // ---- move up/down ----
  ent.y += ent.vy * dt;
  c0 = Math.floor(ent.x / TILE); c1 = Math.floor((ent.x + ent.w - 0.001) / TILE);
  r0 = Math.floor(ent.y / TILE); r1 = Math.floor((ent.y + ent.h - 0.001) / TILE);
  let landed = false;
  for (let c = c0; c <= c1; c++) {
    for (let r = r0; r <= r1; r++) {
      if (LEVEL.isSolid(c, r)) {
        if (ent.vy > 0) { ent.y = r * TILE - ent.h; landed = true; }
        else if (ent.vy < 0) { ent.y = (r + 1) * TILE; }
        ent.vy = 0;
      }
    }
  }
  ent.onGround = landed;
  return landed;
}

/* ---- Find the ground below a point (used for shadows) ---- */
function groundBelow(px, fromY) {
  let c = Math.floor(px / TILE);
  let r = Math.floor(fromY / TILE);
  for (let rr = r; rr < LEVEL_ROWS; rr++) {
    if (LEVEL.isSolid(c, rr)) return rr * TILE;
  }
  return WORLD_H + 200;
}

/* ---------------- PLAYER: Fin ---------------- */
/* ---- Ladder helpers: is there a ladder tile here? how tall is it? ---- */
function ladderAt(col, row) {
  if (col < 0 || col >= LEVEL_COLS || row < 0 || row >= LEVEL_ROWS) return false;
  return LEVEL.grid[row][col] === 'H';
}
function ladderTopRow(col, row) {
  // Find the HIGHEST ladder rung in this column, even if Fin has climbed a bit past it.
  let r = clamp(row, 0, LEVEL_ROWS - 1);
  while (r < LEVEL_ROWS - 1 && !ladderAt(col, r)) r++;
  while (r - 1 >= 0 && ladderAt(col, r - 1)) r--;
  return r;
}
// The merry-go-round always spins, even when nobody is riding.
function updateMerries(dt) { if (LEVEL && LEVEL.merries) for (const m of LEVEL.merries) m.angle += 2.4 * dt; }

class Player {
  constructor(x, y) {
    this.x = x; this.y = y; this.w = 30; this.h = 34;
    this.vx = 0; this.vy = 0; this.onGround = false;
    this.facing = 1; this.state = 'idle'; this.animTime = 0;
    this.anims = FIN_ANIMS;
    this.coyote = 0; this.jumpBuffer = 0;
    this.invuln = 0; this.squash = { x: 1, y: 1 }; this.squashTimer = 0;
    this.hearts = 3; this.coins = 0;
    this.jumpCut = false;   // makes sure we only "cut" a jump once
    this.frozen = 0;        // >0 while Fin is trapped in an ice cube
    this.slippery = false;  // true when standing on ice
    // ---- new movement states ----
    this.climbing = false;  // on a ladder
    this.climbTick = 0;     // tick sound timer
    this.sliding = null;    // the slide he is riding, or null
    this.slideSpeed = 0;
    this.boost = 0;         // seconds of leftover speed from a slide
    this.riding = null;     // the merry-go-round he is on
    this.rideR = 0; this.rideTheta = 0;
    this.inSand = false; this.sandDepth = 0;
    this.splashed = false;  // has he already splashed this fall?
    this.renderScale = 1; this.renderDim = false;
  }
  update(dt) {
    // ---- trapped in ice? sink slowly, then shatter ----
    if (this.frozen > 0) {
      this.frozen -= dt;
      this.vy = 40;
      this.y += this.vy * dt;
      setAnim(this, 'idle');
      advanceAnim(this, dt);
      if (this.frozen <= 0) {
        this.frozen = 0;
        SFX.crack();
        spawnBurst(this.x + this.w / 2, this.y + this.h / 2, '#dff4ff', 16, 'sparkle');
        respawnAfterDeath();
      }
      return;
    }

    const left = anyDown(KEY_LEFT), right = anyDown(KEY_RIGHT);
    const up = anyDown(['ArrowUp', 'w', 'W']);
    const down = anyDown(['ArrowDown', 's', 'S']);
    const jumpDown = anyDown(KEY_JUMP), jumpHit = anyPressed(KEY_JUMP);
    const spaceHit = anyPressed([' ']);

    if (this.boost > 0) this.boost = Math.max(0, this.boost - dt);
    if (this.invuln > 0) this.invuln -= dt;

    // ---- special movement states each run their own simple physics ----
    if (this.sliding) { this.updateSlide(dt, spaceHit, jumpHit); return; }
    if (this.riding) { this.updateRide(dt, jumpHit); return; }
    if (this.inSand) { this.updateSand(dt, left, right, jumpHit); return; }

    // ---- grab a ladder: Up/W only climbs when a ladder is actually there ----
    if (!this.climbing && up) this.tryGrabLadder();
    if (this.climbing) { this.updateClimb(dt, left, right, up, down, spaceHit); return; }

    // remember a jump press for a moment (jump buffering)
    if (jumpHit) this.jumpBuffer = PHYS.JUMP_BUFFER;
    else this.jumpBuffer = Math.max(0, this.jumpBuffer - dt);

    // coyote time: a short grace period after leaving a ledge
    if (this.onGround) this.coyote = PHYS.COYOTE;
    else this.coyote = Math.max(0, this.coyote - dt);

    // ---- left / right movement with acceleration & friction ----
    // On icy tiles Fin skates a little: less grip, slower to speed up/stop.
    this.slippery = !!(theme && theme.slipperyTiles &&
      theme.slipperyTiles.includes(tileCharAtPx(this.x + this.w / 2, this.y + this.h + 2)));
    const slipA = this.slippery ? 0.8 : 1;
    const slipF = this.slippery ? 0.5 : 1;
    const accel = (this.onGround ? PHYS.ACCEL_GROUND : PHYS.ACCEL_AIR) * slipA;
    if (left && !right) { this.vx -= accel * dt; this.facing = -1; }
    else if (right && !left) { this.vx += accel * dt; this.facing = 1; }
    else {
      // no key held: slow down (friction)
      const fr = (this.onGround ? PHYS.FRICTION_GROUND : PHYS.FRICTION_AIR) * slipF * dt;
      if (Math.abs(this.vx) <= fr) this.vx = 0;
      else this.vx -= sign(this.vx) * fr;
    }
    // the speed cap is a bit higher for a moment after leaving a slide ("boost")
    const cap = PHYS.MAX_RUN + 140 * clamp(this.boost / 0.9, 0, 1);
    this.vx = clamp(this.vx, -cap, cap);

    // ---- jumping ----
    if (this.jumpBuffer > 0 && this.coyote > 0) {
      this.vy = PHYS.JUMP;
      this.jumpBuffer = 0; this.coyote = 0; this.jumpCut = false;
      this.squash = { x: 0.86, y: 1.16 }; this.squashTimer = 0.12;
      SFX.jump();
    }
    // variable jump height: letting go of jump early cuts the rise ONCE (short hop)
    if (!jumpDown && this.vy < 0 && !this.jumpCut) { this.vy *= 0.45; this.jumpCut = true; }

    // ---- gravity ----
    this.vy = Math.min(this.vy + PHYS.GRAVITY * dt, PHYS.MAX_FALL);

    // ---- move & collide with the world ----
    const prevFeet = this.y + this.h;   // remembered for the slide crossing test
    const wasAir = !this.onGround;
    const landed = moveAndCollide(this, dt);
    if (landed && wasAir) {
      this.squash = { x: 1.16, y: 0.82 }; this.squashTimer = 0.10;
    }

    // little snow puffs when Fin skids on ice, so you can feel the slip
    if (this.slippery && this.onGround && Math.abs(this.vx) > 60 && Math.random() < 0.25) {
      particles.push({
        x: this.x + this.w / 2 - this.facing * 10, y: this.y + this.h - 2,
        vx: -this.facing * 40 + rand(-20, 20), vy: rand(-55, -15),
        life: 0.45, maxLife: 0.45, color: 'rgba(185,228,255,0.95)',
        size: rand(3, 6), kind: 'poof', rot: 0, vr: 0, gravity: 130
      });
    }

    // ---- choose the right animation ----
    if (!this.onGround) setAnim(this, this.vy < 0 ? 'jump' : 'fall');
    else if (Math.abs(this.vx) > 12) setAnim(this, 'run');
    else setAnim(this, 'idle');
    advanceAnim(this, dt);

    // ---- squash & stretch spring back to normal ----
    if (this.squashTimer > 0) {
      this.squashTimer -= dt;
      this.squash.x = lerp(this.squash.x, 1, 8 * dt);
      this.squash.y = lerp(this.squash.y, 1, 8 * dt);
    } else { this.squash.x = 1; this.squash.y = 1; }

    // ---- fell into a bottomless pit? ----
    if (this.y > WORLD_H + 120) { fallInPit(); return; }
    // ---- splashed into icy water? freeze into a cube! (winter levels only) ----
    if (theme && theme.freeze && !this.onGround && this.coyote <= 0 && this.y + this.h > 438) {
      const col = Math.floor((this.x + this.w / 2) / TILE);
      if (waterZones.some(z => col >= z.colA && col <= z.colB)) { freezeInWater(); return; }
    }

    // ---- quicksand / splash / slide / merry ----
    this.checkSandEntry();
    this.checkSplash();
    this.tryAttachSlide(prevFeet);
    this.tryBoardMerry(landed);
  }

  // Try to grab a ladder whose column Fin is standing in / next to.
  tryGrabLadder() {
    const col = Math.floor((this.x + this.w / 2) / TILE);
    const colCenter = col * TILE + TILE / 2;
    if (Math.abs((this.x + this.w / 2) - colCenter) > 16) return;
    if (this.vy < -50) return;
    const rTop = Math.floor(this.y / TILE), rBot = Math.floor((this.y + this.h - 1) / TILE);
    for (let r = rTop; r <= rBot; r++) {
      if (ladderAt(col, r)) {
        this.climbing = true;
        this.x = colCenter - this.w / 2;
        this.vx = 0; this.vy = 0;
        this.climbTick = 0;
        return;
      }
    }
  }
  updateClimb(dt, left, right, up, down, spaceHit) {
    const col = Math.floor((this.x + this.w / 2) / TILE);
    // Space always jumps right off the ladder
    if (spaceHit) {
      this.climbing = false;
      this.vy = -520;
      this.vx = (left ? -200 : right ? 200 : 0);
      this.jumpCut = false; SFX.jump();
      return;
    }
    // Left / Right climb off with a small hop
    if (left !== right) {
      const dir = right ? 1 : -1;
      const topRow = ladderTopRow(col, Math.floor((this.y + this.h - 1) / TILE));
      // near the top, next to a solid roof? step neatly onto it instead of falling
      if (this.y + this.h >= topRow * TILE - 8 && LEVEL.isSolid(col + dir, topRow)) {
        this.y = topRow * TILE - this.h;
      }
      this.climbing = false;
      this.facing = dir;
      this.vx = dir * 200; this.vy = -150;
      return;
    }
    if (up) this.y -= 110 * dt;
    else if (down) this.y += 110 * dt;
    this.x = col * TILE + TILE / 2 - this.w / 2;   // stay centred on the rung
    this.vx = 0; this.vy = 0;
    // never climb above the top rung
    const topRow = ladderTopRow(col, Math.floor((this.y + this.h - 1) / TILE));
    this.y = Math.max(this.y, topRow * TILE - this.h);
    // stepping down onto solid ground ends the climb
    if (down && solidAtPx(this.x + this.w / 2, this.y + this.h + 4)) {
      this.climbing = false;
      this.onGround = true;
      this.y = Math.floor((this.y + this.h) / TILE) * TILE - this.h;
      return;
    }
    if (up || down) {
      this.climbTick -= dt;
      if (this.climbTick <= 0) { SFX.climbTick(); this.climbTick = 0.15; }
      setAnim(this, 'run'); advanceAnim(this, dt * 0.6);   // slow climb
    } else {
      setAnim(this, 'idle'); advanceAnim(this, dt);
    }
  }
  updateSlide(dt, spaceHit, jumpHit) {
    const s = this.sliding;
    this.slideSpeed += 140 * dt;
    const cx = this.x + this.w / 2 + this.slideSpeed * dt;
    this.x = cx - this.w / 2;
    this.y = slideY(s, cx) - this.h;
    this.vx = 0; this.vy = 0;
    this.facing = 1;
    setAnim(this, 'run'); advanceAnim(this, dt);
    if (Math.random() < 0.5) particles.push({
      x: cx, y: this.y + this.h, vx: rand(-30, 30), vy: rand(-70, -20),
      life: 0.4, maxLife: 0.4, color: 'rgba(255,240,180,0.95)', size: rand(2, 4),
      kind: 'sparkle', rot: 0, vr: 4, gravity: 200
    });
    // jump off the slide
    if (spaceHit || jumpHit) {
      this.sliding = null;
      this.vy = PHYS.JUMP * 0.9; this.vx = this.slideSpeed; this.boost = 0.9;
      this.jumpCut = false; SFX.jump();
      return;
    }
    // reached the bottom
    if (cx >= s.x1) {
      this.sliding = null;
      this.y = s.y1 - this.h;
      this.vx = this.slideSpeed; this.vy = 0; this.boost = 0.9;
      this.squash = { x: 1.1, y: 0.9 }; this.squashTimer = 0.1;
    }
  }
  tryAttachSlide(prevFeet) {
    if (this.sliding || !LEVEL.slides || !LEVEL.slides.length) return;
    const cx = this.x + this.w / 2;
    for (const s of LEVEL.slides) {
      if (cx < s.x0 || cx > s.x1 - 20) continue;
      if (this.vy < 0) continue;
      const sy = slideY(s, cx);
      // a downward crossing of the chute surface: coming from above onto it
      if (prevFeet <= sy + 0.5 && this.y + this.h >= sy) {
        this.sliding = s;
        this.slideSpeed = 120;
        this.climbing = false;
        SFX.slide();
        return;
      }
    }
  }
  tryBoardMerry(landed) {
    if (this.riding || !LEVEL.merries || !LEVEL.merries.length) return;
    if (!landed) return;
    const cx = this.x + this.w / 2;
    if (tileCharAtPx(cx, this.y + this.h + 2) !== 'M') return;
    for (const m of LEVEL.merries) {
      if (cx >= m.x && cx <= m.x + m.w) {
        this.riding = m;
        this.rideR = clamp(Math.abs(cx - m.cx), 20, 56);
        this.rideTheta = Math.acos(clamp((cx - m.cx) / this.rideR, -1, 1));
        SFX.merry();
        return;
      }
    }
  }
  updateRide(dt, jumpHit) {
    const m = this.riding;
    this.rideTheta += 2.4 * dt;
    const cx = m.cx + this.rideR * Math.cos(this.rideTheta);
    this.x = cx - this.w / 2;
    this.y = m.topY - this.h;
    this.facing = (-Math.sin(this.rideTheta)) >= 0 ? 1 : -1;
    setAnim(this, Math.abs(Math.sin(this.rideTheta)) > 0.25 ? 'run' : 'idle');
    advanceAnim(this, dt);
    const depth = Math.sin(this.rideTheta);     // front half looks a bit bigger
    this.renderScale = 0.92 + 0.1 * depth;
    this.renderDim = depth < 0;
    if (jumpHit) {
      this.vx = clamp(-this.rideR * 2.4 * Math.sin(this.rideTheta), -260, 260);
      this.vy = PHYS.JUMP;
      this.riding = null;
      this.renderScale = 1; this.renderDim = false;
      this.squash = { x: 0.86, y: 1.16 }; this.squashTimer = 0.12;
      SFX.jump();
    }
  }
  checkSandEntry() {
    if (this.inSand || this.onGround || this.vy < 0) return;
    const col = Math.floor((this.x + this.w / 2) / TILE);
    for (const z of waterZones) {
      if (z.kind !== 'quicksand') continue;
      if (col < z.colA || col > z.colB) continue;
      if (this.y + this.h >= z.surfaceY) {
        this.inSand = true;
        this.sandDepth = (this.y + this.h) - z.surfaceY;
        this.vx *= 0.6;
        return;
      }
    }
  }
  updateSand(dt, left, right, jumpHit) {
    const col = Math.floor((this.x + this.w / 2) / TILE);
    let z = null;
    for (const zz of waterZones) if (zz.kind === 'quicksand' && col >= zz.colA && col <= zz.colB) { z = zz; break; }
    const surfaceY = z ? z.surfaceY : 436;
    this.vy = 34;                                   // sink slowly
    const accel = PHYS.ACCEL_GROUND * 0.45;
    if (left && !right) { this.vx -= accel * dt; this.facing = -1; }
    else if (right && !left) { this.vx += accel * dt; this.facing = 1; }
    else { const fr = PHYS.FRICTION_GROUND * 0.45 * dt; if (Math.abs(this.vx) <= fr) this.vx = 0; else this.vx -= sign(this.vx) * fr; }
    const cap = PHYS.MAX_RUN * 0.45;
    this.vx = clamp(this.vx, -cap, cap);
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    // stay inside the solid pit walls
    if (z) this.x = clamp(this.x, z.x + 4, z.x + z.w - this.w - 4);
    this.sandDepth = (this.y + this.h) - surfaceY;
    setAnim(this, Math.abs(this.vx) > 12 ? 'run' : 'idle');
    advanceAnim(this, dt);
    if (Math.random() < 0.2) particles.push({
      x: this.x + this.w / 2, y: surfaceY, vx: rand(-20, 20), vy: rand(-30, -10),
      life: 0.4, maxLife: 0.4, color: '#e6c978', size: rand(2, 4), kind: 'poof', rot: 0, vr: 0, gravity: 200
    });
    // hop out (stronger when shallow)
    if (jumpHit) {
      const p = lerp(0.65, 0.22, clamp(this.sandDepth / 70, 0, 1));
      this.vy = PHYS.JUMP * p;
      this.inSand = false; this.onGround = false;
      this.jumpCut = false;
      this.squash = { x: 0.9, y: 1.1 }; this.squashTimer = 0.1;
      spawnBurst(this.x + this.w / 2, surfaceY, '#e6c978', 8, 'poof');
      SFX.jump();
      return;
    }
    // swallowed once too deep
    if (this.sandDepth >= 70) {
      SFX.sink();
      spawnBurst(this.x + this.w / 2, surfaceY, '#e6c978', 18, 'poof');
      this.inSand = false;
      respawnAfterDeath();
    }
  }
  checkSplash() {
    const col = Math.floor((this.x + this.w / 2) / TILE);
    let inW = false;
    for (const z of waterZones) {
      if (z.kind !== 'puddle' && z.kind !== 'water') continue;
      if (col >= z.colA && col <= z.colB && this.y + this.h >= z.surfaceY) { inW = true; break; }
    }
    if (inW) {
      if (!this.splashed) {
        this.splashed = true;
        SFX.splash();
        for (let i = 0; i < 10; i++) particles.push({
          x: this.x + this.w / 2, y: this.y + this.h, vx: rand(-90, 90), vy: rand(-200, -60),
          life: rand(0.4, 0.7), maxLife: 0.7, color: i % 2 ? '#cfe8ff' : '#ffffff',
          size: rand(2, 4), kind: 'poof', rot: 0, vr: 0, gravity: 600
        });
      }
    } else {
      this.splashed = false;
    }
  }
}

/* ---------------- ENEMY: Sharky (leaps out of pits; stompable) ---------------- */
class Sharky {
  constructor(x, y, acc, opts) {
    opts = opts || {};
    this.w = 34; this.h = 30;
    this.x = x; this.y = 0;
    this.facing = 1; this.state = 'swim'; this.animTime = 0; this.anims = SHARKY_ANIMS;
    this.dead = false; this.squish = 0;
    this.acc = acc || null; this.accType = 'sharky';
    this.hidden = true; this.open = 0; this.vy = 0; this.vx = 0;
    this.leapV = (opts.leapV !== undefined) ? opts.leapV : -865;
    // find the pit whose columns contain this spawn column
    const col = Math.floor((x + this.w / 2) / TILE);
    this.zone = null;
    for (const z of waterZones) if (col >= z.colA && col <= z.colB) { this.zone = z; break; }
    this.leapCols = opts.leapCols ? opts.leapCols.slice() :
      (this.zone ? [Math.floor((this.zone.colA + this.zone.colB) / 2)] : [col]);
    this.colIdx = 0;
    this.targetCol = this.leapCols[0];
    this.timer = rand(1.2, 1.8);
    this.squash = { x: 1, y: 1 };
    this.noShadow = true;
  }
  surfY() { return this.zone ? this.zone.surfaceY : 492; }
  chooseNext() {
    if (this.leapCols.length < 2) { this.targetCol = this.leapCols[0]; return; }
    let i = this.colIdx;
    while (i === this.colIdx) i = Math.floor(Math.random() * this.leapCols.length);
    this.colIdx = i; this.targetCol = this.leapCols[i];
  }
  update(dt) {
    if (this.dead) { this.squish -= dt; return; }
    advanceAnim(this, dt);
    const sY = this.surfY();

    if (this.hidden) {
      if (this.state === 'cooldown') {
        this.timer -= dt;
        if (this.timer <= 0) { this.state = 'swim'; this.chooseNext(); }
        return;
      }
      this.y = sY + 10 - this.h;   // body below the surface, only the fin shows
      const tx = this.targetCol * TILE + TILE / 2;
      const cx = this.x + this.w / 2;
      const dir = sign(tx - cx);
      if (this.state === 'warn') {
        this.timer -= dt;
        if (this.timer <= 0) {
          this.state = 'leap'; this.hidden = false;
          this.x = tx - this.w / 2; this.y = sY + 10 - this.h;
          this.vy = this.leapV; this.vx = 0; this.open = 1;
          SFX.chomp();
        }
        return;
      }
      if (dir) this.facing = dir;
      if (Math.abs(tx - cx) <= 3) {
        this.x = tx - this.w / 2;
        this.state = 'warn'; this.timer = 1.2;   // a full telegraph second+
      } else {
        this.x += dir * 90 * dt;
      }
    } else {
      // leaping straight up through the gap
      this.vy = Math.min(this.vy + PHYS.GRAVITY * dt, PHYS.MAX_FALL);
      this.y += this.vy * dt;
      if (this.vy > 0 && this.y + this.h >= sY) {
        this.y = sY + 10 - this.h;
        this.hidden = true; this.open = 0;
        spawnBurst(this.x + this.w / 2, sY, '#cfe8ff', 12, 'poof');
        SFX.splash();
        this.state = 'cooldown'; this.timer = rand(0.8, 1.4);
        this.chooseNext();
      }
    }
  }
}

/* ---------------- BOSS: Boomer ---------------- */
class Boomer {
  constructor(x, y) {
    this.x = x; this.y = y; this.w = 120; this.h = 90;
    this.vx = 0; this.vy = 0; this.onGround = false;
    this.facing = -1; this.state = 'idle'; this.animTime = 0; this.anims = BOOMER_ANIMS;
    this.hp = 3; this.maxHp = 3; this.alive = true; this.name = 'BOOMER';
    this.invuln = 0; this.hopTimer = 1.2; this.mode = 'idle';
    this.glideTimer = 0; this.glideToggle = false; this.wasAir = false;
    this.windupTimer = 0; this.glideDir = 1;
    this.squash = { x: 1, y: 1 }; this.angry = false; this.defeatTimer = 0;
    this.hurtFlash = 0;
    this.dead = false; this.squish = 0;   // used for the deflate-and-vanish animation
  }
  get phase() { return this.hp; }  // 3, 2, or 1
  update(dt) {
    if (!this.alive) {
      // deflate like a popped balloon, then vanish
      this.defeatTimer += dt;
      this.squish = Math.max(0, this.squish - dt);
      this.squash = { x: 1 + (1.2 - this.squish) * 0.35, y: Math.max(0.06, this.squish / 1.2) };
      return;
    }
    if (this.invuln > 0) { this.invuln -= dt; this.hurtFlash = Math.max(0, this.invuln); }
    else this.hurtFlash = 0;

    // Not fighting yet? Boomer dozes peacefully at his end of the arena
    // (gentle breathing) and does NOT attack until Fin steps in.
    if (!bossActive) {
      setAnim(this, 'idle');
      this.squash = { x: 1, y: 1 + Math.sin(time0 * 2) * 0.015 };
      advanceAnim(this, dt);
      return;
    }

    const speed = 90 + (3 - this.phase) * 55;          // faster as he loses health
    const interval = 1.6 - (3 - this.phase) * 0.3;      // hops more often

    if (this.mode === 'idle') {
      setAnim(this, 'idle');
      this.hopTimer -= dt;
      if (this.hopTimer <= 0) {
        const dir = sign((player.x + player.w / 2) - (this.x + this.w / 2)) || -1;
        this.facing = dir;
        if (this.phase === 1 && this.glideToggle) {
          // HP1 special: crouch first (a fair warning!), then glide-charge
          this.mode = 'windup'; this.windupTimer = 0.45; this.vx = 0; this.vy = 0;
          this.glideDir = dir; this.glideToggle = false;
          this.squash = { x: 1.15, y: 0.85 };
          setAnim(this, 'idle');
        } else {
          // normal hop toward Fin
          this.mode = 'hop'; this.vx = dir * speed; this.vy = -620;
          this.glideToggle = true;
          setAnim(this, 'jump');
        }
      }
    } else if (this.mode === 'hop') {
      this.vy = Math.min(this.vy + PHYS.GRAVITY * dt, PHYS.MAX_FALL);
      const wasAir = !this.onGround;
      const landed = moveAndCollide(this, dt);
      if (this.onGround && wasAir) {
        // landing: send out jumpable dust shockwaves
        const floorY = this.y + this.h;   // where Boomer's feet landed
        spawnShockwave(this.x + this.w * 0.5, -1, 220, floorY);
        if (this.phase <= 2) spawnShockwave(this.x + this.w * 0.5, 1, 220, floorY);
        this.squash = { x: 1.2, y: 0.8 };
        this.mode = 'idle'; this.hopTimer = interval; this.vx = 0;
        setAnim(this, 'idle');
      }
    } else if (this.mode === 'windup') {
      // squatting and shaking — get ready to dodge!
      this.windupTimer -= dt;
      this.squash = { x: 1.2, y: 0.8 };
      if (this.windupTimer <= 0) {
        this.mode = 'glide'; this.glideTimer = 0.7;
        this.vx = this.glideDir * 300; this.vy = 0;
        setAnim(this, 'run');
      }
    } else if (this.mode === 'glide') {
      this.glideTimer -= dt;
      this.x += this.vx * dt;
      this.x = clamp(this.x, cam.x + 24, 214 * TILE - this.w);
      if (this.glideTimer <= 0) { this.mode = 'idle'; this.hopTimer = interval; this.vx = 0; }
    }

    // squash spring
    this.squash.x = lerp(this.squash.x, 1, 8 * dt);
    this.squash.y = lerp(this.squash.y, 1, 8 * dt);
    advanceAnim(this, dt);
  }
  takeHit() {
    if (this.invuln > 0 || !this.alive) return;
    this.hp--;
    this.invuln = 1.2;
    this.angry = true;
    if (this.hp <= 0) {
      this.alive = false;
      this.defeatTimer = 0;
      this.dead = true; this.squish = 1.2;
    }
    SFX.bossHit();
  }
}

    this.invuln = 0; this.hopTimer = 1.2; this.mode = 'idle';
    this.slideTimer = 0; this.slideDir = 1; this.attackCount = 0;
    this.squash = { x: 1, y: 1 }; this.angry = false; this.defeatTimer = 0;
    this.hurtFlash = 0; this.floorY = y + 105;
    this.dead = false; this.squish = 0;
  }
  get phase() { return this.hp; }
  update(dt) {
    if (!this.alive) {
      // deflate like a popped balloon, then vanish
      this.defeatTimer += dt;
      this.squish = Math.max(0, this.squish - dt);
      this.squash = { x: 1 + (1.2 - this.squish) * 0.35, y: Math.max(0.06, this.squish / 1.2) };
      return;
    }
    if (this.invuln > 0) { this.invuln -= dt; this.hurtFlash = Math.max(0, this.invuln); }
    else this.hurtFlash = 0;

    // Dozing at his end of the arena until Fin steps in.
    if (!bossActive) {
      setAnim(this, 'idle');
      this.squash = { x: 1, y: 1 + Math.sin(time0 * 2) * 0.02 };
      advanceAnim(this, dt);
      return;
    }

    const speed = 90 + (3 - this.phase) * 50;         // faster as he loses health
    const interval = 1.7 - (3 - this.phase) * 0.3;    // rests a moment between hops (a stomp window)

    if (this.mode === 'idle') {
      setAnim(this, 'idle');
      this.hopTimer -= dt;
      if (this.hopTimer <= 0) {
        const dir = sign((player.x + player.w / 2) - (this.x + this.w / 2)) || -1;
        this.facing = dir;
        this.attackCount++;
        const doSlide = this.phase <= 2 && (this.phase === 1 ? (this.attackCount % 2 === 0) : (this.attackCount % 3 === 0));
        if (doSlide) {
          // crouch + wobble first (a fair warning), then belly-slide
          this.mode = 'windup'; this.slideTimer = 0.5; this.vx = 0; this.vy = 0; this.slideDir = dir;
          this.squash = { x: 1.2, y: 0.8 };
          setAnim(this, 'idle');
        } else {
          this.mode = 'hop'; this.vx = dir * speed; this.vy = -650;
          setAnim(this, 'jump');
        }
      }
    } else if (this.mode === 'hop') {
      this.vy = Math.min(this.vy + PHYS.GRAVITY * dt, PHYS.MAX_FALL);
      const wasAir = !this.onGround;
      const landed = moveAndCollide(this, dt);
      if (this.onGround && wasAir) {
        const floorY = this.y + this.h;
        spawnShockwave(this.x + this.w * 0.5, -1, 220, floorY);
        if (this.phase <= 2) spawnShockwave(this.x + this.w * 0.5, 1, 220, floorY);
        this.squash = { x: 1.22, y: 0.78 };
        this.mode = 'idle'; this.hopTimer = interval; this.vx = 0;
        setAnim(this, 'idle');
      }
    } else if (this.mode === 'windup') {
      this.slideTimer -= dt;
      this.squash = { x: 1.2, y: 0.8 };
      if (this.slideTimer <= 0) {
        // go! squash down low so Fin can jump over him
        this.floorY = this.y + this.h;
        this.h = 76; this.y = this.floorY - this.h;
        this.mode = 'slide'; this.slideTimer = 0.85;
        this.vx = this.slideDir * 320; this.vy = 0;
        SFX.slide();
        setAnim(this, 'run');
      }
    } else if (this.mode === 'slide') {
      this.slideTimer -= dt;
      this.x += this.vx * dt;
      this.x = clamp(this.x, cam.x + 24, 214 * TILE - this.w);
      if (this.slideTimer <= 0) {
        // stand back up
        this.y = this.floorY - 105; this.h = 105;
        this.mode = 'idle'; this.hopTimer = 1.0; this.vx = 0;
      }
    }

    this.squash.x = lerp(this.squash.x, 1, 8 * dt);
    this.squash.y = lerp(this.squash.y, 1, 8 * dt);
    advanceAnim(this, dt);
  }
  takeHit() {
    if (this.invuln > 0 || !this.alive) return;
    this.hp--;
    this.invuln = 1.2;
    this.angry = true;
    if (this.hp <= 0) {
      this.alive = false;
      this.defeatTimer = 0;
      this.dead = true; this.squish = 1.2;
    }
    SFX.bossHit();
  }
}

/* ---------------- BOSS: Basketball (Level 3) ----------------

  }
  get phase() { return this.hp; }

      this.squash = { x: 1 + (1.2 - this.squish) * 0.35, y: Math.max(0.06, this.squish / 1.2) };

    }
    if (this.invuln > 0) { this.invuln -= dt; this.hurtFlash = Math.max(0, this.invuln); }

      setAnim(this, 'idle');
      this.squash = { x: 1, y: 1 + Math.sin(time0 * 2) * 0.02 };
      advanceAnim(this, dt);
      return;
    }

    const speed = 110 + (3 - this.hp) * 45;

      this.restTimer -= dt;
      if (this.restTimer <= 0) {

          setAnim(this, 'jump');

          this.mode = 'crouch'; this.pauseTimer = 0.4; this.vx = 0; this.vy = 0;
          this.squash = { x: 1.2, y: 0.8 }; setAnim(this, 'idle');
        }
      }
    } else if (this.mode === 'crouch') {
      this.pauseTimer -= dt; this.squash = { x: 1.2, y: 0.8 };
      if (this.pauseTimer <= 0) { this.mode = 'hop'; this.vx = this.facing * speed; this.vy = -640; this.hopCount = 1; setAnim(this, 'jump'); }
    } else if (this.mode === 'hop') {
      this.vy = Math.min(this.vy + PHYS.GRAVITY * dt, PHYS.MAX_FALL);
      const wasAir = !this.onGround;

    } else if (this.mode === 'slamUp') {
      this.vy = Math.min(this.vy + PHYS.GRAVITY * dt, PHYS.MAX_FALL);

      if (this.y + this.h < 0) {

    this.angry = true;
    if (this.hp <= 0) { this.alive = false; this.defeatTimer = 0; this.dead = true; this.squish = 1.2; }
    SFX.bossHit();
  }
}

/* ---------------- BOSS: Blue Bear (Level 4) ----------------
   A big fluffy teddy who walks and swats with sausage-mitten arms.
   At low HP he also slams both arms down on a red marker. */
class BlueBear {
  constructor(x, y) {
    this.x = x; this.y = y; this.w = 112; this.h = 124;
    this.vx = 0; this.vy = 0; this.onGround = false;
    this.facing = -1; this.state = 'idle'; this.animTime = 0; this.anims = BLUEBEAR_ANIMS;
    this.hp = 3; this.maxHp = 3; this.alive = true; this.name = 'BLUE BEAR';
    this.invuln = 0; this.mode = 'idle'; this.restTimer = 1.6; this.attackCount = 0;
    this.armL = 0.5; this.armR = -0.5; this.attackRect = null;
    this.tiredTimer = 0; this.swatsLeft = 0; this.walkTimer = 0; this.windupTimer = 0;
    this.slamTimer = 0; this.gapTimer = 0;
    this.markerX = x; this.markerOn = false; this.markerLocked = false;
    this.squash = { x: 1, y: 1 }; this.angry = false; this.defeatTimer = 0; this.hurtFlash = 0;
    this.floorY = y + 124; this.dead = false; this.squish = 0;
  }
  get phase() { return this.hp; }
  update(dt) {
    if (!this.alive) {
      this.defeatTimer += dt;
      this.squish = Math.max(0, this.squish - dt);
      this.squash = { x: 1 + (1.2 - this.squish) * 0.35, y: Math.max(0.06, this.squish / 1.2) };
      return;
    }
    if (this.invuln > 0) { this.invuln -= dt; this.hurtFlash = Math.max(0, this.invuln); }
    else this.hurtFlash = 0;

    if (!bossActive) {
      setAnim(this, 'idle');
      this.squash = { x: 1, y: 1 + Math.sin(time0 * 1.8) * 0.02 };
      this.armL = 0.5 + Math.sin(time0 * 1.5) * 0.08;
      this.armR = -0.5 - Math.sin(time0 * 1.5) * 0.08;
      advanceAnim(this, dt);
      return;
    }

    const speed = 70 + (3 - this.hp) * 25;
    const px = player.x + player.w / 2, cx = this.x + this.w / 2;

    if (this.mode === 'idle') {
      setAnim(this, 'idle');
      this.armL = lerp(this.armL, 0.5, 6 * dt);
      this.armR = lerp(this.armR, -0.5, 6 * dt);
      this.restTimer -= dt;
      if (this.restTimer <= 0) {
        this.attackCount++;
        this.facing = sign(px - cx) || -1;
        let atk = 'swat';
        if (this.hp <= 1) atk = ['swat', 'double', 'slam'][(this.attackCount - 1) % 3];
        else if (this.hp === 2) atk = (this.attackCount % 2 === 0) ? 'double' : 'swat';
        if (atk === 'slam') {
          this.mode = 'slamWind'; this.windupTimer = 0.75; this.attackRect = null;
          this.markerX = px; this.markerOn = true; this.markerLocked = false;
        } else {
          this.mode = 'walk'; this.walkTimer = 0; this.swatsLeft = (atk === 'double') ? 2 : 1;
        }
      }
    } else if (this.mode === 'walk') {
      this.walkTimer += dt;
      this.facing = sign(px - cx) || this.facing;
      this.vx = (Math.abs(px - cx) > 150) ? this.facing * speed : 0;
      setAnim(this, Math.abs(this.vx) > 5 ? 'run' : 'idle');
      if (Math.abs(px - cx) <= 150 || this.walkTimer > 1.8) { this.mode = 'windup'; this.windupTimer = 0.6; this.vx = 0; }
    } else if (this.mode === 'windup') {
      this.windupTimer -= dt; this.vx = 0;
      this.armL = lerp(this.armL, -0.9, 10 * dt);      // pull the arm back
      this.armR = lerp(this.armR, 0.9, 10 * dt);
      if (this.windupTimer <= 0) {
        this.mode = 'swat'; this.slamTimer = 0.28; SFX.swat();
        this.facing = sign(px - cx) || this.facing;
        const acx = this.x + this.w / 2;
        const ax = this.facing > 0 ? acx + 16 : acx - 16 - 84;
        this.attackRect = { x: ax, y: this.floorY - 50, w: 84, h: 50 };
        for (let i = 0; i < 8; i++) particles.push({ x: acx, y: this.y + this.h * 0.3, vx: rand(-70, 70), vy: rand(-90, -20), life: 0.5, maxLife: 0.5, color: '#A8D5D0', size: rand(3, 5), kind: 'poof', rot: 0, vr: 0, gravity: 200 });
      }
    } else if (this.mode === 'swat') {
      this.slamTimer -= dt;
      const t = 1 - this.slamTimer / 0.28;
      if (this.facing > 0) this.armR = lerp(0.9, -1.1, t); else this.armL = lerp(-0.9, 1.1, t);
      if (this.slamTimer <= 0) {
        this.attackRect = null;
        this.swatsLeft--;
        if (this.swatsLeft > 0) { this.mode = 'gap'; this.gapTimer = 0.35; }
        else { this.mode = 'tired'; this.tiredTimer = 1.2; }
      }
    } else if (this.mode === 'gap') {
      this.gapTimer -= dt; this.vx = 0;
      if (this.gapTimer <= 0) { this.mode = 'windup'; this.windupTimer = 0.3; }
    } else if (this.mode === 'tired') {
      this.tiredTimer -= dt;
      this.armL = lerp(this.armL, 0.5, 4 * dt); this.armR = lerp(this.armR, -0.5, 4 * dt);
      this.attackRect = null;
      if (this.tiredTimer <= 0) { this.mode = 'idle'; this.restTimer = 1.4; }
    } else if (this.mode === 'slamWind') {
      this.windupTimer -= dt; this.vx = 0;
      if (this.windupTimer > 0.4) this.markerX = lerp(this.markerX, px, clamp(6 * dt, 0, 1));
      else this.markerLocked = true;                    // locks 0.4s before impact
      if (this.windupTimer <= 0) {
        this.mode = 'slam'; this.slamTimer = 0.2;
        this.attackRect = { x: this.markerX - 55, y: this.floorY - 124, w: 110, h: 124 };
        this.markerOn = false;
        SFX.stomp();
        spawnShockwave(this.x + this.w / 2, -1, 200, this.floorY);
        spawnShockwave(this.x + this.w / 2, 1, 200, this.floorY);
        spawnBurst(this.markerX, this.floorY - 20, '#A8D5D0', 12, 'poof');
      }
    } else if (this.mode === 'slam') {
      this.slamTimer -= dt;
      if (this.slamTimer <= 0) { this.attackRect = null; this.mode = 'tired'; this.tiredTimer = 1.5; }
    }

    // gravity + ground collision for every mode
    this.vy = Math.min(this.vy + PHYS.GRAVITY * dt, PHYS.MAX_FALL);
    if (this.mode !== 'walk') this.vx = 0;
    moveAndCollide(this, dt);
    this.floorY = this.y + this.h;

    this.squash.x = lerp(this.squash.x, 1, 8 * dt);
    this.squash.y = lerp(this.squash.y, 1, 8 * dt);
    advanceAnim(this, dt);
  }
  takeHit() {
    if (this.invuln > 0 || !this.alive) return;
    this.hp--;
    this.invuln = 1.2;
    this.angry = true;
    if (this.hp <= 0) { this.alive = false; this.defeatTimer = 0; this.dead = true; this.squish = 1.2; }
    SFX.bossHit();
  }
}

/* ---------------- Particles (poofs, sparkles, confetti, leaves) ---------------- */
const particles = [];

function spawnBurst(x, y, color, count, kind) {
  for (let i = 0; i < count; i++) {
    const a = rand(0, Math.PI * 2), sp = rand(40, 180);
    particles.push({
      x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: rand(0.4, 0.9), maxLife: 0.9, color: color, size: rand(2, 5),
      kind: kind || 'poof', rot: rand(0, 6), vr: rand(-8, 8), gravity: 500
    });
  }
}

function spawnConfetti(x, y, count, palette) {
  const colors = palette || ['#e8792b', '#d94f2b', '#f2b134', '#5fbf4a', '#3f78d8', '#e8203a'];
  for (let i = 0; i < count; i++) {
    particles.push({
      x: x, y: y, vx: rand(-260, 260), vy: rand(-420, -120),
      life: rand(1.0, 2.0), maxLife: 2.0, color: colors[Math.floor(rand(0, colors.length))],
      size: rand(4, 8), kind: 'confetti', rot: rand(0, 6), vr: rand(-12, 12), gravity: 700
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += (p.gravity || 0) * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
  }
}

function drawParticles(ctx) {
  for (const p of particles) {
    const a = clamp(p.life / p.maxLife, 0, 1);
    const sx = p.x - cam.x, sy = p.y - cam.y;
    ctx.save();
    ctx.globalAlpha = a;
    if (p.kind === 'confetti') {
      ctx.translate(sx, sy); ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
    } else if (p.kind === 'sparkle') {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      for (let k = 0; k < 4; k++) {
        const ang = k * Math.PI / 2 + p.rot;
        ctx.lineTo(sx + Math.cos(ang) * p.size * 2, sy + Math.sin(ang) * p.size * 2);
        ctx.lineTo(sx + Math.cos(ang + Math.PI / 4) * p.size * 0.6, sy + Math.sin(ang + Math.PI / 4) * p.size * 0.6);
      }
      ctx.closePath(); ctx.fill();
    } else {
      ctx.fillStyle = p.color;
      ellipse(ctx, sx, sy, p.size, p.size);
    }
    ctx.restore();
  }
}

// Ambient weather: falling leaves in fall, snowflakes in winter, rain in the city.
const leaves = [];
// Where would a raindrop land at this x? (pit surface, or the top of solid ground)
function rainLandingY(x) {
  const col = Math.floor(x / TILE);
  for (const z of waterZones) if (col >= z.colA && col <= z.colB) return z.surfaceY;
  for (let r = 0; r < LEVEL_ROWS; r++) if (LEVEL.isSolid(col, r)) return r * TILE;
  return null;
}
function updateRainDrops(dt) {
  const cap = 110;
  for (let k = 0; k < 4 && leaves.length < cap; k++) {
    leaves.push({ x: cam.x + rand(-100, VIEW_W + 100), y: rand(-40, 10), vx: -70, vy: rand(900, 1100), rain: true });
  }
  for (let i = leaves.length - 1; i >= 0; i--) {
    const l = leaves[i];
    l.x += l.vx * dt; l.y += l.vy * dt;
    const surf = rainLandingY(l.x);
    if (surf !== null && l.y >= surf) {
      if (ripples.length < 40) ripples.push({ x: l.x, y: surf, t: 0, max: 0.5 });
      leaves.splice(i, 1);
    } else if (l.y > VIEW_H + 220 || l.x < cam.x - 240) {
      leaves.splice(i, 1);
    }
  }
}
function drawRainDrops(ctx) {
  ctx.strokeStyle = 'rgba(200,220,240,0.55)'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  for (const l of leaves) {
    const sx = l.x - cam.x, sy = l.y - cam.y;
    if (sy < -20 || sy > VIEW_H + 20) continue;
    ctx.moveTo(sx, sy); ctx.lineTo(sx - 2, sy + 14);
  }
  ctx.stroke();
}
function updateLeaves(dt) {
  const mode = theme && theme.ambient;
  if (mode === 'rain') { updateRainDrops(dt); return; }
  const winter = mode === 'flake';
  const leaf = mode === 'leaf';
  const cap = winter ? 44 : 26;
  if ((winter || leaf) && leaves.length < cap && Math.random() < 0.6) {
    if (winter) {
      leaves.push({
        x: cam.x + rand(-100, VIEW_W + 100), y: -20,
        vx: rand(-15, 25), vy: rand(20, 55), sway: rand(0, 6), swaySpeed: rand(0.8, 2),
        size: rand(1.6, 3.4), rot: rand(0, 6), vr: rand(-2, 2), color: '#ffffff', flake: true
      });
    } else {
      leaves.push({
        x: cam.x + rand(-100, VIEW_W + 100), y: -20,
        vx: rand(-20, 40), vy: rand(30, 70), sway: rand(0, 6), swaySpeed: rand(1, 2.5),
        size: rand(6, 11), rot: rand(0, 6), vr: rand(-3, 3),
        color: ['#e8792b', '#d94f2b', '#f2b134', '#c98a3d'][Math.floor(rand(0, 4))]
      });
    }
  }
  for (let i = leaves.length - 1; i >= 0; i--) {
    const l = leaves[i];
    l.sway += dt * l.swaySpeed;
    l.x += (l.vx + Math.sin(l.sway) * (l.flake ? 18 : 30)) * dt;
    l.y += l.vy * dt;
    l.rot += l.vr * dt;
    if (l.y > WORLD_H + 40) leaves.splice(i, 1);
  }
}
function drawLeaves(ctx) {
  if (theme && theme.ambient === 'rain') { drawRainDrops(ctx); return; }
  for (const l of leaves) {
    const sx = l.x - cam.x, sy = l.y - cam.y;
    ctx.save();
    if (l.flake) {
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = '#ffffff';
      if (l.size > 2.6) {
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
        for (let k = 0; k < 3; k++) {
          const a = k * Math.PI / 3 + l.rot;
          ctx.beginPath();
          ctx.moveTo(sx - Math.cos(a) * l.size, sy - Math.sin(a) * l.size);
          ctx.lineTo(sx + Math.cos(a) * l.size, sy + Math.sin(a) * l.size);
          ctx.stroke();
        }
      } else {
        ellipse(ctx, sx, sy, l.size, l.size);
      }
    } else {
      ctx.translate(sx, sy);
      ctx.rotate(l.rot);
      ctx.fillStyle = l.color;
      ctx.beginPath();
      ctx.moveTo(0, -l.size * 0.6);
      ctx.quadraticCurveTo(l.size * 0.6, 0, 0, l.size * 0.6);
      ctx.quadraticCurveTo(-l.size * 0.6, 0, 0, -l.size * 0.6);
      ctx.fill();
    }
    ctx.restore();
  }
}

/* ---------------- Shockwaves (boss dust attacks) ---------------- */
const shockwaves = [];
function spawnShockwave(x, dir, speed, floorY) {
  // floorY = the ground Boomer landed on (default: the arena floor)
  const groundY = (floorY === undefined) ? 12 * TILE : floorY;
  shockwaves.push({ x: x, y: groundY - 20, w: 26, h: 20, vx: dir * speed, life: 1.6 });
}
function updateShockwaves(dt) {
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const s = shockwaves[i];
    s.life -= dt; s.x += s.vx * dt;
    if (s.life <= 0) { shockwaves.splice(i, 1); continue; }
    // hit Fin if he is standing in it (jump over it to be safe!)
    if (player.invuln <= 0 && aabb(player, s) && player.y + player.h > s.y + 4) {
      hurtByEnemy(s);
    }
  }
}
function drawShockwaves(ctx) {
  const snow = theme && theme.ambient === 'flake';
  for (const s of shockwaves) {
    const sx = s.x - cam.x, sy = s.y - cam.y;
    ctx.save();
    ctx.globalAlpha = clamp(s.life / 1.6, 0, 1) * 0.9;
    ctx.fillStyle = snow ? '#e8f6ff' : '#c9a86a';
    ellipse(ctx, sx + s.w / 2, sy + s.h, s.w * 0.7, s.h * 0.9);
    ctx.fillStyle = snow ? '#ffffff' : '#efe0c0';
    ellipse(ctx, sx + s.w / 2, sy + s.h, s.w * 0.4, s.h * 0.5);
    ctx.restore();
  }
}

/* ================================================================
   9. GAME STATE, WORLD OBJECTS, CHECKPOINTS
   ================================================================ */

let player;
let enemies = [];
let coins = [];
let checkpoints = [];
let goal = { x: 0, active: false };
let cam = { x: 0, y: 0 };
let state = 'menu';            // menu | playing | win | gameover
let bossActive = false;
let boss = null;
let respawn = { x: 72, y: 398 };
let levelTime = 0;
let bannerTimer = 0;
let winTimer = 0;
let gameOverTimer = 0;
let time0 = 0;                 // clock used for animations
let camShake = 0;              // screen shake amount (for boss slams)
let camShakeTimer = 0;

// Set up (or reset) everything for a fresh run of the CURRENT level.
function resetGame() {
  parseLevel(LEVELS[currentLevel].build());

  // Fresh runtime copies so a restart clears the merry-go-round spin and palm state.
  LEVEL.merries = LEVEL.merries.map(m => ({ x: m.x, w: m.w, topY: m.topY, cx: m.x + m.w / 2, angle: 0 }));
  LEVEL.palms = LEVEL.palms.map(p => ({ x: p.col * TILE + TILE / 2, state: 'hang', t: 0, vy: 0, cocoX: p.col * TILE + TILE / 2, cocoY: 300 }));

  player = new Player(72, 12 * TILE - 34);
  player.hearts = 3; player.coins = 0;

  enemies = [];
  boss = null;
  for (const s of LEVEL.spawns) {
    const feetY = (s.row + 1) * TILE;
    const acc = s.acc || null;
    if (s.type === 'puppy') enemies.push(new Puppy(s.col * TILE, feetY - 26, acc));
    else if (s.type === 'bee') enemies.push(new Bee(s.col * TILE, feetY - 22, acc));
    else if (s.type === 'black') enemies.push(new Turnip(s.col * TILE, feetY - 26, 'black', acc));
    else if (s.type === 'red') enemies.push(new Turnip(s.col * TILE, feetY - 26, 'red', acc));
    else if (s.type === 'monkey') enemies.push(new Monkey(s.col * TILE, feetY - 28, acc));
    else if (s.type === 'sharky') enemies.push(new Sharky(s.col * TILE, 0, acc, s.opts));
    else if (s.type === 'boomer') { boss = new Boomer(s.col * TILE, feetY - 90); enemies.push(boss); }
    else if (s.type === 'penguin') { boss = new PuffyPenguin(s.col * TILE, feetY - 105); enemies.push(boss); }
    else if (s.type === 'basketball') { boss = new Basketball(s.col * TILE, feetY - 112); enemies.push(boss); }
    else if (s.type === 'bluebear') { boss = new BlueBear(s.col * TILE, feetY - 124); enemies.push(boss); }
  }

  coins = LEVEL.coins.map(c => new Coin(c.x - 10, c.y - 10));
  checkpoints = LEVEL.checkpoints.map((col, i) => ({ x: col * TILE, y: 12 * TILE - 34, index: i, active: false }));
  goal = { x: LEVEL.goalX, active: false };

  cam.x = 0; cam.y = 0;
  bossActive = false;
  respawn = { x: 72, y: 12 * TILE - 34 };
  levelTime = 0; bannerTimer = 3.0; winTimer = 0; gameOverTimer = 0;
  particles.length = 0; leaves.length = 0; shockwaves.length = 0; ripples.length = 0;
  camShake = 0; camShakeTimer = 0;
}

// Start (or restart) a level at the chosen difficulty — hearts always refill.
function startLevel(index) {
  currentLevel = index;
  theme = THEMES[LEVELS[index].theme];
  resetGame();
  player.hearts = DIFFICULTIES[menu.difficulty].hearts;
  bannerTimer = 3.0;
  state = 'playing';
  // Quiet rain hiss for the city level; silence it everywhere else.
  stopRain();
  if (theme.rainSound && audioCtx) startRain();
}

/* ================================================================
   10. CAMERA — follow Fin smoothly and stay inside the level
   ================================================================ */

function updateCamera(dt) {
  if (bossActive) {
    // During the boss fight the camera glides over and locks onto the arena.
    cam.x = lerp(cam.x, WORLD_W - VIEW_W, clamp(6 * dt, 0, 1));
    if (cam.x > WORLD_W - VIEW_W - 0.5) cam.x = WORLD_W - VIEW_W;
    cam.y = 0;
    return;
  }
  const lookAhead = player.facing * 70;
  const target = player.x + player.w / 2 + lookAhead - VIEW_W / 2;
  const t = clamp(8 * dt, 0, 1);
  cam.x = lerp(cam.x, target, t);
  cam.x = clamp(cam.x, 0, WORLD_W - VIEW_W);
  cam.y = 0;
}

/* ================================================================
   11. BACKGROUND RENDERER — the parallax layers (fake 3D depth!)
   ================================================================ */

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, VIEW_H);
  g.addColorStop(0, theme.skyTop); g.addColorStop(0.7, theme.skyMid); g.addColorStop(1, theme.skyBot);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  // warm sun with a soft glow (skipped on gray city levels)
  if (theme.sun) {
    const sg = ctx.createRadialGradient(SUN.x, SUN.y, 10, SUN.x, SUN.y, 130);
    sg.addColorStop(0, 'rgba(255,244,180,0.95)');
    sg.addColorStop(0.35, 'rgba(255,226,130,0.45)');
    sg.addColorStop(1, 'rgba(255,226,130,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(SUN.x - 140, SUN.y - 140, 280, 280);
    ctx.fillStyle = '#fff3c0';
    ellipse(ctx, SUN.x, SUN.y, 34, 34);
  }
}

function drawCloud(ctx, x, y, s, fill, shade) {
  ctx.fillStyle = fill || 'rgba(255,255,255,0.92)';
  ellipse(ctx, x, y, 34 * s, 20 * s);
  ellipse(ctx, x - 26 * s, y + 6 * s, 22 * s, 15 * s);
  ellipse(ctx, x + 26 * s, y + 6 * s, 24 * s, 16 * s);
  ellipse(ctx, x + 6 * s, y - 12 * s, 22 * s, 16 * s);
  ctx.fillStyle = shade || 'rgba(220,238,255,0.7)';
  ellipse(ctx, x, y + 10 * s, 40 * s, 8 * s);
}

function drawCloudLayer() {
  const dense = !!(theme && theme.cloudDense);        // city sky is thick gray cloud
  const sparse = (theme && theme.trees === 'palms');  // beach: just a few white clouds
  const factor = 0.12;
  const spacing = dense ? 260 : (sparse ? 600 : 420);
  const off = cam.x * factor - time0 * 8;
  const start = Math.floor(off / spacing) - 1;
  for (let i = start; i < start + Math.ceil(VIEW_W / spacing) + 3; i++) {
    const wx = i * spacing + hash(i) * (dense ? 120 : (sparse ? 260 : 220));
    const sx = wx - off;
    if (sx < -170 || sx > VIEW_W + 170) continue;
    if (dense) {
      drawCloud(ctx, sx, 30 + hash(i * 7) * 190, 1.3 + hash(i * 5) * 0.6, 'rgba(120,132,144,0.92)', 'rgba(100,112,124,0.7)');
    } else if (sparse) {
      drawCloud(ctx, sx, 36 + hash(i * 7) * 130, 0.7 + hash(i * 5) * 0.4);
    } else {
      drawCloud(ctx, sx, 40 + hash(i * 7) * 170, 0.7 + hash(i * 5) * 0.7);
    }
  }
}

function drawHillLayer(factor, baseY, amp, freq, color, colorBottom) {
  const off = cam.x * factor;
  ctx.beginPath();
  ctx.moveTo(0, VIEW_H);
  for (let x = 0; x <= VIEW_W; x += 10) {
    const wx = x + off;
    const y = baseY - amp * Math.sin(wx * freq) - amp * 0.5 * Math.sin(wx * freq * 2.3 + 1.7);
    ctx.lineTo(x, y);
  }
  ctx.lineTo(VIEW_W, VIEW_H);
  ctx.closePath();
  // soft gradient so the hills fade gently instead of forming a hard band
  const g = ctx.createLinearGradient(0, baseY - amp, 0, VIEW_H);
  g.addColorStop(0, color);
  g.addColorStop(1, colorBottom || color);
  ctx.fillStyle = g;
  ctx.fill();
}

function drawTreeLine() {
  const factor = 0.65, spacing = 185;
  const off = cam.x * factor;
  const start = Math.floor(off / spacing) - 1;
  for (let i = start; i < start + Math.ceil(VIEW_W / spacing) + 3; i++) {
    const wx = i * spacing + hash(i) * 70;
    const sx = wx - off;
    if (sx < -220 || sx > VIEW_W + 220) continue;
    // BIG trees rooted at the horizon — fall colors, or snowy pines in winter
    if (theme.trees === 'pine') drawSnowyPine(ctx, sx, 438, 1.8 + hash(i * 3) * 0.6, i);
    else drawFallTree(ctx, sx, 438, 1.8 + hash(i * 3) * 0.6, i);
  }
}

// ---- City skyline: three parallax layers of buildings (varied sizes!) ----
function drawSkylineLayer(factor, colors, wMin, wMax, hMin, hMax, baseY, opts) {
  opts = opts || {};
  const spacing = 130;
  const off = cam.x * factor;
  const start = Math.floor(off / spacing) - 2;
  const count = Math.ceil(VIEW_W / spacing) + 5;
  for (let i = start; i < start + count; i++) {
    const w = wMin + hash(i * 13.7) * (wMax - wMin);
    const bh = hMin + hash(i * 7.3) * (hMax - hMin);
    const bx = i * spacing + hash(i * 3.1) * 40 - off;
    if (bx + w < -30 || bx > VIEW_W + 30) continue;
    ctx.fillStyle = colors[Math.floor(hash(i * 5.5) * colors.length)];
    ctx.fillRect(bx, baseY - bh, w, bh);
    if (opts.antenna && hash(i * 9.1) > 0.6) ctx.fillRect(bx + w * 0.5 - 1, baseY - bh - 18, 2, 18);
    if (opts.windows) {
      const cols = Math.max(1, Math.floor(w / 12)), rows = Math.max(1, Math.floor(bh / 14));
      for (let wy = 0; wy < rows; wy++) {
        for (let wx = 0; wx < cols; wx++) {
          const lit = hash(i * 17.3 + wx * 3.7 + wy * 9.1) < 0.4;
          ctx.fillStyle = lit ? 'rgba(255,233,168,0.92)' : 'rgba(60,74,92,0.55)';
          ctx.fillRect(bx + 5 + wx * 12, baseY - bh + 6 + wy * 14, 6, 8);
        }
      }
      if (hash(i * 3.3) > 0.6) { ctx.fillStyle = '#6b6f76'; ctx.fillRect(bx + w * 0.6, baseY - bh - 12, 10, 12); }
    }
    if (opts.near) {
      const c1 = hash(i * 4.2) > 0.5 ? '#e0533f' : '#4a9a55';
      ctx.fillStyle = c1; ctx.fillRect(bx, baseY - 14, w, 8);
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      for (let k = 0; k < w; k += 10) ctx.fillRect(bx + k, baseY - 14, 5, 8);
      ctx.fillStyle = hash(i * 2.1) > 0.5 ? '#ff9ec4' : '#ffe066';
      for (let k = 8; k < w - 6; k += 16) ellipse(ctx, bx + k, baseY - 20, 2, 2);
    }
  }
}
function drawCityBack() {
  drawSkylineLayer(0.20, ['#8fa1b3', '#a9b7c6'], 50, 110, 120, 260, 440, { antenna: true });
  drawSkylineLayer(0.40, ['#b9a89a', '#9fb0a0', '#a8a1b8', '#c2a49a'], 80, 140, 160, 300, 440, { windows: true });
  drawSkylineLayer(0.65, ['#c97b63', '#7f9db8', '#d5b96e', '#8fae8f'], 110, 190, 200, 330, 440, { near: true });
}

// ---- Beach: ocean horizon, sand dunes and background palms ----
function drawBeachBack() {
  const farOff = cam.x * 0.20;
  const seaY = 305;
  ctx.fillStyle = '#2f8fd0';
  ctx.fillRect(0, seaY, VIEW_W, 440 - seaY);
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  for (let i = 0; i < 40; i++) {
    let gx = (i * 61 - farOff) % (VIEW_W + 80); if (gx < 0) gx += VIEW_W + 80;
    const gy = seaY + 8 + hash(i * 3) * (440 - seaY - 16);
    ellipse(ctx, gx - 40, gy, 4, 1.4);
  }
  // tiny distant island
  const islX = ((120 - farOff) % (VIEW_W + 300) + VIEW_W + 300) % (VIEW_W + 300) - 80;
  ctx.fillStyle = '#8fae8f';
  ellipse(ctx, islX, seaY + 2, 34, 10);
  // mid sand dunes
  const midOff = cam.x * 0.40;
  ctx.fillStyle = '#f0d58a';
  ctx.beginPath();
  ctx.moveTo(0, 440);
  for (let x = 0; x <= VIEW_W; x += 12) {
    const wx = x + midOff;
    const y = 402 - 26 * Math.sin(wx * 0.004) - 12 * Math.sin(wx * 0.011 + 1.3);
    ctx.lineTo(x, y);
  }
  ctx.lineTo(VIEW_W, 440); ctx.closePath(); ctx.fill();
  // near background palms
  const nearOff = cam.x * 0.65, spacing = 250;
  const start = Math.floor(nearOff / spacing) - 1;
  for (let i = start; i < start + Math.ceil(VIEW_W / spacing) + 3; i++) {
    const sx = i * spacing + hash(i) * 90 - nearOff;
    if (sx < -220 || sx > VIEW_W + 220) continue;
    drawPalm(ctx, sx, 440, 1.6 + hash(i * 3) * 0.6, Math.sin(time0 * 1.1 + i) * 2);
  }
}

// A faint far layer of rain for depth (drawn before the gameplay layer).
function drawRainFar() {
  if (!(theme && theme.ambient === 'rain')) return;
  ctx.strokeStyle = 'rgba(200,220,240,0.18)'; ctx.lineWidth = 1;
  const off = (time0 * 700) % 60;
  for (let i = 0; i < 60; i++) {
    const x = hash(i * 3.1) * VIEW_W;
    const y = (hash(i * 7.7) * VIEW_H + off) % VIEW_H;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 3, y + 12); ctx.stroke();
  }
}

function drawForeground() {
  if (theme.ground === 'pavement') return;   // no grass in the city
  const factor = 1.3, spacing = 120;
  const off = cam.x * factor;
  const start = Math.floor(off / spacing) - 1;
  const winter = theme.ambient === 'flake';
  const beach = theme.ground === 'sand';
  ctx.save();
  ctx.globalAlpha = 0.9;
  for (let i = start; i < start + Math.ceil(VIEW_W / spacing) + 3; i++) {
    const sx = i * spacing + hash(i * 11) * 50 - off;
    if (sx < -80 || sx > VIEW_W + 80) continue;
    if (beach) {
      // light beach-grass tufts in front
      ctx.fillStyle = '#7fae5a';
      for (let b = 0; b < 4; b++) {
        const bx = sx + b * 8 - 12, bh = 14 + hash(i * 13 + b) * 18;
        ctx.beginPath();
        ctx.moveTo(bx, VIEW_H); ctx.quadraticCurveTo(bx + 3, VIEW_H - bh, bx + 7, VIEW_H - bh - 3);
        ctx.quadraticCurveTo(bx + 4, VIEW_H - bh * 0.4, bx + 5, VIEW_H); ctx.closePath(); ctx.fill();
      }
    } else if (winter) {
      // fluffy white snow drifts passing in FRONT of everything
      const dh = 16 + hash(i * 13) * 22;
      ctx.fillStyle = 'rgba(244,250,255,0.95)';
      ctx.beginPath();
      ctx.moveTo(sx - 30, VIEW_H);
      ctx.quadraticCurveTo(sx - 10, VIEW_H - dh, sx + 6, VIEW_H - dh * 0.7);
      ctx.quadraticCurveTo(sx + 24, VIEW_H - dh * 1.1, sx + 42, VIEW_H);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(210,235,250,0.9)';
      ellipse(ctx, sx + 6, VIEW_H - dh * 0.4, 10, 4);
    } else {
      // tall dark grass tufts passing in FRONT of everything
      ctx.fillStyle = '#2f6d34';
      for (let b = 0; b < 5; b++) {
        const bx = sx + b * 7 - 14;
        const bh = 22 + hash(i * 13 + b) * 26;
        ctx.beginPath();
        ctx.moveTo(bx, VIEW_H);
        ctx.quadraticCurveTo(bx + 3, VIEW_H - bh, bx + 9, VIEW_H - bh - 4);
        ctx.quadraticCurveTo(bx + 5, VIEW_H - bh * 0.4, bx + 6, VIEW_H);
        ctx.closePath(); ctx.fill();
      }
      // occasional big leaf silhouette
      if (hash(i * 17) > 0.7) {
        ctx.fillStyle = 'rgba(180,80,30,0.55)';
        ctx.save(); ctx.translate(sx + 40, VIEW_H - 60); ctx.rotate(hash(i) * 3);
        ellipse(ctx, 0, 0, 26, 14); ctx.restore();
      }
    }
  }
  ctx.restore();
}

/* ================================================================
   12. GAMEPLAY RENDERING
   ================================================================ */

// Draw a soft shadow on the ground below an entity.
function drawShadow(ctx, ent) {
  const gx = ent.x + ent.w / 2;
  const groundY = groundBelow(gx, ent.y + ent.h);
  if (groundY > WORLD_H) return;
  const height = groundY - (ent.y + ent.h);
  const scale = clamp(1 - height / 320, 0.25, 1);
  ctx.save();
  ctx.globalAlpha = 0.28 * scale;
  ctx.fillStyle = '#000';
  ellipse(ctx, gx - cam.x, groundY - cam.y + 2, (ent.w * 0.5) * scale, 6 * scale);
  ctx.restore();
}

// The unified entity renderer — works for BOTH procedural and sprite-sheet frames.
function renderEntity(ent) {
  if (ent.dead && ent.squish !== undefined && ent.squish <= 0) return;
  if (!ent.noShadow) drawShadow(ctx, ent);

  const sx = ent.x - cam.x, sy = ent.y - cam.y;
  ctx.save();
  ctx.translate(sx + ent.w / 2, sy + ent.h);   // move to the FEET (squash pivot)
  ctx.scale(ent.facing || 1, 1);               // flip to face the right way
  const rs = ent.renderScale || 1;             // merry-go-round depth illusion
  if (rs !== 1) ctx.scale(rs, rs);
  const sq = ent.squash || { x: 1, y: 1 };
  ctx.scale(sq.x, sq.y);
  ctx.translate(-ent.w / 2, -ent.h);           // now local (0,0) is the top-left

  // Flashing when hurt / invulnerable, or dimmed on the far side of the ride
  const blink = ent.invuln > 0 && Math.floor(time0 * 20) % 2 === 0;
  if (blink) ctx.globalAlpha = 0.45;
  else if (ent.renderDim) ctx.globalAlpha = 0.82;

  const frame = currentFrame(ent);
  if (frame.kind === 'proc') {
    frame.draw(ctx, ent);
  } else if (frame.kind === 'sheet') {
    const img = AssetLoader.images[frame.src];
    if (img && img.complete) ctx.drawImage(img, frame.sx, frame.sy, frame.sw, frame.sh, 0, 0, ent.w, ent.h);
  }
  // optional hat / shades / shovel+pail on top of the enemy
  if (ent.acc) drawAccessory(ctx, ent.acc, ent.accType, ent.w, ent.h);
  ctx.restore();
}

function drawGameplay() {
  // ---- tiles (only the ones on screen) ----
  const c0 = Math.max(0, Math.floor(cam.x / TILE) - 1);
  const c1 = Math.min(LEVEL_COLS - 1, Math.floor((cam.x + VIEW_W) / TILE) + 1);
  for (let c = c0; c <= c1; c++) {
    for (let r = 0; r < LEVEL_ROWS; r++) {
      const ch = LEVEL.grid[r][c];
      if (ch === '.') continue;
      const sx = c * TILE - cam.x, sy = r * TILE - cam.y;
      drawTile(ctx, ch, sx, sy, LEVEL.isSolid(c, r - 1), c, r);
    }
  }

  // ---- water / puddles filling the gaps ----
  if (theme.water) drawWater(ctx);

  // ---- slides (Fin rides ON TOP of these, so draw them first) ----
  if (LEVEL.slides) for (const s of LEVEL.slides) drawSlide(ctx, s);
  // ---- merry-go-round backs ----
  if (LEVEL.merries) for (const m of LEVEL.merries) drawMerryBack(ctx, m);
  // ---- interactive coconut palms ----
  drawPalms(ctx);

  // ---- decorations (behind the characters) ----
  for (const d of LEVEL.decos) {
    const sx = d.x - cam.x;
    if (sx < -140 || sx > VIEW_W + 140) continue;
    const by = d.baseY - cam.y;
    if (d.type === 'tree') drawFallTree(ctx, sx, by, 1.0, d.x);
    else if (d.type === 'pine') drawSnowyPine(ctx, sx, by, 1.0, d.x);
    else if (d.type === 'snowman') drawSnowman(ctx, sx, by, 1.0, d.x);
    else if (d.type === 'pumpkin') drawPumpkin(ctx, sx, by, 1.0);
    else if (d.type === 'sign') drawSign(ctx, sx, by, 'THIS WAY!');
    else if (d.type === 'signBoss') drawSign(ctx, sx, by, theme.ambient === 'flake' ? 'PENGUIN AHEAD!' : theme.ambient === 'rain' ? 'HOOP AHEAD!' : theme.ambient === 'sun' ? 'BEAR AHEAD!' : 'BOSS AHEAD!');
    else if (d.type === 'signHop') drawSign(ctx, sx, by, 'HOP OUT!');
    // city decorations
    else if (d.type === 'lamp') drawLamp(ctx, sx, by);
    else if (d.type === 'hydrant') drawHydrant(ctx, sx, by);
    else if (d.type === 'bench') drawBench(ctx, sx, by);
    else if (d.type === 'trashcan') drawTrashcan(ctx, sx, by);
    else if (d.type === 'busstop') drawBusStop(ctx, sx, by);
    else if (d.type === 'flowerbox') drawFlowerBox(ctx, sx, by);
    else if (d.type === 'blossom') drawBlossom(ctx, sx, by);
    else if (d.type === 'flowerbed') drawFlowerbed(ctx, sx, by);
    else if (d.type === 'umbrella') drawUmbrellaStuck(ctx, sx, by);
    else if (d.type === 'hoop') drawHoop(ctx, sx, by);
    else if (d.type === 'laddersign') drawLadderSign(ctx, sx, by);
    // beach decorations
    else if (d.type === 'palmdeco') drawPalmDeco(ctx, sx, by);
    else if (d.type === 'umbrella_b') drawUmbrellaB(ctx, sx, by);
    else if (d.type === 'chair') drawChair(ctx, sx, by);
    else if (d.type === 'towel') drawTowel(ctx, sx, by);
    else if (d.type === 'sandcastle') drawSandcastle(ctx, sx, by);
    else if (d.type === 'pail') drawPail(ctx, sx, by);
    else if (d.type === 'shovel') drawShovelDeco(ctx, sx, by);
    else if (d.type === 'beachball') drawBeachball(ctx, sx, by);
    else if (d.type === 'surfboard') drawSurfboard(ctx, sx, by);
    else if (d.type === 'starfish') drawStarfishDeco(ctx, sx, by);
    else if (d.type === 'shell') drawShellDeco(ctx, sx, by);
    else if (d.type === 'cooler') drawCooler(ctx, sx, by);
  }

  // ---- checkpoints (fall flags, or candy canes in winter) ----
  for (const cp of checkpoints) {
    const sx = cp.x - cam.x;
    if (sx < -60 || sx > VIEW_W + 60) continue;
    if (theme.checkpoint === 'candycane') { drawCandyCane(ctx, sx, cp.y + 34, cp.active); continue; }
    ctx.fillStyle = '#6f4a24';
    ctx.fillRect(sx, cp.y + 4, 4, 30);
    ctx.fillStyle = cp.active ? '#5fbf4a' : '#c0c0c0';
    ctx.beginPath();
    ctx.moveTo(sx + 4, cp.y + 4);
    ctx.lineTo(sx + 30, cp.y + 14);
    ctx.lineTo(sx + 4, cp.y + 24);
    ctx.closePath(); ctx.fill();
  }

  // ---- goal flag (only appears after the boss is beaten) ----
  if (goal.active) {
    const sx = goal.x - cam.x;
    const winter = theme.ambient === 'flake';
    ctx.fillStyle = '#6f4a24';
    ctx.fillRect(sx, 12 * TILE - 110, 5, 110);
    ctx.fillStyle = winter ? '#2f8fd0' : '#f2b134';
    ctx.beginPath();
    ctx.moveTo(sx + 5, 12 * TILE - 110);
    ctx.lineTo(sx + 54, 12 * TILE - 92);
    ctx.lineTo(sx + 5, 12 * TILE - 74);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = winter ? 'rgba(15,60,105,0.9)' : 'rgba(150,90,10,0.85)';
    ctx.lineWidth = 2; ctx.stroke();
    if (winter) {
      ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 1.4;
      for (let k = 0; k < 3; k++) {
        const a = k * Math.PI / 3;
        ctx.beginPath();
        ctx.moveTo(sx + 28 - Math.cos(a) * 9, 12 * TILE - 92 - Math.sin(a) * 9);
        ctx.lineTo(sx + 28 + Math.cos(a) * 9, 12 * TILE - 92 + Math.sin(a) * 9);
        ctx.stroke();
      }
    }
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('GOAL', sx + 28, 12 * TILE - 92);
  }

  // ---- coins ----
  for (const co of coins) {
    if (co.taken) continue;
    const sx = co.x - cam.x;
    if (sx < -40 || sx > VIEW_W + 40) continue;
    drawCoin(ctx, co.x + 10 - cam.x, co.y + 10 - cam.y, 9, co.spin);
  }

  // ---- enemies + player ----
  for (const e of enemies) {
    if (e.dead && e.squish <= 0) continue;
    const sx = e.x - cam.x;
    if (sx < -200 || sx > VIEW_W + 200) continue;
    renderEntity(e);
  }
  renderEntity(player);

  // ---- merry-go-round front layer (so Fin looks like he circles the middle) ----
  if (LEVEL.merries) for (const m of LEVEL.merries) drawMerryFront(ctx, m);

  // ---- quicksand (drawn OVER Fin so he looks half-buried) ----
  drawQuicksandOverlay(ctx);

  // ---- boss attack sweeps + slam markers ----
  for (const e of enemies) {
    if (e.attackRect) {
      const r = e.attackRect;
      ctx.save();
      ctx.globalAlpha = 0.35 + 0.2 * Math.abs(Math.sin(time0 * 12));
      ctx.fillStyle = '#ffffff';
      ellipse(ctx, r.x - cam.x + r.w / 2, r.y - cam.y + r.h, r.w * 0.5, r.h * 0.35);
      ctx.restore();
    }
    if (e.markerOn) {
      const mx = e.markerX - cam.x, my = (e.floorY || WORLD_H) - cam.y;
      const pulse = 1 + 0.12 * Math.sin(time0 * 10);
      ctx.save();
      ctx.globalAlpha = 0.85;
      ctx.strokeStyle = '#ff3b30'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.ellipse(mx, my, 70 * pulse, 20 * pulse, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 0.35; ctx.fillStyle = '#ff3b30';
      ctx.beginPath(); ctx.ellipse(mx, my, 66 * pulse, 18 * pulse, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  // ---- if Fin is frozen in an ice cube, draw the cube on top ----
  if (player.frozen > 0) drawIceCube(ctx);

  // ---- shockwaves + ripples + particles + weather ----
  drawShockwaves(ctx);
  drawRipples(ctx);
  drawParticles(ctx);
  drawLeaves(ctx);
}

// A soft vignette + warm sunlight glow over everything (2.5D mood).
function drawOverlay() {
  const bright = theme.ground === 'sand';   // sunrise glow, no dark vignette on the beach
  const vg = ctx.createRadialGradient(VIEW_W / 2, VIEW_H / 2, 200, VIEW_W / 2, VIEW_H / 2, 620);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  if (theme.ambient === 'rain') vg.addColorStop(1, 'rgba(15,25,40,0.28)');
  else vg.addColorStop(1, bright ? 'rgba(40,30,0,0.10)' : 'rgba(40,20,0,0.28)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  if (theme.sun) {
    const wg = ctx.createRadialGradient(SUN.x, SUN.y, 20, SUN.x, SUN.y, 520);
    wg.addColorStop(0, 'rgba(255,230,150,' + (bright ? 0.22 : 0.16) + ')');
    wg.addColorStop(1, 'rgba(255,230,150,0)');
    ctx.fillStyle = wg;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }
}

function drawHeart(ctx, x, y, size, filled) {
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath();
  ctx.moveTo(0, size * 0.3);
  ctx.bezierCurveTo(size * 0.5, -size * 0.35, size * 1.1, size * 0.3, 0, size);
  ctx.bezierCurveTo(-size * 1.1, size * 0.3, -size * 0.5, -size * 0.35, 0, size * 0.3);
  ctx.closePath();
  ctx.fillStyle = filled ? '#e8203a' : 'rgba(60,60,60,0.55)';
  ctx.fill();
  ctx.strokeStyle = filled ? '#a01020' : 'rgba(30,30,30,0.6)';
  ctx.lineWidth = 2; ctx.stroke();
  if (filled) { ctx.fillStyle = 'rgba(255,255,255,0.6)'; ellipse(ctx, -size * 0.3, size * 0.1, 2.5, 3); }
  ctx.restore();
}

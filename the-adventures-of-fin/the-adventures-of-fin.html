/* ---------------- Particles (poofs, sparkles, confetti, leaves) ---------------- */
const particles = [];

function spawnBurst(x, y, color, count, kind) {
  for (let i = 0; i < count; i++) {
    const a = rand(0, Math.PI * 2), sp = rand(40, 180);
    particles.push({
      x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: rand(0.4, 0.9), maxLife: 0.9, color: color, size: rand(2, 5),
      kind: kind || 'poof', rot: rand(0, 6), vr: rand(-8, 8), gravity: 500
    });
  }
}

function spawnConfetti(x, y, count, palette) {
  const colors = palette || ['#e8792b', '#d94f2b', '#f2b134', '#5fbf4a', '#3f78d8', '#e8203a'];
  for (let i = 0; i < count; i++) {
    particles.push({
      x: x, y: y, vx: rand(-260, 260), vy: rand(-420, -120),
      life: rand(1.0, 2.0), maxLife: 2.0, color: colors[Math.floor(rand(0, colors.length))],
      size: rand(4, 8), kind: 'confetti', rot: rand(0, 6), vr: rand(-12, 12), gravity: 700
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += (p.gravity || 0) * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
  }
}

function drawParticles(ctx) {
  for (const p of particles) {
    const a = clamp(p.life / p.maxLife, 0, 1);
    const sx = p.x - cam.x, sy = p.y - cam.y;
    ctx.save();
    ctx.globalAlpha = a;
    if (p.kind === 'confetti') {
      ctx.translate(sx, sy); ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
    } else if (p.kind === 'sparkle') {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      for (let k = 0; k < 4; k++) {
        const ang = k * Math.PI / 2 + p.rot;
        ctx.lineTo(sx + Math.cos(ang) * p.size * 2, sy + Math.sin(ang) * p.size * 2);
        ctx.lineTo(sx + Math.cos(ang + Math.PI / 4) * p.size * 0.6, sy + Math.sin(ang + Math.PI / 4) * p.size * 0.6);
      }
      ctx.closePath(); ctx.fill();
    } else {
      ctx.fillStyle = p.color;
      ellipse(ctx, sx, sy, p.size, p.size);
    }
    ctx.restore();
  }
}

// Ambient weather: falling leaves in fall, drifting snowflakes in winter.
const leaves = [];
function updateLeaves(dt) {
  const winter = theme && theme.ambient === 'flake';
  const cap = winter ? 44 : 26;
  if (leaves.length < cap && Math.random() < 0.6) {
    if (winter) {
      leaves.push({
        x: cam.x + rand(-100, VIEW_W + 100), y: -20,
        vx: rand(-15, 25), vy: rand(20, 55), sway: rand(0, 6), swaySpeed: rand(0.8, 2),
        size: rand(1.6, 3.4), rot: rand(0, 6), vr: rand(-2, 2), color: '#ffffff', flake: true
      });
    } else {
      leaves.push({
        x: cam.x + rand(-100, VIEW_W + 100), y: -20,
        vx: rand(-20, 40), vy: rand(30, 70), sway: rand(0, 6), swaySpeed: rand(1, 2.5),
        size: rand(6, 11), rot: rand(0, 6), vr: rand(-3, 3),
        color: ['#e8792b', '#d94f2b', '#f2b134', '#c98a3d'][Math.floor(rand(0, 4))]
      });
    }
  }
  for (let i = leaves.length - 1; i >= 0; i--) {
    const l = leaves[i];
    l.sway += dt * l.swaySpeed;
    l.x += (l.vx + Math.sin(l.sway) * (l.flake ? 18 : 30)) * dt;
    l.y += l.vy * dt;
    l.rot += l.vr * dt;
    if (l.y > WORLD_H + 40) leaves.splice(i, 1);
  }
}
function drawLeaves(ctx) {
  for (const l of leaves) {
    const sx = l.x - cam.x, sy = l.y - cam.y;
    ctx.save();
    if (l.flake) {
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = '#ffffff';
      if (l.size > 2.6) {
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
        for (let k = 0; k < 3; k++) {
          const a = k * Math.PI / 3 + l.rot;
          ctx.beginPath();
          ctx.moveTo(sx - Math.cos(a) * l.size, sy - Math.sin(a) * l.size);
          ctx.lineTo(sx + Math.cos(a) * l.size, sy + Math.sin(a) * l.size);
          ctx.stroke();
        }
      } else {
        ellipse(ctx, sx, sy, l.size, l.size);
      }
    } else {
      ctx.translate(sx, sy);
      ctx.rotate(l.rot);
      ctx.fillStyle = l.color;
      ctx.beginPath();
      ctx.moveTo(0, -l.size * 0.6);
      ctx.quadraticCurveTo(l.size * 0.6, 0, 0, l.size * 0.6);
      ctx.quadraticCurveTo(-l.size * 0.6, 0, 0, -l.size * 0.6);
      ctx.fill();
    }
    ctx.restore();
  }
}

/* ---------------- Shockwaves (boss dust attacks) ---------------- */
const shockwaves = [];
function spawnShockwave(x, dir, speed, floorY) {
  // floorY = the ground Boomer landed on (default: the arena floor)
  const groundY = (floorY === undefined) ? 12 * TILE : floorY;
  shockwaves.push({ x: x, y: groundY - 20, w: 26, h: 20, vx: dir * speed, life: 1.6 });
}
function updateShockwaves(dt) {
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const s = shockwaves[i];
    s.life -= dt; s.x += s.vx * dt;
    if (s.life <= 0) { shockwaves.splice(i, 1); continue; }
    // hit Fin if he is standing in it (jump over it to be safe!)
    if (player.invuln <= 0 && aabb(player, s) && player.y + player.h > s.y + 4) {
      hurtByEnemy(s);
    }
  }
}
function drawShockwaves(ctx) {
  const snow = theme && theme.ambient === 'flake';
  for (const s of shockwaves) {
    const sx = s.x - cam.x, sy = s.y - cam.y;
    ctx.save();
    ctx.globalAlpha = clamp(s.life / 1.6, 0, 1) * 0.9;
    ctx.fillStyle = snow ? '#e8f6ff' : '#c9a86a';
    ellipse(ctx, sx + s.w / 2, sy + s.h, s.w * 0.7, s.h * 0.9);
    ctx.fillStyle = snow ? '#ffffff' : '#efe0c0';
    ellipse(ctx, sx + s.w / 2, sy + s.h, s.w * 0.4, s.h * 0.5);
    ctx.restore();
  }
}

/* ================================================================
   9. GAME STATE, WORLD OBJECTS, CHECKPOINTS
   ================================================================ */

let player;
let enemies = [];
let coins = [];
let checkpoints = [];
let goal = { x: 0, active: false };
let cam = { x: 0, y: 0 };
let state = 'menu';            // menu | playing | win | gameover
let bossActive = false;
let boss = null;
let respawn = { x: 72, y: 398 };
let levelTime = 0;
let bannerTimer = 0;
let winTimer = 0;
let gameOverTimer = 0;
let time0 = 0;                 // clock used for animations

// Set up (or reset) everything for a fresh run of the CURRENT level.
function resetGame() {
  parseLevel(LEVELS[currentLevel].build());

  player = new Player(72, 12 * TILE - 34);
  player.hearts = 3; player.coins = 0;

  enemies = [];
  boss = null;
  for (const s of LEVEL.spawns) {
    const feetY = (s.row + 1) * TILE;
    if (s.type === 'puppy') enemies.push(new Puppy(s.col * TILE, feetY - 26));
    else if (s.type === 'bee') enemies.push(new Bee(s.col * TILE, feetY - 22));
    else if (s.type === 'black') enemies.push(new Turnip(s.col * TILE, feetY - 26, 'black'));
    else if (s.type === 'red') enemies.push(new Turnip(s.col * TILE, feetY - 26, 'red'));
    else if (s.type === 'boomer') { boss = new Boomer(s.col * TILE, feetY - 90); enemies.push(boss); }
    else if (s.type === 'penguin') { boss = new PuffyPenguin(s.col * TILE, feetY - 105); enemies.push(boss); }
  }

  coins = LEVEL.coins.map(c => new Coin(c.x - 10, c.y - 10));
  checkpoints = LEVEL.checkpoints.map((col, i) => ({ x: col * TILE, y: 12 * TILE - 34, index: i, active: false }));
  goal = { x: LEVEL.goalX, active: false };

  cam.x = 0; cam.y = 0;
  bossActive = false;
  respawn = { x: 72, y: 12 * TILE - 34 };
  levelTime = 0; bannerTimer = 3.0; winTimer = 0; gameOverTimer = 0;
  particles.length = 0; leaves.length = 0; shockwaves.length = 0;
}

// Start (or restart) a level at the chosen difficulty — hearts always refill.
function startLevel(index) {
  currentLevel = index;
  theme = THEMES[LEVELS[index].theme];
  resetGame();
  player.hearts = DIFFICULTIES[menu.difficulty].hearts;
  bannerTimer = 3.0;
  state = 'playing';
}

/* ================================================================
   10. CAMERA — follow Fin smoothly and stay inside the level
   ================================================================ */

function updateCamera(dt) {
  if (bossActive) {
    // During the boss fight the camera glides over and locks onto the arena.
    cam.x = lerp(cam.x, WORLD_W - VIEW_W, clamp(6 * dt, 0, 1));
    if (cam.x > WORLD_W - VIEW_W - 0.5) cam.x = WORLD_W - VIEW_W;
    cam.y = 0;
    return;
  }
  const lookAhead = player.facing * 70;
  const target = player.x + player.w / 2 + lookAhead - VIEW_W / 2;
  const t = clamp(8 * dt, 0, 1);
  cam.x = lerp(cam.x, target, t);
  cam.x = clamp(cam.x, 0, WORLD_W - VIEW_W);
  cam.y = 0;
}

/* ================================================================
   11. BACKGROUND RENDERER — the parallax layers (fake 3D depth!)
   ================================================================ */

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, VIEW_H);
  g.addColorStop(0, theme.skyTop); g.addColorStop(0.7, theme.skyMid); g.addColorStop(1, theme.skyBot);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  // warm sun with a soft glow
  const sg = ctx.createRadialGradient(SUN.x, SUN.y, 10, SUN.x, SUN.y, 130);
  sg.addColorStop(0, 'rgba(255,244,180,0.95)');
  sg.addColorStop(0.35, 'rgba(255,226,130,0.45)');
  sg.addColorStop(1, 'rgba(255,226,130,0)');
  ctx.fillStyle = sg;
  ctx.fillRect(SUN.x - 140, SUN.y - 140, 280, 280);
  ctx.fillStyle = '#fff3c0';
  ellipse(ctx, SUN.x, SUN.y, 34, 34);
}

function drawCloud(ctx, x, y, s) {
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ellipse(ctx, x, y, 34 * s, 20 * s);
  ellipse(ctx, x - 26 * s, y + 6 * s, 22 * s, 15 * s);
  ellipse(ctx, x + 26 * s, y + 6 * s, 24 * s, 16 * s);
  ellipse(ctx, x + 6 * s, y - 12 * s, 22 * s, 16 * s);
  ctx.fillStyle = 'rgba(220,238,255,0.7)';
  ellipse(ctx, x, y + 10 * s, 40 * s, 8 * s);
}

function drawCloudLayer() {
  const factor = 0.12, spacing = 420;
  const off = cam.x * factor - time0 * 8;
  const start = Math.floor(off / spacing) - 1;
  for (let i = start; i < start + Math.ceil(VIEW_W / spacing) + 3; i++) {
    const wx = i * spacing + hash(i) * 220;
    const sx = wx - off;
    if (sx < -120 || sx > VIEW_W + 120) continue;
    drawCloud(ctx, sx, 40 + hash(i * 7) * 170, 0.7 + hash(i * 5) * 0.7);
  }
}

function drawHillLayer(factor, baseY, amp, freq, color, colorBottom) {
  const off = cam.x * factor;
  ctx.beginPath();
  ctx.moveTo(0, VIEW_H);
  for (let x = 0; x <= VIEW_W; x += 10) {
    const wx = x + off;
    const y = baseY - amp * Math.sin(wx * freq) - amp * 0.5 * Math.sin(wx * freq * 2.3 + 1.7);
    ctx.lineTo(x, y);
  }
  ctx.lineTo(VIEW_W, VIEW_H);
  ctx.closePath();
  // soft gradient so the hills fade gently instead of forming a hard band
  const g = ctx.createLinearGradient(0, baseY - amp, 0, VIEW_H);
  g.addColorStop(0, color);
  g.addColorStop(1, colorBottom || color);
  ctx.fillStyle = g;
  ctx.fill();
}

function drawTreeLine() {
  const factor = 0.65, spacing = 185;
  const off = cam.x * factor;
  const start = Math.floor(off / spacing) - 1;
  for (let i = start; i < start + Math.ceil(VIEW_W / spacing) + 3; i++) {
    const wx = i * spacing + hash(i) * 70;
    const sx = wx - off;
    if (sx < -220 || sx > VIEW_W + 220) continue;
    // BIG trees rooted at the horizon — fall colors, or snowy pines in winter
    if (theme.trees === 'pine') drawSnowyPine(ctx, sx, 438, 1.8 + hash(i * 3) * 0.6, i);
    else drawFallTree(ctx, sx, 438, 1.8 + hash(i * 3) * 0.6, i);
  }
}

function drawForeground() {
  const factor = 1.3, spacing = 120;
  const off = cam.x * factor;
  const start = Math.floor(off / spacing) - 1;
  const winter = theme.ambient === 'flake';
  ctx.save();
  ctx.globalAlpha = 0.9;
  for (let i = start; i < start + Math.ceil(VIEW_W / spacing) + 3; i++) {
    const sx = i * spacing + hash(i * 11) * 50 - off;
    if (sx < -80 || sx > VIEW_W + 80) continue;
    if (winter) {
      // fluffy white snow drifts passing in FRONT of everything
      const dh = 16 + hash(i * 13) * 22;
      ctx.fillStyle = 'rgba(244,250,255,0.95)';
      ctx.beginPath();
      ctx.moveTo(sx - 30, VIEW_H);
      ctx.quadraticCurveTo(sx - 10, VIEW_H - dh, sx + 6, VIEW_H - dh * 0.7);
      ctx.quadraticCurveTo(sx + 24, VIEW_H - dh * 1.1, sx + 42, VIEW_H);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(210,235,250,0.9)';
      ellipse(ctx, sx + 6, VIEW_H - dh * 0.4, 10, 4);
    } else {
      // tall dark grass tufts passing in FRONT of everything
      ctx.fillStyle = '#2f6d34';
      for (let b = 0; b < 5; b++) {
        const bx = sx + b * 7 - 14;
        const bh = 22 + hash(i * 13 + b) * 26;
        ctx.beginPath();
        ctx.moveTo(bx, VIEW_H);
        ctx.quadraticCurveTo(bx + 3, VIEW_H - bh, bx + 9, VIEW_H - bh - 4);
        ctx.quadraticCurveTo(bx + 5, VIEW_H - bh * 0.4, bx + 6, VIEW_H);
        ctx.closePath(); ctx.fill();
      }
      // occasional big leaf silhouette
      if (hash(i * 17) > 0.7) {
        ctx.fillStyle = 'rgba(180,80,30,0.55)';
        ctx.save(); ctx.translate(sx + 40, VIEW_H - 60); ctx.rotate(hash(i) * 3);
        ellipse(ctx, 0, 0, 26, 14); ctx.restore();
      }
    }
  }
  ctx.restore();
}

/* ================================================================
   12. GAMEPLAY RENDERING
   ================================================================ */

// Draw a soft shadow on the ground below an entity.
function drawShadow(ctx, ent) {
  const gx = ent.x + ent.w / 2;
  const groundY = groundBelow(gx, ent.y + ent.h);
  if (groundY > WORLD_H) return;
  const height = groundY - (ent.y + ent.h);
  const scale = clamp(1 - height / 320, 0.25, 1);
  ctx.save();
  ctx.globalAlpha = 0.28 * scale;
  ctx.fillStyle = '#000';
  ellipse(ctx, gx - cam.x, groundY - cam.y + 2, (ent.w * 0.5) * scale, 6 * scale);
  ctx.restore();
}

// The unified entity renderer — works for BOTH procedural and sprite-sheet frames.
function renderEntity(ent) {
  if (ent.dead && ent.squish !== undefined && ent.squish <= 0) return;
  drawShadow(ctx, ent);

  const sx = ent.x - cam.x, sy = ent.y - cam.y;
  ctx.save();
  ctx.translate(sx + ent.w / 2, sy + ent.h);   // move to the FEET (squash pivot)
  ctx.scale(ent.facing || 1, 1);               // flip to face the right way
  const sq = ent.squash || { x: 1, y: 1 };
  ctx.scale(sq.x, sq.y);
  ctx.translate(-ent.w / 2, -ent.h);           // now local (0,0) is the top-left

  // Flashing when hurt / invulnerable
  const blink = ent.invuln > 0 && Math.floor(time0 * 20) % 2 === 0;
  if (blink) ctx.globalAlpha = 0.45;

  const frame = currentFrame(ent);
  if (frame.kind === 'proc') {
    frame.draw(ctx, ent);
  } else if (frame.kind === 'sheet') {
    const img = AssetLoader.images[frame.src];
    if (img && img.complete) ctx.drawImage(img, frame.sx, frame.sy, frame.sw, frame.sh, 0, 0, ent.w, ent.h);
  }
  ctx.restore();
}

function drawGameplay() {
  // ---- tiles (only the ones on screen) ----
  const c0 = Math.max(0, Math.floor(cam.x / TILE) - 1);
  const c1 = Math.min(LEVEL_COLS - 1, Math.floor((cam.x + VIEW_W) / TILE) + 1);
  for (let c = c0; c <= c1; c++) {
    for (let r = 0; r < LEVEL_ROWS; r++) {
      const ch = LEVEL.grid[r][c];
      if (ch === '.') continue;
      const sx = c * TILE - cam.x, sy = r * TILE - cam.y;
      drawTile(ctx, ch, sx, sy, LEVEL.isSolid(c, r - 1), c, r);
    }
  }

  // ---- icy water filling the gaps (winter levels) ----
  if (theme.water) drawWater(ctx);

  // ---- decorations (behind the characters) ----
  for (const d of LEVEL.decos) {
    const sx = d.x - cam.x;
    if (sx < -140 || sx > VIEW_W + 140) continue;
    if (d.type === 'tree') drawFallTree(ctx, sx, d.baseY - cam.y, 1.0, d.x);
    else if (d.type === 'pine') drawSnowyPine(ctx, sx, d.baseY - cam.y, 1.0, d.x);
    else if (d.type === 'snowman') drawSnowman(ctx, sx, d.baseY - cam.y, 1.0, d.x);
    else if (d.type === 'pumpkin') drawPumpkin(ctx, sx, d.baseY - cam.y, 1.0);
    else if (d.type === 'sign') drawSign(ctx, sx, d.baseY - cam.y, 'THIS WAY!');
    else if (d.type === 'signBoss') drawSign(ctx, sx, d.baseY - cam.y, theme.ambient === 'flake' ? 'PENGUIN AHEAD!' : 'BOSS AHEAD!');
  }

  // ---- checkpoints (fall flags, or candy canes in winter) ----
  for (const cp of checkpoints) {
    const sx = cp.x - cam.x;
    if (sx < -60 || sx > VIEW_W + 60) continue;
    if (theme.checkpoint === 'candycane') { drawCandyCane(ctx, sx, cp.y + 34, cp.active); continue; }
    ctx.fillStyle = '#6f4a24';
    ctx.fillRect(sx, cp.y + 4, 4, 30);
    ctx.fillStyle = cp.active ? '#5fbf4a' : '#c0c0c0';
    ctx.beginPath();
    ctx.moveTo(sx + 4, cp.y + 4);
    ctx.lineTo(sx + 30, cp.y + 14);
    ctx.lineTo(sx + 4, cp.y + 24);
    ctx.closePath(); ctx.fill();
  }

  // ---- goal flag (only appears after the boss is beaten) ----
  if (goal.active) {
    const sx = goal.x - cam.x;
    const winter = theme.ambient === 'flake';
    ctx.fillStyle = '#6f4a24';
    ctx.fillRect(sx, 12 * TILE - 110, 5, 110);
    ctx.fillStyle = winter ? '#7fd0f0' : '#f2b134';
    ctx.beginPath();
    ctx.moveTo(sx + 5, 12 * TILE - 110);
    ctx.lineTo(sx + 54, 12 * TILE - 92);
    ctx.lineTo(sx + 5, 12 * TILE - 74);
    ctx.closePath(); ctx.fill();
    if (winter) {
      ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 1.4;
      for (let k = 0; k < 3; k++) {
        const a = k * Math.PI / 3;
        ctx.beginPath();
        ctx.moveTo(sx + 28 - Math.cos(a) * 9, 12 * TILE - 92 - Math.sin(a) * 9);
        ctx.lineTo(sx + 28 + Math.cos(a) * 9, 12 * TILE - 92 + Math.sin(a) * 9);
        ctx.stroke();
      }
    }
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('GOAL', sx + 28, 12 * TILE - 92);
  }

  // ---- coins ----
  for (const co of coins) {
    if (co.taken) continue;
    const sx = co.x - cam.x;
    if (sx < -40 || sx > VIEW_W + 40) continue;
    drawCoin(ctx, co.x + 10 - cam.x, co.y + 10 - cam.y, 9, co.spin);
  }

  // ---- enemies + player ----
  for (const e of enemies) {
    if (e.dead && e.squish <= 0) continue;
    const sx = e.x - cam.x;
    if (sx < -200 || sx > VIEW_W + 200) continue;
    renderEntity(e);
  }
  renderEntity(player);

  // ---- if Fin is frozen in an ice cube, draw the cube on top ----
  if (player.frozen > 0) drawIceCube(ctx);

  // ---- shockwaves + particles + leaves ----
  drawShockwaves(ctx);
  drawParticles(ctx);
  drawLeaves(ctx);
}

// A soft vignette + warm sunlight glow over everything (2.5D mood).
function drawOverlay() {
  const vg = ctx.createRadialGradient(VIEW_W / 2, VIEW_H / 2, 200, VIEW_W / 2, VIEW_H / 2, 620);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(40,20,0,0.28)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  const wg = ctx.createRadialGradient(SUN.x, SUN.y, 20, SUN.x, SUN.y, 520);
  wg.addColorStop(0, 'rgba(255,230,150,0.16)');
  wg.addColorStop(1, 'rgba(255,230,150,0)');
  ctx.fillStyle = wg;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
}

/* ================================================================
   13. HUD, SCREENS & MAIN LOOP
   ================================================================ */

function drawHeart(ctx, x, y, size, filled) {
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath();
  ctx.moveTo(0, size * 0.3);
  ctx.bezierCurveTo(size * 0.5, -size * 0.35, size * 1.1, size * 0.3, 0, size);
  ctx.bezierCurveTo(-size * 1.1, size * 0.3, -size * 0.5, -size * 0.35, 0, size * 0.3);
  ctx.closePath();
  ctx.fillStyle = filled ? '#e8203a' : 'rgba(60,60,60,0.55)';
  ctx.fill();
  ctx.strokeStyle = filled ? '#a01020' : 'rgba(30,30,30,0.6)';
  ctx.lineWidth = 2; ctx.stroke();
  if (filled) { ctx.fillStyle = 'rgba(255,255,255,0.6)'; ellipse(ctx, -size * 0.3, size * 0.1, 2.5, 3); }
  ctx.restore();
}

function drawHUD() {
  // hearts (as many slots as the chosen difficulty)
  const maxH = DIFFICULTIES[menu.difficulty].hearts;
  for (let i = 0; i < maxH; i++) drawHeart(ctx, 34 + i * 30, 26, 14, i < player.hearts);

  // coin counter
  drawCoin(ctx, VIEW_W - 92, 34, 11, time0 * 4);
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 4;
  ctx.font = 'bold 24px system-ui, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.strokeText('x ' + player.coins, VIEW_W - 74, 35);
  ctx.fillText('x ' + player.coins, VIEW_W - 74, 35);

  // boss health bar
  if (bossActive && boss && boss.alive) {
    const barW = 260, barX = VIEW_W / 2 - barW / 2, barY = 30;
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    roundRect(ctx, barX - 10, barY - 8, barW + 20, 34, 10); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(boss.name || 'BOSS', VIEW_W / 2, barY + 9);
    const segW = (barW - 8) / boss.maxHp;
    for (let i = 0; i < boss.maxHp; i++) {
      ctx.fillStyle = i < boss.hp ? '#e8203a' : 'rgba(255,255,255,0.2)';
      roundRect(ctx, barX + i * segW, barY + 18, segW - 4, 12, 4); ctx.fill();
    }
  }

  // level intro banner
  if (bannerTimer > 0) {
    const a = clamp(bannerTimer, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    roundRect(ctx, VIEW_W / 2 - 220, 90, 440, 54, 14); ctx.fill();
    ctx.fillStyle = '#ffe9a8';
    ctx.font = 'bold 26px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('LEVEL ' + (currentLevel + 1) + ' — ' + LEVELS[currentLevel].name.toUpperCase(), VIEW_W / 2, 118);
    ctx.restore();
  }

  // mute hint
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = '12px system-ui, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  ctx.fillText('M = sound ' + (muted ? 'OFF' : 'ON'), 20, VIEW_H - 14);
}

function bigText(text, y, size, color) {
  ctx.save();
  ctx.font = 'bold ' + size + 'px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(60,30,0,0.85)';
  ctx.strokeText(text, VIEW_W / 2, y);
  ctx.fillStyle = color;
  ctx.fillText(text, VIEW_W / 2, y);
  ctx.restore();
}

// A simple ground band behind the menu (grass or snow, matching the level).
function drawMenuGround() {
  if (theme.ground === 'snow') {
    ctx.fillStyle = '#bfe4f2'; ctx.fillRect(0, 430, VIEW_W, VIEW_H - 430);
    ctx.fillStyle = '#f4faff'; roundRect(ctx, -2, 424, VIEW_W + 4, 16, 6); ctx.fill();
    ctx.fillStyle = '#ffffff'; roundRect(ctx, -2, 424, VIEW_W + 4, 7, 5); ctx.fill();
  } else {
    ctx.fillStyle = COL.dirt; ctx.fillRect(0, 430, VIEW_W, VIEW_H - 430);
    ctx.fillStyle = COL.grass; roundRect(ctx, -2, 424, VIEW_W + 4, 16, 6); ctx.fill();
    ctx.fillStyle = COL.grassLight; roundRect(ctx, -2, 424, VIEW_W + 4, 7, 5); ctx.fill();
  }
}

// One selectable row of the menu (a label + a carousel value with arrows).
function drawMenuPanel(y, rowIndex, label, valueText) {
  const selected = menu.row === rowIndex;
  const w = 560, x = VIEW_W / 2 - w / 2, h = 58;
  ctx.save();
  ctx.globalAlpha = selected ? 1 : 0.85;
  ctx.fillStyle = 'rgba(0,0,0,' + (selected ? 0.62 : 0.5) + ')';
  roundRect(ctx, x, y, w, h, 14); ctx.fill();
  ctx.strokeStyle = selected ? '#ffe066' : 'rgba(255,255,255,0.35)';
  ctx.lineWidth = selected ? 3 : 1.5;
  roundRect(ctx, x, y, w, h, 14); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.font = 'bold 13px system-ui, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x + 16, y + h / 2);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 24px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(valueText, VIEW_W / 2, y + h / 2);
  const bob = Math.sin(time0 * 5) * 3;
  ctx.fillStyle = selected ? '#ffe066' : 'rgba(255,255,255,0.5)';
  ctx.font = 'bold 26px system-ui, sans-serif';
  ctx.fillText('◀', x + w - 46 - bob, y + h / 2);
  ctx.fillText('▶', x + w - 20 + bob, y + h / 2);
  ctx.restore();
}

function drawMenu() {
  ctx.fillStyle = 'rgba(20,15,10,0.42)';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  const bounce = Math.sin(time0 * 2.5) * 7;
  bigText('The Adventures of Fin', 96 + bounce, 50, '#ffe066');

  // Fin preview (wears his scarf when a winter level is picked)
  ctx.save();
  ctx.translate(VIEW_W / 2 - 34, 150);
  ctx.scale(2.2, 2.2);
  drawFin(ctx, 30, 34, { bob: Math.sin(time0 * 3) * 0.8 });
  ctx.restore();

  drawMenuPanel(250, 0, 'LEVEL', LEVELS[menu.level].icon + '  ' + LEVELS[menu.level].name);
  drawMenuPanel(324, 1, 'DIFFICULTY', DIFFICULTIES[menu.difficulty].name);

  // hearts preview for the chosen difficulty
  const maxH = DIFFICULTIES[menu.difficulty].hearts;
  for (let i = 0; i < maxH; i++) drawHeart(ctx, VIEW_W / 2 - maxH * 13 + 13 + i * 26, 398, 11, true);

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(time0 * 4);
  ctx.fillText('Press SPACE or ENTER to Start', VIEW_W / 2, 452);
  ctx.globalAlpha = 1;

  ctx.font = '15px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fillText('↑ ↓ choose a row   ·   ← → change   ·   Move: ←→/AD   Jump: SPACE/W/↑', VIEW_W / 2, 486);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText('During a level: press ESC to come back here', VIEW_W / 2, 510);
}

function drawWin() {
  ctx.fillStyle = 'rgba(30,20,5,0.5)';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  const bounce = Math.abs(Math.sin(time0 * 4)) * 16;
  bigText('FIN WINS!', 190 - bounce, 90, '#ffe066');

  ctx.font = 'bold 24px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.fillText(currentLevel === 1 ? 'You saved Antarctica! 🧊' : 'You saved Fall Fields! 🍁', VIEW_W / 2, 285);
  ctx.font = '20px system-ui, sans-serif';
  ctx.fillText('Time: ' + levelTime.toFixed(1) + 's      Coins: ' + player.coins, VIEW_W / 2, 330);
  ctx.fillStyle = '#ffe066';
  ctx.font = 'bold 22px system-ui, sans-serif';
  ctx.fillText('Press R to play again      Press Enter for Menu', VIEW_W / 2, 400);
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(40,0,0,0.55)';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  bigText('GAME OVER', 220, 72, '#ff6b6b');
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('Fin ran out of hearts!', VIEW_W / 2, 300);
  ctx.fillStyle = '#ffe066';
  ctx.fillText('Press R to try again      Press Enter for Menu', VIEW_W / 2, 350);
}

/* ---------------- Losing a heart & respawning ---------------- */
/* ---------------- Getting hurt ----------------
   Touching a bad guy: Fin bounces away and blinks (NO teleport).
   Falling in a pit: Fin loses a heart and restarts at the last checkpoint. */
function hurtByEnemy(source) {
  if (player.invuln > 0) return;              // mercy time after a hit
  player.invuln = 1.2;
  player.hearts = Math.max(0, player.hearts - 1);
  SFX.hurt();
  spawnBurst(player.x + player.w / 2, player.y + player.h / 2, '#e8203a', 12, 'poof');
  // knock Fin away from whatever hit him — a little bounce, NOT a teleport
  const srcX = source ? source.x + source.w / 2 : player.x;
  player.vx = (player.x + player.w / 2 < srcX) ? -230 : 230;
  player.vy = -300;
  if (player.hearts <= 0) { state = 'gameover'; gameOverTimer = 0; SFX.gameover(); }
}

function respawnAfterDeath() {
  if (player.hearts <= 0) return;
  player.hearts = Math.max(0, player.hearts - 1);
  player.invuln = 1.4;
  SFX.hurt();
  spawnBurst(player.x + player.w / 2, player.y + player.h / 2, '#e8203a', 12, 'poof');
  if (player.hearts <= 0) { state = 'gameover'; gameOverTimer = 0; SFX.gameover(); return; }
  // put Fin back at the last checkpoint (or safely inside the arena during the boss fight)
  if (bossActive) { player.x = cam.x + 80; player.y = 12 * TILE - player.h; }
  else { player.x = respawn.x; player.y = respawn.y; }
  player.vx = 0; player.vy = 0;
  player.frozen = 0;
  shockwaves.length = 0;
}

// Fell into a bottomless pit.
function fallInPit() { respawnAfterDeath(); }

// Splashed into icy water: Fin freezes into a cube, then shatters!
function freezeInWater() {
  if (player.frozen > 0) return;
  player.frozen = 0.9;
  player.vx = 0; player.vy = 40;
  SFX.freeze();
}

/* ---------------- Collisions between Fin and enemies ---------------- */
function handleEnemyCollisions() {
  if (player.frozen > 0) return;
  for (const e of enemies) {
    if (e.dead) continue;
    if (!aabb(player, e)) continue;

    const stomping = player.vy > 0 && (player.y + player.h) < (e.y + e.h * 0.55);
    if (stomping) {
      // bounce off the enemy
      player.vy = anyDown(KEY_JUMP) ? PHYS.STOMP_BOUNCE_HOLD : PHYS.STOMP_BOUNCE;
      player.squash = { x: 0.85, y: 1.15 }; player.squashTimer = 0.12;

      if (e === boss) {
        if (boss.invuln <= 0 && boss.alive) {
          boss.takeHit();
          spawnBurst(e.x + e.w / 2, e.y + 20, theme.ambient === 'flake' ? '#dff4ff' : '#a6c84a', 14, 'poof');
          if (!boss.alive) {
            // boss defeated — big party, then the goal flag appears!
            spawnConfetti(e.x + e.w / 2, e.y + e.h / 2, 60, theme.ambient === 'flake' ? ['#ffffff', '#dff4ff', '#bfe4f2', '#9fd8f5'] : undefined);
            goal.active = true;
          }
        }
      } else {
        e.dead = true; e.squish = 0.4;
        SFX.stomp();
        spawnBurst(e.x + e.w / 2, e.y + e.h / 2, '#ffffff', 12, 'poof');
      }
    } else {
      // touched from the side or below — ouch! Fin gets knocked away
      if (e !== boss || boss.alive) hurtByEnemy(e);
    }
  }
}

/* ---------------- Collect coins, checkpoints, goal ---------------- */
function handlePickups() {
  if (player.frozen > 0) return;
  for (const co of coins) {
    if (co.taken) continue;
    if (aabb(player, { x: co.x, y: co.y, w: 20, h: 20 })) {
      co.taken = true;
      player.coins++;
      SFX.coin();
      spawnBurst(co.x + 10, co.y + 10, '#fff6c0', 6, 'sparkle');
    }
  }
  for (const cp of checkpoints) {
    if (!cp.active && player.x + player.w / 2 >= cp.x) {
      cp.active = true;
      respawn = { x: cp.x, y: cp.y };
      SFX.checkpoint();
      spawnBurst(cp.x + 10, cp.y, '#5fbf4a', 10, 'sparkle');
    }
  }
  if (goal.active && player.x + player.w / 2 >= goal.x) {
    state = 'win'; winTimer = 0; bannerTimer = 0;
    spawnConfetti(player.x + player.w / 2, player.y, 40, theme.ambient === 'flake' ? ['#ffffff', '#dff4ff', '#bfe4f2', '#9fd8f5'] : undefined);
    SFX.win();
  }
}

/* ---------------- THE MAIN UPDATE ---------------- */
function update(dt) {
  time0 += dt;

  if (state === 'menu') {
    // Fin bobs gently on the menu screen
    setAnim(player, 'idle'); advanceAnim(player, dt);
    // ↑ ↓ switch rows
    if (anyPressed(['ArrowUp', 'w', 'W']) || anyPressed(['ArrowDown', 's', 'S'])) {
      menu.row = (menu.row + 1) % 2; SFX.menuBlip();
    }
    // ← → change the value in the selected row
    const goLeft = anyPressed(['ArrowLeft', 'a', 'A']);
    const goRight = anyPressed(['ArrowRight', 'd', 'D']);
    if (goLeft || goRight) {
      const dir = goRight ? 1 : -1;
      if (menu.row === 0) {
        menu.level = (menu.level + dir + LEVELS.length) % LEVELS.length;
        theme = THEMES[LEVELS[menu.level].theme];   // live background preview
      } else {
        menu.difficulty = (menu.difficulty + dir + DIFFICULTIES.length) % DIFFICULTIES.length;
      }
      SFX.menuBlip();
    }
    // SPACE / Enter starts the chosen level
    if (pressed[' '] || pressed['Enter']) { SFX.menuStart(); startLevel(menu.level); }
    updateParticles(dt);
  } else if (state === 'playing') {
    // ESC hops back to the menu
    if (pressed['Escape']) state = 'menu';

    if (state === 'playing') {
      levelTime += dt;
      if (bannerTimer > 0) bannerTimer -= dt;

      player.update(dt);

      // start the boss battle once Fin is well inside the arena (so he stays on screen)
      if (!bossActive && boss && player.x > (WORLD_W - VIEW_W) + 40) {
        bossActive = true;
        boss.hopTimer = 1.0;
        player.invuln = Math.max(player.invuln, 0.6);   // a short grace moment as the boss wakes up
      }
      // keep Fin inside the arena AND on screen during the fight
      if (bossActive) player.x = clamp(player.x, cam.x + 24, 214 * TILE - player.w);

      for (const e of enemies) e.update(dt);
      for (const co of coins) co.update(dt);

      handleEnemyCollisions();
      handlePickups();
      updateShockwaves(dt);
      updateParticles(dt);
      updateLeaves(dt);
      updateCamera(dt);
    }
  } else if (state === 'win') {
    winTimer += dt;
    updateParticles(dt); updateLeaves(dt);
    if (Math.random() < 0.4) spawnConfetti(cam.x + rand(100, VIEW_W - 100), -20, 4, theme.ambient === 'flake' ? ['#ffffff', '#dff4ff', '#bfe4f2', '#9fd8f5'] : undefined);
    if (pressed['r'] || pressed['R']) startLevel(currentLevel);
    if (pressed['Enter']) state = 'menu';
  } else if (state === 'gameover') {
    gameOverTimer += dt;
    updateParticles(dt);
    if (pressed['r'] || pressed['R']) startLevel(currentLevel);
    if (pressed['Enter']) state = 'menu';
  }

  // clear "pressed this frame" markers (do this LAST)
  for (const k in pressed) pressed[k] = false;
}

/* ---------------- THE MAIN RENDER ---------------- */
function render() {
  ctx.clearRect(0, 0, VIEW_W, VIEW_H);
  drawSky();
  drawCloudLayer();
  drawHillLayer(0.25, 330, 60, 0.0016, theme.farHill[0], theme.farHill[1]);   // far hazy hills (fade to sky)
  drawHillLayer(0.45, 400, 45, 0.0026, theme.midHill[0], theme.midHill[1]);   // mid hills
  drawTreeLine();
  if (state === 'menu') drawMenuGround(); else drawGameplay();
  drawForeground();
  drawOverlay();
  if (state !== 'menu') drawHUD();

  if (state === 'menu') drawMenu();
  else if (state === 'win') drawWin();
  else if (state === 'gameover') drawGameOver();
}

/* ---------------- Boot up! ---------------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function fitCanvas() {
  const scale = Math.min(window.innerWidth / VIEW_W, window.innerHeight / VIEW_H);
  canvas.style.width = (VIEW_W * scale) + 'px';
  canvas.style.height = (VIEW_H * scale) + 'px';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

resetGame();          // build the world
state = 'menu';       // ...and show the menu

// Fixed-timestep game loop: the game logic ALWAYS moves in exact 1/60-second
// steps, so jump height is identical on a 30fps, 60fps, or 144fps screen.
const STEP = 1 / 60;
let last = performance.now();
let acc = 0;                            // game time we still owe the logic
function loop(now) {
  const frameTime = Math.min((now - last) / 1000, 0.25);  // ignore long pauses
  last = now;
  acc += frameTime;
  let steps = 0;
  while (acc >= STEP && steps < 5) {    // catch up in fixed steps (max 5)
    update(STEP);
    acc -= STEP;
    steps++;
  }
  if (acc > STEP) acc = 0;              // too far behind? drop the backlog
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

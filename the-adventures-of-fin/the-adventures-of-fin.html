<script>
"use strict";

/* ================================================================
   1. CONFIG & CONSTANTS
   All the numbers we can tweak live here, in one easy place.
   ================================================================ */

const VIEW_H = 540;   // how tall it is
const TILE = 36;      // one square of the level is 36x36 pixels
const LEVEL_COLS = 216;               // how many squares wide Level 1 is
const LEVEL_ROWS = 15;                // how many squares tall
const WORLD_W = LEVEL_COLS * TILE;    // total world width in pixels
const WORLD_H = LEVEL_ROWS * TILE;    // total world height in pixels

  ACCEL_AIR: 1600,        // how quickly Fin speeds up in the air

  FRICTION_AIR: 300,      // how quickly Fin slows down in the air
  MAX_FALL: 900,          // fastest falling speed

  blue: '#2a5bb8', blueDark: '#1c3f86', blueLight: '#3f78d8', belly: '#e8f2ff',
  red: '#e8203a', teeth: '#fdf6e3'
};

// ---- Difficulty & level choices (used by the main menu) ----
const DIFFICULTIES = [
  { name: 'EASY',   hearts: 5 },

];
const LEVELS = [
  { name: 'Fall Fields',        icon: '🍁', theme: 'fall',   build: buildLevel1 },
  { name: 'Ice Ice Antarctica', icon: '❄️', theme: 'winter', build: buildLevel2 }
];
let currentLevel = 0;                                 // which level is loaded right now

// ---- Themes: one set of colors & rules per level look ----
const THEMES = {
  fall: {
    skyTop: COL.skyTop, skyMid: '#9fd8f5', skyBot: COL.skyBot,
    farHill: ['#a9c2e0', '#cfe0f0'], midHill: ['#8fb98a', '#a9cf9f'],
    trees: 'fall', ground: 'grass', platform: 'log', brick: 'brick',
    ambient: 'leaf', water: false, slipperyTiles: '', scarf: false,

  },

  }
};
let theme = THEMES.fall;

/* ================================================================
   2. UTILITIES — tiny helper functions used everywhere
   ================================================================ */

function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { return a + Math.random() * (b - a); }
function sign(v) { return v < 0 ? -1 : (v > 0 ? 1 : 0); }
// Deterministic "random" from a number, so decorations stay in the same spot each frame.
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
// Do two rectangles overlap? (AABB = axis-aligned bounding box)
function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
// Draw a filled ellipse quickly.
function ellipse(ctx, x, y, rx, ry, rot) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); ctx.fill(); }
// Draw a rounded rectangle path.
function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ================================================================
   3. AUDIO — beeps and boops made with code (no sound files!)
   ================================================================ */

let audioCtx = null;
let muted = false;

// Make the sound engine ready. Browsers only allow sound after a key press.
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

// The magic beep machine: sweeps from one note to another.
function beep(f1, f2, dur, type, vol) {
  if (!audioCtx || muted) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(f1, t);
  if (f2 !== f1) osc.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t + dur);
  gain.gain.setValueAtTime(vol || 0.12, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + dur + 0.03);
}

const SFX = {
  jump()   { beep(220, 520, 0.14, 'square', 0.10); },
  stomp()  { beep(300, 90, 0.14, 'square', 0.16); beep(120, 60, 0.16, 'triangle', 0.12); },
  coin()   { beep(988, 988, 0.07, 'square', 0.10); setTimeout(() => beep(1319, 1319, 0.12, 'square', 0.10), 70); },
  hurt()   { beep(420, 120, 0.30, 'sawtooth', 0.14); },
  bossHit(){ beep(160, 60, 0.30, 'sawtooth', 0.20); beep(90, 40, 0.35, 'triangle', 0.16); },
  checkpoint(){ beep(660, 660, 0.10, 'sine', 0.12); setTimeout(() => beep(990, 990, 0.16, 'sine', 0.12), 90); },
  win()    { const notes = [523, 659, 784, 1047, 1319]; notes.forEach((n, i) => setTimeout(() => beep(n, n, 0.22, 'triangle', 0.14), i * 130)); },
  gameover(){ const notes = [440, 349, 262, 196]; notes.forEach((n, i) => setTimeout(() => beep(n, n, 0.28, 'triangle', 0.13), i * 180)); },
  freeze() { beep(1400, 300, 0.5, 'sine', 0.12); beep(900, 200, 0.55, 'triangle', 0.08); },   // brrr!
  crack()  { beep(220, 70, 0.14, 'sawtooth', 0.14); },                                        // ice shatter
  slide()  { beep(160, 420, 0.45, 'triangle', 0.10); },                                       // penguin belly-slide
  menuBlip()  { beep(640, 640, 0.05, 'square', 0.06); },                                      // menu move
  menuStart() { beep(520, 780, 0.12, 'square', 0.09); setTimeout(() => beep(780, 1040, 0.16, 'square', 0.09), 110); }
};

/* ================================================================
   4. ASSET & ANIMATION SYSTEM  (sprite-sheet ready!)
   A "frame" can be:
     { kind:'proc',  draw(ctx, ent) }                         -> drawn with code (what we use now)
     { kind:'sheet', src, sx, sy, sw, sh }                     -> a piece of a picture (plug in later)
   Both kinds travel through the SAME render path, so swapping
   in real sprite sheets later needs zero changes to the game loop.
   ================================================================ */

// Small helper to build a procedural frame.
function procFrame(draw) { return { kind: 'proc', draw: draw }; }

// AssetLoader: looks through every animation, finds any 'sheet' frames,
// and pre-loads those pictures before the game starts.
const AssetLoader = {
  images: {},
  ready: true,
  _pending: 0,
  collect(anims) {
    for (const key in anims) {
      for (const frame of anims[key].frames) {
        if (frame.kind === 'sheet' && !this.images[frame.src]) {
          this._pending++;
          this.ready = false;
          const img = new Image();
          img.onload = img.onerror = () => {
            this.images[frame.src] = img;
            this._pending--;
            if (this._pending <= 0) this.ready = true;
          };
          img.src = frame.src;
          this.images[frame.src] = img;
        }
      }
    }
  }
};

// Advance the animation clock for an entity.
function advanceAnim(ent, dt) {
  ent.animTime += dt;
}
// Switch to a new animation state (resets the clock only when it changes).
function setAnim(ent, state) {
  if (ent.state !== state) { ent.state = state; ent.animTime = 0; }
}
// Work out which frame to show right now.
function currentFrame(ent) {
  const anim = ent.anims[ent.state] || ent.anims.idle;
  let i = Math.floor(ent.animTime * anim.fps);
  if (anim.loop) i = ((i % anim.frames.length) + anim.frames.length) % anim.frames.length;
  else i = clamp(i, 0, anim.frames.length - 1);
  return anim.frames[i];
}

/* ================================================================
   5. PROCEDURAL ART LIBRARY
   Pure drawing functions. They never change game logic — they only paint.
   ================================================================ */

/* ---------------- FIN (the hero) ----------------
   A fluffy royal-blue cube shark with a big friendly red smile. */
function drawFin(ctx, w, h, p) {
  p = p || {};
  const run = p.run || 0;
  const bob = p.bob || 0;
  const blink = !!p.blink;

  const swing = [0, 1, 0, -1][run % 4];

  // little feet (they wiggle when running)
  ctx.fillStyle = COL.blueDark;
  ellipse(ctx, w * 0.34, h - 2.5 + (run ? swing * 1.2 : 0), 5.5, 3.2);
  ellipse(ctx, w * 0.66, h - 2.5 - (run ? swing * 1.2 : 0), 5.5, 3.2);

  // stubby arms
  ellipse(ctx, 2.0, h * 0.62 + bob, 3.6, 6.2);
  ellipse(ctx, w - 2.0, h * 0.62 + bob, 3.6, 6.2);

  // body: a soft rounded cube
  const bx = 2, by = 3 + bob, bw = w - 4, bh = h - 7;
  const g = ctx.createLinearGradient(bx, by, bx + bw, by + bh);
  g.addColorStop(0, COL.blueLight); g.addColorStop(0.55, COL.blue); g.addColorStop(1, COL.blueDark);
  ctx.fillStyle = g;
  roundRect(ctx, bx, by, bw, bh, 9); ctx.fill();

  // fluffy bumps around the edge so it looks fuzzy
  ctx.fillStyle = COL.blue;
  ellipse(ctx, bx + 3, by + 5, 3, 3);
  ellipse(ctx, bx + bw - 3, by + 5, 3, 3);
  ellipse(ctx, bx + 3, by + bh - 5, 3, 3);
  ellipse(ctx, bx + bw - 3, by + bh - 5, 3, 3);

  // top fin (the little shark fin on his head)
  ctx.fillStyle = COL.blueDark;
  ctx.beginPath();
  ctx.moveTo(w * 0.48, by + 2);
  ctx.quadraticCurveTo(w * 0.66, by - 7, w * 0.74, by + 2);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = COL.blueLight;
  ctx.beginPath();
  ctx.moveTo(w * 0.52, by + 1);
  ctx.quadraticCurveTo(w * 0.64, by - 4, w * 0.68, by + 1);
  ctx.closePath(); ctx.fill();

  // cozy red scarf (winter levels only!) — a collar near the top, with a tail
  if (theme && theme.scarf) {
    const sy0 = by + bh * 0.08;
    ctx.fillStyle = '#e03030';
    roundRect(ctx, bx - 1, sy0, bw + 2, 6, 3); ctx.fill();
    ctx.fillStyle = '#a01010';
    ctx.fillRect(bx - 1, sy0 + 1.8, bw + 2, 1.4);
    // a little tail hanging off the back (left) side, swaying as Fin runs
    ctx.fillStyle = '#e03030';
    const sw = Math.sin(time0 * 6) * 1.5;
    ctx.beginPath();
    ctx.moveTo(bx - 1, sy0 + 3);
    ctx.quadraticCurveTo(bx - 7 + sw, sy0 + 10, bx - 3 + sw, sy0 + 17);
    ctx.lineTo(bx + 3, sy0 + 4);
    ctx.closePath(); ctx.fill();
  }

  // pale belly
  ctx.fillStyle = COL.belly;
  ellipse(ctx, w * 0.5, h * 0.74 + bob, w * 0.26, h * 0.19);

  // big friendly red mouth
  const mx = w * 0.5, my = h * 0.68 + bob, mrx = w * 0.33, mry = h * 0.185;
  ctx.fillStyle = COL.red;
  ellipse(ctx, mx, my, mrx, mry);
  ctx.fillStyle = '#b3142a';
  ellipse(ctx, mx, my + mry * 0.5, mrx * 0.85, mry * 0.35);

  // zig-zag teeth (top row points down, bottom row points up)
  ctx.fillStyle = COL.teeth;
  for (let i = -2; i <= 2; i++) {
    const tx = mx + i * mrx * 0.34;
    const ty = my - mry * 0.82;
    ctx.beginPath(); ctx.moveTo(tx - 2.3, ty - 1); ctx.lineTo(tx + 2.3, ty - 1); ctx.lineTo(tx, ty + 3.6); ctx.closePath(); ctx.fill();
  }
  for (let i = -1; i <= 1; i++) {
    const tx = mx + i * mrx * 0.42;
    const ty = my + mry * 0.85;
    ctx.beginPath(); ctx.moveTo(tx - 2.0, ty + 1); ctx.lineTo(tx + 2.0, ty + 1); ctx.lineTo(tx, ty - 3.2); ctx.closePath(); ctx.fill();
  }

  // eyes (low and wide apart, with a sparkle)
  if (blink) {
    ctx.strokeStyle = '#111'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(w * 0.28, h * 0.46 + bob); ctx.lineTo(w * 0.40, h * 0.46 + bob); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(w * 0.60, h * 0.46 + bob); ctx.lineTo(w * 0.72, h * 0.46 + bob); ctx.stroke();
  } else {
    ctx.fillStyle = '#111';
    ellipse(ctx, w * 0.34, h * 0.45 + bob, 2.4, 3.0);
    ellipse(ctx, w * 0.66, h * 0.45 + bob, 2.4, 3.0);
    ctx.fillStyle = '#fff';
    ellipse(ctx, w * 0.34 + 0.9, h * 0.45 + bob - 1, 0.9, 0.9);
    ellipse(ctx, w * 0.66 + 0.9, h * 0.45 + bob - 1, 0.9, 0.9);
  }

  // rim light on the sunny side (top-right)
  ctx.strokeStyle = 'rgba(255,255,255,0.30)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(w * 0.62, by + 6, bw * 0.30, -1.9, -0.7); ctx.stroke();
}

/* ---------------- PUPPY (enemy #1) ----------------
   A tiny round ball puppy: cream face stripe, tan side patches,
   huge blue sparkly eyes and pink blush cheeks. */
function drawPuppy(ctx, w, h, p) {
  p = p || {};
  const walk = p.walk || 0;
  const wob = [0, 1, 0, -1][walk % 4] * 0.6;

  // feet nubs
  ctx.fillStyle = '#efe6cd';
  ellipse(ctx, w * 0.34, h - 2, 4.5, 3);
  ellipse(ctx, w * 0.66, h - 2, 4.5, 3);

  // ears behind the body
  ctx.fillStyle = '#6b4226';
  ellipse(ctx, w * 0.14 + wob, h * 0.42, 5.5, 7);
  ellipse(ctx, w * 0.86 - wob, h * 0.42, 5.5, 7);

  // round cream body
  const cx = w * 0.5, cy = h * 0.52;
  const g = ctx.createRadialGradient(cx - 3, cy - 4, 2, cx, cy, w * 0.55);
  g.addColorStop(0, '#fffaf0'); g.addColorStop(1, '#e8dcbe');
  ctx.fillStyle = g;
  ellipse(ctx, cx, cy + wob, w * 0.46, h * 0.46);

  // tan side patches
  ctx.fillStyle = '#c98a3d';
  ellipse(ctx, w * 0.26, cy + wob, w * 0.24, h * 0.34);
  ellipse(ctx, w * 0.74, cy + wob, w * 0.24, h * 0.34);
  // golden outline
  ctx.strokeStyle = '#e0a24b'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(w * 0.26, cy + wob, w * 0.24, h * 0.34, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(w * 0.74, cy + wob, w * 0.24, h * 0.34, 0, 0, Math.PI * 2); ctx.stroke();

  // HUGE sparkly blue eyes
  ctx.fillStyle = '#1b2a5b';
  ellipse(ctx, w * 0.26, cy + wob, 4.6, 5.4);
  ellipse(ctx, w * 0.74, cy + wob, 4.6, 5.4);
  ctx.fillStyle = '#2f7bd8';
  ellipse(ctx, w * 0.26, cy + wob, 3.4, 4.2);
  ellipse(ctx, w * 0.74, cy + wob, 3.4, 4.2);
  ctx.fillStyle = '#0a1020';
  ellipse(ctx, w * 0.26, cy + wob + 0.6, 1.7, 2.1);
  ellipse(ctx, w * 0.74, cy + wob + 0.6, 1.7, 2.1);
  ctx.fillStyle = '#fff';
  ellipse(ctx, w * 0.26 - 1.2, cy + wob - 1.6, 1.1, 1.3);
  ellipse(ctx, w * 0.74 - 1.2, cy + wob - 1.6, 1.1, 1.3);

  // pink blush
  ctx.fillStyle = 'rgba(240,140,160,0.7)';
  ellipse(ctx, w * 0.26, cy + wob + 5, 3, 2);
  ellipse(ctx, w * 0.74, cy + wob + 5, 3, 2);

  // little nose and w-smile
  ctx.fillStyle = '#5a3a20';
  ctx.beginPath(); ctx.moveTo(cx - 1.8, cy + 4 + wob); ctx.lineTo(cx + 1.8, cy + 4 + wob); ctx.lineTo(cx, cy + 6.4 + wob); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#5a3a20'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx - 4, cy + 7 + wob); ctx.quadraticCurveTo(cx - 2, cy + 9.5 + wob, cx, cy + 7 + wob);
  ctx.quadraticCurveTo(cx + 2, cy + 9.5 + wob, cx + 4, cy + 7 + wob);
  ctx.stroke();
  ctx.fillStyle = '#f08a9a';
  ellipse(ctx, cx, cy + 9.6 + wob, 1.8, 1.3);
}

/* ---------------- BEE (enemy #2) ----------------
   A plump sunshine-yellow bumblebee with fluttery white wings. */
function drawBee(ctx, w, h, p) {
  p = p || {};
  const flap = p.flap || 0;   // 0 or 1
  const wob = p.wob || 0;

  // white wings on top (they flap)
  const wingTilt = flap ? -0.5 : -0.1;
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.save(); ctx.translate(w * 0.5, h * 0.22); ctx.rotate(wingTilt);
  ellipse(ctx, -5, -6, 5, 8); ctx.restore();
  ctx.save(); ctx.translate(w * 0.5, h * 0.22); ctx.rotate(wingTilt * 0.7);
  ellipse(ctx, 5, -7, 5, 8); ctx.restore();
  ctx.strokeStyle = 'rgba(180,200,220,0.8)'; ctx.lineWidth = 0.8;
  ctx.save(); ctx.translate(w * 0.5, h * 0.22); ctx.rotate(wingTilt); ctx.beginPath(); ctx.ellipse(-5, -6, 5, 8, 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore();

  // yellow egg body
  const cx = w * 0.5, cy = h * 0.55 + wob;
  const g = ctx.createRadialGradient(cx - 3, cy - 3, 2, cx, cy, w * 0.55);
  g.addColorStop(0, '#ffe86a'); g.addColorStop(1, '#f2c400');
  ctx.fillStyle = g;
  ellipse(ctx, cx, cy, w * 0.42, h * 0.40);

  // two black stripes wrapping the back
  ctx.strokeStyle = '#222'; ctx.lineWidth = 3.2;
  ctx.beginPath(); ctx.ellipse(cx + 3, cy, w * 0.40, h * 0.34, 0, -0.9, 0.9); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(cx + 7, cy, w * 0.40, h * 0.34, 0, -0.6, 0.6); ctx.stroke();

  // low, far-apart bead eyes
  ctx.fillStyle = '#111';
  ellipse(ctx, w * 0.34, cy + 1, 1.9, 1.9);
  ellipse(ctx, w * 0.66, cy + 1, 1.9, 1.9);
  ctx.fillStyle = '#fff';
  ellipse(ctx, w * 0.34 + 0.6, cy + 0.3, 0.6, 0.6);
  ellipse(ctx, w * 0.66 + 0.6, cy + 0.3, 0.6, 0.6);

  // simple smile
  ctx.strokeStyle = '#111'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.arc(cx, cy + 2.5, 3.4, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();

  // crochet swirl
  ctx.strokeStyle = 'rgba(200,160,0,0.6)'; ctx.lineWidth = 0.9;
  ctx.beginPath(); ctx.arc(cx + 4, cy + 4, 2.2, 0, Math.PI * 1.6); ctx.stroke();
}

/* ---------------- BOOMER (level 1 BOSS) ----------------
   A giant marbled-green dragon plush: cream belly + snout,
   big black dot eyes, silver horns and little bat wings. */
function drawBoomer(ctx, w, h, p) {
  p = p || {};
  const angry = p.angry;
  const flash = p.flash || 0;     // 0..1 white flash when hit
  const squash = p.squash || 1;   // used when defeated
  const cx = w * 0.5, cy = h * 0.55;

  ctx.save();
  ctx.translate(cx, h);
  ctx.scale(1, squash);
  ctx.translate(-cx, -h);

  // little bat wings low on the sides
  ctx.fillStyle = '#2e6b34';
  ctx.beginPath();
  ctx.moveTo(w * 0.18, cy + 6);
  ctx.quadraticCurveTo(w * -0.02, cy - 14, w * 0.06, cy + 16);
  ctx.quadraticCurveTo(w * 0.12, cy + 22, w * 0.20, cy + 16);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(w * 0.82, cy + 6);
  ctx.quadraticCurveTo(w * 1.02, cy - 14, w * 0.94, cy + 16);
  ctx.quadraticCurveTo(w * 0.88, cy + 22, w * 0.80, cy + 16);
  ctx.closePath(); ctx.fill();
  // bronze glitter panels
  ctx.fillStyle = '#c9a86a';
  ellipse(ctx, w * 0.11, cy + 8, 4, 7);
  ellipse(ctx, w * 0.89, cy + 8, 4, 7);

  // big marbled green body
  const g = ctx.createRadialGradient(cx - 14, cy - 16, 6, cx, cy, w * 0.55);
  g.addColorStop(0, '#6fae4a'); g.addColorStop(0.6, '#4c9a3a'); g.addColorStop(1, '#1f6b2e');
  ctx.fillStyle = g;
  ellipse(ctx, cx, cy, w * 0.47, h * 0.47);

  // watercolor blotches
  ctx.fillStyle = 'rgba(166,200,74,0.55)';
  ellipse(ctx, cx - w * 0.18, cy - h * 0.16, w * 0.11, h * 0.10);
  ellipse(ctx, cx + w * 0.16, cy - h * 0.02, w * 0.13, h * 0.11);
  ctx.fillStyle = 'rgba(31,107,46,0.45)';
  ellipse(ctx, cx + w * 0.02, cy + h * 0.22, w * 0.16, h * 0.10);
  ellipse(ctx, cx - w * 0.20, cy + h * 0.10, w * 0.10, h * 0.08);

  // cream belly
  ctx.fillStyle = '#f3efe0';
  ellipse(ctx, cx, cy + h * 0.24, w * 0.24, h * 0.20);

  // rounded cow-like ears
  ctx.fillStyle = '#3f8a37';
  ellipse(ctx, cx - w * 0.34, cy - h * 0.30, w * 0.10, h * 0.09);
  ellipse(ctx, cx + w * 0.34, cy - h * 0.30, w * 0.10, h * 0.09);
  ctx.fillStyle = '#efe6d0';
  ellipse(ctx, cx - w * 0.34, cy - h * 0.30, w * 0.05, h * 0.05);
  ellipse(ctx, cx + w * 0.34, cy - h * 0.30, w * 0.05, h * 0.05);

  // three silver glitter horns
  ctx.fillStyle = '#cfd6dc';
  ctx.beginPath(); ctx.moveTo(cx - w * 0.16, cy - h * 0.38); ctx.lineTo(cx - w * 0.10, cy - h * 0.56); ctx.lineTo(cx - w * 0.04, cy - h * 0.40); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx + w * 0.04, cy - h * 0.40); ctx.lineTo(cx + w * 0.11, cy - h * 0.56); ctx.lineTo(cx + w * 0.16, cy - h * 0.38); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx - w * 0.02, cy - h * 0.40); ctx.lineTo(cx + w * 0.01, cy - h * 0.50); ctx.lineTo(cx + w * 0.04, cy - h * 0.40); ctx.closePath(); ctx.fill();
  // sparkles
  ctx.fillStyle = '#fff';
  ellipse(ctx, cx - w * 0.11, cy - h * 0.48, 1.2, 1.2);
  ellipse(ctx, cx + w * 0.10, cy - h * 0.48, 1.2, 1.2);

  // cream snout with two little nostrils
  ctx.fillStyle = '#f3efe0';
  ellipse(ctx, cx, cy + h * 0.06, w * 0.15, h * 0.11);
  ctx.strokeStyle = '#4c9a3a'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(cx - w * 0.045, cy + h * 0.05, 2, 0.2 * Math.PI, 1.1 * Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx + w * 0.045, cy + h * 0.05, 2, 1.9 * Math.PI, 2.8 * Math.PI); ctx.stroke();

  // big black dot eyes (one a touch higher)
  ctx.fillStyle = '#0c0c0c';
  ellipse(ctx, cx - w * 0.18, cy - h * 0.12, w * 0.045, w * 0.045);
  ellipse(ctx, cx + w * 0.18, cy - h * 0.16, w * 0.045, w * 0.045);

  // angry eyebrows once he has been stomped
  if (angry) {
    ctx.strokeStyle = '#1f4a22'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx - w * 0.25, cy - h * 0.24); ctx.lineTo(cx - w * 0.11, cy - h * 0.19); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + w * 0.25, cy - h * 0.28); ctx.lineTo(cx + w * 0.11, cy - h * 0.22); ctx.stroke();
  }

  // rim light
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, w * 0.47, -1.8, -0.9); ctx.stroke();

  // white hit flash
  if (flash > 0) {
    ctx.globalAlpha = flash * 0.75;
    ctx.fillStyle = '#fff';
    ellipse(ctx, cx, cy, w * 0.47, h * 0.47);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/* ---------------- Coins, pumpkins, trees, signs ---------------- */
function drawCoin(ctx, cx, cy, r, spin) {
  const sx = Math.abs(Math.cos(spin));           // makes the coin look like it is spinning
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(Math.max(0.15, sx), 1);
  ctx.fillStyle = '#f2c94c'; ellipse(ctx, 0, 0, r, r);
  ctx.fillStyle = '#e0a92f'; ellipse(ctx, 0, 0, r * 0.68, r * 0.68);
  // winter coins have a tiny snowflake stamped on them!
  if (theme && theme.coin === 'snowcoin') {
    ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 1.1;
    for (let k = 0; k < 3; k++) {
      const a = k * Math.PI / 3;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * -r * 0.5, Math.sin(a) * -r * 0.5);
      ctx.lineTo(Math.cos(a) * r * 0.5, Math.sin(a) * r * 0.5);
      ctx.stroke();
    }
  }
  ctx.fillStyle = '#fff6c0'; ellipse(ctx, -r * 0.25, -r * 0.25, r * 0.22, r * 0.3);
  ctx.restore();
}

/* ---------------- WINTER ART ---------------- */

// A snow-covered pine tree for the background tree line.
function drawSnowyPine(ctx, x, baseY, s, seed) {
  ctx.save(); ctx.translate(x, baseY); ctx.scale(s, s);
  // trunk
  ctx.fillStyle = '#6f4a24';
  ctx.fillRect(-5, -34, 10, 34);
  // three stacked green tiers, each with a snow cap on top
  const tiers = [
    { y: -30, hw: 34, hh: 32 },
    { y: -54, hw: 27, hh: 26 },
    { y: -74, hw: 20, hh: 22 }
  ];
  for (const t of tiers) {
    ctx.fillStyle = '#2f6b46';
    ctx.beginPath();
    ctx.moveTo(0, t.y - t.hh);
    ctx.lineTo(-t.hw, t.y);
    ctx.lineTo(t.hw, t.y);
    ctx.closePath(); ctx.fill();
    // white snow sitting on the upper part of the tier
    ctx.fillStyle = '#f4faff';
    ctx.beginPath();
    ctx.moveTo(0, t.y - t.hh);
    ctx.lineTo(-t.hw * 0.55, t.y - t.hh * 0.32);
    ctx.lineTo(-t.hw * 0.18, t.y - t.hh * 0.42);
    ctx.lineTo(0, t.y - t.hh * 0.16);
    ctx.lineTo(t.hw * 0.3, t.y - t.hh * 0.46);
    ctx.lineTo(t.hw * 0.55, t.y - t.hh * 0.32);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

// A friendly snowman with a hat or scarf (varies with the seed).
function drawSnowman(ctx, x, baseY, s, seed) {
  ctx.save(); ctx.translate(x, baseY); ctx.scale(s, s);
  // stick arms behind the body
  ctx.strokeStyle = '#6f4a24'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-9, -22); ctx.lineTo(-24, -30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(9, -22); ctx.lineTo(24, -30); ctx.stroke();
  // two stacked snowballs
  ctx.fillStyle = '#f4faff'; ellipse(ctx, 0, -14, 16, 14);
  ctx.fillStyle = '#ffffff'; ellipse(ctx, 0, -36, 11, 10);
  ctx.strokeStyle = 'rgba(160,200,225,0.5)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(0, -14, 16, 14, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, -36, 11, 10, 0, 0, Math.PI * 2); ctx.stroke();
  // coal eyes, carrot nose, buttons
  ctx.fillStyle = '#222';
  ellipse(ctx, -4, -38, 1.7, 1.7); ellipse(ctx, 4, -38, 1.7, 1.7);
  ellipse(ctx, 0, -22, 1.6, 1.6); ellipse(ctx, 0, -15, 1.6, 1.6);
  ctx.fillStyle = '#e8802a';
  ctx.beginPath(); ctx.moveTo(0, -35); ctx.lineTo(9, -33); ctx.lineTo(0, -31); ctx.closePath(); ctx.fill();
  // hat OR scarf for variety
  if (hash(seed) > 0.5) {
    ctx.fillStyle = '#d02030';
    roundRect(ctx, -10, -47, 20, 6, 2); ctx.fill();
    ctx.fillRect(-8, -54, 16, 8);
    ctx.fillStyle = '#fff'; ellipse(ctx, 0, -55, 4, 4);
  } else {
    ctx.fillStyle = '#d02030';
    roundRect(ctx, -10, -47, 20, 5, 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillRect(-3, -47, 4, 5);
    ctx.fillRect(5, -47, 4, 5);
  }
  ctx.restore();
}

// A candy-cane checkpoint pole with a little flag.
function drawCandyCane(ctx, x, baseY, active) {
  ctx.save();
  // striped pole
  for (let i = 0; i < 11; i++) {
    ctx.fillStyle = (i % 2) ? '#e03030' : '#f8f8f8';
    ctx.fillRect(x, baseY - 44 + i * 4, 5, 4);
  }
  // hook at the top
  ctx.strokeStyle = '#f8f8f8'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(x + 8, baseY - 44, 8, Math.PI, 0); ctx.stroke();
  ctx.strokeStyle = '#e03030'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x + 8, baseY - 44, 8, Math.PI, 0); ctx.stroke();
  // small flag (green when this checkpoint is switched on)
  ctx.fillStyle = active ? '#5fbf4a' : '#c0c0c0';
  ctx.beginPath();
  ctx.moveTo(x + 5, baseY - 40);
  ctx.lineTo(x + 30, baseY - 32);
  ctx.lineTo(x + 5, baseY - 24);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// Ice-block tile (used for frozen platforms and the slippery arena floor).
function drawIceBlockTile(ctx, sx, sy, top) {
  ctx.fillStyle = '#8ec9e8';
  roundRect(ctx, sx + 1, sy + 1, TILE - 2, TILE - 2, 5); ctx.fill();
  ctx.fillStyle = '#b8e0f2';
  roundRect(ctx, sx + 2, sy + 2, TILE - 4, TILE - 5, 5); ctx.fill();
  // white corner shine + gloss streak
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.beginPath();
  ctx.moveTo(sx + 5, sy + TILE - 6);
  ctx.lineTo(sx + TILE - 8, sy + 5);
  ctx.lineTo(sx + TILE - 4, sy + 9);
  ctx.lineTo(sx + 9, sy + TILE - 3);
  ctx.closePath(); ctx.fill();
  // a couple of little cracks
  ctx.strokeStyle = 'rgba(120,180,210,0.7)'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(sx + 10, sy + 6); ctx.lineTo(sx + 15, sy + 14);
  ctx.moveTo(sx + 24, sy + 20); ctx.lineTo(sx + 28, sy + 28);
  ctx.stroke();
  if (top) {
    ctx.fillStyle = '#f4faff';
    roundRect(ctx, sx - 1, sy - 3, TILE + 2, 7, 3); ctx.fill();
  }
}

// Snow-topped ground tile.
function drawSnowGroundTile(ctx, sx, sy, hasSolidAbove, col, row) {
  ctx.fillStyle = '#bfe4f2';
  ctx.fillRect(sx, sy, TILE, TILE);
  const v = hash(col * 3.1 + row * 7.7);
  ctx.fillStyle = 'rgba(255,255,255,' + (0.05 + v * 0.06).toFixed(3) + ')';
  ellipse(ctx, sx + 9 + v * 18, sy + 14 + v * 12, 7 + v * 5, 4 + v * 4);
  ctx.fillStyle = 'rgba(120,170,205,0.25)';
  ellipse(ctx, sx + 24 - v * 10, sy + 27, 5, 3);
  if (!hasSolidAbove) {
    ctx.fillStyle = 'rgba(150,195,220,0.35)';
    ctx.fillRect(sx, sy + 7, TILE, 4);
    ctx.fillStyle = '#f4faff';
    roundRect(ctx, sx - 1, sy - 5, TILE + 2, 14, 5); ctx.fill();
    ctx.fillStyle = '#ffffff';
    roundRect(ctx, sx - 1, sy - 5, TILE + 2, 6, 4); ctx.fill();
  }
}

/* ---------------- TURNIP (winter enemy) ----------------
   A little egg-shaped penguin plush with a big silver face patch
   and huge star-sparkle eyes. Black one is slow; red one is angry + fast. */
function drawTurnip(ctx, w, h, p) {
  p = p || {};
  const kind = p.kind || 'black';
  const walk = p.walk || 0;
  const angry = p.angry;
  const dark = kind === 'black';
  const body = dark ? '#1c2440' : '#e03028';
  const bodyHi = dark ? '#2c3c66' : '#f05040';
  const bodyLo = dark ? '#11172c' : '#a01c16';
  const patch = dark ? '#d8dee8' : '#f0eadf';
  const beak = dark ? '#b8c840' : '#e8d040';
  const foot = dark ? '#11172c' : '#e8d040';

  const wob = [0, 1, 0, -1][walk % 4];
  const lean = angry ? 0.09 : 0;   // red turnip leans forward (angry!)

  ctx.save();
  ctx.translate(w * 0.5, h);
  ctx.rotate(lean * (p.flipLean === false ? 1 : 1));
  ctx.translate(-w * 0.5, -h);

  // tiny feet
  ctx.fillStyle = foot;
  ellipse(ctx, w * 0.36, h - 2 + wob * 0.8, 4.5, 3);
  ellipse(ctx, w * 0.64, h - 2 - wob * 0.8, 4.5, 3);

  // little flippers at the sides
  ctx.fillStyle = bodyLo;
  ellipse(ctx, w * 0.10, h * 0.66, 4, 6.5);
  ellipse(ctx, w * 0.90, h * 0.66, 4, 6.5);

  // egg body
  const cx = w * 0.5, cy = h * 0.54;
  const g = ctx.createRadialGradient(cx - 4, cy - 5, 2, cx, cy, w * 0.6);
  g.addColorStop(0, bodyHi); g.addColorStop(0.6, body); g.addColorStop(1, bodyLo);
  ctx.fillStyle = g;
  ellipse(ctx, cx, cy, w * 0.46, h * 0.5);

  // big pale face/belly patch, shaped like the top of a heart
  ctx.fillStyle = patch;
  ctx.beginPath();
  ctx.moveTo(cx, cy - h * 0.05);
  ctx.quadraticCurveTo(cx - w * 0.30, cy - h * 0.42, cx - w * 0.34, cy - h * 0.12);
  ctx.quadraticCurveTo(cx - w * 0.36, cy + h * 0.30, cx, cy + h * 0.46);
  ctx.quadraticCurveTo(cx + w * 0.36, cy + h * 0.30, cx + w * 0.34, cy - h * 0.12);
  ctx.quadraticCurveTo(cx + w * 0.30, cy - h * 0.42, cx, cy - h * 0.05);
  ctx.closePath(); ctx.fill();
  // stitch outline
  ctx.strokeStyle = dark ? 'rgba(150,160,185,0.9)' : 'rgba(200,180,160,0.9)';
  ctx.lineWidth = 1; ctx.stroke();

  // huge sparkly eyes with a star twinkle
  const ex = w * 0.30, ex2 = w * 0.70, ey = cy - h * 0.08;
  for (const X of [ex, ex2]) {
    ctx.fillStyle = '#101828'; ellipse(ctx, X, ey, 4.2, 5.0);
    ctx.fillStyle = '#3f8fe0'; ellipse(ctx, X, ey + 1.2, 3.0, 3.4);
    ctx.fillStyle = '#0a1020'; ellipse(ctx, X, ey + 0.4, 1.5, 1.9);
    ctx.fillStyle = '#fff'; ellipse(ctx, X - 1.2, ey - 1.6, 1.0, 1.2);
    // star sparkle (twinkles over time)
    const tw = 1.4 + Math.sin(time0 * 6 + X) * 0.6;
    ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(X - tw, ey - 2.6); ctx.lineTo(X + tw, ey - 2.6);
    ctx.moveTo(X, ey - 2.6 - tw); ctx.lineTo(X, ey - 2.6 + tw);
    ctx.stroke();
  }

  // pink blush cheeks
  ctx.fillStyle = 'rgba(240,150,170,0.6)';
  ellipse(ctx, ex, ey + 6, 2.6, 1.8);
  ellipse(ctx, ex2, ey + 6, 2.6, 1.8);

  // tiny beak
  ctx.fillStyle = beak;
  ellipse(ctx, cx, cy + h * 0.10, 3.0, 1.8);

  // angry eyebrows for the red turnip
  if (angry) {
    ctx.strokeStyle = '#7a1010'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ex - 4, ey - 7); ctx.lineTo(ex + 3, ey - 4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ex2 + 4, ey - 7); ctx.lineTo(ex2 - 3, ey - 4); ctx.stroke();
  }

  // rim light
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, w * 0.46, -1.9, -0.8); ctx.stroke();

  ctx.restore();
}

/* ---------------- PUFFY PENGUIN (Level 2 BOSS) ----------------
   A giant fluffy blue-and-white penguin: turquoise fur, a huge
   shaggy white belly-bib, tiny black eyes and a golden beak nub. */
function drawPuffy(ctx, w, h, p) {
  p = p || {};
  const angry = p.angry;
  const slide = p.slide;
  const bob = p.bob || 0;
  const flash = p.flash || 0;
  const cx = w * 0.5, cy = h * 0.56;

  ctx.save();
  if (slide) {
    // squashed low + leaning forward when belly-sliding
    ctx.translate(cx, h);
    ctx.scale(1.06, 0.9);
    ctx.translate(-cx, -h);
  }

  // floppy side flippers
  ctx.fillStyle = '#1d7fb0';
  const flip = slide ? 0.9 : 0.2;
  ctx.save(); ctx.translate(w * 0.12, cy + 4); ctx.rotate(flip);
  ellipse(ctx, 0, 0, 9, 16); ctx.restore();
  ctx.save(); ctx.translate(w * 0.88, cy + 4); ctx.rotate(-flip);
  ellipse(ctx, 0, 0, 9, 16); ctx.restore();

  // big round turquoise body
  const g = ctx.createRadialGradient(cx - 16, cy - 18, 8, cx, cy, w * 0.55);
  g.addColorStop(0, '#6fd0f0'); g.addColorStop(0.55, '#2fa8d8'); g.addColorStop(1, '#1d7fb0');
  ctx.fillStyle = g;
  ellipse(ctx, cx, cy, w * 0.47, h * 0.48);

  // shaggy fur tufts around the outline
  ctx.fillStyle = '#2fa8d8';
  for (let i = 0; i < 7; i++) {
    const a = (i / 7) * Math.PI * 2 + 0.4;
    const tx = cx + Math.cos(a) * w * 0.44, ty = cy + Math.sin(a) * h * 0.44;
    ctx.beginPath();
    ctx.moveTo(tx - 5, ty + 5); ctx.lineTo(tx + 2, ty - 6); ctx.lineTo(tx + 6, ty + 5);
    ctx.closePath(); ctx.fill();
  }

  // HUGE white fluffy belly bib
  ctx.fillStyle = '#f8fcff';
  ellipse(ctx, cx, cy + h * 0.14, w * 0.34, h * 0.32);
  // fluff wisps along the bib edge
  for (let i = 0; i < 7; i++) {
    const a = Math.PI * (0.15 + 0.7 * (i / 6));
    ellipse(ctx, cx + Math.cos(a) * w * 0.30, cy + h * 0.14 + Math.sin(a) * h * 0.30, 5, 5);
  }
  // two tall white lobes around the eyes
  ellipse(ctx, cx - w * 0.13, cy - h * 0.16, w * 0.15, h * 0.16);
  ellipse(ctx, cx + w * 0.13, cy - h * 0.16, w * 0.15, h * 0.16);

  // tiny black bead eyes with glints
  ctx.fillStyle = '#0c0c0c';
  ellipse(ctx, cx - w * 0.13, cy - h * 0.16, 3.2, 3.2);
  ellipse(ctx, cx + w * 0.13, cy - h * 0.18, 3.2, 3.2);
  ctx.fillStyle = '#fff';
  ellipse(ctx, cx - w * 0.13 + 1, cy - h * 0.16 - 1, 1.1, 1.1);
  ellipse(ctx, cx + w * 0.13 + 1, cy - h * 0.18 - 1, 1.1, 1.1);

  // little golden beak nub
  ctx.fillStyle = '#f0c030';
  ellipse(ctx, cx, cy - h * 0.05, 4.5, 3.4);
  ctx.fillStyle = '#d9a010';
  ellipse(ctx, cx, cy - h * 0.05 + 1.4, 3.2, 1.6);

  // angry brows after the first stomp
  if (angry) {
    ctx.strokeStyle = '#134a6a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx - w * 0.20, cy - h * 0.24); ctx.lineTo(cx - w * 0.07, cy - h * 0.20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + w * 0.20, cy - h * 0.26); ctx.lineTo(cx + w * 0.07, cy - h * 0.21); ctx.stroke();
  }

  // wobbly spiky crown tuft
  ctx.save();
  ctx.translate(cx, cy - h * 0.44);
  ctx.rotate(Math.sin(time0 * 6) * 0.15);
  ctx.fillStyle = '#2fa8d8';
  ctx.beginPath();
  ctx.moveTo(-8, 4); ctx.lineTo(-3, -12); ctx.lineTo(1, 2);
  ctx.lineTo(6, -10); ctx.lineTo(9, 4); ctx.closePath(); ctx.fill();
  ctx.restore();

  // rim light
  ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, w * 0.47, -1.9, -0.8); ctx.stroke();

  // white hit flash
  if (flash > 0) {
    ctx.globalAlpha = flash * 0.7;
    ctx.fillStyle = '#fff';
    ellipse(ctx, cx, cy, w * 0.47, h * 0.47);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

// Animated icy water surface + sparkles for the gaps.
function drawWater(ctx) {
  for (const z of waterZones) {
    const x = z.x - cam.x, w = z.w;
    if (x > VIEW_W || x + w < 0) continue;
    const y = z.surfaceY - cam.y;
    const g = ctx.createLinearGradient(0, y, 0, VIEW_H);
    g.addColorStop(0, 'rgba(127,208,240,0.85)');
    g.addColorStop(1, 'rgba(47,143,208,0.92)');
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, VIEW_H - y);
    // wavy white surface line
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let px = 0; px <= w; px += 6) {
      const wy = y + Math.sin((px + x) * 0.05 + time0 * 3) * 3;
      if (px === 0) ctx.moveTo(x + px, wy); else ctx.lineTo(x + px, wy);
    }
    ctx.stroke();
    // twinkling sparkles
    for (let i = 0; i < 6; i++) {
      const gx = x + hash(z.colA * 7 + i) * w;
      const gy = y + 8 + hash(z.colA * 3 + i) * (VIEW_H - y) * 0.7;
      ctx.globalAlpha = 0.25 + 0.55 * Math.abs(Math.sin(time0 * 4 + i));
      ctx.fillStyle = '#ffffff';
      ellipse(ctx, gx, gy, 2, 2);
      ctx.globalAlpha = 1;
    }
  }
}

// The see-through ice cube Fin gets trapped in when he falls in the water.
function drawIceCube(ctx) {
  const sx = player.x - cam.x - 4, sy = player.y - cam.y - 4;
  const w = player.w + 8, h = player.h + 8;
  ctx.save();
  ctx.fillStyle = 'rgba(205,238,255,0.55)';
  roundRect(ctx, sx, sy, w, h, 6); ctx.fill();
  ctx.strokeStyle = '#eaf8ff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(sx + 4, sy + h - 6); ctx.lineTo(sx + w * 0.5, sy + 4); ctx.stroke();
  if (player.frozen < 0.45) {
    ctx.strokeStyle = 'rgba(127,184,216,0.95)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(sx + w * 0.4, sy + 2); ctx.lineTo(sx + w * 0.5, sy + h * 0.5); ctx.lineTo(sx + w * 0.3, sy + h - 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx + w * 0.72, sy + 2); ctx.lineTo(sx + w * 0.6, sy + h * 0.6); ctx.stroke();
  }
  ctx.restore();
}

function drawPumpkin(ctx, x, baseY, s) {
  ctx.save(); ctx.translate(x, baseY); ctx.scale(s, s);
  // stem
  ctx.fillStyle = '#5a7a2a';
  ctx.fillRect(-2.5, -30, 5, 8);
  // body: several rounded ribs
  ctx.fillStyle = '#e07b1e';
  ellipse(ctx, 0, -12, 18, 15);
  ctx.fillStyle = '#c9621a';
  ellipse(ctx, -8, -12, 8, 15);
  ellipse(ctx, 8, -12, 8, 15);
  ctx.fillStyle = '#f0942e';
  ellipse(ctx, 0, -12, 9, 15);
  // cute friendly face
  ctx.fillStyle = '#7a3a10';
  ctx.beginPath(); ctx.moveTo(-7, -15); ctx.lineTo(-3, -15); ctx.lineTo(-5, -11); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(7, -15); ctx.lineTo(3, -15); ctx.lineTo(5, -11); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#7a3a10'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(0, -10, 6, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();

}

function drawFallTree(ctx, x, baseY, s, seed) {
  const colors = ['#e8792b', '#d94f2b', '#f2b134', '#e0632a'];
  const c1 = colors[Math.floor(hash(seed) * colors.length)];
  const c2 = colors[Math.floor(hash(seed + 5) * colors.length)];
  ctx.save(); ctx.translate(x, baseY); ctx.scale(s, s);
  // trunk
  ctx.fillStyle = '#6f4a24';
  ctx.fillRect(-5, -46, 10, 46);
  ctx.fillStyle = '#8a5a2b';
  ctx.fillRect(-5, -46, 4, 46);
  // canopy: three fluffy circles
  ctx.fillStyle = c1;
  ellipse(ctx, 0, -58, 30, 26);
  ctx.fillStyle = c2;
  ellipse(ctx, -18, -50, 20, 18);
  ellipse(ctx, 18, -52, 19, 17);

function drawSign(ctx, x, baseY, text) {

/* ---------------- Ground / platform / brick tiles ---------------- */
function drawTile(ctx, ch, sx, sy, hasSolidAbove, col, row) {
  if (ch === '#') {
    if (theme.ground === 'snow') { drawSnowGroundTile(ctx, sx, sy, hasSolidAbove, col, row); return; }
    // dirt block — a solid earthy brown with natural little patches
    ctx.fillStyle = COL.dirt;
    ctx.fillRect(sx, sy, TILE, TILE);
    const v = hash(col * 3.1 + row * 7.7);
    ctx.fillStyle = 'rgba(0,0,0,' + (0.04 + v * 0.06).toFixed(3) + ')';
    ellipse(ctx, sx + 9 + v * 18, sy + 12 + v * 14, 6 + v * 5, 4 + v * 4);
    ctx.fillStyle = 'rgba(255,220,170,0.06)';
    ellipse(ctx, sx + 24 - v * 10, sy + 26, 5, 3);
    // tiny pebbles
    ctx.fillStyle = 'rgba(0,0,0,0.10)';
    ctx.fillRect(sx + ((col * 13) % 24) + 4, sy + ((row * 17) % 22) + 6, 4, 4);
    // grass cap on top when nothing is above
    if (!hasSolidAbove) {
      ctx.fillStyle = 'rgba(0,0,0,0.16)';
      ctx.fillRect(sx, sy + 6, TILE, 4);
      ctx.fillStyle = COL.grass;
      roundRect(ctx, sx - 1, sy - 4, TILE + 2, 12, 4); ctx.fill();
      ctx.fillStyle = COL.grassLight;
      roundRect(ctx, sx - 1, sy - 4, TILE + 2, 5, 3); ctx.fill();
    }
  } else if (ch === '=') {
    if (theme.platform === 'ice') { drawIceBlockTile(ctx, sx, sy, true); return; }
    // wooden log platform
    ctx.fillStyle = COL.woodDark;
    roundRect(ctx, sx, sy + 6, TILE, TILE - 10, 8); ctx.fill();
    ctx.fillStyle = COL.wood;
    roundRect(ctx, sx, sy + 4, TILE, TILE - 12, 8); ctx.fill();
    ctx.strokeStyle = 'rgba(90,60,30,0.6)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(sx + 8, sy + 8); ctx.lineTo(sx + 8, sy + TILE - 10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx + TILE - 8, sy + 8); ctx.lineTo(sx + TILE - 8, sy + TILE - 10); ctx.stroke();
    // grass tuft on top
    ctx.fillStyle = COL.grassLight;
    ellipse(ctx, sx + TILE * 0.3, sy + 4, 5, 3);
    ellipse(ctx, sx + TILE * 0.7, sy + 4, 5, 3);
  } else if (ch === 'B' || ch === 'I') {
    if (theme.brick === 'iceblock') { drawIceBlockTile(ctx, sx, sy, ch === 'I' || !hasSolidAbove); return; }
    // brick block
    ctx.fillStyle = COL.brickDark;
    ctx.fillRect(sx, sy, TILE, TILE);
    ctx.fillStyle = COL.brick;
    ctx.fillRect(sx + 1, sy + 1, TILE - 2, TILE - 2);
    ctx.strokeStyle = 'rgba(80,30,15,0.55)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(sx, sy + TILE / 2); ctx.lineTo(sx + TILE, sy + TILE / 2);
    ctx.moveTo(sx + TILE / 2, sy); ctx.lineTo(sx + TILE / 2, sy + TILE / 2);
    ctx.moveTo(sx + TILE * 0.25, sy + TILE / 2); ctx.lineTo(sx + TILE * 0.25, sy + TILE);
    ctx.moveTo(sx + TILE * 0.75, sy + TILE / 2); ctx.lineTo(sx + TILE * 0.75, sy + TILE);
    ctx.stroke();
  }
}

function anyDown(list) { return list.some(k => keys[k]); }

window.addEventListener('keydown', (e) => {
  initAudio();
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
  if (e.key === 'm' || e.key === 'M') muted = !muted;   // M toggles sound on/off

/* ================================================================
   7. LEVEL BUILDER + LEVEL 1 DATA
   Tiny helper functions let us "paint" the level in plain English.
   ================================================================ */

class LevelBuilder {
  constructor(cols, rows) {
    this.cols = cols; this.rows = rows;
    this.grid = [];
    for (let r = 0; r < rows; r++) this.grid.push(new Array(cols).fill('.'));
    this.coinList = []; this.decoList = []; this.spawnList = [];
    this.checkpointList = []; this.goalCol = null;
  }
  _fill(cA, cB, rA, rB, ch) {
    for (let c = cA; c <= cB; c++)
      for (let r = rA; r <= rB; r++)
        if (c >= 0 && c < this.cols && r >= 0 && r < this.rows) this.grid[r][c] = ch;
    return this;
  }
  ground(cA, cB, topRow) { return this._fill(cA, cB, topRow === undefined ? 12 : topRow, this.rows - 1, '#'); }
  platform(col, row, len) { return this._fill(col, col + len - 1, row, row, '='); }
  brick(col, row, len) { return this._fill(col, col + len - 1, row, row, 'B'); }
  coins(col, row, count) { for (let i = 0; i < count; i++) this.coinList.push({ col: col + i, row: row }); return this; }
  deco(type, col, row) { this.decoList.push({ type: type, col: col, row: row === undefined ? 11 : row }); return this; }
  enemy(type, col, row) { this.spawnList.push({ type: type, col: col, row: row }); return this; }
  checkpoint(col) { this.checkpointList.push(col); return this; }
  goal(col) { this.goalCol = col; return this; }
  // Turn the top row of ground into slick ice ('I' = solid + slippery + ice look).
  iceFloor(colA, colB) {
    for (let c = colA; c <= colB; c++) if (this.grid[12][c] === '#') this.grid[12][c] = 'I';
    return this;
  }
  isSolid(col, row) {
    if (col < 0 || col >= this.cols || row < 0 || row >= this.rows) return false;
    const ch = this.grid[row][col];
    return ch === '#' || ch === '=' || ch === 'B' || ch === 'I';
  }
}

// Turn the builder data into simple lists the game can use.
let LEVEL = null;
function parseLevel(L) {
  LEVEL = {
    grid: L.grid,
    isSolid: (c, r) => L.isSolid(c, r),
    coins: L.coinList.map(c => ({ x: (c.col + 0.5) * TILE, y: (c.row + 0.5) * TILE })),
    decos: L.decoList.map(d => ({ type: d.type, x: d.col * TILE + TILE / 2, baseY: (d.row + 1) * TILE })),
    spawns: L.spawnList,
    checkpoints: L.checkpointList,
    goalX: L.goalCol * TILE + TILE / 2
  };
  // Find the gaps (columns with no ground in the bottom rows) — winter levels
  // fill these with icy water.
  waterZones = [];
  let start = -1;
  for (let c = 0; c <= LEVEL_COLS; c++) {
    const isGap = c < LEVEL_COLS && !L.isSolid(c, 12) && !L.isSolid(c, 13) && !L.isSolid(c, 14);
    if (isGap && start < 0) start = c;
    if (!isGap && start >= 0) {
      waterZones.push({ colA: start, colB: c - 1, x: start * TILE, w: (c - start) * TILE, surfaceY: 12 * TILE - 8 });
      start = -1;
    }
  }
}

/* ---- Helper: is a point inside a solid tile? ---- */
function solidAtPx(px, py) {
  return LEVEL.isSolid(Math.floor(px / TILE), Math.floor(py / TILE));
}

/* ---- Helper: what kind of tile is at this point? ('.' = empty) ---- */
function tileCharAtPx(px, py) {
  const c = Math.floor(px / TILE), r = Math.floor(py / TILE);
  if (c < 0 || c >= LEVEL_COLS || r < 0 || r >= LEVEL_ROWS) return '.';
  return LEVEL.grid[r][c];
}

/* ---- Physics + collision: move an entity and stop it at walls/floors ---- */
function moveAndCollide(ent, dt) {
  // ---- move sideways ----
  ent.x += ent.vx * dt;
  let c0 = Math.floor(ent.x / TILE), c1 = Math.floor((ent.x + ent.w - 0.001) / TILE);
  let r0 = Math.floor(ent.y / TILE), r1 = Math.floor((ent.y + ent.h - 0.001) / TILE);
  for (let c = c0; c <= c1; c++) {
    for (let r = r0; r <= r1; r++) {
      if (LEVEL.isSolid(c, r)) {
        if (ent.vx > 0) ent.x = c * TILE - ent.w;
        else if (ent.vx < 0) ent.x = (c + 1) * TILE;
        ent.vx = 0;
      }
    }
  }

  // ---- move up/down ----
  ent.y += ent.vy * dt;
  c0 = Math.floor(ent.x / TILE); c1 = Math.floor((ent.x + ent.w - 0.001) / TILE);
  r0 = Math.floor(ent.y / TILE); r1 = Math.floor((ent.y + ent.h - 0.001) / TILE);
  let landed = false;
  for (let c = c0; c <= c1; c++) {
    for (let r = r0; r <= r1; r++) {
      if (LEVEL.isSolid(c, r)) {
        if (ent.vy > 0) { ent.y = r * TILE - ent.h; landed = true; }
        else if (ent.vy < 0) { ent.y = (r + 1) * TILE; }
        ent.vy = 0;
      }
    }
  }
  ent.onGround = landed;
  return landed;
}

/* ---- Find the ground below a point (used for shadows) ---- */
function groundBelow(px, fromY) {
  let c = Math.floor(px / TILE);
  let r = Math.floor(fromY / TILE);
  for (let rr = r; rr < LEVEL_ROWS; rr++) {
    if (LEVEL.isSolid(c, rr)) return rr * TILE;
  }
  return WORLD_H + 200;
}

/* ---------------- PLAYER: Fin ---------------- */
class Player {
  constructor(x, y) {
    this.x = x; this.y = y; this.w = 30; this.h = 34;
    this.vx = 0; this.vy = 0; this.onGround = false;
    this.facing = 1; this.state = 'idle'; this.animTime = 0;
    this.anims = FIN_ANIMS;
    this.coyote = 0; this.jumpBuffer = 0;
    this.invuln = 0; this.squash = { x: 1, y: 1 }; this.squashTimer = 0;
    this.hearts = 3; this.coins = 0;
    this.jumpCut = false;   // makes sure we only "cut" a jump once
    this.frozen = 0;        // >0 while Fin is trapped in an ice cube
    this.slippery = false;  // true when standing on ice
  }
  update(dt) {
    // ---- trapped in ice? sink slowly, then shatter ----
    if (this.frozen > 0) {
      this.frozen -= dt;
      this.vy = 40;
      this.y += this.vy * dt;
      setAnim(this, 'idle');
      advanceAnim(this, dt);
      if (this.frozen <= 0) {
        this.frozen = 0;
        SFX.crack();
        spawnBurst(this.x + this.w / 2, this.y + this.h / 2, '#dff4ff', 16, 'sparkle');
        respawnAfterDeath();
      }
      return;
    }

    const left = anyDown(KEY_LEFT), right = anyDown(KEY_RIGHT);
    const jumpDown = anyDown(KEY_JUMP), jumpHit = anyPressed(KEY_JUMP);

    // remember a jump press for a moment (jump buffering)
    if (jumpHit) this.jumpBuffer = PHYS.JUMP_BUFFER;
    else this.jumpBuffer = Math.max(0, this.jumpBuffer - dt);

    // coyote time: a short grace period after leaving a ledge
    if (this.onGround) this.coyote = PHYS.COYOTE;
    else this.coyote = Math.max(0, this.coyote - dt);

    // ---- left / right movement with acceleration & friction ----
    // On icy tiles Fin skates a little: less grip, slower to speed up/stop.
    this.slippery = !!(theme && theme.slipperyTiles &&
      theme.slipperyTiles.includes(tileCharAtPx(this.x + this.w / 2, this.y + this.h + 2)));
    const slipA = this.slippery ? 0.8 : 1;
    const slipF = this.slippery ? 0.5 : 1;
    const accel = (this.onGround ? PHYS.ACCEL_GROUND : PHYS.ACCEL_AIR) * slipA;
    if (left && !right) { this.vx -= accel * dt; this.facing = -1; }
    else if (right && !left) { this.vx += accel * dt; this.facing = 1; }
    else {
      // no key held: slow down (friction)
      const fr = (this.onGround ? PHYS.FRICTION_GROUND : PHYS.FRICTION_AIR) * slipF * dt;
      if (Math.abs(this.vx) <= fr) this.vx = 0;
      else this.vx -= sign(this.vx) * fr;
    }
    this.vx = clamp(this.vx, -PHYS.MAX_RUN, PHYS.MAX_RUN);

    // ---- jumping ----
    if (this.jumpBuffer > 0 && this.coyote > 0) {
      this.vy = PHYS.JUMP;
      this.jumpBuffer = 0; this.coyote = 0; this.jumpCut = false;
      this.squash = { x: 0.86, y: 1.16 }; this.squashTimer = 0.12;
      SFX.jump();
    }
    // variable jump height: letting go of jump early cuts the rise ONCE (short hop)
    if (!jumpDown && this.vy < 0 && !this.jumpCut) { this.vy *= 0.45; this.jumpCut = true; }

    // ---- gravity ----
    this.vy = Math.min(this.vy + PHYS.GRAVITY * dt, PHYS.MAX_FALL);

    // ---- move & collide with the world ----
    const wasAir = !this.onGround;
    const landed = moveAndCollide(this, dt);
    if (landed && wasAir) {
      this.squash = { x: 1.16, y: 0.82 }; this.squashTimer = 0.10;
    }

    // ---- choose the right animation ----
    if (!this.onGround) setAnim(this, this.vy < 0 ? 'jump' : 'fall');
    else if (Math.abs(this.vx) > 12) setAnim(this, 'run');
    else setAnim(this, 'idle');
    advanceAnim(this, dt);

    // ---- squash & stretch spring back to normal ----
    if (this.squashTimer > 0) {
      this.squashTimer -= dt;
      this.squash.x = lerp(this.squash.x, 1, 8 * dt);
      this.squash.y = lerp(this.squash.y, 1, 8 * dt);
    } else { this.squash.x = 1; this.squash.y = 1; }

    if (this.invuln > 0) this.invuln -= dt;

    // ---- fell into a pit? ----
    if (this.y > WORLD_H + 120) { fallInPit(); return; }
    // ---- splashed into icy water? freeze into a cube! ----
    if (theme && theme.water && this.y + this.h > 426) {
      const col = Math.floor((this.x + this.w / 2) / TILE);
      if (waterZones.some(z => col >= z.colA && col <= z.colB)) freezeInWater();
    }
  }
}

/* ---------------- BOSS: Boomer ---------------- */
class Boomer {
  constructor(x, y) {
    this.x = x; this.y = y; this.w = 120; this.h = 90;
    this.vx = 0; this.vy = 0; this.onGround = false;
    this.facing = -1; this.state = 'idle'; this.animTime = 0; this.anims = BOOMER_ANIMS;
    this.hp = 3; this.maxHp = 3; this.alive = true; this.name = 'BOOMER';
    this.invuln = 0; this.hopTimer = 1.2; this.mode = 'idle';
    this.glideTimer = 0; this.glideToggle = false; this.wasAir = false;
    this.windupTimer = 0; this.glideDir = 1;
    this.squash = { x: 1, y: 1 }; this.angry = false; this.defeatTimer = 0;
    this.hurtFlash = 0;
    this.dead = false; this.squish = 0;   // used for the deflate-and-vanish animation
  }
  get phase() { return this.hp; }  // 3, 2, or 1
  update(dt) {
    if (!this.alive) {
      // deflate like a popped balloon, then vanish
      this.defeatTimer += dt;
      this.squish = Math.max(0, this.squish - dt);
      this.squash = { x: 1 + (1.2 - this.squish) * 0.35, y: Math.max(0.06, this.squish / 1.2) };
      return;
    }
    if (this.invuln > 0) { this.invuln -= dt; this.hurtFlash = Math.max(0, this.invuln); }
    else this.hurtFlash = 0;

    // Not fighting yet? Boomer dozes peacefully at his end of the arena
    // (gentle breathing) and does NOT attack until Fin steps in.
    if (!bossActive) {
      setAnim(this, 'idle');
      this.squash = { x: 1, y: 1 + Math.sin(time0 * 2) * 0.015 };
      advanceAnim(this, dt);
      return;
    }

    const speed = 90 + (3 - this.phase) * 55;          // faster as he loses health
    const interval = 1.6 - (3 - this.phase) * 0.3;      // hops more often

    if (this.mode === 'idle') {
      setAnim(this, 'idle');
      this.hopTimer -= dt;
      if (this.hopTimer <= 0) {
        const dir = sign((player.x + player.w / 2) - (this.x + this.w / 2)) || -1;
        this.facing = dir;
        if (this.phase === 1 && this.glideToggle) {
          // HP1 special: crouch first (a fair warning!), then glide-charge
          this.mode = 'windup'; this.windupTimer = 0.45; this.vx = 0; this.vy = 0;
          this.glideDir = dir; this.glideToggle = false;
          this.squash = { x: 1.15, y: 0.85 };
          setAnim(this, 'idle');
        } else {
          // normal hop toward Fin
          this.mode = 'hop'; this.vx = dir * speed; this.vy = -620;
          this.glideToggle = true;
          setAnim(this, 'jump');
        }
      }
    } else if (this.mode === 'hop') {
      this.vy = Math.min(this.vy + PHYS.GRAVITY * dt, PHYS.MAX_FALL);
      const wasAir = !this.onGround;
      const landed = moveAndCollide(this, dt);
      if (this.onGround && wasAir) {
        // landing: send out jumpable dust shockwaves
        const floorY = this.y + this.h;   // where Boomer's feet landed
        spawnShockwave(this.x + this.w * 0.5, -1, 220, floorY);
        if (this.phase <= 2) spawnShockwave(this.x + this.w * 0.5, 1, 220, floorY);
        this.squash = { x: 1.2, y: 0.8 };
        this.mode = 'idle'; this.hopTimer = interval; this.vx = 0;
        setAnim(this, 'idle');
      }
    } else if (this.mode === 'windup') {
      // squatting and shaking — get ready to dodge!
      this.windupTimer -= dt;
      this.squash = { x: 1.2, y: 0.8 };
      if (this.windupTimer <= 0) {
        this.mode = 'glide'; this.glideTimer = 0.7;
        this.vx = this.glideDir * 300; this.vy = 0;
        setAnim(this, 'run');
      }
    } else if (this.mode === 'glide') {
      this.glideTimer -= dt;
      this.x += this.vx * dt;
      this.x = clamp(this.x, cam.x + 24, 214 * TILE - this.w);
      if (this.glideTimer <= 0) { this.mode = 'idle'; this.hopTimer = interval; this.vx = 0; }
    }

    // squash spring
    this.squash.x = lerp(this.squash.x, 1, 8 * dt);
    this.squash.y = lerp(this.squash.y, 1, 8 * dt);
    advanceAnim(this, dt);
  }
  takeHit() {
    if (this.invuln > 0 || !this.alive) return;
    this.hp--;
    this.invuln = 1.2;
    this.angry = true;
    if (this.hp <= 0) {
      this.alive = false;
      this.defeatTimer = 0;
      this.dead = true; this.squish = 1.2;
    }
    SFX.bossHit();
  }
}

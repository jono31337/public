/* ---------------- Losing a heart & respawning ---------------- */
/* ---------------- Getting hurt ----------------
   Touching a bad guy: Fin bounces away and blinks (NO teleport).
   Falling in a pit: Fin loses a heart and restarts at the last checkpoint. */
function hurtByEnemy(source) {
  if (player.invuln > 0) return;              // mercy time after a hit
  player.invuln = 1.2;
  // getting bumped cancels any special ride / climb / slide
  player.climbing = false; player.riding = null; player.sliding = null;
  player.renderScale = 1; player.renderDim = false; player.inSand = false;
  player.hearts = Math.max(0, player.hearts - 1);
  SFX.hurt();
  spawnBurst(player.x + player.w / 2, player.y + player.h / 2, '#e8203a', 12, 'poof');
  // knock Fin away from whatever hit him — a little bounce, NOT a teleport.
  // If that direction is a gap/water, bounce him the safe way instead, so one
  // mistake near a ledge can't cost two hearts.
  const srcX = source ? source.x + source.w / 2 : player.x;
  let dir = (player.x + player.w / 2 < srcX) ? -1 : 1;
  const probeY = player.y + player.h + 8;
  const px = player.x + player.w / 2;
  if (!solidAtPx(px + dir * 46, probeY) && solidAtPx(px - dir * 46, probeY)) dir = -dir;
  player.vx = dir * 230;
  player.vy = -300;
  if (player.hearts <= 0) { state = 'gameover'; gameOverTimer = 0; SFX.gameover(); }
}

function respawnAfterDeath() {
  if (player.hearts <= 0) return;
  player.hearts = Math.max(0, player.hearts - 1);
  player.invuln = 1.4;
  SFX.hurt();
  spawnBurst(player.x + player.w / 2, player.y + player.h / 2, '#e8203a', 12, 'poof');
  if (player.hearts <= 0) { state = 'gameover'; gameOverTimer = 0; SFX.gameover(); return; }
  // put Fin back at the last checkpoint (or safely inside the arena during the boss fight)
  if (bossActive) { player.x = cam.x + 80; player.y = 12 * TILE - player.h; }
  else { player.x = respawn.x; player.y = respawn.y; }
  player.vx = 0; player.vy = 0;
  player.frozen = 0;
  player.climbing = false; player.riding = null; player.sliding = null;
  player.inSand = false; player.sandDepth = 0; player.splashed = false;
  player.renderScale = 1; player.renderDim = false;
  shockwaves.length = 0;
}

// Fell into a bottomless pit.
function fallInPit() { respawnAfterDeath(); }

// Splashed into icy water: Fin freezes into a cube, then shatters!
function freezeInWater() {
  if (player.frozen > 0) return;
  player.frozen = 0.9;
  player.vx = 0; player.vy = 40;
  SFX.freeze();
}

/* ---------------- Collisions between Fin and enemies ---------------- */
function handleEnemyCollisions() {
  if (player.frozen > 0) return;
  for (const e of enemies) {
    if (e.dead) continue;
    if (e.hidden) continue;                          // Sharky underwater is safe to pass over
    const bodyHit = aabb(player, e);
    const sweepHit = e.attackRect && aabb(player, e.attackRect);   // bear arm sweep
    if (!bodyHit && !sweepHit) continue;

    // While sliding, Fin bowls flat any normal enemy (and a leaping Sharky).
    if (player.sliding) {
      if (e !== boss) {
        e.dead = true; e.squish = 0.4;
        SFX.stomp();
        spawnBurst(e.x + e.w / 2, e.y + e.h / 2, '#ffffff', 12, 'poof');
      }
      continue;
    }

    if (bodyHit) {
      // tall bosses (Basketball, Blue Bear) get a friendlier stomp window
      const stompZone = (e === boss) ? 0.72 : 0.55;
      const stomping = player.vy > 0 && (player.y + player.h) < (e.y + e.h * stompZone);
      if (stomping) {
        // bounce off the enemy
        player.vy = anyDown(KEY_JUMP) ? PHYS.STOMP_BOUNCE_HOLD : PHYS.STOMP_BOUNCE;
        player.squash = { x: 0.85, y: 1.15 }; player.squashTimer = 0.12;

        if (e === boss) {
          // a short grace after bouncing off the boss, so his body can't hurt Fin
          // while he is flashing (invulnerable) on the rebound
          player.invuln = Math.max(player.invuln, 0.4);
          if (boss.invuln <= 0 && boss.alive) {
            boss.takeHit();
            spawnBurst(e.x + e.w / 2, e.y + 20, theme.ambient === 'flake' ? '#dff4ff' : '#a6c84a', 14, 'poof');
            if (!boss.alive) {
              // boss defeated — big party, then the goal flag appears!
              spawnConfetti(e.x + e.w / 2, e.y + e.h / 2, 60, themeConfetti());
              goal.active = true;
            }
          }
        } else {
          e.dead = true; e.squish = 0.4;
          SFX.stomp();
          spawnBurst(e.x + e.w / 2, e.y + e.h / 2, '#ffffff', 12, 'poof');
        }
        continue;
      }
    }
    // touched from the side / below, or caught in a sweep — ouch!
    if (e !== boss || boss.alive) hurtByEnemy(e);
  }
}

// A fitting confetti palette per theme.
function themeConfetti() {
  if (theme.ambient === 'flake') return ['#ffffff', '#dff4ff', '#bfe4f2', '#9fd8f5'];
  if (theme.ambient === 'rain') return ['#cfe8ff', '#ffffff', '#e0533f', '#f2b134'];
  if (theme.ground === 'sand') return ['#ffe066', '#7fd0f4', '#f4f1ea', '#ff9e6b'];
  return undefined;
}

/* ---------------- Collect coins, checkpoints, goal ---------------- */
function handlePickups() {
  if (player.frozen > 0) return;
  for (const co of coins) {
    if (co.taken) continue;
    if (aabb(player, { x: co.x, y: co.y, w: 20, h: 20 })) {
      co.taken = true;
      player.coins++;
      SFX.coin();
      spawnBurst(co.x + 10, co.y + 10, '#fff6c0', 6, 'sparkle');
    }
  }
  for (const cp of checkpoints) {
    if (!cp.active && player.x + player.w / 2 >= cp.x) {
      cp.active = true;
      respawn = { x: cp.x, y: cp.y };
      SFX.checkpoint();
      spawnBurst(cp.x + 10, cp.y, '#5fbf4a', 10, 'sparkle');
    }
  }
  if (goal.active && player.x + player.w / 2 >= goal.x) {
    state = 'win'; winTimer = 0; bannerTimer = 0;
    spawnConfetti(player.x + player.w / 2, player.y, 40, theme.ambient === 'flake' ? ['#ffffff', '#dff4ff', '#bfe4f2', '#9fd8f5'] : undefined);
    SFX.win();
  }
}

/* ---------------- THE MAIN UPDATE ---------------- */
function update(dt) {
  time0 += dt;

  // screen shake always eases back down
  if (camShakeTimer > 0) { camShakeTimer -= dt; if (camShakeTimer <= 0) camShake = 0; }

  if (state === 'menu') {
    // Fin bobs gently on the menu screen
    setAnim(player, 'idle'); advanceAnim(player, dt);
    // weather keeps falling behind the menu, for a live preview
    updateLeaves(dt); updateRipples(dt);
    // ↑ ↓ switch rows
    if (anyPressed(['ArrowUp', 'w', 'W']) || anyPressed(['ArrowDown', 's', 'S'])) {
      menu.row = (menu.row + 1) % 2; SFX.menuBlip();
    }
    // ← → change the value in the selected row
    const goLeft = anyPressed(['ArrowLeft', 'a', 'A']);
    const goRight = anyPressed(['ArrowRight', 'd', 'D']);
    if (goLeft || goRight) {
      const dir = goRight ? 1 : -1;
      if (menu.row === 0) {
        menu.level = (menu.level + dir + LEVELS.length) % LEVELS.length;
        theme = THEMES[LEVELS[menu.level].theme];   // live background preview
        leaves.length = 0; ripples.length = 0;      // clear old weather right away
      } else {
        menu.difficulty = (menu.difficulty + dir + DIFFICULTIES.length) % DIFFICULTIES.length;
      }
      SFX.menuBlip();
    }
    // number keys 1-4 jump straight to a level
    for (let i = 0; i < LEVELS.length; i++) {
      if (pressed[String(i + 1)]) { menu.level = i; menu.row = 0; theme = THEMES[LEVELS[i].theme]; leaves.length = 0; ripples.length = 0; SFX.menuBlip(); }
    }
    // SPACE / Enter starts the chosen level
    if (pressed[' '] || pressed['Enter']) { SFX.menuStart(); startLevel(menu.level); }
    updateParticles(dt);
  } else if (state === 'playing') {
    // ESC hops back to the menu
    if (pressed['Escape']) { state = 'menu'; stopRain(); }

    if (state === 'playing') {
      levelTime += dt;
      if (bannerTimer > 0) bannerTimer -= dt;

      player.update(dt);

      // start the boss battle once Fin is well inside the arena (so he stays on screen)
      if (!bossActive && boss && player.x > (WORLD_W - VIEW_W) + 40) {
        bossActive = true;
        boss.hopTimer = 1.0;
        player.invuln = Math.max(player.invuln, 0.6);   // a short grace moment as the boss wakes up
      }
      // keep Fin inside the arena AND on screen during the fight
      if (bossActive) player.x = clamp(player.x, cam.x + 24, 214 * TILE - player.w);

      for (const e of enemies) e.update(dt);
      for (const co of coins) co.update(dt);

      handleEnemyCollisions();
      handlePickups();
      updateShockwaves(dt);
      updateParticles(dt);
      updateLeaves(dt);
      updateRipples(dt);
      updateMerries(dt);
      updatePalms(dt);
      updateCamera(dt);
    }
  } else if (state === 'win') {
    winTimer += dt;
    updateParticles(dt); updateLeaves(dt); updateRipples(dt);
    if (Math.random() < 0.4) spawnConfetti(cam.x + rand(100, VIEW_W - 100), -20, 4, theme.ambient === 'flake' ? ['#ffffff', '#dff4ff', '#bfe4f2', '#9fd8f5'] : undefined);
    if (pressed['r'] || pressed['R']) startLevel(currentLevel);
    if (pressed['Enter']) { state = 'menu'; stopRain(); }
  } else if (state === 'gameover') {
    gameOverTimer += dt;
    updateParticles(dt);
    if (pressed['r'] || pressed['R']) startLevel(currentLevel);
    if (pressed['Enter']) { state = 'menu'; stopRain(); }
  }

  // clear "pressed this frame" markers (do this LAST)
  for (const k in pressed) pressed[k] = false;
}

/* ---------------- THE MAIN RENDER ---------------- */
function render() {
  ctx.clearRect(0, 0, VIEW_W, VIEW_H);
  // a little screen shake for boss slams (world layers only)
  const sh = camShake;
  ctx.save();
  if (sh > 0) ctx.translate(rand(-sh, sh), rand(-sh, sh));

  drawSky();
  drawCloudLayer();
  if (theme.trees === 'buildings') {
    drawCityBack();                       // parallax skyline
  } else if (theme.trees === 'palms') {
    drawBeachBack();                      // ocean + dunes + palms
  } else {
    drawHillLayer(0.25, 330, 60, 0.0016, theme.farHill[0], theme.farHill[1]);
    drawHillLayer(0.45, 400, 45, 0.0026, theme.midHill[0], theme.midHill[1]);
    drawTreeLine();
  }
  drawRainFar();
  if (state === 'menu') drawMenuGround(); else drawGameplay();
  drawForeground();
  drawOverlay();
  ctx.restore();

  if (state !== 'menu') drawHUD();

  if (state === 'menu') { drawLeaves(ctx); drawRipples(ctx); drawMenu(); }
  else if (state === 'win') drawWin();
  else if (state === 'gameover') drawGameOver();
}

/* ---------------- Boot up! ---------------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function fitCanvas() {
  const scale = Math.min(window.innerWidth / VIEW_W, window.innerHeight / VIEW_H);
  canvas.style.width = (VIEW_W * scale) + 'px';
  canvas.style.height = (VIEW_H * scale) + 'px';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

resetGame();          // build the world
state = 'menu';       // ...and show the menu

// Fixed-timestep game loop: the game logic ALWAYS moves in exact 1/60-second
// steps, so jump height is identical on a 30fps, 60fps, or 144fps screen.
const STEP = 1 / 60;
let last = performance.now();
let acc = 0;                            // game time we still owe the logic
function loop(now) {
  const frameTime = Math.min((now - last) / 1000, 0.25);  // ignore long pauses
  last = now;
  acc += frameTime;
  let steps = 0;
  while (acc >= STEP && steps < 5) {    // catch up in fixed steps (max 5)
    update(STEP);
    acc -= STEP;
    steps++;
  }
  if (acc > STEP) acc = 0;              // too far behind? drop the backlog
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

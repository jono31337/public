<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>The Adventures of Fin Reimagined</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0b1220; }
  body { font-family:"Trebuchet MS","Segoe UI",sans-serif; -webkit-user-select:none; user-select:none; touch-action:none; }
  canvas { display:block; width:100vw; height:100vh; }
  .tbtn {
    position:fixed; bottom:12px; width:68px; height:68px; border-radius:20px;
    background:rgba(255,255,255,.16); border:3px solid rgba(255,255,255,.45);
    color:#fff; font-size:24px; line-height:62px; text-align:center;
    pointer-events:auto; opacity:.55; z-index:5; touch-action:none;
  }
  .tbtn:active { background:rgba(255,255,255,.4); }
  #tleft  { left:8px; }
  #tright { left:84px; }
  /* ▼ sits above the gap between the arrows, so the same thumb can reach it
     without letting go of left/right. Big enough to hit while running. */
  #tdown  { left:70px; bottom:92px; width:76px; height:76px; font-size:24px; line-height:68px; opacity:.72; }
  #tjump  { right:12px; width:92px; }
  #tpause {
    right:10px; top:84px; bottom:auto; width:58px; height:58px;
    border-radius:18px; font-size:20px; line-height:52px;
    background:rgba(18,30,50,.72); border-color:rgba(255,255,255,.7); opacity:.95;
  }
  body.no-touch .tbtn { display:none; }
  body:not(.playing) .tbtn { display:none; }
  #rotate {
    display:none; position:fixed; inset:0; z-index:30;
    background:#0b1424; color:#fff; text-align:center; padding:28px;
    align-items:center; justify-content:center; flex-direction:column; gap:14px;
    font:bold 26px "Trebuchet MS", sans-serif; line-height:1.4;
  }
  #rotate .spin { font-size:64px; display:inline-block; animation:tip 2s ease-in-out infinite; }
  @keyframes tip { 0%,100% { transform:rotate(0deg); } 50% { transform:rotate(90deg); } }
  @media (orientation:portrait) and (max-width:820px) and (pointer:coarse) {
    #rotate { display:flex; }
    body.no-touch #rotate { display:none; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="rotate"><div class="spin">&#128241;</div><div>Turn your phone sideways to play!</div></div>
<div class="tbtn" id="tleft">&#9664;</div>
<div class="tbtn" id="tright">&#9654;</div>
<div class="tbtn" id="tdown">&#9660;</div>
<div class="tbtn" id="tjump">&#9650;</div>
<div class="tbtn" id="tpause">&#10074;&#10074;</div>
<script>
/* =====================================================================
   THE ADVENTURES OF FIN REIMAGINED
   A 2.5D side-scrolling platformer in one single file.

   Sections:
     1. CONFIG      - all the physics / feel numbers (tune me!)
     2. HELPERS     - tiny maths + shape helpers
     3. INPUT       - keyboard + touch buttons
     4. SOUND       - code-made music and sound effects
     5. ART         - every character and prop is drawn with canvas paths
     6. SPRITES     - a clean hook for real sprite sheets later
     7. LEVELS      - level 1 Fall, 2 Antarctica, 3 City, 4 Beach
     8. PHYSICS     - movement, collisions, stomping
     9. UPDATE      - game logic runs at a steady 60 steps per second
    10. RENDER      - parallax layers, shadows, HUD
    11. MENUS       - title screen, difficulty, level select
    12. BOOT        - start the engine
   ===================================================================== */
'use strict';

/* ============================ 1. CONFIG ============================ */
const CFG = {
  W: 1280, H: 720,
  GROUND_Y: 600,
  gravity: 2500,
  maxFall: 1250,
  runAccel: 2700,
  runMax: 350,
  friction: 2900,
  airAccel: 2000,
  airDrag: 340,
  jumpVel: -890,
  jumpCut: 0.42,      // let go of jump early -> shorter hop
  coyote: 0.10,       // tiny grace period to jump after leaving a ledge
  jumpBuffer: 0.13,   // press jump a moment before landing and it still works
  stompBounce: -640,
  stompBounceHeld: -790,
  enemySpeed: 1,
  iceAccel: 900,
  iceFriction: 240,
  invuln: 1.35,
  bossHp: 3
};

const DIFFICULTIES = [
  { id: 'easy',   name: 'Easy',   hearts: 5, color: '#5fd68a' },
  { id: 'normal', name: 'Normal', hearts: 3, color: '#ffcf4d' },
  { id: 'hard',   name: 'Hard',   hearts: 1, color: '#ff6f7d' }
];

/* ============================ 2. HELPERS =========================== */
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;
const rand  = (a, b) => a + Math.random() * (b - a);
const dist  = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const TAU = Math.PI * 2;

// A tiny random maker so background trees/clouds look the same every load.
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function overlaps(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function pointInSolid(level, x, y) {
  for (const s of level.solids) {
    if (x > s.x && x < s.x + s.w && y > s.y && y < s.y + s.h) return true;
  }
  return false;
}
// highest solid top below a point - used to park shadows on the floor
function groundTopAt(level, x, fromY) {
  let best = level.groundY + 4;
  for (const s of level.solids) {
    if (x > s.x + 2 && x < s.x + s.w - 2 && s.y >= fromY - 4 && s.y < best) best = s.y;
  }
  return best;
}

// ---------- canvas shape helpers (all drawing uses these) ----------
function rr(c, x, y, w, h, r) {                       // rounded rectangle
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function fillRR(c, x, y, w, h, r, col) { rr(c, x, y, w, h, r); c.fillStyle = col; c.fill(); }
function circ(c, x, y, r, col) { c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = col; c.fill(); }
function ell(c, x, y, rx, ry, rot, col) { c.beginPath(); c.ellipse(x, y, rx, ry, rot || 0, 0, TAU); c.fillStyle = col; c.fill(); }

function vgrad(c, x, y, w, h, top, bottom) {          // vertical colour fade
  const g = c.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, top); g.addColorStop(1, bottom);
  return g;
}
function radialSprite(size, rgb, alpha) {   // reusable soft circle (fast!)
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const g2 = cv.getContext('2d');
  const half = size / 2;
  const rg = g2.createRadialGradient(half, half, 0, half, half, half);
  rg.addColorStop(0, 'rgba(' + rgb + ',' + alpha + ')');
  rg.addColorStop(1, 'rgba(' + rgb + ',0)');
  g2.fillStyle = rg;
  g2.fillRect(0, 0, size, size);
  return cv;
}
const SHADOW_SPRITE = radialSprite(64, '0,0,0', 1);
const PICKUP_GLOW = radialSprite(64, '255,246,190', 0.45);

function shadowEllipse(c, x, y, rx, alpha) {          // soft ground shadow
  c.save();
  c.globalAlpha = c.globalAlpha * (alpha || 0.22);
  c.drawImage(SHADOW_SPRITE, x - rx, y - rx * 0.34, rx * 2, rx * 0.68);
  c.restore();
}
function starPath(c, x, y, r, points, inner) {
  c.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const rad = i % 2 ? r * inner : r;
    const a = (i / (points * 2)) * TAU - Math.PI / 2;
    const px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
    i ? c.lineTo(px, py) : c.moveTo(px, py);
  }
  c.closePath();
}
function heartPath(c, x, y, s) {
  c.beginPath();
  c.moveTo(x, y + s * 0.32);
  c.bezierCurveTo(x - s * 0.62, y - s * 0.22, x - s * 0.30, y - s * 0.72, x, y - s * 0.28);
  c.bezierCurveTo(x + s * 0.30, y - s * 0.72, x + s * 0.62, y - s * 0.22, x, y + s * 0.32);
  c.closePath();
}

/* ============================ 3. INPUT ============================= */
const Input = {
  left: false, right: false, up: false, down: false,
  jumpHeld: false, jumpPressed: false,
  pressed: {},
  clearPressed() { this.pressed = {}; this.jumpPressed = false; },
  hit(name) { return !!this.pressed[name]; }
};

const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'up', KeyW: 'up',
  ArrowDown: 'down', KeyS: 'down',
  Space: 'jump', KeyZ: 'jump', KeyK: 'jump',
  Enter: 'enter', NumpadEnter: 'enter',
  Escape: 'pause', KeyP: 'pause',
  KeyM: 'mute', KeyR: 'restart', KeyQ: 'quit'
};

addEventListener('keydown', e => {
  const a = KEYMAP[e.code];
  if (!a) return;
  if (a === 'jump') e.preventDefault();
  if (a === 'pause' || a === 'enter') e.preventDefault();
  if (a === 'jump') { if (!Input.jumpHeld) Input.jumpPressed = true; Input.jumpHeld = true; }
  if (a === 'left') Input.left = true;
  if (a === 'right') Input.right = true;
  if (a === 'up') Input.up = true;
  if (a === 'down') Input.down = true;
  Input.pressed[a] = true;
  Sound.unlock();
});
addEventListener('keyup', e => {
  const a = KEYMAP[e.code];
  if (!a) return;
  if (a === 'jump') Input.jumpHeld = false;
  if (a === 'left') Input.left = false;
  if (a === 'right') Input.right = false;
  if (a === 'up') Input.up = false;
  if (a === 'down') Input.down = false;
});
addEventListener('blur', () => {
  Input.left = Input.right = Input.up = Input.down = false;
  Input.jumpHeld = false;
});

// ---- touch / click buttons ----
function bindButton(id, onDown, onUp) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); el.setPointerCapture(e.pointerId); Sound.unlock(); onDown();
  });
  const up = e => { e.preventDefault(); onUp(); };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('pointerleave', up);
}
bindButton('tleft', () => Input.left = true, () => Input.left = false);
bindButton('tright', () => Input.right = true, () => Input.right = false);
bindButton('tdown', () => Input.down = true, () => Input.down = false);
bindButton('tjump', () => { Input.jumpHeld = true; Input.jumpPressed = true; Input.pressed.jump = true; },
                     () => Input.jumpHeld = false);
bindButton('tpause', () => {
  if (game.state === 'playing') game.state = 'paused';
  else if (game.state === 'paused') game.state = 'playing';
}, () => {});
const IS_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0 ||
  (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
if (!IS_TOUCH) document.body.classList.add('no-touch');

/* ============================ 4. SOUND ============================= */
const Sound = (() => {
  let ac = null, master = null, musicBus = null, sfxBus = null;
  let muted = false, song = null, step = 0, nextTime = 0, timer = null, playing = null;
  const NOTE = n => 440 * Math.pow(2, (n - 69) / 12);

  const SONGS = {
    // Happy autumn tune (C major). Each slot is a 16th note: 0 = rest.
    fall: {
      bpm: 132,
      lead: [72,0,76,79, 76,0,72,0, 74,0,77,81, 79,0,76,0, 72,0,76,79, 84,0,79,76, 74,0,72,74, 72,0,0,0],
      bass: [48,0,55,0, 48,0,55,0, 50,0,57,0, 50,0,57,0],
      leadType: 'square', bassType: 'triangle', leadVol: 0.10, bassVol: 0.16
    },
    // Sparkly, chilly waltz-ish tune (A minor).
    ice: {
      bpm: 104,
      lead: [69,0,72,76, 0,72,0,69, 67,0,71,74, 0,71,0,67, 69,0,72,76, 81,0,76,72, 71,0,67,64, 69,0,0,0],
      bass: [45,0,52,0, 45,0,52,0, 43,0,50,0, 43,0,50,0],
      leadType: 'triangle', bassType: 'sine', leadVol: 0.14, bassVol: 0.18
    },
    // Rainy-day city groove (D minor, syncopated).
    city: {
      bpm: 118,
      lead: [62,0,65,0, 69,0,65,67, 0,65,62,0, 60,0,62,0, 62,0,65,0, 69,0,72,69, 67,0,65,0, 62,0,0,0],
      bass: [38,0,45,0, 38,0,45,0, 36,0,43,0, 38,0,45,0],
      leadType: 'square', bassType: 'triangle', leadVol: 0.09, bassVol: 0.17
    },
    // Sunny beach tune (G major).
    beach: {
      bpm: 126,
      lead: [67,0,71,74, 0,74,0,71, 69,0,72,76, 0,74,0,71, 67,0,71,74, 79,0,76,74, 72,0,71,67, 67,0,0,0],
      bass: [43,0,50,0, 43,0,50,0, 45,0,52,0, 43,0,50,0],
      leadType: 'sine', bassType: 'triangle', leadVol: 0.13, bassVol: 0.16
    },
    menu: {
      bpm: 112,
      lead: [72,76,79,84, 79,76,72,0, 74,77,81,86, 81,77,74,0],
      bass: [48,0,55,0, 48,0,55,0, 50,0,57,0, 43,0,50,0],
      leadType: 'triangle', bassType: 'sine', leadVol: 0.10, bassVol: 0.14
    },
    win: {
      bpm: 150,
      lead: [72,76,79,84, 88,0,84,0, 86,84,79,76, 72,0,0,0],
      bass: [48,0,55,0, 60,0,55,0, 53,0,55,0, 48,0,0,0],
      leadType: 'square', bassType: 'triangle', leadVol: 0.11, bassVol: 0.16
    }
  };

  function unlock() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      master = ac.createGain(); master.gain.value = 0.85; master.connect(ac.destination);
      musicBus = ac.createGain(); musicBus.gain.value = muted ? 0 : 0.34; musicBus.connect(master);
      sfxBus = ac.createGain(); sfxBus.gain.value = 0.55; sfxBus.connect(master);
      timer = setInterval(schedule, 35);
    }
    if (ac.state === 'suspended') ac.resume();
  }

  function blip(freq, dur, type, vol, slideTo, dest) {
    if (!ac) return;
    const t0 = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(dest || sfxBus);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }

  function noise(dur, vol, filterFrom, filterTo) {
    if (!ac) return;
    const len = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ac.createBufferSource(); src.buffer = buf;
    const flt = ac.createBiquadFilter(); flt.type = 'lowpass';
    flt.frequency.setValueAtTime(filterFrom || 1800, ac.currentTime);
    flt.frequency.exponentialRampToValueAtTime(filterTo || 300, ac.currentTime + dur);
    const g = ac.createGain(); g.gain.value = vol || 0.25;
    src.connect(flt); flt.connect(g); g.connect(sfxBus);
    src.start();
  }

  function sfx(name) {
    if (!ac || muted) return;
    switch (name) {
      case 'jump':   blip(330, 0.16, 'square', 0.20, 760); break;
      case 'land':   noise(0.07, 0.10, 900, 200); break;
      case 'stomp':  blip(180, 0.14, 'square', 0.25, 70); noise(0.10, 0.16, 1200, 200); break;
      case 'hurt':   blip(420, 0.30, 'sawtooth', 0.22, 90); break;
      case 'heart':  blip(660, 0.09, 'sine', 0.22); setTimeout(() => blip(990, 0.12, 'sine', 0.20), 80); break;
      case 'coin':   blip(880, 0.07, 'square', 0.16); setTimeout(() => blip(1320, 0.12, 'square', 0.14), 60); break;
      case 'bossHit':blip(140, 0.25, 'square', 0.28, 50); noise(0.22, 0.2, 900, 120); break;
      case 'select': blip(560, 0.06, 'square', 0.13); break;
      case 'splash': noise(0.35, 0.22, 2000, 220); break;
      case 'freeze': blip(900, 0.5, 'sine', 0.18, 1400); break;
      case 'win':    [72, 76, 79, 84, 88].forEach((n, i) => setTimeout(() => blip(NOTE(n), 0.30, 'square', 0.18), i * 120)); break;
      case 'unlock': [60, 64, 67, 72].forEach((n, i) => setTimeout(() => blip(NOTE(n), 0.22, 'triangle', 0.15), i * 100)); break;
      default: break;
    }
  }

  function schedule() {
    if (!ac || !song || muted) return;
    const s = SONGS[song];
    const stepDur = 60 / s.bpm / 4;
    while (nextTime < ac.currentTime + 0.25) {
      const t = Math.max(nextTime, ac.currentTime + 0.02);
      const ln = s.lead[step % s.lead.length];
      if (ln) scheduleNote(ln, t, stepDur * 0.95, s.leadType, s.leadVol);
      if (step % 4 === 0) {
        const bn = s.bass[Math.floor(step / 4) % s.bass.length];
        if (bn) scheduleNote(bn, t, stepDur * 3.4, s.bassType, s.bassVol);
      }
      // soft tick for rhythm
      if (step % 2 === 0) scheduleTick(t, step % 8 === 0 ? 0.05 : 0.025);
      nextTime += stepDur;
      step++;
    }
  }

  function scheduleNote(n, t, dur, type, vol) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = NOTE(n);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function scheduleTick(t, vol) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.value = 140;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    o.connect(g); g.connect(musicBus);
    o.start(t); o.stop(t + 0.06);
  }

  return {
    unlock,
    sfx,
    play(name) {
      if (!ac) return;
      if (playing === name) return;
      playing = name; song = name; step = 0; nextTime = ac.currentTime + 0.12;
    },
    stop() { playing = null; song = null; },
    toggleMute() {
      muted = !muted;
      if (musicBus) musicBus.gain.value = muted ? 0 : 0.34;
      return muted;
    },
    get muted() { return muted; }
  };
})();

/* ------------------------ 6. SPRITE HOOK --------------------------- */
/* Drop real sprite sheets in here later and the game will use them
   instead of the vector art. Example:
     Sprites.add('fin', 'fin-sheet.png', { frameW:64, frameH:64,
        anims:{ idle:[0,1], run:[2,3,4,5], jump:[6], fall:[7] } });
   Until then every character is drawn with canvas paths.            */
const Sprites = {
  sheets: {},
  add(name, src, def) {
    const img = new Image();
    img.src = src;
    this.sheets[name] = { img, def, ready: false };
    img.onload = () => { this.sheets[name].ready = true; };
  },
  has(name) { const s = this.sheets[name]; return !!(s && s.ready); },
  draw(c, name, anim, t, x, y, w, h, flip) {
    const s = this.sheets[name];
    if (!s || !s.ready) return false;
    const frames = (s.def.anims && s.def.anims[anim]) || [0];
    const idx = frames[Math.floor(t * 10) % frames.length];
    const fw = s.def.frameW, fh = s.def.frameH;
    const sx = (idx * fw) % s.img.width;
    const sy = Math.floor((idx * fw) / s.img.width) * fh;
    c.save();
    if (flip) { c.translate(x + w, y); c.scale(-1, 1); }
    else c.translate(x, y);
    c.drawImage(s.img, sx, sy, fw, fh, 0, 0, w, h);
    c.restore();
    return true;
  }
};

/* ============================== 5. ART ============================= */
/* Every character below is built from simple shapes. They are drawn
   around a local origin at the feet, so the maths stays friendly.     */

function drawFin(c, p, t) {
  if (Sprites.draw(c, 'fin', p.anim, p.animT, p.x, p.y, p.w, p.h, p.facing < 0)) return;
  const w = p.w, h = p.h;
  c.save();
  c.translate(p.x + w / 2, p.y + h);
  c.scale(p.facing, 1);
  const sq = p.squash || 1;              // height scale: 1 = normal, <1 = squashed flat, >1 = stretched tall
  c.scale(1 / sq, sq);
  const running = p.onGround && Math.abs(p.vx) > 30;
  const swing = running ? Math.sin(p.animT * 16) : 0;
  // two steps per cycle, so the body bounces on every footfall
  const bob = running ? Math.abs(Math.sin(p.animT * 16)) * -2.4 : 0;
  c.translate(0, bob);
  // lean into a run, and breathe gently when standing still
  if (running) c.rotate(Math.min(0.11, Math.abs(p.vx) / 3200));
  else if (p.onGround) {
    const br = Math.sin(t * 2.4) * 0.013;
    c.scale(1 - br, 1 + br);
  }
  const air = !p.onGround;
  // spinning on the park merry-go-round
  if (p.spinA > 0.02) {
    c.translate(0, -h * 0.45);
    c.rotate(p.spinA);
    c.translate(0, h * 0.45);
  }

  // little legs: one steps forward while the other steps back
  const stepA = running ? swing : 0;
  const stepB = running ? -swing : 0;
  const tuck = air ? 2.5 : 0;
  c.save();
  c.translate(-7 + stepA * 6, -8 - tuck);
  c.rotate(stepA * 0.28 + (air ? 0.16 : 0));
  fillRR(c, -4.5, -2, 9, 12, 3.5, '#1b4c9c');
  c.restore();
  c.save();
  c.translate(7 + stepB * 6, -8 - tuck);
  c.rotate(stepB * 0.28 - (air ? 0.16 : 0));
  fillRR(c, -4.5, -2, 9, 12, 3.5, '#1b4c9c');
  c.restore();

  // tail fin at the back
  c.save();
  c.translate(-w * 0.42, -h * 0.52);
  c.rotate(-0.5 + swing * 0.15);
  c.beginPath();
  c.moveTo(0, 0);
  c.quadraticCurveTo(-16, -10, -14, 8);
  c.quadraticCurveTo(-6, 4, 0, 6);
  c.closePath();
  c.fillStyle = '#2f74d0'; c.fill();
  c.restore();

  // main boxy shark body
  const bodyTop = -h * 0.86;
  const bodyH = h * 0.78;
  rr(c, -w / 2, bodyTop, w, bodyH, 9);
  c.fillStyle = vgrad(c, 0, bodyTop, 0, bodyTop + bodyH, '#4a93ef', '#1e57b8');
  c.fill();

  // soft top highlight
  c.save(); rr(c, -w / 2, bodyTop, w, bodyH, 9); c.clip();
  ell(c, -w * 0.10, bodyTop + 6, w * 0.42, 8, 0, 'rgba(255,255,255,.22)');
  c.restore();

  // white belly: the plush's whole lower half is cream, not just a patch
  c.save(); rr(c, -w / 2, bodyTop, w, bodyH, 9); c.clip();
  ell(c, 0, -h * 0.20, w * 0.46, h * 0.27, 0, '#f3f8ff');
  c.restore();

  // big friendly grin, sitting on the belly exactly like the plush.
  // The plush is a big RED mouth with a row of small white zigzag teeth
  // hanging from the top lip (and three little ones on the bottom), so the
  // teeth have to stay narrow or the red disappears and it reads as a white
  // mouth with red fangs.
  const mcx = 0, mcy = -h * 0.26, mrx = w * 0.325, mry = h * 0.15;
  c.save();
  c.beginPath();
  c.ellipse(mcx, mcy, mrx, mry, 0, 0, TAU);
  c.fillStyle = '#d8354a'; c.fill();
  c.clip();
  c.fillStyle = '#fdfdff';
  // top row: small triangles hanging down from the upper lip
  const nTop = 5;
  for (let i = 0; i < nTop; i++) {
    const u = -0.72 + (i / (nTop - 1)) * 1.44;
    const tx = mcx + u * mrx;
    const root = Math.sqrt(Math.max(0, 1 - u * u));
    const tw = mrx * 0.105;
    const deep = mry * root * 0.30;
    const lipTop = mcy - mry * root;
    c.beginPath();
    c.moveTo(tx - tw, lipTop - 1);
    c.lineTo(tx + tw, lipTop - 1);
    c.lineTo(tx, lipTop + deep);
    c.closePath(); c.fill();
  }
  // bottom row: three smaller ones pointing up from the lower lip
  const nBot = 3;
  for (let i = 0; i < nBot; i++) {
    const u = -0.42 + (i / (nBot - 1)) * 0.84;
    const tx = mcx + u * mrx;
    const root = Math.sqrt(Math.max(0, 1 - u * u));
    const tw = mrx * 0.085;
    const deep = mry * root * 0.17;
    const lipBot = mcy + mry * root;
    c.beginPath();
    c.moveTo(tx - tw, lipBot + 1);
    c.lineTo(tx + tw, lipBot + 1);
    c.lineTo(tx, lipBot - deep);
    c.closePath(); c.fill();
  }
  c.restore();

  // eyes (blink now and then) - small and close together, like the plush
  const blink = (Math.floor(t * 0.9) % 7 === 0) && (t % 0.9 < 0.12);
  c.fillStyle = '#101a2b';
  if (blink) {
    fillRR(c, -10, -h * 0.615, 7, 2.5, 1, '#101a2b');
    fillRR(c, 3, -h * 0.615, 7, 2.5, 1, '#101a2b');
  } else {
    circ(c, -6.5, -h * 0.60, 3.6, '#101a2b');
    circ(c, 6.5, -h * 0.60, 3.6, '#101a2b');
    circ(c, -5.4, -h * 0.625, 1.3, '#ffffff');
    circ(c, 7.6, -h * 0.625, 1.3, '#ffffff');
  }

  // dorsal fin
  c.beginPath();
  c.moveTo(-6, bodyTop + 2);
  c.quadraticCurveTo(0, bodyTop - 13, 9, bodyTop + 1);
  c.closePath();
  c.fillStyle = '#2f74d0'; c.fill();

  // tiny arms, swinging opposite to the legs
  const armY = -h * 0.44 + (air ? -6 : 0);
  fillRR(c, -w * 0.52, armY - swing * 3.2, 7, 12, 3, '#2a6cc6');
  fillRR(c, w * 0.52 - 7, armY + swing * 3.2, 7, 12, 3, '#2a6cc6');

  c.restore();
}

/* ---------------------------- PUPPY ------------------------------- */
function drawPuppy(c, e, t) {
  c.save();
  c.translate(e.x + e.w / 2, e.y + e.h);
  c.scale(e.face < 0 ? -1 : 1, 1);
  const w = e.w, h = e.h, bounce = e.hopping ? Math.sin(t * 14) * 2 : 0;

  // floppy ears behind the head
  ell(c, -w * 0.34, -h * 0.72, 9, 13, -0.35, '#8a5a2b');
  ell(c, w * 0.34, -h * 0.72, 9, 13, 0.35, '#8a5a2b');
  ell(c, -w * 0.34, -h * 0.72, 5, 8, -0.35, '#6d4520');
  ell(c, w * 0.34, -h * 0.72, 5, 8, 0.35, '#6d4520');

  // round cream head/body
  const g = c.createRadialGradient(-w * 0.15, -h * 0.75, 4, 0, -h * 0.55, w * 0.62);
  g.addColorStop(0, '#fff6e2'); g.addColorStop(1, '#e8cfa4');
  circ(c, 0, -h * 0.52 + bounce, w * 0.47, g);
  // tan eye patches
  ell(c, -w * 0.19, -h * 0.60 + bounce, 10, 11, -0.2, '#c99a5e');
  ell(c, w * 0.19, -h * 0.60 + bounce, 10, 11, 0.2, '#c99a5e');

  // big blue eyes
  circ(c, -w * 0.17, -h * 0.60 + bounce, 6, '#122033');
  circ(c, w * 0.17, -h * 0.60 + bounce, 6, '#122033');
  circ(c, -w * 0.17, -h * 0.60 + bounce, 4, '#2f7fd8');
  circ(c, w * 0.17, -h * 0.60 + bounce, 4, '#2f7fd8');
  circ(c, -w * 0.15, -h * 0.63 + bounce, 1.7, '#fff');
  circ(c, w * 0.19, -h * 0.63 + bounce, 1.7, '#fff');
  // blush + nose + smile
  ell(c, -w * 0.30, -h * 0.42 + bounce, 4.5, 3, 0, 'rgba(255,150,150,.65)');
  ell(c, w * 0.30, -h * 0.42 + bounce, 4.5, 3, 0, 'rgba(255,150,150,.65)');
  ell(c, 0, -h * 0.44 + bounce, 3.4, 2.6, 0, '#7a4a24');
  c.strokeStyle = '#7a4a24'; c.lineWidth = 1.6; c.lineCap = 'round';
  c.beginPath();
  c.moveTo(-3, -h * 0.39 + bounce);
  c.quadraticCurveTo(0, -h * 0.36 + bounce, 3, -h * 0.39 + bounce);
  c.stroke();
  // little paws
  ell(c, -7, -2, 5, 3, 0, '#f2ddb8');
  ell(c, 7, -2, 5, 3, 0, '#f2ddb8');
  c.restore();
  drawAccessory(c, e, t);
}

/* ------------------------------ BEE ------------------------------- */
function drawBee(c, e, t) {
  c.save();
  c.translate(e.x + e.w / 2, e.y + e.h);
  const w = e.w, h = e.h;
  const flap = Math.sin(t * 42) * 0.7;
  const hover = Math.sin(t * 6) * 3;
  c.translate(0, hover);

  // round yellow body
  const bg = c.createRadialGradient(-w * 0.16, -h * 0.62, 4, 0, -h * 0.46, w * 0.50);
  bg.addColorStop(0, '#ffe680'); bg.addColorStop(0.7, '#ffd23f'); bg.addColorStop(1, '#e8b31f');
  ell(c, 0, -h * 0.46, w * 0.45, h * 0.41, 0, bg);

  // thin black crochet bands, only across the back (left) half
  c.save();
  c.beginPath(); c.ellipse(0, -h * 0.46, w * 0.45, h * 0.41, 0, 0, TAU); c.clip();
  c.strokeStyle = '#2b2b33'; c.lineWidth = 2.8; c.lineCap = 'round';
  for (let i = 0; i < 4; i++) {
    const bx = -w * 0.36 + i * 6.5;
    c.beginPath();
    c.moveTo(bx, -h * 0.80);
    c.quadraticCurveTo(bx - 7, -h * 0.46, bx, -h * 0.12);
    c.stroke();
  }
  c.restore();

  // two fluffy white wings poking up from the back, like the crochet plush
  const wf = flap * 0.25;
  c.save();
  c.translate(-w * 0.20, -h * 0.84);
  c.rotate(-0.55 + wf);
  c.fillStyle = '#ffffff';
  c.beginPath(); c.ellipse(-4, -4, 10, 7, 0, 0, TAU); c.fill();
  c.beginPath(); c.ellipse(-11, 1, 6, 5, 0, 0, TAU); c.fill();
  c.restore();
  c.save();
  c.translate(w * 0.14, -h * 0.86);
  c.rotate(0.5 - wf);
  c.fillStyle = '#f2f9ff';
  c.beginPath(); c.ellipse(4, -4, 9.5, 6.5, 0, 0, TAU); c.fill();
  c.beginPath(); c.ellipse(11, 1, 5.5, 4.6, 0, 0, TAU); c.fill();
  c.restore();

  // small black bead eyes and a little smile, like the plush
  circ(c, w * 0.14, -h * 0.56, 3.4, '#15151b');
  circ(c, w * 0.30, -h * 0.56, 3.4, '#15151b');
  circ(c, w * 0.15, -h * 0.575, 1.2, '#fff');
  circ(c, w * 0.31, -h * 0.575, 1.2, '#fff');
  c.strokeStyle = '#15151b'; c.lineWidth = 1.6; c.lineCap = 'round';
  c.beginPath(); c.arc(w * 0.22, -h * 0.44, 4.6, 0.25, Math.PI - 0.25); c.stroke();
  c.restore();
  drawAccessory(c, e, t);
}

/* ----------------------------- BOOMER ----------------------------- */
function drawBoomer(c, e, t) {
  c.save();
  c.translate(e.x + e.w / 2, e.y + e.h);
  c.scale(e.face < 0 ? -1 : 1, 1);
  const w = e.w, h = e.h, breath = 1 + Math.sin(t * 3) * 0.02;
  c.scale(breath, 2 - breath);

  // squash on landing, stretch on the way up, and lean into the hop. This is
  // the boss whose whole fight is a jump, so the jump has to be readable.
  const vy = e.vy || 0;
  const rise = clamp(-vy / 700, 0, 1);
  const fall = clamp(vy / 900, 0, 1);
  const land = clamp((e.landT || 0) / 0.2, 0, 1);
  if (e.airborne) {
    c.scale(1 - rise * 0.10 + fall * 0.06, 1 + rise * 0.12 - fall * 0.06);
    c.rotate(clamp(vy / 2600, -0.13, 0.13));
  } else if (land > 0) {
    c.scale(1 + land * 0.12, 1 - land * 0.14);
  }

  // little grey flipper wings behind
  const flap = e.airborne ? Math.sin(t * 16) * 0.5 : Math.sin(t * 3) * 0.12;
  c.save();
  c.translate(-w * 0.40, -h * 0.48);
  c.rotate(-0.30 + flap);
  c.beginPath();
  c.moveTo(0, 0);
  c.quadraticCurveTo(-26, -14, -31, 6);
  c.quadraticCurveTo(-15, 12, 0, 9);
  c.closePath();
  c.fillStyle = '#aeb8bf'; c.fill();
  c.strokeStyle = '#8f9aa3'; c.lineWidth = 1.6; c.stroke();
  c.restore();
  c.save();
  c.translate(w * 0.40, -h * 0.48);
  c.rotate(0.30 - flap);
  c.beginPath();
  c.moveTo(0, 0);
  c.quadraticCurveTo(26, -14, 31, 6);
  c.quadraticCurveTo(15, 12, 0, 9);
  c.closePath();
  c.fillStyle = '#c3ccd2'; c.fill();
  c.strokeStyle = '#8f9aa3'; c.lineWidth = 1.6; c.stroke();
  c.restore();

  // green round body
  const g = c.createRadialGradient(-w * 0.18, -h * 0.72, 8, 0, -h * 0.52, w * 0.72);
  g.addColorStop(0, '#79b95a'); g.addColorStop(0.6, '#4d9340'); g.addColorStop(1, '#2f6b2c');
  circ(c, 0, -h * 0.52, w * 0.48, g);

  // mottled tie-dye patches, just like the plush fabric
  c.save();
  c.beginPath(); c.arc(0, -h * 0.52, w * 0.47, 0, TAU); c.clip();
  c.globalAlpha = 0.22;
  ell(c, -w * 0.20, -h * 0.68, w * 0.20, h * 0.13, 0.4, '#1d4d1c');
  ell(c, w * 0.24, -h * 0.44, w * 0.16, h * 0.11, -0.3, '#1d4d1c');
  ell(c, -w * 0.05, -h * 0.30, w * 0.18, h * 0.09, 0.1, '#7fbf5c');
  c.globalAlpha = 1;
  c.restore();

  // white belly
  ell(c, 0, -h * 0.20, w * 0.34, h * 0.17, 0, '#f2f7ec');

  // cream horns: two big ones on the sides, two little ones on top
  const horn = (hx, hy, sc, rot) => {
    c.save();
    c.translate(hx * w, hy * h);
    c.rotate(rot);
    c.scale(sc, sc);
    c.beginPath();
    c.moveTo(-6, 7);
    c.quadraticCurveTo(-4, -13, 2, -17);
    c.quadraticCurveTo(9, -10, 6, 7);
    c.closePath();
    c.fillStyle = '#f4f1e4'; c.fill();
    c.strokeStyle = '#cfc7b2'; c.lineWidth = 1.5; c.stroke();
    c.restore();
  };
  horn(-0.30, -0.80, 1.15, -0.35);
  horn(0.30, -0.80, 1.15, 0.35);
  horn(-0.11, -0.94, 0.72, -0.15);
  horn(0.11, -0.94, 0.72, 0.15);

  // big cream snout, centred on the face
  ell(c, 0, -h * 0.42, w * 0.27, h * 0.15, 0, '#f7f4ea');
  ell(c, -w * 0.075, -h * 0.46, 2.6, 2.2, 0, '#6d8a5c');
  ell(c, w * 0.075, -h * 0.46, 2.6, 2.2, 0, '#6d8a5c');
  c.strokeStyle = '#6d8a5c'; c.lineWidth = 1.4; c.lineCap = 'round';
  c.beginPath(); c.arc(0, -h * 0.385, 4.4, 0.3, Math.PI - 0.3); c.stroke();

  // eyes, wide apart and symmetric
  circ(c, -w * 0.22, -h * 0.62, 5.2, '#141a18');
  circ(c, w * 0.22, -h * 0.62, 5.2, '#141a18');
  circ(c, -w * 0.205, -h * 0.645, 1.9, '#fff');
  circ(c, w * 0.235, -h * 0.645, 1.9, '#fff');

  // little feet
  ell(c, -w * 0.24, -3, 14, 6, 0, '#3c7a36');
  ell(c, w * 0.24, -3, 14, 6, 0, '#3c7a36');
  c.restore();
}

/* ------------------------ BLACK / RED TURNIP ---------------------- */
/* The real plushies are round "ball birds": a dark body, a big cream
   heart-shaped face mask, huge sparkly eyes and pink cheeks.         */
function drawPlushBall(c, e, t, o) {
  c.save();
  c.translate(e.x + e.w / 2, e.y + e.h);
  c.scale(e.face < 0 ? -1 : 1, 1);
  const w = e.w, h = e.h;
  const hop = e.hopping ? Math.abs(Math.sin(t * 10)) * 3 : 0;
  c.translate(0, -hop);

  // ears (monkey) go behind the body
  if (o.ears) {
    ell(c, -w * 0.40, -h * 0.76, 9, 11, -0.35, o.body);
    ell(c, w * 0.40, -h * 0.76, 9, 11, 0.35, o.body);
    ell(c, -w * 0.40, -h * 0.76, 5.5, 7, -0.35, o.mask);
    ell(c, w * 0.40, -h * 0.76, 5.5, 7, 0.35, o.mask);
  }

  // tiny flipper arms
  const flap = Math.sin(t * 8 + e.x * 0.01) * 0.15;
  ell(c, -w * 0.45, -h * 0.40, 6, 10, 0.35 + flap, o.dark);
  ell(c, w * 0.45, -h * 0.40, 6, 10, -0.35 - flap, o.dark);

  // round body
  const g = c.createRadialGradient(-w * 0.16, -h * 0.70, 4, 0, -h * 0.48, w * 0.56);
  g.addColorStop(0, o.light); g.addColorStop(0.65, o.body); g.addColorStop(1, o.dark);
  circ(c, 0, -h * 0.48, w * 0.47, g);

  // cream face mask (wide heart with a notch at the top)
  c.beginPath();
  c.moveTo(0, -h * 0.58);
  c.bezierCurveTo(-w * 0.10, -h * 0.75, -w * 0.31, -h * 0.77, -w * 0.36, -h * 0.60);
  c.bezierCurveTo(-w * 0.43, -h * 0.39, -w * 0.26, -h * 0.21, 0, -h * 0.19);
  c.bezierCurveTo(w * 0.26, -h * 0.21, w * 0.43, -h * 0.39, w * 0.36, -h * 0.60);
  c.bezierCurveTo(w * 0.31, -h * 0.77, w * 0.10, -h * 0.75, 0, -h * 0.58);
  c.closePath();
  c.fillStyle = o.mask; c.fill();
  c.strokeStyle = o.maskEdge; c.lineWidth = 1.1; c.stroke();

  // pink cheeks
  ell(c, -w * 0.275, -h * 0.335, 5, 3.4, -0.2, o.blush);
  ell(c, w * 0.275, -h * 0.335, 5, 3.4, 0.2, o.blush);

  // huge sparkly eyes
  const ey = -h * 0.50;
  [-1, 1].forEach(s => {
    circ(c, s * w * 0.155, ey, 6.3, '#20263c');
    circ(c, s * w * 0.155, ey, 4.3, '#3d5c8f');
    starPath(c, s * w * 0.140, ey - 1.4, 3.1, 4, 0.35);
    c.fillStyle = '#ffffff'; c.fill();
    circ(c, s * w * 0.185, ey + 2.4, 1.2, 'rgba(255,255,255,.9)');
  });

  if (o.beak) {
    c.beginPath();
    c.moveTo(-2.6, -h * 0.375); c.lineTo(2.6, -h * 0.375); c.lineTo(0, -h * 0.325);
    c.closePath(); c.fillStyle = '#f2c14e'; c.fill();
  } else {
    c.strokeStyle = '#6b5a4a'; c.lineWidth = 1.4; c.lineCap = 'round';
    c.beginPath(); c.arc(0, -h * 0.38, 3.4, 0.25, Math.PI - 0.25); c.stroke();
  }

  // the red one is the angry one: sharp brows above the eyes
  if (o.angry) {
    c.strokeStyle = '#241a1a'; c.lineWidth = 2.4; c.lineCap = 'round';
    c.beginPath();
    c.moveTo(-w * 0.255, -h * 0.705); c.lineTo(-w * 0.095, -h * 0.645);
    c.moveTo(w * 0.255, -h * 0.705); c.lineTo(w * 0.095, -h * 0.645);
    c.stroke();
  }

  // tiny feet
  ell(c, -w * 0.16, -2, 6, 3.4, 0, o.dark);
  ell(c, w * 0.16, -2, 6, 3.4, 0, o.dark);
  c.restore();
  drawAccessory(c, e, t);
}

function drawTurnip(c, e, t) {
  const red = e.type === 'redTurnip';
  drawPlushBall(c, e, t, red ? {
    light: '#ff8f7f', body: '#e04343', dark: '#9e1c2b',
    mask: '#f8ecdf', maskEdge: '#e6d3c1', blush: '#ff9aa8',
    beak: true, angry: true
  } : {
    light: '#39405f', body: '#242b45', dark: '#12172a',
    mask: '#efe7d6', maskEdge: '#d9cdb6', blush: '#f2a0b5',
    beak: true, angry: false
  });
}

/* ----------------------------- MONKEY ----------------------------- */
/* Lavender ball plush with a big cream mask and little round ears.   */
function drawMonkey(c, e, t) {
  drawPlushBall(c, e, t, {
    light: '#c4a5ee', body: '#9a6fd0', dark: '#6b45a3',
    mask: '#f4ecdc', maskEdge: '#e2d5c0', blush: '#f0a6c0',
    beak: false, ears: true, angry: false
  });
}

/* ------------------------- PUFFY PENGUIN -------------------------- */
function drawPenguin(c, e, t) {
  c.save();
  c.translate(e.x + e.w / 2, e.y + e.h);
  c.scale(e.face < 0 ? -1 : 1, 1);
  const w = e.w, h = e.h;
  const waddle = Math.sin(t * 6) * 0.05;
  c.rotate(waddle);

  // orange feet: one lifts while the other plants, so she waddles instead of
  // sliding along the floor
  const step = Math.sin(t * 6);
  const liftL = Math.max(0, step) * 5;
  const liftR = Math.max(0, -step) * 5;
  // soft shadow under the planted foot
  ell(c, w * 0.21 * (step > 0 ? 1 : -1), -0.5, 11, 3, 0, 'rgba(10,40,70,.18)');
  ell(c, -w * 0.21, -2 - liftL, 12, 5, 0, '#f2a03a');
  ell(c, w * 0.21, -2 - liftR, 12, 5, 0, '#f2a03a');

  // big fluffy cyan body
  const g = c.createRadialGradient(-w * 0.14, -h * 0.74, 8, 0, -h * 0.46, w * 0.62);
  g.addColorStop(0, '#6fd6fb'); g.addColorStop(0.6, '#2ba6e4'); g.addColorStop(1, '#1673b6');
  c.beginPath(); c.ellipse(0, -h * 0.46, w * 0.48, h * 0.44, 0, 0, TAU);
  c.fillStyle = g; c.fill();

  // fluffy bumps around the edge (this plush is very fuzzy)
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * TAU + 0.1;
    const wob = 1 + Math.sin(t * 3 + i) * 0.02;
    circ(c, Math.cos(a) * w * 0.455 * wob, -h * 0.46 + Math.sin(a) * h * 0.415 * wob,
      4.6, i % 2 ? '#4fc3f2' : '#2497d8');
  }

  // huge white face + chest
  c.beginPath(); c.ellipse(0, -h * 0.49, w * 0.33, h * 0.35, 0, 0, TAU);
  c.fillStyle = '#ffffff'; c.fill();
  ell(c, 0, -h * 0.30, w * 0.30, h * 0.13, 0, '#f4fbff');

  // small black eyes
  circ(c, -w * 0.11, -h * 0.64, 3.7, '#141a22');
  circ(c, w * 0.11, -h * 0.64, 3.7, '#141a22');
  circ(c, -w * 0.095, -h * 0.655, 1.3, '#ffffff');
  circ(c, w * 0.125, -h * 0.655, 1.3, '#ffffff');

  // little yellow beak
  c.beginPath();
  c.moveTo(-5, -h * 0.545); c.lineTo(5, -h * 0.545); c.lineTo(0, -h * 0.485);
  c.closePath(); c.fillStyle = '#f7c948'; c.fill();
  c.strokeStyle = '#d9a531'; c.lineWidth = 1; c.stroke();

  // flippers resting on the sides
  ell(c, -w * 0.46, -h * 0.42, 6, 16, 0.3 + Math.sin(t * 5) * 0.08, '#1d86c4');
  ell(c, w * 0.46, -h * 0.42, 6, 16, -0.3 - Math.sin(t * 5) * 0.08, '#1d86c4');
  c.restore();
}

/* ----------------------------- SHARKY ----------------------------- */
/* Pale warm-grey shark ball with a red mouth and no big dorsal fin.  */
function drawSharky(c, e, t) {
  c.save();
  c.translate(e.x + e.w / 2, e.y + e.h);
  c.scale(e.face < 0 ? -1 : 1, 1);
  const w = e.w, h = e.h;
  const wiggle = Math.sin(t * 8) * 2;
  c.translate(0, wiggle);

  // little side fin + tail tip
  c.beginPath();
  c.moveTo(-w * 0.40, -h * 0.38);
  c.quadraticCurveTo(-w * 0.60, -h * 0.30, -w * 0.56, -h * 0.16);
  c.quadraticCurveTo(-w * 0.46, -h * 0.20, -w * 0.40, -h * 0.26);
  c.closePath();
  c.fillStyle = '#a89f8f'; c.fill();

  // body
  c.beginPath();
  c.ellipse(0, -h * 0.44, w * 0.47, h * 0.40, 0, 0, TAU);
  c.fillStyle = vgrad(c, 0, -h * 0.84, 0, -h * 0.04, '#e2dccd', '#b3aa99');
  c.fill();

  // cream belly
  c.beginPath(); c.ellipse(w * 0.02, -h * 0.30, w * 0.36, h * 0.18, 0, 0, TAU);
  c.fillStyle = '#f6f1e5'; c.fill();

  // gill lines
  c.strokeStyle = 'rgba(120,110,95,.45)'; c.lineWidth = 1.4; c.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    c.beginPath();
    c.moveTo(-w * 0.26 + i * 5, -h * 0.52);
    c.quadraticCurveTo(-w * 0.24 + i * 5, -h * 0.44, -w * 0.27 + i * 5, -h * 0.36);
    c.stroke();
  }

  // big red grin with zigzag teeth along both lips, like the plush
  const mx = w * 0.24, my = -h * 0.355, mrx = w * 0.235, mry = h * 0.115;
  c.save();
  c.beginPath();
  c.ellipse(mx, my, mrx, mry, -0.16, 0, TAU);
  c.fillStyle = '#c8334a'; c.fill();
  c.clip();
  c.fillStyle = '#ffffff';
  // each tooth sits on the curved lip, so nothing spills outside the mouth
  for (let i = 0; i < 6; i++) {
    const u = -0.78 + (i / 5) * 1.56;             // across the mouth, -1..1
    const tx = mx + u * mrx;
    const lipY = my - mry * Math.sqrt(Math.max(0, 1 - u * u));
    const tw = mrx * 0.16;
    c.beginPath();
    c.moveTo(tx - tw, lipY - 1);
    c.lineTo(tx + tw, lipY - 1);
    c.lineTo(tx, lipY + mry * 0.62);
    c.closePath(); c.fill();
  }
  for (let i = 0; i < 5; i++) {
    const u = -0.62 + (i / 4) * 1.24;
    const tx = mx + u * mrx;
    const lipY = my + mry * Math.sqrt(Math.max(0, 1 - u * u));
    const tw = mrx * 0.15;
    c.beginPath();
    c.moveTo(tx - tw, lipY + 1);
    c.lineTo(tx + tw, lipY + 1);
    c.lineTo(tx, lipY - mry * 0.55);
    c.closePath(); c.fill();
  }
  c.restore();

  // small bead eye
  circ(c, w * 0.02, -h * 0.60, 3.4, '#141414');
  circ(c, w * 0.035, -h * 0.615, 1.2, '#ffffff');
  c.restore();
  drawAccessory(c, e, t);
}

/* --------------------------- BASKETBALL --------------------------- */
function drawBasketball(c, e, t) {
  c.save();
  c.translate(e.x + e.w / 2, e.y + e.h);
  c.scale(e.face < 0 ? -1 : 1, 1);
  const w = e.w, h = e.h;
  const squish = 1 + Math.sin(t * 8) * 0.05;
  const bc = -h * 0.58;          // middle of the ball
  const br = w * 0.43;           // ball radius

  // thin grey legs with red sneakers (the plush wears real shoes)
  fillRR(c, -17, -30, 7, 30, 3.5, '#9aa0aa');
  fillRR(c, 10, -30, 7, 30, 3.5, '#9aa0aa');
  fillRR(c, -25, -11, 22, 11, 5, '#e63b3b');
  fillRR(c, 3, -11, 22, 11, 5, '#e63b3b');
  fillRR(c, -25, -4, 22, 5, 2.5, '#f7f7f7');
  fillRR(c, 3, -4, 22, 5, 2.5, '#f7f7f7');

  // ball, spinning as it moves
  c.save();
  c.scale(1, squish);
  c.translate(0, bc);
  c.rotate(e.rot || 0);
  c.translate(0, -bc);
  const g = c.createRadialGradient(-w * 0.15, bc - h * 0.12, 6, 0, bc, br * 1.2);
  g.addColorStop(0, '#ffab5e'); g.addColorStop(0.75, '#e8792c'); g.addColorStop(1, '#b9531c');
  circ(c, 0, bc, br, g);

  // black seams, kept above the face and clipped to the ball
  c.save();
  c.beginPath(); c.arc(0, bc, br, 0, TAU); c.clip();
  c.strokeStyle = '#2a1b12'; c.lineWidth = 3;
  c.beginPath(); c.moveTo(-br, bc - h * 0.20); c.quadraticCurveTo(0, bc - h * 0.26, br, bc - h * 0.20); c.stroke();
  c.beginPath(); c.moveTo(0, bc - br); c.lineTo(0, bc - h * 0.24); c.stroke();
  c.beginPath(); c.arc(-w * 0.41, bc - h * 0.20, w * 0.30, -0.95, 1.05); c.stroke();
  c.beginPath(); c.arc(w * 0.41, bc - h * 0.20, w * 0.30, Math.PI - 1.05, Math.PI + 0.95); c.stroke();
  c.restore();
  c.restore();

  // friendly sleepy face (the plush is smiling, not angry)
  circ(c, -9, bc + h * 0.03, 3.6, '#1a120c');
  circ(c, 9, bc + h * 0.03, 3.6, '#1a120c');
  circ(c, -8, bc + h * 0.015, 1.2, '#ffffff');
  circ(c, 10, bc + h * 0.015, 1.2, '#ffffff');
  c.strokeStyle = '#1a120c'; c.lineWidth = 2; c.lineCap = 'round';
  c.beginPath(); c.arc(0, bc + h * 0.13, 5.5, 0.35, Math.PI - 0.35); c.stroke();
  c.restore();
}

/* --------------------------- BLUE BEAR ---------------------------- */
/* Pastel seafoam plush, cream muzzle and belly, small dark eyes.     */
function drawBlueBear(c, e, t) {
  c.save();
  c.translate(e.x + e.w / 2, e.y + e.h);
  c.scale(e.face < 0 ? -1 : 1, 1);
  const w = e.w, h = e.h;
  const breathe = Math.sin(t * 2.4) * 0.02;
  c.scale(1 + breathe, 1 - breathe);

  // legs
  fillRR(c, -w * 0.30, -26, 26, 26, 12, '#a3cfc8');
  fillRR(c, w * 0.06, -26, 26, 26, 12, '#a3cfc8');
  ell(c, -w * 0.19, -3, 14, 7, 0, '#e8f2ee');
  ell(c, w * 0.19, -3, 14, 7, 0, '#e8f2ee');

  // ears
  circ(c, -w * 0.30, -h * 0.86, 13, '#a9d2cb');
  circ(c, w * 0.30, -h * 0.86, 13, '#a9d2cb');
  circ(c, -w * 0.30, -h * 0.86, 7, '#e6f1ec');
  circ(c, w * 0.30, -h * 0.86, 7, '#e6f1ec');

  // body
  const g = c.createRadialGradient(-w * 0.15, -h * 0.72, 10, 0, -h * 0.45, w * 0.62);
  g.addColorStop(0, '#e2f3ee'); g.addColorStop(0.7, '#bcdcd5'); g.addColorStop(1, '#96c3bb');
  c.beginPath(); c.ellipse(0, -h * 0.46, w * 0.44, h * 0.44, 0, 0, TAU);
  c.fillStyle = g; c.fill();

  // cream belly panel
  c.beginPath(); c.ellipse(0, -h * 0.30, w * 0.27, h * 0.20, 0, 0, TAU);
  c.fillStyle = '#f4f0e2'; c.fill();

  // cream muzzle with a small brown nose, centred
  ell(c, 0, -h * 0.53, w * 0.20, h * 0.135, 0, '#f7f3e7');
  ell(c, 0, -h * 0.565, 3.4, 2.6, 0, '#b98a6a');
  c.strokeStyle = '#8a6a52'; c.lineWidth = 1.4; c.lineCap = 'round';
  c.beginPath(); c.arc(0, -h * 0.50, 4.2, 0.35, Math.PI - 0.35); c.stroke();

  // small dark eyes, one each side of the muzzle
  circ(c, -w * 0.17, -h * 0.64, 4.2, '#1b2320');
  circ(c, w * 0.17, -h * 0.64, 4.2, '#1b2320');
  circ(c, -w * 0.185, -h * 0.655, 1.5, '#ffffff');
  circ(c, w * 0.155, -h * 0.655, 1.5, '#ffffff');

  // swatting arms, with a wind-up before the paw comes down
  const wind = e.swatWind || 0;            // 0..1, rises before a swat
  const follow = (e.swatFollow || 0) / 0.22;   // 1 right after the paw lands, 0 once it settles
  const swat = Math.sin(t * (e.swatting ? 12 : 3)) * (e.swatting ? 0.85 : 0.15);
  c.save();
  c.translate(-w * 0.38, -h * 0.52);
  c.rotate(-0.5 + swat - wind * 1.15 + follow * 0.42);
  fillRR(c, -11, -8, 22, 46, 11, '#a9d2cb');
  ell(c, 0, 40, 12, 11, 0, '#e8f2ee');
  c.restore();
  c.save();
  c.translate(w * 0.38, -h * 0.52);
  c.rotate(0.5 - swat + wind * 1.15 - follow * 0.42);
  fillRR(c, -11, -8, 22, 46, 11, '#a9d2cb');
  ell(c, 0, 40, 12, 11, 0, '#e8f2ee');
  c.restore();
  c.restore();
}

/* ------------------------- boss arena landmarks ------------------- */
// Every boss gets its own landmark behind the arena, so one frame is enough to
// tell you which fight you are in. All four are pure paint: they never collide,
// never hurt you, and never block a jump.
function drawBossStage(c, p, t) {
  c.save();
  if (p.kind === 'barn') {
    // Fall Fields: the hay barn, doors flung open, hay spilling out
    fillRR(c, -120, -150, 240, 150, 6, '#a63b32');
    fillRR(c, -120, -150, 240, 16, 5, '#8c2f28');
    // roof
    c.beginPath();
    c.moveTo(-136, -148); c.lineTo(0, -222); c.lineTo(136, -148);
    c.closePath(); c.fillStyle = '#7c2b25'; c.fill();
    c.fillStyle = '#c9553f';
    c.beginPath();
    c.moveTo(-136, -148); c.lineTo(0, -222); c.lineTo(0, -208); c.lineTo(-120, -148);
    c.closePath(); c.fill();
    // white X doors
    fillRR(c, -62, -104, 124, 104, 4, '#f6ead6');
    c.strokeStyle = '#a63b32'; c.lineWidth = 9; c.lineCap = 'round';
    c.beginPath();
    c.moveTo(-56, -100); c.lineTo(56, -4);
    c.moveTo(56, -100); c.lineTo(-56, -4);
    c.stroke();
    // hay loft window
    fillRR(c, -22, -138, 44, 26, 3, '#3a2a20');
    fillRR(c, -18, -134, 36, 18, 2, '#d9b04a');
    // hay bales against the wall
    fillRR(c, -140, -34, 54, 34, 8, '#e3b64f');
    fillRR(c, 96, -30, 46, 30, 8, '#d9aa45');
  } else if (p.kind === 'rookery') {
    // Antarctica: a snow arch with three little penguins watching the fight
    c.beginPath();
    c.moveTo(-130, 0);
    c.quadraticCurveTo(-130, -210, 0, -210);
    c.quadraticCurveTo(130, -210, 130, 0);
    c.lineTo(96, 0);
    c.quadraticCurveTo(96, -168, 0, -168);
    c.quadraticCurveTo(-96, -168, -96, 0);
    c.closePath();
    c.fillStyle = '#cfeaf8'; c.fill();
    c.strokeStyle = '#9ecfe6'; c.lineWidth = 4; c.stroke();
    // snow caps on the arch
    ell(c, -92, -172, 26, 12, -0.3, '#f7fdff');
    ell(c, 92, -172, 26, 12, 0.3, '#f7fdff');
    ell(c, 0, -208, 34, 14, 0, '#f7fdff');
    // three tiny penguins, bobbing in turn
    [-58, 0, 58].forEach((x, i) => {
      const b = Math.sin(t * 2.2 + i * 1.4) * 3;
      c.save();
      c.translate(x, b);
      ell(c, 0, -6, 15, 18, 0, '#1d2a3d');
      ell(c, 0, -2, 9, 13, 0, '#f4fbff');
      circ(c, -4, -14, 2.4, '#f4fbff');
      circ(c, 4, -14, 2.4, '#f4fbff');
      c.beginPath(); c.moveTo(-4, -9); c.lineTo(4, -9); c.lineTo(0, -5); c.closePath();
      c.fillStyle = '#f2a03a'; c.fill();
      c.restore();
    });
  } else if (p.kind === 'hoop') {
    // Rainy City: a street basketball hoop and a painted court
    c.strokeStyle = '#8d99a8'; c.lineWidth = 10; c.lineCap = 'round';
    c.beginPath(); c.moveTo(96, 0); c.lineTo(96, -196); c.stroke();
    c.beginPath(); c.moveTo(96, -150); c.lineTo(44, -168); c.stroke();
    fillRR(c, 6, -212, 84, 56, 5, 'rgba(240,244,250,.92)');
    c.strokeStyle = '#5a6a7d'; c.lineWidth = 3; c.strokeRect(6, -212, 84, 56);
    c.strokeStyle = '#d24b52'; c.lineWidth = 4;
    c.strokeRect(36, -190, 26, 20);
    // hoop and net
    c.strokeStyle = '#e8622f'; c.lineWidth = 5;
    c.beginPath(); c.moveTo(6, -168); c.lineTo(40, -168); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      const x = 8 + i * 6;
      c.beginPath(); c.moveTo(x, -166); c.lineTo(x + 3, -140); c.stroke();
    }
    c.beginPath(); c.moveTo(8, -140); c.lineTo(44, -140); c.stroke();
    // painted court markings on the floor
    c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(-150, -4); c.lineTo(150, -4); c.stroke();
    c.beginPath(); c.arc(-40, -4, 56, Math.PI, TAU); c.stroke();
  } else if (p.kind === 'tower') {
    // Sunny Beach: a lifeguard tower with a flag, and a watermelon stand
    c.strokeStyle = '#c9a06a'; c.lineWidth = 8; c.lineCap = 'round';
    c.beginPath();
    c.moveTo(-56, 0); c.lineTo(-34, -120);
    c.moveTo(56, 0); c.lineTo(34, -120);
    c.stroke();
    c.beginPath();
    c.moveTo(-52, -34); c.lineTo(52, -34);
    c.moveTo(-44, -78); c.lineTo(44, -78);
    c.stroke();
    fillRR(c, -58, -132, 116, 46, 5, '#f4f7fa');
    fillRR(c, -58, -132, 116, 8, 3, '#e0573f');
    fillRR(c, -20, -122, 40, 26, 3, '#7fb8d6');
    c.strokeStyle = '#c9a06a'; c.lineWidth = 5;
    c.beginPath(); c.moveTo(48, -132); c.lineTo(48, -196); c.stroke();
    c.fillStyle = '#ff6b81';
    c.beginPath();
    c.moveTo(49, -196); c.lineTo(92, -184); c.lineTo(49, -172);
    c.closePath(); c.fill();
    // watermelon stand: a striped umbrella over two green melons
    c.strokeStyle = '#b98247'; c.lineWidth = 5;
    c.beginPath(); c.moveTo(146, 0); c.lineTo(146, -58); c.stroke();
    for (let i = 0; i < 6; i++) {
      c.fillStyle = i % 2 ? 'rgba(250,252,255,.95)' : 'rgba(226,86,96,.95)';
      c.beginPath();
      c.moveTo(146, -96);
      c.arc(146, -96, 46, Math.PI + i * 0.5236, Math.PI + (i + 1) * 0.5236);
      c.closePath(); c.fill();
    }
    circ(c, 128, -16, 19, '#4f8f38');
    circ(c, 164, -12, 15, '#3f7a2c');
    // dark stripes, so they read as watermelons and not green balls
    c.strokeStyle = '#2e6b21'; c.lineWidth = 2.5;
    [[128, -16, 19], [164, -12, 15]].forEach(([mx, my, mr]) => {
      for (let i = -1; i <= 1; i++) {
        c.beginPath();
        c.ellipse(mx, my, mr * 0.42, mr, 0, -Math.PI / 2, Math.PI / 2);
        c.stroke();
        c.beginPath();
        c.ellipse(mx, my, mr * 0.42, mr, 0, Math.PI / 2, Math.PI * 1.5);
        c.stroke();
      }
    });
  }
  c.restore();
}

/* --------------------- little beach accessories ------------------- */
function drawAccessory(c, e, t) {
  if (!e.acc) return;
  const w = e.w, h = e.h;
  c.save();
  c.translate(e.x + e.w / 2, e.y + e.h);
  c.scale(e.face < 0 ? -1 : 1, 1);
  if (e.acc === 'hat') {
    fillRR(c, -w * 0.36, -h * 1.02, w * 0.72, 6, 3, '#f2d06b');
    fillRR(c, -w * 0.20, -h * 1.17, w * 0.40, 12, 4, '#f2d06b');
    fillRR(c, -w * 0.20, -h * 1.07, w * 0.40, 4, 2, '#e0605c');
  } else if (e.acc === 'shades') {
    fillRR(c, -w * 0.30, -h * 0.70, w * 0.24, 8, 4, '#1b2330');
    fillRR(c, w * 0.06, -h * 0.70, w * 0.24, 8, 4, '#1b2330');
    c.fillStyle = '#1b2330'; c.fillRect(-w * 0.07, -h * 0.68, w * 0.14, 3);
  } else if (e.acc === 'bucket') {
    c.save();
    c.translate(w * 0.34, -h * 0.92);
    c.rotate(0.25);
    c.beginPath();
    c.moveTo(-9, -8); c.lineTo(9, -8); c.lineTo(6, 8); c.lineTo(-6, 8); c.closePath();
    c.fillStyle = '#e94d5b'; c.fill();
    c.strokeStyle = '#b02f3d'; c.lineWidth = 2;
    c.beginPath(); c.arc(0, -8, 9, Math.PI, 0); c.stroke();
    c.restore();
  } else if (e.acc === 'shovel') {
    // little spade resting over the shoulder
    c.save();
    c.translate(w * 0.30, -h * 0.86);
    c.rotate(-0.35);
    c.fillStyle = '#b07a42'; c.fillRect(-2, -30, 4, 30);
    c.beginPath();
    c.moveTo(-7, 0); c.lineTo(7, 0); c.lineTo(5, 12); c.lineTo(-5, 12); c.closePath();
    c.fillStyle = '#cfd6dd'; c.fill();
    c.strokeStyle = '#9aa3ad'; c.lineWidth = 1.4; c.stroke();
    c.restore();
  }
  c.restore();
}

function drawEnemy(c, e, t) {
  c.save();
  // squashed / stretched around the feet (used when an enemy is stomped)
  if (e.squash && e.squash !== 1) {
    const cx = e.x + e.w / 2, cy = e.y + e.h;
    c.translate(cx, cy);
    c.scale(1 / e.squash, e.squash);
    c.translate(-cx, -cy);
  }
  // if a sprite sheet was ever loaded for this character, use it instead
  if (Sprites.draw(c, e.type, e.anim, e.animT || 0, e.x, e.y, e.w, e.h, e.face < 0)) { c.restore(); return; }
  switch (e.type) {
    case 'puppy': drawPuppy(c, e, t); break;
    case 'bee': drawBee(c, e, t); break;
    case 'blackTurnip': drawTurnip(c, e, t); break;
    case 'redTurnip': drawTurnip(c, e, t); break;
    case 'monkey': drawMonkey(c, e, t); break;
    case 'sharky': drawSharky(c, e, t); break;
    default: drawPuppy(c, e, t);
  }
  c.restore();
}

function drawBoss(c, b, t) {
  c.save();
  if (Sprites.draw(c, b.type, b.anim, b.t || 0, b.x, b.y, b.w, b.h, b.face < 0)) { c.restore(); return; }
  switch (b.type) {
    case 'boomer': drawBoomer(c, b, t); break;
    case 'penguin': drawPenguin(c, b, t); break;
    case 'basketball': drawBasketball(c, b, t); break;
    case 'bear': drawBlueBear(c, b, t); break;
  }
  c.restore();
}

/* ------------------------- PROPS & SCENERY ------------------------ */
function drawProp(c, p, L, t) {
  const x = p.x, y = p.y != null ? p.y : L.groundY;
  c.save();
  c.translate(x, y);
  if (p.scale) c.scale(p.scale, p.scale);
  switch (p.type) {
    case 'bossStage': {
      drawBossStage(c, p, t);
      break;
    }
    case 'tree': {
      const col = p.kind === 'maple' ? ['#e0573f', '#c33f33', '#f08a4b']
                : p.kind === 'gold'  ? ['#f2b23e', '#e08f2a', '#ffd45e']
                : ['#6fae4a', '#4f8f38', '#8cc95c'];
      c.fillStyle = '#6b4a2f';
      fillRR(c, -9, -110, 18, 112, 5, '#6b4a2f');
      c.strokeStyle = '#57381f'; c.lineWidth = 3;
      c.beginPath(); c.moveTo(-6, -70); c.lineTo(-22, -96); c.stroke();
      circ(c, -18, -132, 34, col[1]);
      circ(c, 22, -126, 30, col[0]);
      circ(c, -22, -166, 27, col[2]);
      circ(c, 20, -168, 25, col[0]);
      circ(c, 0, -196, 26, col[2]);
      break;
    }
    case 'pine': {
      fillRR(c, -7, -60, 14, 62, 4, '#5a3f2b');
      for (let i = 0; i < 3; i++) {

   happily run it - that's how levels 2-4 plug straight in.           */

const THEMES = {
  fall: {
    skyTop: '#57b7f2', skyBottom: '#bfe8fb', sun: '#fff4c2',
    ground: ['#7a4f2a', '#5c3a1e'], grass: ['#7fc45a', '#4e9538'],
    far: '#a8c98c', mid: '#8fb96f', haze: '#d9edf5', music: 'fall'
  },
  ice: {
    skyTop: '#3f9fe0', skyBottom: '#cdeeff', sun: '#ffffff',
    ground: ['#dff1fb', '#a9cfdf'], grass: ['#f4fbff', '#cfe8f5'],
    far: '#a8c9dd', mid: '#c3dcea', haze: '#eaf7ff', music: 'ice'
  },
  city: {
    skyTop: '#5d6f92', skyBottom: '#93a6bf', sun: '#dfe9f5',
    ground: ['#59636f', '#3d454f'], grass: ['#7b8895', '#5d6a78'],
    far: '#7d90a8', mid: '#647689', haze: '#9fb2c6', music: 'city'
  },
  beach: {
    skyTop: '#3fb4ee', skyBottom: '#cdf0ff', sun: '#fff6c8',
    ground: ['#e8cf99', '#cfae74'], grass: ['#f6e3b4', '#e2c88f'],
    far: '#8ecfe0', mid: '#a9dced', haze: '#e7f8ff', music: 'beach'
  }
};

function newLevel(o) {
  const L = Object.assign({
    solids: [], pits: [], props: [], enemies: [], ladders: [], slides: [], spins: [],
    width: 6000, groundY: CFG.GROUND_Y, kind: 'ground'
  }, o);
  L.theme = THEMES[o.themeKey];
  seedBackdrop(L);
  return L;
}
function addGround(L, x0, x1, kind) {
  L.solids.push({ x: x0, y: L.groundY, w: x1 - x0, h: 300, kind: kind || L.kind });
}
function addPit(L, x0, x1, type) { L.pits.push({ x0, x1, type }); }
function addBlock(L, x, y, w, h, kind) { L.solids.push({ x, y, w, h, kind: kind || 'block' }); }
function enemy(type, x, extra) {
  const dims = {
    puppy: [46, 42], bee: [46, 38], blackTurnip: [42, 46], redTurnip: [42, 46],
    monkey: [50, 54], sharky: [56, 40]
  }[type] || [44, 44];
  return Object.assign({ type, x, y: 0, w: dims[0], h: dims[1], vx: 0, vy: 0, alive: true,
    face: -1, t: Math.random() * 6, onGround: false, hopping: false }, extra || {});
}

function seedBackdrop(L) {
  const rnd = mulberry32(1234 + L.width);
  L.bg = { clouds: [], far: [], mid: [], near: [], drift: [] };
  for (let i = 0; i < 16; i++) {
    L.bg.clouds.push({ x: rnd() * L.width * 0.8, y: 30 + rnd() * 190, s: 0.55 + rnd() * 0.85, sp: 4 + rnd() * 8 });
  }
  for (let i = 0; i < 26; i++) L.bg.far.push({ x: rnd() * L.width, h: 0.5 + rnd() * 0.8, s: 0.6 + rnd() * 0.8 });
  for (let i = 0; i < 22; i++) L.bg.mid.push({ x: rnd() * L.width, s: 0.7 + rnd() * 0.8, k: rnd() });
  for (let i = 0; i < 18; i++) L.bg.near.push({ x: rnd() * L.width, s: 0.6 + rnd() * 0.7 });
}

/* ---------------------- collision helpers ------------------------- */
function collide(e, dt, solids) {
  e.hitWall = false;
  // feet this close to a ledge top can climb over it instead of bonking
  const STEP_UP = 18;
  // thin platforms are "jump-through": you can rise through them from below
  const oneWay = s => s.h <= 30;
  const nearLedge = s => (e.y + e.h) - s.y < STEP_UP;
  e.x += e.vx * dt;
  for (const s of solids) {
    if (overlaps(e, s) && !oneWay(s) && !nearLedge(s)) {
      if (e.vx > 0) { e.x = s.x - e.w; e.hitWall = true; e.vx = 0; }
      else if (e.vx < 0) { e.x = s.x + s.w; e.hitWall = true; e.vx = 0; }
    }
  }
  if (e.x < 0) { e.x = 0; e.vx = 0; e.hitWall = true; }
  const maxX = game.level.width - e.w;
  if (e.x > maxX) { e.x = maxX; e.vx = 0; e.hitWall = true; }

  const wasGround = e.onGround;
  e.onGround = false;
  e.y += e.vy * dt;
  for (const s of solids) {
    if (overlaps(e, s)) {
      // while dropping through a thin platform, let it pass by completely
      if (oneWay(s) && e.dropT > 0) continue;
      if (oneWay(s) && e.vy < 0) continue;      // pass up through thin platforms
      if (nearLedge(s)) {
        // pop up onto the ledge (also makes hazard escapes forgiving)
        e.y = s.y - e.h; e.vy = 0; e.onGround = true;
      } else if (e.vy > 0) { e.y = s.y - e.h; e.vy = 0; e.onGround = true; }
      else if (e.vy < 0) { e.y = s.y + s.h; e.vy = 0; }
    }
  }
  e.justLanded = e.onGround && !wasGround;
}

function groundBelow(x, y, L) {
  return pointInSolid(L, x, y + 6) || pointInSolid(L, x, y + 30);
}

function slideAt(L, x) {
  for (const s of L.slides) {
    if (x > s.x && x < s.x + s.w) {
      const t = (x - s.x) / s.w;
      return { y: lerp(s.yTop, s.yBottom, t * t), s };
    }
  }
  return null;
}

/* ------------------------- part effects --------------------------- */
function burst(x, y, n, colors, opt) {
  const o = opt || {};
  for (let i = 0; i < n; i++) {
    const a = o.angle != null ? o.angle + rand(-0.7, 0.7) : rand(0, TAU);
    const sp = rand(o.min || 60, o.max || 260);
    game.particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up || 0),
      life: 0, max: rand(o.lifeMin || 0.35, o.lifeMax || 0.9),
      size: rand(o.sizeMin || 2, o.sizeMax || 6),
      color: colors[(Math.random() * colors.length) | 0],
      grav: o.grav != null ? o.grav : 900, kind: o.kind || 'dot', rot: rand(0, TAU)
    });
  }
}
function updateParticles(dt) {
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.life += dt;
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.rot += dt * 3;
    if (p.kind === 'confetti') p.vx *= 0.99;
    if (p.life >= p.max) game.particles.splice(i, 1);
  }
  for (let i = game.shockwaves.length - 1; i >= 0; i--) {
    const s = game.shockwaves[i];
    s.life += dt;
    s.x += s.dir * (s.spd || 520) * dt;
    // only hits Fin when his feet are actually on the arena floor -
    // standing on a platform above the wave must be safe
    const feetOnFloor = (player.y + player.h) > game.level.groundY - 10;
    if (Math.abs(s.x - (player.x + player.w / 2)) < 34 && player.onGround && feetOnFloor && !s.hit) {
      s.hit = true;
      hurt();
    }
    if (s.life > 0.9) game.shockwaves.splice(i, 1);
  }
  for (let i = game.coconuts.length - 1; i >= 0; i--) {
    const k = game.coconuts[i];
    k.life += dt;
    k.vy += 1400 * dt;
    k.y += k.vy * dt;
    k.rot += dt * 5;
    if (overlaps(k, player) && !player.dead) {
      hurt();
      game.coconuts.splice(i, 1);
      continue;
    }
    if (k.y > game.level.groundY - 8) {
      burst(k.x, game.level.groundY, 8, ['#8a5a2c', '#c99a5e'], { up: 180, lifeMax: 0.5 });
      game.coconuts.splice(i, 1);
    }
  }
}

function damagePlayer(amount) { hurt(); }

function hurt() {
  if (player.invuln > 0 || player.dead || game.state !== 'playing') return;
  game.hearts--;
  game.flash = 1;
  game.shake = 9;
  player.invuln = CFG.invuln;
  player.vy = -420;
  player.vx = -player.facing * 260;
  burst(player.x + player.w / 2, player.y + player.h / 2, 10, ['#ff8a8a', '#ffd0d0'], { up: 120 });
  Sound.sfx('hurt');
  if (game.hearts <= 0) killPlayer('hearts');
}

function killPlayer(reason) {
  if (game.state !== 'playing') return;
  game.deathReason = reason || 'fall';
  player.dead = true;
  game.state = 'dead';
  game.deadTimer = 0;
  game.shake = 14;
  Sound.sfx(reason === 'ice' ? 'freeze' : reason === 'water' || reason === 'puddle' ? 'splash' : 'hurt');
  burst(player.x + player.w / 2, player.y + player.h / 2, 22,
    reason === 'ice' ? ['#bfe9ff', '#ffffff', '#8fd4f2'] : ['#ffffff', '#ffd0d0'], { up: 150, max: 340, lifeMax: 1.1 });
}

/* ------------------------- player update -------------------------- */
function updatePlayer(dt) {
  const p = player, L = game.level;
  p.animT += dt;
  // the first time Fin is told to move, the level really begins
  if (!game.playerMoved && (Input.left || Input.right || Input.jumpPressed || Input.up || Input.down)) {
    game.playerMoved = true;
  }
  if (p.invuln > 0) p.invuln -= dt;
  if (p.escapeT > 0) p.escapeT -= dt;
  if (p.jumpBuf > 0) p.jumpBuf -= dt;
  if (p.coyoteT > 0) p.coyoteT -= dt;
  if (Input.jumpPressed) p.jumpBuf = CFG.jumpBuffer;

  // ---- ladders ----
  const lad = L.ladders.find(l =>
    p.x + p.w > l.x - 4 && p.x < l.x + l.w + 4 && p.y + p.h > l.yTop && p.y < l.yBottom);
  if (!p.climbing && lad && (Input.up || Input.down) && !p.onSlide) {
    p.climbing = true; p.vx = 0; p.vy = 0;
    p.x = lad.x + lad.w / 2 - p.w / 2;
  }
  if (p.climbing) {
    if (!lad) { p.climbing = false; }
    else {
      p.vx = 0; p.vy = 0;
      if (Input.up) p.y -= 210 * dt;
      if (Input.down) p.y += 210 * dt;
      p.facing = 1;
      p.anim = 'climb';
      if (p.y + p.h <= lad.yTop + 3) {
        p.y = lad.yTop - p.h;
        p.x = lad.x + lad.w + 10;
        p.climbing = false;
        p.onGround = true;
      }
      if (p.y > lad.yBottom - p.h) p.y = lad.yBottom - p.h;
      if (Input.jumpPressed) { p.climbing = false; p.vy = -520; }
      if (p.climbing) return;
    }
  }

  // ---- left / right with accel + friction ----
  const dir = (Input.right ? 1 : 0) - (Input.left ? 1 : 0);
  const onIce = L.kind === 'ice';
  const accel = onIce ? CFG.iceAccel : (p.onGround ? CFG.runAccel : CFG.airAccel);
  const fric = onIce ? CFG.iceFriction : CFG.friction;
  if (dir !== 0) {
    p.vx += dir * accel * dt;
    p.vx = clamp(p.vx, -CFG.runMax, CFG.runMax);
    p.facing = dir;
  } else {
    const drop = (p.onGround ? fric : CFG.airDrag) * dt;
    if (Math.abs(p.vx) <= drop) p.vx = 0;
    else p.vx -= Math.sign(p.vx) * drop;
  }

  // ---- jump (with coyote time + input buffer) ----
  if (p.jumpBuf > 0 && (p.onGround || p.coyoteT > 0)) {
    p.vy = CFG.jumpVel;
    p.jumpBuf = 0; p.coyoteT = 0; p.onGround = false;
    p.squash = 1.16;              // stretch tall as he leaves the ground
    Sound.sfx('jump');
    burst(p.x + p.w / 2, p.y + p.h, 6, ['#ffffff', '#e8e0d0'], { up: 30, max: 90, lifeMax: 0.35 });
  }
  // short hop when jump is released early
  if (!Input.jumpHeld && p.vy < -180 && !(p.escapeT > 0)) p.vy += CFG.gravity * 1.7 * dt;

  // ---- gravity ----
  p.vy += CFG.gravity * dt;
  p.vy = Math.min(p.vy, CFG.maxFall);

  // ---- move + collide ----
  const wasGround = p.onGround;
  const impact = p.vy;
  p.onGround = false;
  collide(p, dt, L.solids);

  // ---- landing thump ----
  // The most common thing that happens in a platformer should be felt:
  // squash Fin, kick up a little dust and play a soft thud.
  if (!wasGround && p.onGround && impact > 240) {
    const hard = clamp((impact - 240) / 650, 0, 1);
    p.squash = 0.88 - hard * 0.16;
    game.shake = Math.max(game.shake, 1 + hard * 3);
    const dust = L.kind === 'sand' ? ['#eadcb8', '#d9c79c']
      : L.kind === 'ice' ? ['#ffffff', '#d6efff']
      : L.kind === 'stone' ? ['#cfd6de', '#eef3f8']
      : ['#e6dcc6', '#f7f2e4'];
    burst(p.x + p.w / 2, p.y + p.h, 4 + Math.round(hard * 5), dust,
      { up: 26 + hard * 40, max: 60 + hard * 70, lifeMax: 0.34 });
    Sound.sfx('land');
  }

  // ---- drop through thin platforms ----
  // Holding DOWN while standing on a thin plank/awning lets Fin slip through
  // it. Without this, a thin platform he can jump up through is a one-way
  // trap he can never get back down from.
  if (p.dropT > 0) p.dropT -= dt;
  if (Input.down && p.onGround && !p.climbing && p.dropT <= 0) {
    const feet = p.y + p.h;
    const thin = L.solids.some(s => s.h <= 30 &&
      p.x + p.w > s.x + 2 && p.x < s.x + s.w - 2 &&
      Math.abs(feet - s.y) < 6);
    if (thin) {
      p.dropT = 0.22;   // long enough to clear the platform below him
      p.y += 3;
      p.vy = 60;
      p.onGround = false;
      p.coyoteT = 0;
    }
  }

  // ---- slides ----
  const sl = slideAt(L, p.x + p.w / 2);
  p.onSlide = false;
  if (sl) {
    const feet = p.y + p.h;
    if (feet > sl.y - 26 && feet < sl.y + 22 && p.vy >= -50) {
      p.y = sl.y - p.h;
      p.vy = 0;
      p.onGround = true;
      p.onSlide = true;
      // a slide is a downhill chute: it carries Fin with it whether or not
      // he holds a direction key, so the speed is set, not requested
      p.vx = Math.max(p.vx, 300);
      if (Math.random() < 0.35) burst(p.x + p.w / 2, p.y + p.h, 1, ['#ffe6a8'], { up: 20, max: 60, lifeMax: 0.3 });
    }
  }

  // ---- merry-go-round ride ----
  let riding = false;
  for (const sp of L.spins) {
    const feet = p.y + p.h;
    if (p.x + p.w > sp.x - sp.r && p.x < sp.x + sp.r && feet > sp.y - 14 && feet < sp.y + 16) {
      p.x += 130 * dt;
      p.rideT += dt;
      riding = true;
      p.spinA = (p.spinA + dt * 6.2) % TAU;   // he actually spins round
    }
  }
  if (!riding) p.spinA = p.spinA > 0.02 ? p.spinA * Math.max(0, 1 - dt * 6) : 0;

  // ---- spin / star pads ----
  p.squash += (1 - p.squash) * Math.min(1, dt * 12);
  if (p.onGround) p.coyoteT = CFG.coyote;

  // ---- animation state ----
  if (!p.onGround) p.anim = p.vy < 0 ? 'jump' : 'fall';
  else if (Math.abs(p.vx) > 25) p.anim = 'run';
  else p.anim = 'idle';

  // ---- hazards ----
  hazardCheck(dt);
}

function escapeDir(pit) {
  if (Input.left) return -1;
  if (Input.right) return 1;
  // no direction held: hop toward the closer bank
  const cx = player.x + player.w / 2;
  return cx < (pit.x0 + pit.x1) / 2 ? -1 : 1;
}

function hazardCheck(dt) {
  const p = player, L = game.level;
  if (p.y > L.groundY + 300) { killPlayer('fall'); return; }

  const cx = p.x + p.w / 2;
  const pit = L.pits.find(pt => cx > pt.x0 && cx < pt.x1);
  if (!pit) { p.sink = 0; p.frozen = 0; return; }
  // If Fin's feet are resting on real ground at the very edge of a pit, he is
  // safe - only count the hazard once he is actually over the hole.
  if (p.onGround && p.y + p.h <= L.groundY + 3) { p.sink = 0; p.frozen = 0; return; }

  const inGap = p.y + p.h > L.groundY - 4;
  if (!inGap) { p.sink = 0; return; }

  // first time Fin falls in anything, tell him how to get out
  if (!game.pitTip) {
    game.pitTip = true;
    game.toast = IS_TOUCH ? 'Tap ▲ fast to leap out!' : 'Press SPACE fast to leap out!';
    game.toastT = 2.4;
  }
  // the mud and water hold on to you: you cannot just power-walk across a pit
  const cap = pit.type === 'quicksand' ? 70 : pit.type === 'puddle' ? 110 : 130;
  p.vx = clamp(p.vx, -cap, cap);

  if (pit.type === 'quicksand') {
    p.sink += dt;
    if (p.vy > 32) p.vy = 32;          // slow, visible sinking
    if (p.vy < 0 && p.sink > 0.1) { p.sink = Math.max(0, p.sink - dt * 2); }
    // quicksand is slow, not a trap: a quick jump can still get you out
    if (Input.jumpPressed && p.sink > 0.04) {
      p.y = L.groundY - p.h - 2;          // push up out of the mud first
      p.vy = -820;
      p.vx = escapeDir(pit) * 340;
      p.escapeT = 0.38;
      p.sink = Math.max(0, p.sink - 0.45);
      p.jumpBuf = 0;
      Sound.sfx('jump');
      burst(p.x + p.w / 2, L.groundY + 12, 8, ['#e0c48c', '#f6e3b4'], { up: 90, max: 160, lifeMax: 0.4 });
    }
    if (Math.random() < 0.25) burst(p.x + p.w / 2, L.groundY + 18, 1, ['#e0c48c'], { up: -20, max: 40, lifeMax: 0.4, grav: -40 });
    if (p.sink > 2.0) killPlayer('sand');
  } else if (pit.type === 'water') {
    if (p.frozen <= 0) Sound.sfx('freeze');
    p.frozen += dt;
    if (p.vy > 40) p.vy = 40;
    if (p.vy > -100 && !(p.escapeT > 0)) p.vx *= 0.7;   // drag only while sinking
    // one desperate leap before the ice sets solid - any time while alive
    if (Input.jumpPressed) {
      p.y = L.groundY - p.h - 2;          // burst up through the surface
      p.vy = -900;
      p.vx = escapeDir(pit) * 390;
      p.frozen = 0.45;
      p.escapeT = 0.4;
      p.jumpBuf = 0;
      Sound.sfx('jump');
      burst(p.x + p.w / 2, L.groundY + 8, 10, ['#bdeaff', '#ffffff'], { up: 120, max: 200, lifeMax: 0.5 });
    }
    if (p.frozen > 0.85) killPlayer('ice');
  } else if (pit.type === 'puddle') {
    p.sink += dt;
    if (p.vy > 42) p.vy = 42;
    // water drag only while sinking - never while leaping out
    if (p.vy > -100 && !(p.escapeT > 0)) p.vx *= 0.86;
    if (p.vy < 0 && p.sink > 0.1) p.sink = Math.max(0, p.sink - dt * 2);
    // a puddle is only waist deep for a moment - jump fast and you get out
    if (Input.jumpPressed && p.sink > 0.04) {
      p.y = L.groundY - p.h - 2;          // push up out of the water first
      p.vy = -880;
      p.vx = escapeDir(pit) * 400;
      p.escapeT = 0.4;
      p.sink = Math.max(0, p.sink - 0.5);
      p.jumpBuf = 0;
      Sound.sfx('jump');
      burst(p.x + p.w / 2, L.groundY + 8, 10, ['#9fd8f0', '#dff4ff'], { up: 120, max: 200, lifeMax: 0.5 });
    }
    if (Math.random() < 0.2) burst(p.x + p.w / 2, L.groundY + 6, 1, ['#9fd8f0'], { up: 90, max: 120, lifeMax: 0.4 });
    if (p.sink > 1.0) killPlayer('puddle');
  }
  // keep Fin near the surface - he sinks visually instead of vanishing
  if (p.sink > 0) {
    p.y = Math.min(p.y, L.groundY - p.h + 2);
    p.sinkLimit = pit.type === 'quicksand' ? 2.0 : 1.0;
  }
}

/* ------------------------- enemy update --------------------------- */
function walkEnemy(e, dt, speed) {
  const L = game.level;
  e.vx = e.face * speed;
  e.vy += CFG.gravity * dt;
  e.vy = Math.min(e.vy, CFG.maxFall);
  collide(e, dt, L.solids);
  if (e.hitWall) e.face *= -1;
  if (e.onGround) {
    const ahead = e.face > 0 ? e.x + e.w + 3 : e.x - 3;
    if (!groundBelow(ahead, e.y + e.h, L)) e.face *= -1;
  }
}

function updateEnemies(dt) {
  const L = game.level;
  // a friendly grace period at the start of every level, so nobody can be
  // hurt while they read the controls hint. Enemies also stay asleep until
  // Fin first moves, so an idle player can never be hit.
  const grace = 7;
  const calming = !game.playerMoved || game.time - (game.levelStart || 0) < grace;
  for (const e of L.enemies) {
    if (!e.alive) { e.deadT = (e.deadT || 0) + dt; e.y += 260 * dt; e.t += dt; continue; }
    if (e.squash && Math.abs(e.squash - 1) > 0.01) e.squash += (1 - e.squash) * Math.min(1, dt * 9);
    else e.squash = 1;
    e.t += dt;
    if (calming) {
      e.vx = 0;
      // you can still stomp a sleepy enemy - it just can't hurt you yet
      if (!player.dead && overlaps(player, e)) {
        const stomping = player.vy > 40 && (player.y + player.h) < e.y + e.h * 0.55;
        if (stomping) stompEnemy(e);
      }
      continue;
    }

    switch (e.type) {
      case 'puppy': {
        walkEnemy(e, dt, 78 * CFG.enemySpeed);
        e.hopping = false;
        break;
      }
      case 'blackTurnip': {
        walkEnemy(e, dt, 62 * CFG.enemySpeed);
        break;
      }
      case 'redTurnip': {
        e.hopT = (e.hopT || 1.4) - dt;
        if (e.onGround && e.hopT <= 0) { e.vy = -420; e.hopT = 1.5; e.hopping = true; }
        walkEnemy(e, dt, 128 * CFG.enemySpeed);
        e.hopping = e.hopping && !e.onGround ? true : (e.onGround ? false : e.hopping);
        break;
      }
      case 'bee': {
        e.hoverT = (e.hoverT || 0) + dt;
        const target = player.x + player.w / 2;
        const dx = target - (e.x + e.w / 2);
        e.vx = clamp(dx * 0.5, -70, 70) * CFG.enemySpeed;
        e.x += e.vx * dt;
        e.y = (e.baseY || (e.baseY = e.y)) + Math.sin(e.t * 3.4) * 26;
        e.face = dx < 0 ? -1 : 1;
        break;
      }
      case 'monkey': {
        walkEnemy(e, dt, 70 * CFG.enemySpeed);
        e.hopT = (e.hopT || 1.6) - dt;
        if (e.onGround && e.hopT <= 0 && Math.abs(player.x - e.x) < 420) {
          e.vy = -560; e.vx = (player.x > e.x ? 1 : -1) * 120; e.hopT = 2.1;
        }
        break;
      }
      case 'sharky': {
        if (e.inWater === undefined) e.inWater = true;
        if (e.inWater) {
          e.x = e.home + Math.sin(e.t * 1.4) * 20;
          e.y = L.groundY + 24;
          e.jumpT = (e.jumpT || 1.2) - dt;
          if (e.jumpT <= 0 && Math.abs(player.x - e.home) < 300) {
            e.inWater = false;
            e.vy = -900;
            e.vx = (player.x > e.home ? 1 : -1) * 130;
            e.face = Math.sign(e.vx) || 1;
            e.jumpT = 2.2;
          }
        } else {
          e.vy += CFG.gravity * dt;
          e.x += e.vx * dt;
          e.y += e.vy * dt;
          if (e.y > L.groundY + 26) { e.inWater = true; e.vy = 0; e.y = L.groundY + 24; }
        }
        break;
      }
    }

    // keep enemies inside the level
    e.x = clamp(e.x, 0, L.width - e.w);

    // ---- player contact ----
    if (!player.dead && e.alive && overlaps(player, e)) {
      const stomping = player.vy > 40 && (player.y + player.h) < e.y + e.h * 0.55;
      if (stomping) stompEnemy(e);
      else if (!calming) hurt();   // harmless while everyone is still waking up
    }
  }
}

function stompEnemy(e) {
  e.alive = false;
  e.squash = 0.62;              // squashed flat, then springs back
  game.shake = 5;
  player.vy = Input.jumpHeld ? CFG.stompBounceHeld : CFG.stompBounce;
  player.squash = 0.8;
  Sound.sfx('stomp');
  burst(e.x + e.w / 2, e.y + e.h * 0.4, 10, ['#ffe08a', '#ffffff', '#ffb347'], { up: 120, max: 220, lifeMax: 0.6 });
  burst(e.x + e.w / 2, e.y + e.h * 0.8, 6, ['#c9b48a'], { up: 20, max: 90, lifeMax: 0.4 });
}

/* --------------------------- boss update -------------------------- */
function updateBoss(dt) {
  const L = game.level, b = L.boss;
  if (!b) return;
  if (b.hp <= 0) {
    b.deadT = (b.deadT || 0) + dt;
    if (b.deadT > 1.4 && !game.bossDefeated) {
      game.bossDefeated = true;
      game.clearTimer = 0;
      game.clearShown = false;
      Sound.sfx('win');
      Sound.play('win');
      confettiBurst();
      // the last boss rolls straight into the big finale, so "FIN WINS"
      // only ever appears once, at the real end of the adventure
      if (game.levelIndex >= LEVEL_BUILDERS.length - 1) {
        game.state = 'victory';
      } else {
        game.state = 'clear';
      }
    }
    return;
  }
  if (!b.active) {
    if (player.x > b.x - 700) {
      b.active = true;
      game.bossTip = 3.6;
      burst(b.x + b.w / 2, b.y + 10, 20, ['#ffffff', '#ffe08a'], { up: 200, max: 260, lifeMax: 0.7 });
      // shoo the regular enemies out of the duel arena: a boss fight should be
      // a clean one-on-one, not a puppy sneaking in for a free hit
      if (b.arena) {
        for (const e of L.enemies) {
          if (e.alive && e.x + e.w > b.arena.x0 - 30 && e.x < b.arena.x1 + 30) {
            e.alive = false;
            e.deadT = 0;
            burst(e.x + e.w / 2, e.y + e.h / 2, 6, ['#ffffff', '#ffe9b8'],
              { up: 60, max: 130, lifeMax: 0.4 });
          }
        }
      }
    } else return;
  }
  b.t += dt;
  b.face = player.x + player.w / 2 < b.x + b.w / 2 ? -1 : 1;
  b.stun = Math.max(0, (b.stun || 0) - dt);

  const speedScale = game.difficulty === 2 ? 1.25 : game.difficulty === 0 ? 0.8 : 1;
  // "last stand": on the final hit the boss gets a little faster and a little
  // pushier, so the third stomp feels different from the first. Easy mode keeps
  // the same speed and only gets the banner - it is the mode for learning.
  const last = b.hp === 1 && game.difficulty > 0;

  if (b.type === 'boomer' && b.stun <= 0) {
    const wasGrounded = b.onGround;
    b.landT = Math.max(0, (b.landT || 0) - dt);
    b.vy += CFG.gravity * dt;
    b.vy = Math.min(b.vy, CFG.maxFall);
    b.x += b.vx * dt;
    b.onGround = false;
    b.y += b.vy * dt;
    for (const s of L.solids) {
      if (overlaps(b, s)) {
        if (b.vy > 0) {
          b.y = s.y - b.h; b.vy = 0;
          b.onGround = true;
          // only stomp the ground once per landing (not every frame!)
          if (!wasGrounded) {
            game.shake = 8;
            b.landT = 0.2;    // drives the squash in drawBoomer
            burst(b.x + b.w / 2, b.y + b.h, 14, ['#e8d9b0', '#c9b48a'], { up: 120, max: 220 });
            game.shockwaves.push({ x: b.x + b.w / 2, y: L.groundY, dir: -1, life: 0, hit: false, spd: last ? 700 : 520 });
            game.shockwaves.push({ x: b.x + b.w / 2, y: L.groundY, dir: 1, life: 0, hit: false, spd: last ? 700 : 520 });
            Sound.sfx('land');
          }
        } else if (b.vy < 0) { b.y = s.y + s.h; b.vy = 0; }
      }
    }
    b.hopT = (b.hopT || 1.2) - dt;
    if (b.onGround && b.hopT <= 0) {
      b.vy = -700;
      b.vx = b.face * 190 * speedScale;
      b.hopT = last ? 1.2 : 1.9;      // last stand: he barely stops hopping
      Sound.sfx('jump');
    }
    if (b.onGround) b.vx *= 0.86;
    b.airborne = !b.onGround;
    b.x = clamp(b.x, 120, L.width - b.w - 40);

  } else if (b.type === 'penguin' && b.stun <= 0) {
    b.vy += CFG.gravity * dt;
    b.vx = b.face * (last ? 285 : 210) * speedScale;
    collide(b, dt, L.solids);
    if (b.hitWall) b.face *= -1;
    b.slideT = (b.slideT || 2.2) - dt;
    if (b.slideT <= 0) {
      b.vy = -620; b.slideT = last ? 1.7 : 2.6;
      game.shake = 4;
      Sound.sfx('jump');
    }

  } else if (b.type === 'basketball' && b.stun <= 0) {
    b.vy += CFG.gravity * 1.15 * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.onGround = false;
    for (const s of L.solids) {
      if (overlaps(b, s)) {
        if (b.vy > 0) {
          b.y = s.y - b.h; b.vy = -740; b.onGround = true;
          game.shake = 5;
          burst(b.x + b.w / 2, b.y + b.h, 8, ['#d8dee8'], { up: 80, max: 150, lifeMax: 0.4 });
        } else if (b.vy < 0) { b.y = s.y + s.h; b.vy = 0; }
      }
    }
    b.vx = b.face * (last ? 200 : 120) * speedScale;
    b.x = clamp(b.x, 120, L.width - b.w - 40);
    b.rot = (b.rot || 0) + (b.vx / b.w) * dt * 2.2;   // a bouncing ball should spin

  } else if (b.type === 'bear' && b.stun <= 0) {
    b.vy += CFG.gravity * dt;
    const dx = (player.x + player.w / 2) - (b.x + b.w / 2);
    // he closes in slowly, and a little faster once he is down to his last hit
    b.vx = Math.abs(dx) > 90 ? Math.sign(dx) * (last ? 118 : 88) * speedScale : 0;
    collide(b, dt, L.solids);
    if (b.hitWall) b.vx = 0;
    b.swatT = (b.swatT || 2.0) - dt;
    // rear back for a moment, then swat: the pose tells you when it's coming.
    // On the last hit the warning is shorter.
    const wind = last ? 0.30 : 0.45;
    b.swatWind = b.swatT > wind && b.swatT < 0.95 ? 1 - (b.swatT - wind) / (0.95 - wind) : 0;
    b.swatting = b.swatT < wind;
    if (b.swatT <= 0) { b.swatT = last ? 1.6 : 2.2; Sound.sfx('hurt'); }
    // remember the moment the swat ends so the arms can follow through
    if (b.swatting) b.wasSwat = true;
    else if (b.wasSwat) { b.wasSwat = false; b.swatFollow = 0.22; }
    b.swatFollow = Math.max(0, (b.swatFollow || 0) - dt);
    if (b.swatting && Math.abs(dx) < 150 && Math.abs((player.y + player.h) - (b.y + b.h)) < 130) {
      b.swatHit = b.swatHit || false;
      if (!b.swatHit) { hurt(); b.swatHit = true; }
    }
    if (!b.swatting) b.swatHit = false;
  }

  // keep every boss inside its arena so it can never fall into a pit
  const ar = b.arena || { x0: 120, x1: L.width - 40 };
  b.x = clamp(b.x, ar.x0, ar.x1 - b.w);
  if (b.y > L.groundY + 40) {

    b.x = clamp((ar.x0 + ar.x1) / 2 - b.w / 2, ar.x0, ar.x1 - b.w);
    b.y = L.groundY - b.h;
    b.vy = 0;
    b.stun = Math.max(b.stun || 0, 0.8);
    burst(b.x + b.w / 2, b.y + b.h, 12, ['#ffffff', '#ffe08a'], { up: 120 });
  }

  // ---- stomp the boss ----
  if (overlaps(player, b) && player.vy > 40 && (player.y + player.h) < b.y + b.h * 0.45) {
    b.hp--;
    b.stun = 1.0;
    b.vx = 0; b.vy = -180;
    game.shake = 12;
    game.flash = 0.6;
    player.vy = Input.jumpHeld ? CFG.stompBounceHeld : CFG.stompBounce;
    player.squash = 0.82;
    Sound.sfx('bossHit');
    burst(b.x + b.w / 2, b.y + 10, 16, ['#fff1a8', '#ffffff', '#ffb347'], { up: 160, max: 300, lifeMax: 0.8 });
    if (b.hp === 1) {
      // tell the player the fight just changed gear
      game.toast = 'ONE MORE HIT!';
      game.toastT = 2.0;
      game.shake = 16;
    }
    if (b.hp <= 0) {
      b.deadT = 0;
      game.shake = 20;
      burst(b.x + b.w / 2, b.y + b.h / 2, 40, ['#ffffff', '#ffe08a', '#ff9a5c', '#8fd4f2'], { up: 220, max: 480, lifeMax: 1.4 });
    }
  } else if (overlaps(player, b) && b.hp > 0 && !player.dead) {
    hurt();
  }
}

/* ------------------------- level extras --------------------------- */
function updateCoconuts(dt) {
  const L = game.level;
  if (L.themeKey !== 'beach') return;
  if (!L.palms) {
    L.palms = L.props.filter(p => p.type === 'palm' && p.coconut).map(p => ({ p, timer: rand(0.5, 3) }));
  }
  for (const item of L.palms) {
    item.timer -= dt;
    // warn the player only in the moment before a coconut lets go
    item.p.warn = item.timer > 0 && item.timer < 0.7 && Math.abs(player.x - item.p.x) < 260;
    if (item.timer <= 0) {
      item.timer = rand(2.4, 4.4);
      if (Math.abs(player.x - item.p.x) < 260) {
        game.coconuts.push({
          x: item.p.x + 30, y: L.groundY - 150, w: 22, h: 22,
          vy: 0, rot: 0, life: 0
        });
        Sound.sfx('select');
      }
    }
  }
}

function confettiBurst() {
  const cols = ['#ff5f7e', '#ffd166', '#5fd68a', '#5bb8ff', '#c084fc', '#ffffff'];
  for (let i = 0; i < 160; i++) {
    game.particles.push({
      x: rand(0, CFG.W), y: rand(-260, -10),
      vx: rand(-70, 70), vy: rand(50, 220),
      life: 0, max: rand(2.2, 4.2), size: rand(5, 11),
      color: cols[(Math.random() * cols.length) | 0],
      grav: 60, kind: 'confetti', rot: rand(0, TAU)
    });
  }
}

/* --------------------- collectible sun-stars ---------------------- */
/* One theme-flavoured collectible per level. Little rewards that make
   exploring worth it and teach players where the jumps are.          */
function buildPickups(L) {
  L.pickups = [];
  const type = { fall: 'leaf', ice: 'snow', city: 'star', beach: 'shell' }[L.themeKey] || 'star';
  const add = (x, y) => L.pickups.push({ x, y, r: 13, got: false, phase: Math.random() * 6, type });

  // one or two above each platform, not a carpet of them
  for (const s of L.solids) {
    if (s.kind === 'ground' || s.y === L.groundY) continue;
    if (s.w < 80) continue;
    const n = s.w > 220 ? 2 : 1;
    for (let i = 0; i < n; i++) {
      add(s.x + s.w * (i + 1) / (n + 1), s.y - 52);
    }
  }
  // a trail along the floor
  for (let x = 360; x < L.width - 200; x += 520) {
    if (L.pits.some(p => x > p.x0 - 40 && x < p.x1 + 40)) continue;
    add(x, L.groundY - 44);
  }
  // arcs over the gaps: rewards for brave jumps
  for (const p of L.pits) {
    const w = p.x1 - p.x0;
    for (let i = 0; i < 2; i++) {
      add(p.x0 + w * (i + 1) / 3, L.groundY - 120 - Math.sin((i + 1) / 3 * Math.PI) * 42);
    }
  }
  // a line of treats down every slide, so riding it is worth more than walking
  for (const s of L.slides) {
    for (let i = 1; i <= 4; i++) {
      const t = i / 5;
      const x = s.x + s.w * t;
      const y = s.yTop + (s.yBottom - s.yTop) * (t * t * 0.75 + t * 0.25);
      add(x, y - 34);
    }
  }
  // hand-placed rewards (a lookout deck, the end of a climb)
  for (const r of (L.rewardSpots || [])) {
    for (let i = 0; i < r.n; i++) add(r.x + i * (r.gap || 46), r.y);
  }
}

function updatePickups(dt) {
  const L = game.level;
  if (!L || !L.pickups) return;
  for (let i = 0; i < L.pickups.length; i++) {
    const p = L.pickups[i];
    if (p.got) continue;
    p.phase += dt * 2.4;
    const box = { x: p.x - 16, y: p.y - 16 - Math.sin(p.phase) * 4, w: 32, h: 32 };
    if (!player.dead && overlaps(player, box)) {
      p.got = true;
      const key = game.levelIndex + ':' + i;
      const fresh = !game.collectedKeys || !game.collectedKeys.has(key);
      if (fresh) {
        game.score++;
        game.levelScore++;
      }
      if (game.collectedKeys) game.collectedKeys.add(key);
      Sound.sfx('coin');
      burst(p.x, p.y, 8, ['#ffe08a', '#fff6c2', '#ffb347'], { up: 60, max: 160, lifeMax: 0.5 });
    }
  }
}

function drawPickup(c, p, L, t) {
  if (p.got) return;
  const y = p.y + Math.sin(p.phase) * 4;
  const pulse = 1 + Math.sin(p.phase * 1.5) * 0.06;
  c.save();
  c.translate(p.x, y);
  c.scale(pulse, pulse);
  c.drawImage(PICKUP_GLOW, -30, -30, 60, 60);

  if (p.type === 'leaf') {
    c.rotate(Math.sin(t * 0.8 + p.phase) * 0.35 - 0.3);
    c.beginPath();
    c.moveTo(0, 13);
    c.bezierCurveTo(-13, 4, -12, -10, 0, -13);
    c.bezierCurveTo(12, -10, 13, 4, 0, 13);
    c.closePath();
    c.fillStyle = '#ffb340'; c.fill();
    c.strokeStyle = '#fff3c9'; c.lineWidth = 2.6; c.stroke();
    c.strokeStyle = '#c96f18'; c.lineWidth = 2; c.lineCap = 'round';
    c.beginPath(); c.moveTo(0, 11); c.lineTo(0, -9); c.stroke();
    c.beginPath(); c.moveTo(0, 2); c.lineTo(-7, -4); c.moveTo(0, -3); c.lineTo(7, -8); c.stroke();
  } else if (p.type === 'snow') {
    c.rotate(t * 0.4 + p.phase);
    c.strokeStyle = '#8fdcff'; c.lineWidth = 5; c.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      const a = i * Math.PI / 3;
      c.beginPath();
      c.moveTo(Math.cos(a) * -12, Math.sin(a) * -12);
      c.lineTo(Math.cos(a) * 12, Math.sin(a) * 12);
      c.stroke();
    }
    c.strokeStyle = '#ffffff'; c.lineWidth = 2.6;
    for (let i = 0; i < 3; i++) {
      const a = i * Math.PI / 3;
      c.beginPath();
      c.moveTo(Math.cos(a) * -12, Math.sin(a) * -12);
      c.lineTo(Math.cos(a) * 12, Math.sin(a) * 12);
      c.stroke();
    }
    c.fillStyle = '#ffffff';
    c.beginPath(); c.arc(0, 0, 4, 0, TAU); c.fill();
  } else if (p.type === 'shell') {
    c.beginPath();
    c.arc(0, 5, 13, Math.PI, 0);
    c.closePath();
    // pink, not coral: the beach is warm sand, so a warm shell disappears.
    // A pink shell is a different hue family and still reads as a seashell.
    c.fillStyle = '#ff5f8a'; c.fill();
    c.strokeStyle = '#fff0dc'; c.lineWidth = 2.6; c.stroke();
    c.strokeStyle = '#c73f68'; c.lineWidth = 2;
    for (let i = -2; i <= 2; i++) {
      c.beginPath(); c.moveTo(0, 5); c.lineTo(i * 6, -7); c.stroke();
    }
    ell(c, -4, -1, 3, 2, -0.4, 'rgba(255,255,255,.85)');
  } else {
    c.rotate(Math.sin(t * 1.2 + p.phase) * 0.2);
    starPath(c, 0, 0, 14, 5, 0.46);
    c.fillStyle = '#ffd166'; c.fill();
    c.strokeStyle = '#fff3c9'; c.lineWidth = 2.4; c.stroke();
    c.strokeStyle = '#f0a72e'; c.lineWidth = 1.2; c.stroke();
  }
  c.restore();
}

/* --------------------------- camera ------------------------------- */
function updateCamera(dt) {
  const L = game.level;
  const target = clamp(player.x + player.w / 2 - CFG.W * 0.4, 0, Math.max(0, L.width - CFG.W));
  cam.x += (target - cam.x) * Math.min(1, dt * 5.5);
  game.shake *= Math.pow(0.001, dt);
  game.flash = Math.max(0, game.flash - dt * 2.4);
}

/* ---------------------------- update ------------------------------ */
function update(dt) {
  game.time += dt;
  if (Input.hit('mute')) {
    const m = Sound.toggleMute();
    game.toast = m ? 'MUTED' : 'SOUND ON';
    game.toastT = 1.8;
  }
  if (game.toastT > 0) game.toastT -= dt;
  if (game.bossTip > 0) game.bossTip -= dt;
  switch (game.state) {
    case 'title': updateTitle(dt); break;
    case 'playing': updatePlaying(dt); break;
    case 'paused':
      if (Input.hit('pause') || Input.hit('enter')) game.state = 'playing';
      if (Input.hit('restart')) resetLevel(game.levelIndex);
      if (Input.hit('quit')) { game.state = 'title'; Sound.play('menu'); }
      break;
    case 'dead':
      game.deadTimer += dt;
      updateParticles(dt);
      game.shake *= Math.pow(0.001, dt);
      if (game.deadTimer > 1.8) resetLevel(game.levelIndex);
      break;
    case 'clear':
      game.clearTimer += dt;
      updateParticles(dt);
      updateCamera(dt);
      if (player.onGround) player.vx *= 0.94;
      if (game.clearTimer > 0.8 && (Input.hit('enter') || Input.hit('jump'))) {
        nextLevel();
      }
      break;
    case 'victory':
      game.clearTimer += dt;
      updateParticles(dt);
      if (game.clearTimer > 1.0 && (Input.hit('enter') || Input.hit('jump'))) {
        game.state = 'title';
        Sound.play('menu');
      }
      break;
  }
  Input.clearPressed();
}

function updatePlaying(dt) {
  if (Input.hit('pause')) { game.state = 'paused'; return; }
  if (Input.hit('restart')) { resetLevel(game.levelIndex); return; }
  updatePlayer(dt);
  if (game.state !== 'playing') return;
  updateEnemies(dt);
  updateBoss(dt);
  updateCoconuts(dt);
  updatePickups(dt);
  updateParticles(dt);
  updateCamera(dt);
}

function nextLevel() {
  if (game.levelIndex < LEVEL_BUILDERS.length - 1) {
    game.unlocked = Math.max(game.unlocked, game.levelIndex + 2);
    Sound.sfx('unlock');
    resetLevel(game.levelIndex + 1);
  } else {
    game.state = 'victory';
    game.clearTimer = 0;
    confettiBurst();
    Sound.play('win');
  }
}

/* =========================== 10. RENDER =========================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const view = { scale: 1, ox: 0, oy: 0, dpr: 1 };

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = Math.max(320, Math.floor(innerWidth * dpr));
  const ch = Math.max(240, Math.floor(innerHeight * dpr));
  canvas.width = cw; canvas.height = ch;
  const s = Math.min(cw / CFG.W, ch / CFG.H);
  view.scale = s; view.ox = (cw - CFG.W * s) / 2; view.oy = (ch - CFG.H * s) / 2; view.dpr = dpr;
}
addEventListener('resize', resize);
resize();

function beginFrame() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0b1220';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(view.scale, 0, 0, view.scale, view.ox, view.oy);
  // keep every drawing inside the game's 1280x720 frame so nothing
  // spills into the black letterbox bars on oddly-shaped windows
  ctx.beginPath();
  ctx.rect(0, 0, CFG.W, CFG.H);
  ctx.clip();
}

function toLogical(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  const dx = (clientX - r.left) * (canvas.width / r.width);
  const dy = (clientY - r.top) * (canvas.height / r.height);
  return { x: (dx - view.ox) / view.scale, y: (dy - view.oy) / view.scale };
}

/* ----------------------------- sky -------------------------------- */
function drawSky(L) {
  const th = L.theme;
  const g = ctx.createLinearGradient(0, 0, 0, CFG.GROUND_Y + 40);
  g.addColorStop(0, th.skyTop); g.addColorStop(1, th.skyBottom);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, CFG.W, CFG.H);

  // sun glow
  const sx = 1010 - cam.x * 0.03, sy = 130;
  const dim = L.themeKey === 'city' ? 0.22 : 0.95;
  const sg = ctx.createRadialGradient(sx, sy, 10, sx, sy, 220);
  sg.addColorStop(0, 'rgba(255,255,240,' + (0.95 * dim) + ')');
  sg.addColorStop(0.25, 'rgba(255,245,200,' + (0.55 * dim) + ')');
  sg.addColorStop(1, 'rgba(255,245,200,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(sx, sy, 220, 0, TAU); ctx.fill();
  ctx.globalAlpha = L.themeKey === 'city' ? 0.32 : 1;
  circ(ctx, sx, sy, 52, th.sun);
  ctx.globalAlpha = 1;

  // friendly clouds
  for (const c of L.bg.clouds) {
    const x = ((c.x - cam.x * 0.12) % (CFG.W + 420) + CFG.W + 420) % (CFG.W + 420) - 210;
    drawCloud(ctx, x, c.y + Math.sin(game.time * 0.4 + c.x) * 4, c.s * 1.1);
  }
}

function drawCloud(c, x, y, s) {
  c.save();
  c.translate(x, y); c.scale(s, s);
  c.fillStyle = 'rgba(255,255,255,.92)';
  ell(c, 0, 0, 46, 22, 0, 'rgba(255,255,255,.92)');
  circ(c, -34, 2, 20, 'rgba(255,255,255,.92)');
  circ(c, 30, 3, 22, 'rgba(255,255,255,.92)');
  circ(c, -6, -16, 26, 'rgba(255,255,255,.95)');
  circ(c, 20, -10, 20, 'rgba(255,255,255,.95)');
  c.restore();
}

/* --------------------------- parallax ----------------------------- */
function drawBackdrop(L) {
  const th = L.theme;
  const y0 = 470;

  if (L.themeKey === 'fall') {
    // far field band so there is no empty sky strip above the ground
    ctx.fillStyle = '#c3ddab';
    ctx.fillRect(0, 430, CFG.W, 240);
    for (let i = 0; i < 7; i++) {
      const x = ((i * 420 - cam.x * 0.18) % (CFG.W + 800) + CFG.W + 800) % (CFG.W + 800) - 400;
      ctx.fillStyle = 'rgba(160,200,140,.75)';
      ctx.beginPath();
      ctx.ellipse(x, 585, 320, 165, 0, 0, TAU);
      ctx.fill();
    }
    for (let i = 0; i < 6; i++) {
      const x = ((i * 330 - cam.x * 0.30) % (CFG.W + 700) + CFG.W + 700) % (CFG.W + 700) - 350;
      ctx.fillStyle = 'rgba(126,176,112,.9)';
      ctx.beginPath();
      ctx.ellipse(x, 630, 250, 140, 0, 0, TAU);
      ctx.fill();
    }
  }

  if (L.themeKey === 'beach') {
    // sea horizon, then a far sand bar
    const sg = ctx.createLinearGradient(0, 496, 0, 620);
    sg.addColorStop(0, '#63c9e6'); sg.addColorStop(1, '#2e93b8');
    ctx.fillStyle = sg;
    ctx.fillRect(0, 496, CFG.W, 130);
    // sparkles
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    for (let i = 0; i < 26; i++) {
      const x = ((i * 97 + game.time * 18) % (CFG.W + 100)) - 50;
      ctx.fillRect(x, 512 + Math.sin(game.time * 2 + i) * 6, 16, 2);
    }
    for (let i = 0; i < 5; i++) {
      const x = ((i * 780 - cam.x * 0.15) % (CFG.W + 900) + CFG.W + 900) % (CFG.W + 900) - 450;
      ctx.fillStyle = '#8fd9c8';
      ctx.beginPath();
      ctx.ellipse(x, 500, 130, 22, 0, Math.PI, 0);
      ctx.fill();
    }
    ctx.fillStyle = '#eddcb4';
    ctx.fillRect(0, 586, CFG.W, 40);
  }

  if (L.themeKey === 'ice') {
    ctx.fillStyle = '#dceffa';
    ctx.fillRect(0, 520, CFG.W, 160);
    // big mountains
    for (let i = 0; i < 8; i++) {
      const bx = ((i * 380 - cam.x * 0.16) % (CFG.W + 760) + CFG.W + 760) % (CFG.W + 760) - 380;
      const h = 220 + (i % 3) * 60;
      ctx.beginPath();
      ctx.moveTo(bx - 210, y0 + 40);
      ctx.lineTo(bx, y0 + 40 - h);
      ctx.lineTo(bx + 210, y0 + 40);
      ctx.closePath();
      ctx.fillStyle = 'rgba(176,205,224,.9)';
      ctx.fill();
      // snow cap
      ctx.beginPath();
      ctx.moveTo(bx, y0 + 40 - h);
      ctx.lineTo(bx + 62, y0 + 40 - h * 0.68);
      ctx.lineTo(bx + 22, y0 + 40 - h * 0.62);
      ctx.lineTo(bx - 20, y0 + 40 - h * 0.70);
      ctx.lineTo(bx - 62, y0 + 40 - h * 0.66);
      ctx.closePath();
      ctx.fillStyle = '#f2fbff';
      ctx.fill();
    }
    for (let i = 0; i < 9; i++) {
      const bx = ((i * 300 - cam.x * 0.32) % (CFG.W + 600) + CFG.W + 600) % (CFG.W + 600) - 300;
      ctx.fillStyle = 'rgba(226,244,253,.95)';
      ctx.beginPath();
      ctx.ellipse(bx, 620, 210, 120, 0, 0, TAU);
      ctx.fill();
    }
  }

  if (L.themeKey === 'city') {
    // hazy street band behind the skyline
    ctx.fillStyle = '#6c7d92';
    ctx.fillRect(0, 520, CFG.W, 140);
    // far skyline
    for (let i = 0; i < 14; i++) {
      const bx = ((i * 210 - cam.x * 0.16) % (CFG.W + 420) + CFG.W + 420) % (CFG.W + 420) - 210;
      const h = 190 + ((i * 53) % 150);
      drawBuilding(ctx, bx, 640, h, 150, 'rgba(110,130,155,.55)');
    }
    for (let i = 0; i < 10; i++) {
      const bx = ((i * 300 - cam.x * 0.32) % (CFG.W + 600) + CFG.W + 600) % (CFG.W + 600) - 300;
      const h = 230 + ((i * 77) % 170);
      // six different rooftops so the near skyline never repeats the same box
      drawCityTower(ctx, bx, 655, h, 190, 'rgba(88,105,128,.85)', i % 6, i);
    }
    // wet street sheen
    ctx.fillStyle = 'rgba(255,255,255,.07)';
    ctx.fillRect(0, 560, CFG.W, 70);
  }
}

function drawBuilding(c, x, baseY, h, w, color) {
  c.fillStyle = color;
  c.fillRect(x - w / 2, baseY - h, w, h);
  // every window in one fill call
  c.fillStyle = 'rgba(255,235,170,.28)';
  c.beginPath();
  for (let y = baseY - h + 24; y < baseY - 20; y += 32) {
    for (let xx = x - w / 2 + 14; xx < x + w / 2 - 20; xx += 30) {
      c.rect(xx, y, 14, 16);
    }
  }
  c.fill();
}

// Near-skyline buildings get six different rooftops, so the city does not
// look like the same box copied ten times along the street.
function drawCityTower(c, x, baseY, h, w, color, variant, seed) {
  const left = x - w / 2;
  c.fillStyle = color;
  c.fillRect(left, baseY - h, w, h);

  // --- glass tower: tall lit stripes instead of square windows ---
  if (variant === 2) {
    const g = c.createLinearGradient(left, 0, left + w, 0);
    g.addColorStop(0, 'rgba(150,185,215,.30)');
    g.addColorStop(0.5, 'rgba(180,210,235,.26)');
    g.addColorStop(1, 'rgba(130,165,200,.22)');
    c.fillStyle = g;
    c.fillRect(left + 8, baseY - h + 18, w - 16, h - 44);
    // thin mullions instead of window squares, so it reads as glass
    c.strokeStyle = 'rgba(200,225,245,.22)';
    c.lineWidth = 1;
    c.beginPath();
    for (let xx = left + 22; xx < left + w - 10; xx += 24) {
      c.moveTo(xx, baseY - h + 18); c.lineTo(xx, baseY - 26);
    }
    c.stroke();
    c.fillStyle = 'rgba(255,240,190,.20)';
    for (let y = baseY - h + 26; y < baseY - 26; y += 18) {
      for (let xx = left + 14; xx < left + w - 14; xx += 22) c.fillRect(xx, y, 10, 10);
    }
    // roof cap
    c.fillStyle = color;
    c.fillRect(left + w * 0.2, baseY - h - 10, w * 0.6, 10);
    return;
  }

  // --- normal window grid, shared by the other five ---
  c.fillStyle = 'rgba(255,235,170,.28)';
  c.beginPath();
  for (let y = baseY - h + 24; y < baseY - 20; y += 32) {
    for (let xx = left + 14; xx < left + w - 20; xx += 30) c.rect(xx, y, 14, 16);
  }
  c.fill();

  if (variant === 0) {
    // rooftop billboard with a gently flickering sign
    c.fillStyle = color;
    c.fillRect(left + w * 0.28, baseY - h - 34, 6, 34);
    c.fillRect(left + w * 0.62, baseY - h - 34, 6, 34);
    fillRR(c, left + w * 0.16, baseY - h - 66, w * 0.68, 36, 4, 'rgba(40,55,75,.95)');
    c.fillStyle = 'rgba(255,214,120,' + (0.55 + Math.sin(game.time * 1.6 + seed) * 0.12) + ')';
    c.fillRect(left + w * 0.20, baseY - h - 60, w * 0.60, 8);
    c.fillStyle = 'rgba(150,230,255,.45)';
    c.fillRect(left + w * 0.20, baseY - h - 46, w * 0.40, 6);
  } else if (variant === 1) {
    // scaffolding strapped to the side
    c.strokeStyle = 'rgba(210,225,240,.35)';
    c.lineWidth = 2;
    c.beginPath();
    for (let y = baseY - h + 40; y < baseY - 40; y += 34) {
      c.moveTo(left + 4, y); c.lineTo(left + w - 4, y);
    }
    c.moveTo(left + w * 0.5, baseY - h + 30); c.lineTo(left + w * 0.5, baseY - 40);
    c.stroke();
  } else if (variant === 3) {
    // street-level shop with a warm window and a striped awning
    c.fillStyle = 'rgba(255,196,110,.22)';
    c.fillRect(left + 6, baseY - 78, w - 12, 58);
    for (let i = 0; i < 5; i++) {
      c.fillStyle = i % 2 ? 'rgba(240,240,245,.65)' : 'rgba(214,88,96,.75)';
      c.fillRect(left + 4 + i * ((w - 8) / 5), baseY - 96, (w - 8) / 5, 12);
    }
  } else if (variant === 4) {
    // water tower on the roof
    c.fillStyle = 'rgba(60,75,95,.9)';
    c.fillRect(left + w * 0.30, baseY - h - 26, w * 0.40, 22);
    c.beginPath();
    c.moveTo(left + w * 0.28, baseY - h - 26);
    c.lineTo(left + w * 0.50, baseY - h - 42);
    c.lineTo(left + w * 0.72, baseY - h - 26);
    c.closePath();
    c.fill();
  } else if (variant === 5) {
    // antenna with a blinking red light
    c.fillStyle = 'rgba(60,75,95,.9)';
    c.fillRect(left + w * 0.5 - 2, baseY - h - 46, 4, 46);
    c.fillStyle = 'rgba(255,120,110,' + (0.45 + Math.sin(game.time * 3 + seed) * 0.35) + ')';
    c.beginPath(); c.arc(left + w * 0.5, baseY - h - 48, 4, 0, TAU); c.fill();
  }
}

/* --------------------------- world art ---------------------------- */
function drawPitContents(L, pit) {
  const gY = L.groundY;
  const w = pit.x1 - pit.x0;
  if (pit.type === 'water') {
    const frozen = L.themeKey === 'ice';
    const g = ctx.createLinearGradient(0, gY, 0, gY + 150);
    // deliberately deeper and darker than any ice platform, so a hole in the
    // floor never reads as a block you can stand on
    if (frozen) { g.addColorStop(0, '#5fb6e0'); g.addColorStop(0.35, '#2a7aa6'); g.addColorStop(1, '#0d3450'); }
    else { g.addColorStop(0, '#4fa8c8'); g.addColorStop(1, '#1c5a78'); }
    ctx.fillStyle = g;
    ctx.fillRect(pit.x0, gY + 6, w, 200);
    // surface waves
    ctx.strokeStyle = 'rgba(255,255,255,.6)';
    ctx.lineWidth = 3;
    for (let k = 0; k < 2; k++) {
      ctx.beginPath();
      for (let x = pit.x0; x <= pit.x1; x += 8) {
        const y = gY + 12 + k * 9 + Math.sin(x * 0.06 + game.time * 2 + k) * 4;
        x === pit.x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    // icy rim on both sides
    if (frozen) {
      fillRR(ctx, pit.x0 - 6, gY - 6, 20, 20, 7, 'rgba(245,253,255,.95)');
      fillRR(ctx, pit.x1 - 14, gY - 6, 20, 20, 7, 'rgba(245,253,255,.95)');
      ctx.fillStyle = 'rgba(240,252,255,.75)';
      ctx.beginPath();
      ctx.moveTo(pit.x0 + 14, gY + 12);
      ctx.lineTo(pit.x0 + 54, gY + 6);
      ctx.lineTo(pit.x0 + 40, gY + 26);
      ctx.closePath(); ctx.fill();
    }
  } else if (pit.type === 'puddle') {
    const g = ctx.createLinearGradient(0, gY, 0, gY + 90);
    g.addColorStop(0, '#7fa4b8'); g.addColorStop(1, '#3a5266');
    ctx.fillStyle = g;
    ctx.fillRect(pit.x0, gY + 8, w, 120);
    // dark rim so the puddle reads as a hole, not just wet ground
    const pl = ctx.createLinearGradient(pit.x0, 0, pit.x0 + 14, 0);
    pl.addColorStop(0, 'rgba(15,24,34,.5)'); pl.addColorStop(1, 'rgba(15,24,34,0)');
    ctx.fillStyle = pl;
    ctx.fillRect(pit.x0, gY + 8, 14, 120);
    const pr = ctx.createLinearGradient(pit.x1 - 14, 0, pit.x1, 0);
    pr.addColorStop(0, 'rgba(15,24,34,0)'); pr.addColorStop(1, 'rgba(15,24,34,.5)');
    ctx.fillStyle = pr;
    ctx.fillRect(pit.x1 - 14, gY + 8, 14, 120);
    ctx.fillStyle = 'rgba(190,225,245,.35)';
    ctx.fillRect(pit.x0 + 2, gY + 8, w - 4, 3);
    ctx.strokeStyle = 'rgba(200,230,245,.5)';
    ctx.lineWidth = 2;
    for (let k = 0; k < 3; k++) {
      const rx = pit.x0 + 20 + k * 40;
      ctx.beginPath();
      ctx.ellipse(rx, gY + 22 + Math.sin(game.time * 2 + k) * 3, 26, 6, 0, 0, TAU);
      ctx.stroke();
    }
    // pale sky reflection so puddles read as water, not black holes
    ctx.fillStyle = 'rgba(215,238,252,.18)';
    ctx.fillRect(pit.x0 + 10, gY + 34, w - 20, 6);
    ctx.fillRect(pit.x0 + 26, gY + 52, w - 52, 3);
    // rain splashes
    if (Math.random() < 0.25) {
      const sx = pit.x0 + Math.random() * w;
      ctx.strokeStyle = 'rgba(220,245,255,.8)';
      ctx.beginPath();
      ctx.ellipse(sx, gY + 14, 8, 2.5, 0, 0, TAU);
      ctx.stroke();
    }
  } else if (pit.type === 'quicksand') {
    const g = ctx.createLinearGradient(0, gY, 0, gY + 130);
    g.addColorStop(0, '#c9a86b'); g.addColorStop(1, '#8a6631');
    ctx.fillStyle = g;
    ctx.fillRect(pit.x0, gY + 6, w, 150);
    // dark rim + sunken lip so it reads as a hole full of sand
    const ql = ctx.createLinearGradient(pit.x0, 0, pit.x0 + 18, 0);
    ql.addColorStop(0, 'rgba(84,58,20,.72)'); ql.addColorStop(1, 'rgba(84,58,20,0)');
    ctx.fillStyle = ql;
    ctx.fillRect(pit.x0, gY + 6, 18, 150);
    const qr = ctx.createLinearGradient(pit.x1 - 18, 0, pit.x1, 0);
    qr.addColorStop(0, 'rgba(84,58,20,0)'); qr.addColorStop(1, 'rgba(84,58,20,.72)');
    ctx.fillStyle = qr;
    ctx.fillRect(pit.x1 - 18, gY + 6, 18, 150);
    // wavy edge line so the drop is obvious, not just a colour change
    ctx.strokeStyle = 'rgba(80,55,20,.8)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    for (let x = pit.x0; x <= pit.x1; x += 8) {
      const y = gY + 8 + Math.sin(x * 0.07) * 3;
      x === pit.x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.fillStyle = 'rgba(70,48,16,.5)';
    ctx.fillRect(pit.x0 + 4, gY + 6, w - 8, 6);
    // slow swirls
    ctx.strokeStyle = 'rgba(160,120,60,.55)';
    ctx.lineWidth = 3;
    for (let k = 0; k < 2; k++) {
      ctx.beginPath();
      for (let x = pit.x0; x <= pit.x1; x += 10) {
        const y = gY + 22 + k * 12 + Math.sin(x * 0.08 + game.time * 1.4 + k) * 5;
        x === pit.x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    // bubbles
    for (let k = 0; k < 3; k++) {
      const bx = pit.x0 + ((k * 47 + game.time * 22) % w);
      const by = gY + 34 + Math.sin(game.time * 2 + k) * 6;
      ctx.strokeStyle = 'rgba(255,255,255,.45)';
      ctx.beginPath(); ctx.arc(bx, by, 5 + k, 0, TAU); ctx.stroke();
    }
  } else {
    // void / gap: a deep drop with rocky walls and a foggy bottom
    const g = ctx.createLinearGradient(0, gY, 0, gY + 260);
    g.addColorStop(0, '#241a10');
    g.addColorStop(0.28, '#170f08');
    g.addColorStop(0.7, '#0d0805');
    g.addColorStop(1, '#050302');
    ctx.fillStyle = g;
    ctx.fillRect(pit.x0, gY + 2, w, 260);
    // rocky ledge shadows just under the ground edges
    const lsh = ctx.createLinearGradient(pit.x0, 0, pit.x0 + 26, 0);
    lsh.addColorStop(0, 'rgba(0,0,0,.55)'); lsh.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = lsh;
    ctx.fillRect(pit.x0, gY + 2, 26, 260);
    const rsh = ctx.createLinearGradient(pit.x1 - 26, 0, pit.x1, 0);
    rsh.addColorStop(0, 'rgba(0,0,0,0)'); rsh.addColorStop(1, 'rgba(0,0,0,.55)');
    ctx.fillStyle = rsh;
    ctx.fillRect(pit.x1 - 26, gY + 2, 26, 260);
    // rocky strata - chunky stone bands, not wavy water lines
    ctx.fillStyle = 'rgba(160,124,78,.10)';
    for (let k = 0; k < 4; k++) {
      const yy = gY + 34 + k * 52;
      ctx.beginPath();
      for (let x = pit.x0 + 4; x <= pit.x1 - 4; x += 12) {
        const y = yy + Math.sin(x * 0.09 + k) * 5;
        x === pit.x0 + 4 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      for (let x = pit.x1 - 4; x >= pit.x0 + 4; x -= 12) {
        const y = yy + 14 + Math.sin(x * 0.07 + k * 2) * 4;
        ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
    }
    // dark haze at the very bottom
    const fog = ctx.createLinearGradient(0, gY + 150, 0, gY + 262);
    fog.addColorStop(0, 'rgba(8,12,20,0)');
    fog.addColorStop(1, 'rgba(6,9,16,.55)');
    ctx.fillStyle = fog;
    ctx.fillRect(pit.x0, gY + 150, w, 112);
    // dark inner lip so the gap reads as a hole, not a pool
    ctx.fillStyle = 'rgba(4,8,14,.7)';
    ctx.fillRect(pit.x0, gY + 2, w, 5);
    // a scruffy grass fringe overhanging the edge, so the hole belongs to the meadow
    ctx.fillStyle = 'rgba(96,142,64,.95)';
    for (let x = pit.x0; x < pit.x1; x += 9) {
      const hh = 2 + (Math.sin(x * 0.8) + 1) * 1.6;
      ctx.fillRect(x, gY - 1, 9, hh);
    }
  }
}

function drawSolid(L, s) {
  const th = L.theme;
  if (s.kind === 'awning') {
    // a striped shop awning: a real place you can stand on, not another slab
    fillRR(ctx, s.x, s.y, s.w, s.h, 5, '#dfe7ef');
    const stripe = 18;
    for (let i = 0; i * stripe < s.w; i++) {
      ctx.fillStyle = i % 2 ? 'rgba(226,86,96,.95)' : 'rgba(250,252,255,.98)';
      ctx.fillRect(s.x + i * stripe, s.y, Math.min(stripe, s.w - i * stripe), 9);
    }
    // scalloped hem
    ctx.fillStyle = 'rgba(226,86,96,.9)';
    for (let x = s.x; x < s.x + s.w - 4; x += stripe * 2) {
      ctx.beginPath();
      ctx.arc(x + stripe, s.y + 9, stripe * 0.5, 0, Math.PI);
      ctx.fill();
    }
    // little support poles down to the street
    ctx.strokeStyle = 'rgba(70,86,104,.75)'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(s.x + 8, s.y + s.h); ctx.lineTo(s.x + 8, L.groundY);
    ctx.moveTo(s.x + s.w - 8, s.y + s.h); ctx.lineTo(s.x + s.w - 8, L.groundY);
    ctx.stroke();
    return;
  }
  if (s.kind === 'wood') {
    fillRR(ctx, s.x, s.y, s.w, s.h, 6, '#a9733c');
    fillRR(ctx, s.x + 2, s.y + 2, s.w - 4, 6, 3, '#c98f52');
    ctx.strokeStyle = 'rgba(90,55,25,.4)'; ctx.lineWidth = 2;
    for (let x = s.x + 22; x < s.x + s.w; x += 34) {
      ctx.beginPath(); ctx.moveTo(x, s.y + 4); ctx.lineTo(x, s.y + s.h - 2); ctx.stroke();
    }
    return;
  }
  if (s.kind === 'ice') {
    const g = ctx.createLinearGradient(0, s.y, 0, s.y + 70);
    g.addColorStop(0, '#e6f5fe'); g.addColorStop(0.4, '#9cc9dd'); g.addColorStop(1, '#5f93ac');
    ctx.fillStyle = g;
    ctx.fillRect(s.x, s.y, s.w, Math.min(s.h, 300));
    ctx.fillStyle = '#4a7f97';
    ctx.fillRect(s.x, s.y + 70, s.w, Math.min(s.h - 70, 300));
    // a dark outline all the way round, so an ice block never melts into the
    // frozen lake behind it - the platform edge has to be obvious at a glance
    ctx.strokeStyle = 'rgba(38,72,94,.55)';
    ctx.lineWidth = 3;
    ctx.strokeRect(s.x + 1.5, s.y + 1.5, s.w - 3, Math.min(s.h, 300) - 3);
    // fluffy snow cap with a wavy bottom edge
    ctx.beginPath();
    ctx.moveTo(s.x, s.y - 2);
    for (let x = s.x; x <= s.x + s.w; x += 22) {
      ctx.quadraticCurveTo(x + 11, s.y + 10, x + 22, s.y + 1);
    }
    ctx.lineTo(s.x + s.w, s.y - 8);
    ctx.lineTo(s.x, s.y - 8);
    ctx.closePath();
    ctx.fillStyle = '#f7fdff';
    ctx.fill();
    // crisp white highlight along the very top edge
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(s.x + 2, s.y - 2, s.w - 4, 3);
    // blue shadow under the snow
    ctx.fillStyle = 'rgba(120,175,205,.45)';
    ctx.fillRect(s.x, s.y + 12, s.w, 5);
    // cracks + sparkle
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2;
    for (let x = s.x + 30; x < s.x + s.w; x += 70) {
      ctx.beginPath(); ctx.moveTo(x, s.y + 20); ctx.lineTo(x + 20, s.y + 52); ctx.stroke();
    }
    const rnd = mulberry32((s.x | 0) + 7);
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    for (let i = 0; i < s.w / 40; i++) {
      ctx.fillRect(s.x + rnd() * s.w, s.y + 16 + rnd() * 14, 3, 3);
    }
    return;
  }
  if (s.kind === 'stone') {
    ctx.fillStyle = '#4c5661';
    ctx.fillRect(s.x, s.y, s.w, Math.min(s.h, 300));
    ctx.fillStyle = '#5d6875';
    ctx.fillRect(s.x, s.y, s.w, 12);
    // pavement slabs on top
    ctx.fillStyle = '#78838f';
    for (let x = s.x; x < s.x + s.w; x += 46) {
      ctx.fillRect(x + 2, s.y, 42, 10);
    }
    ctx.strokeStyle = 'rgba(30,36,44,.45)'; ctx.lineWidth = 2;
    for (let y = s.y + 30; y < s.y + Math.min(s.h, 200); y += 30) {
      ctx.beginPath(); ctx.moveTo(s.x, y); ctx.lineTo(s.x + s.w, y); ctx.stroke();
    }
    for (let x = s.x + 40; x < s.x + s.w; x += 60) {
      ctx.beginPath(); ctx.moveTo(x, s.y + 14); ctx.lineTo(x, s.y + 28); ctx.stroke();
    }
    return;
  }
  if (s.kind === 'sand') {
    const g = ctx.createLinearGradient(0, s.y, 0, s.y + 120);
    g.addColorStop(0, '#f3dfae'); g.addColorStop(1, '#c9a468');
    ctx.fillStyle = g;
    ctx.fillRect(s.x, s.y, s.w, Math.min(s.h, 300));
    ctx.fillStyle = '#f8ecc6';
    ctx.fillRect(s.x, s.y, s.w, 10);
    // speckles
    const rnd = mulberry32(s.x | 0);
    ctx.fillStyle = 'rgba(160,130,80,.35)';
    for (let i = 0; i < s.w / 12; i++) {
      ctx.fillRect(s.x + rnd() * s.w, s.y + 12 + rnd() * 90, 2, 2);
    }
    // wind ripples so the sand is not a flat slab
    ctx.strokeStyle = 'rgba(180,148,95,.30)';
    ctx.lineWidth = 2;
    for (let k = 0; k < 3; k++) {
      ctx.beginPath();
      for (let x = s.x; x <= s.x + s.w; x += 18) {
        const y = s.y + 36 + k * 34 + Math.sin((x + s.x) * 0.03 + k) * 4;
        x === s.x ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    // tiny shells
    const rnd2 = mulberry32((s.x | 0) + 7);
    for (let i = 0; i < s.w / 110; i++) {
      const sx = s.x + 20 + rnd2() * (s.w - 40);
      const sy = s.y + 24 + rnd2() * 78;
      ctx.fillStyle = 'rgba(255,255,255,.7)';
      ctx.beginPath(); ctx.arc(sx, sy, 2.5, Math.PI, 0); ctx.fill();
      ctx.strokeStyle = 'rgba(185,145,95,.55)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(sx - 2.5, sy); ctx.lineTo(sx + 2.5, sy); ctx.stroke();
    }
    return;
  }
  // default dirt ground
  const g = ctx.createLinearGradient(0, s.y, 0, s.y + 110);
  g.addColorStop(0, th.ground[0]); g.addColorStop(1, th.ground[1]);
  ctx.fillStyle = g;
  ctx.fillRect(s.x, s.y, s.w, Math.min(s.h, 300));
  // lighter topsoil
  ctx.fillStyle = 'rgba(255,235,200,.10)';
  ctx.fillRect(s.x, s.y + 18, s.w, 22);
  // grass top
  const gg = ctx.createLinearGradient(0, s.y - 4, 0, s.y + 24);
  gg.addColorStop(0, th.grass[0]); gg.addColorStop(1, th.grass[1]);
  ctx.fillStyle = gg;
  ctx.fillRect(s.x, s.y - 4, s.w, 24);
  // grass blades
  ctx.fillStyle = th.grass[0];
  for (let x = s.x + 6; x < s.x + s.w - 6; x += 16) {
    const hgt = 6 + ((x * 7) % 10);
    ctx.beginPath();
    ctx.moveTo(x, s.y - 4); ctx.lineTo(x + 3, s.y - 4 - hgt); ctx.lineTo(x + 6, s.y - 4);
    ctx.closePath(); ctx.fill();
  }
  // dirt edge shading at the sides of the ground chunk
  const edge = ctx.createLinearGradient(s.x, 0, s.x + 10, 0);
  edge.addColorStop(0, 'rgba(0,0,0,.28)'); edge.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = edge;
  ctx.fillRect(s.x, s.y, 10, Math.min(s.h, 160));
  const edge2 = ctx.createLinearGradient(s.x + s.w - 10, 0, s.x + s.w, 0);
  edge2.addColorStop(0, 'rgba(0,0,0,0)'); edge2.addColorStop(1, 'rgba(0,0,0,.28)');
  ctx.fillStyle = edge2;
  ctx.fillRect(s.x + s.w - 10, s.y, 10, Math.min(s.h, 160));
  // pebbles
  ctx.fillStyle = 'rgba(0,0,0,.13)';
  for (let x = s.x + 30; x < s.x + s.w - 20; x += 58) {
    ctx.beginPath(); ctx.ellipse(x, s.y + 58 + (x % 30), 8, 5, 0, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = 'rgba(0,0,0,.07)';
  for (let x = s.x + 70; x < s.x + s.w - 20; x += 96) {
    ctx.fillRect(x, s.y + 90, 40, 3);
  }
}

function drawLadder(L, l) {
  ctx.strokeStyle = '#a9733c'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(l.x + 3, l.yTop); ctx.lineTo(l.x + 3, l.yBottom); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(l.x + l.w - 3, l.yTop); ctx.lineTo(l.x + l.w - 3, l.yBottom); ctx.stroke();
  ctx.lineWidth = 4;
  for (let y = l.yTop + 12; y < l.yBottom - 6; y += 18) {
    ctx.beginPath(); ctx.moveTo(l.x + 3, y); ctx.lineTo(l.x + l.w - 3, y); ctx.stroke();
  }
}

function drawSlide(L, s) {
  const x0 = s.x, y0 = s.yTop, x1 = s.x + s.w, y1 = s.yBottom;
  const cx = x0 + s.w * 0.60;
  const icy = L.themeKey === 'ice';       // Antarctica gets a frozen slide
  const legDark = icy ? '#7fb6d6' : '#a9733c';
  const legLight = icy ? '#c8e8f8' : '#c48c4a';
  ctx.save();
  // soft shadow on the ground
  shadowEllipse(ctx, x1 - 24, y1 + 10, 74, 0.16);

  // support legs
  ctx.strokeStyle = legDark; ctx.lineWidth = 8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x0 + 30, y0 + 16); ctx.lineTo(x0 + 30, y1 + 8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x1 - 34, y1 - 78); ctx.lineTo(x1 - 34, y1 + 8); ctx.stroke();
  ctx.strokeStyle = legLight; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x0 + 30, y0 + 16); ctx.lineTo(x0 + 30, y1 + 8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x1 - 34, y1 - 78); ctx.lineTo(x1 - 34, y1 + 8); ctx.stroke();

  // the slide itself: a thick curved band
  ctx.beginPath();
  ctx.moveTo(x0 - 4, y0 - 2);
  ctx.quadraticCurveTo(cx, y0 + 22, x1, y1 - 34);
  ctx.lineTo(x1 + 6, y1 - 2);
  ctx.quadraticCurveTo(cx, y0 + 52, x0 - 4, y0 + 26);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  if (icy) { g.addColorStop(0, '#f2fdff'); g.addColorStop(0.55, '#b9e4f6'); g.addColorStop(1, '#7fc4e6'); }
  else { g.addColorStop(0, '#ffe08f'); g.addColorStop(0.55, '#ffc44d'); g.addColorStop(1, '#ef9327'); }
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = icy ? '#5ba6cc' : '#c97a1e'; ctx.lineWidth = 3; ctx.stroke();

  // shiny strip down the middle
  ctx.beginPath();
  ctx.moveTo(x0 + 8, y0 + 9);
  ctx.quadraticCurveTo(cx, y0 + 32, x1 - 12, y1 - 38);
  ctx.strokeStyle = 'rgba(255,255,255,.62)'; ctx.lineWidth = 4; ctx.stroke();

  // low side rails (so it reads as a slide, not a chute)
  ctx.strokeStyle = icy ? '#8fcfe8' : '#e0a33a'; ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(x0 - 2, y0 + 1);
  ctx.quadraticCurveTo(cx, y0 + 25, x1 + 3, y1 - 31);
  ctx.stroke();

  // run-out lip at the bottom
  fillRR(ctx, x1 - 6, y1 - 12, 26, 14, 6, icy ? '#a9dcf0' : '#ffc44d');

  // wooden top platform + a little flag on a pole
  fillRR(ctx, x0 - 32, y0 - 12, 84, 14, 5, icy ? '#9fd2e8' : '#b98247');
  fillRR(ctx, x0 - 32, y0 - 12, 84, 5, 3, icy ? '#dff4fc' : '#e0b878');
  ctx.strokeStyle = icy ? '#7fb6d6' : '#a9733c'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x0 + 6, y0 - 12); ctx.lineTo(x0 + 6, y0 - 58); ctx.stroke();
  ctx.fillStyle = '#ff6b81';
  ctx.beginPath();
  ctx.moveTo(x0 + 7, y0 - 58);
  ctx.lineTo(x0 + 42, y0 - 48);
  ctx.lineTo(x0 + 7, y0 - 38);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffd166';
  ctx.beginPath(); ctx.arc(x0 + 6, y0 - 60, 3, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawSpin(L, sp) {
  const t = game.time;
  ctx.save();
  shadowEllipse(ctx, sp.x, sp.y + 54, sp.r * 1.15, 0.2);
  // pedestal
  const pg = ctx.createLinearGradient(0, sp.y + 10, 0, sp.y + 52);
  pg.addColorStop(0, '#d9a94e'); pg.addColorStop(1, '#a87a2f');
  ctx.fillStyle = pg;
  ctx.fillRect(sp.x - sp.r * 0.58, sp.y + 10, sp.r * 1.16, 42);
  ctx.beginPath(); ctx.ellipse(sp.x, sp.y + 52, sp.r * 0.58, 11, 0, 0, TAU); ctx.fill();
  // disc side
  ctx.fillStyle = '#b7852f';
  ctx.fillRect(sp.x - sp.r, sp.y + 2, sp.r * 2, 16);
  ctx.beginPath(); ctx.ellipse(sp.x, sp.y + 18, sp.r, 12, 0, 0, TAU); ctx.fillStyle = '#9c7026'; ctx.fill();
  // spinning top
  const g = ctx.createLinearGradient(0, sp.y - 16, 0, sp.y + 16);
  g.addColorStop(0, '#ffd97a'); g.addColorStop(1, '#e0a83c');
  ctx.save();
  ctx.beginPath(); ctx.ellipse(sp.x, sp.y, sp.r, 16, 0, 0, TAU); ctx.fillStyle = g; ctx.fill();
  ctx.clip();
  const spin = t * 3;
  for (let i = 0; i < 8; i++) {
    const a = spin + i * TAU / 8;
    ctx.fillStyle = i % 2 ? '#ff9a6b' : '#ffe08a';
    ctx.beginPath();
    ctx.moveTo(sp.x, sp.y);
    ctx.arc(sp.x, sp.y, sp.r + 8, a, a + 0.42);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle = '#8a6238'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(sp.x, sp.y, sp.r, 16, 0, 0, TAU); ctx.stroke();
  circ(ctx, sp.x, sp.y - 2, 9, '#c98f52');
  circ(ctx, sp.x - 2, sp.y - 5, 4, 'rgba(255,255,255,.5)');
  // handle bar
  ctx.strokeStyle = '#c98f52'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(sp.x + sp.r * 0.55, sp.y - 16, 14, Math.PI, TAU); ctx.stroke();
  ctx.restore();
}

/* --------------------------- draw world --------------------------- */
function drawScene() {
  const L = game.level;
  if (!L) return;
  const shakeX = (Math.random() - 0.5) * game.shake;
  const shakeY = (Math.random() - 0.5) * game.shake;

  ctx.save();
  drawSky(L);
  drawBackdrop(L);
  ctx.restore();

  ctx.save();
  ctx.translate(-cam.x + shakeX, shakeY);

  // pits behind the ground
  for (const pit of L.pits) drawPitContents(L, pit);

  // solids
  for (const s of L.solids) drawSolid(L, s);

  // props behind characters
  for (const p of L.props) {
    if (p.type === 'tree' || p.type === 'pine' || p.type === 'parktree' || p.type === 'palm' || p.type === 'building' || p.type === 'bossStage') {
      drawProp(ctx, p, L, game.time);
    }
  }
  for (const p of L.props) {
    if (!(p.type === 'tree' || p.type === 'pine' || p.type === 'parktree' || p.type === 'palm' || p.type === 'building' || p.type === 'bossStage')) {
      drawProp(ctx, p, L, game.time);
    }
  }
  for (const l of L.ladders) drawLadder(L, l);
  for (const s of L.slides) drawSlide(L, s);
  for (const sp of L.spins) drawSpin(L, sp);

  // collectibles
  if (L.pickups) for (const pk of L.pickups) drawPickup(ctx, pk, L, game.time);

  // ladders are drawn before the player; enemies first
  const sleepy = !game.playerMoved || game.time - (game.levelStart || 0) < 7;
  for (const e of L.enemies) {
    if (!e.alive && (e.deadT || 0) > 0.7) continue;
    if (e.deadT > 0 && e.y > L.groundY + 60) continue;
    if (e.alive) {
      const sy = e.type === 'bee'
        ? groundTopAt(L, e.x + e.w / 2, e.y + e.h)
        : e.y + e.h + 2;
      shadowEllipse(ctx, e.x + e.w / 2, sy, e.w * 0.55, 0.2);
    }
    ctx.save();
    if (!e.alive) { ctx.globalAlpha = Math.max(0, 1 - (e.deadT || 0) * 1.6); ctx.translate(0, 0); }
    drawEnemy(ctx, e, game.time);
    // little sleeping "z"s while everyone is still waking up
    if (e.alive && sleepy) {
      const zt = (game.time * 0.9 + e.x * 0.01) % 1;
      ctx.globalAlpha = 0.85 * (1 - zt);
      ctx.font = 'bold 16px "Trebuchet MS", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff';
      ctx.fillText('z', e.x + e.w / 2 + 10 + zt * 8, e.y - 6 - zt * 14);
    }
    ctx.restore();
  }

  // boss
  if (L.boss) {
    const b = L.boss;
    if (b.hp > 0 || (b.deadT || 0) < 0.9) {
      shadowEllipse(ctx, b.x + b.w / 2, groundTopAt(L, b.x + b.w / 2, b.y + b.h), b.w * 0.6, 0.24);
      ctx.save();
      if (b.hp <= 0) ctx.globalAlpha = Math.max(0, 1 - (b.deadT || 0));
      drawBoss(ctx, b, game.time);
      ctx.restore();
    }
  }

  // coconuts
  for (const k of game.coconuts) {
    ctx.save();
    ctx.translate(k.x, k.y); ctx.rotate(k.rot);
    circ(ctx, 0, 0, 11, '#7a4a24');
    circ(ctx, -3, -3, 3, '#9a6a3c');
    ctx.restore();
  }

  // shockwaves
  for (const s of game.shockwaves) {
    const a = 1 - s.life / 0.9;
    ctx.strokeStyle = 'rgba(255,224,150,' + a + ')';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.ellipse(s.x, L.groundY - 2, 26 + s.life * 40, 12 + s.life * 16, 0, 0, TAU);
    ctx.stroke();
  }

  // particles
  for (const p of game.particles) {
    const a = 1 - p.life / p.max;
    ctx.globalAlpha = Math.max(0, a);
    ctx.fillStyle = p.color;
    if (p.kind === 'confetti') {
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      ctx.restore();
    } else {
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
  }
  ctx.globalAlpha = 1;

  // player
  if (player) {
    // Fin stays visible while dying: the ice cube keeps bobbing, the
    // quicksand keeps swallowing him. It fades out near the end.
    const deadFade = player.dead ? clamp(1 - Math.max(0, game.deadTimer - 0.9) / 0.9, 0, 1) : 1;
    // when sinking into sand or a puddle, hide whatever is below the surface
    const sinking = player.sink > 0.02;
    if (sinking) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(cam.x - 200, -500, CFG.W + 400, L.groundY + 6 + 500);
      ctx.clip();
      // slide him down a little more each moment so you can see him going under
      const under = Math.min(player.sink / (player.sinkLimit || 1.5), 1);
      const extra = player.dead ? Math.min(1.6, game.deadTimer * 0.55) : 0;
      ctx.translate(0, Math.pow(under, 1.5) * (player.h + 4) + extra * (player.h + 4));
    }
    const blink = !player.dead && player.invuln > 0 && Math.floor(player.invuln * 14) % 2 === 0;
    if (player.onGround && !sinking) shadowEllipse(ctx, player.x + player.w / 2, player.y + player.h + 2, player.w * 0.6, 0.24);
    else if (!sinking) shadowEllipse(ctx, player.x + player.w / 2, groundTopAt(L, player.x + player.w / 2, player.y + player.h), player.w * 0.45, 0.18);
    if (player.frozen > 0) {
      const bob = player.dead ? Math.sin(game.deadTimer * 7) * 2.5 : 0;
      ctx.save();
      ctx.translate(0, bob);
      ctx.globalAlpha = deadFade;
      drawFin(ctx, player, game.time);
      ctx.globalAlpha = deadFade;
      drawIceCube(ctx, player);
      ctx.restore();
    } else {
      ctx.globalAlpha = deadFade * (blink ? 0.55 : 1);
      drawFin(ctx, player, game.time);
    }
    ctx.globalAlpha = 1;
    if (sinking) {
      ctx.restore();
      // a muddy ring where Fin disappeared into the sand
      if (player.sink > 0.15) {
        const cx = player.x + player.w / 2;
        ctx.strokeStyle = 'rgba(120,92,52,.55)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(cx, L.groundY + 4, 26 + Math.sin(game.time * 6) * 3, 7, 0, 0, TAU);
        ctx.stroke();
      }
    }
  }

  ctx.restore();

  // weather in front of everything
  drawWeather(L);
}

function drawIceCube(c, p) {
  const x = p.x + p.w / 2, y = p.y + p.h / 2, w = p.w + 18, h = p.h + 16;
  c.save();
  c.translate(x, y);
  const g = c.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2);
  g.addColorStop(0, 'rgba(220,245,255,.85)');
  g.addColorStop(0.5, 'rgba(160,215,240,.55)');
  g.addColorStop(1, 'rgba(120,190,225,.85)');
  fillRR(c, -w / 2, -h / 2, w, h, 8, g);
  c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3;
  rr(c, -w / 2, -h / 2, w, h, 8); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 2;
  c.beginPath();
  c.moveTo(-w * 0.25, -h * 0.4); c.lineTo(w * 0.3, -h * 0.05);
  c.moveTo(-w * 0.3, h * 0.15); c.lineTo(w * 0.05, h * 0.4);
  c.stroke();
  c.restore();
}

function drawWeather(L) {
  if (L.themeKey === 'city') {
    // all the rain in ONE path and one stroke - way faster than 140 strokes
    ctx.strokeStyle = 'rgba(190,220,240,.55)';
    ctx.lineWidth = 2;
    const t = game.time * 900;
    ctx.beginPath();
    for (let i = 0; i < 140; i++) {
      const x = ((i * 131 + t * 0.6) % (CFG.W + 200)) - 100;
      const y = ((i * 97 + t) % (CFG.H + 120)) - 60;
      ctx.moveTo(x, y); ctx.lineTo(x - 6, y + 22);
    }
    ctx.stroke();
  }
  if (L.themeKey === 'ice') {
    for (let i = 0; i < 90; i++) {
      const t = game.time;
      const x = ((i * 149 + t * 40 + Math.sin(t + i) * 20) % (CFG.W + 100)) - 50;
      const y = ((i * 83 + t * 70) % (CFG.H + 80)) - 40;
      const s = 2 + (i % 3);
      ctx.fillStyle = 'rgba(255,255,255,' + (0.5 + (i % 4) * 0.12) + ')';
      ctx.beginPath(); ctx.arc(x, y, s, 0, TAU); ctx.fill();
    }
  }
  if (L.themeKey === 'fall') {
    for (let i = 0; i < 22; i++) {
      const t = game.time;
      const x = ((i * 173 + t * 36 + Math.sin(t * 1.4 + i) * 40) % (CFG.W + 120)) - 60;
      const y = ((i * 61 + t * 28) % (CFG.H + 120)) - 60;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(t * 1.2 + i);
      ctx.fillStyle = i % 3 === 0 ? '#e0573f' : i % 3 === 1 ? '#f2b23e' : '#c9762f';
      ctx.beginPath(); ctx.ellipse(0, 0, 7, 4, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }
  if (L.themeKey === 'beach') {
    // sparkles over the sea
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    for (let i = 0; i < 18; i++) {
      const x = ((i * 143 + game.time * 26) % (CFG.W + 100)) - 50;
      const y = 470 + Math.sin(game.time * 2 + i) * 5;
      ctx.fillRect(x, y, 10, 2);
    }
  }
  // gentle vignette for depth
  const vg = ctx.createRadialGradient(CFG.W / 2, CFG.H / 2, CFG.H * 0.62, CFG.W / 2, CFG.H / 2, CFG.H * 1.05);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(10,18,32,.20)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, CFG.W, CFG.H);
}

/* ------------------------------ HUD ------------------------------- */
function drawHUD() {
  const L = game.level;
  if (!L) return;
  // soft scrim so the HUD stays readable over bright skies
  const sc = ctx.createLinearGradient(0, 0, 0, 132);
  sc.addColorStop(0, 'rgba(10,20,36,.48)');
  sc.addColorStop(1, 'rgba(10,20,36,0)');
  ctx.fillStyle = sc;
  ctx.fillRect(0, 0, CFG.W, 132);
  // hearts
  for (let i = 0; i < game.maxHearts; i++) {
    const x = 46 + i * 44, y = 54;
    const full = i < game.hearts && game.state !== 'dead';
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(1.5, 1.5);
    ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
    heartPath(ctx, 0, 0, 26);
    ctx.fillStyle = full ? '#ff5d73' : 'rgba(16,28,46,.78)';
    ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.strokeStyle = full ? 'rgba(255,255,255,.75)' : 'rgba(255,255,255,.7)';
    ctx.lineWidth = 1.6;
    ctx.stroke();
    if (full) {
      ell(ctx, -4, -6, 4, 2.6, -0.4, 'rgba(255,255,255,.6)');
    }
    ctx.restore();
  }
  // score
  const sx2 = 46 + game.maxHearts * 44 + 14;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
  starPath(ctx, sx2, 51, 13, 5, 0.46);
  ctx.fillStyle = '#ffd166'; ctx.fill();
  ctx.strokeStyle = '#e8a12e'; ctx.lineWidth = 2; ctx.stroke();
  ctx.shadowColor = 'transparent';
  ctx.font = 'bold 25px "Trebuchet MS", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(String(game.score), sx2 + 22, 61);
  // how many there are in THIS level, so the number actually means something
  if (L.pickups && L.pickups.length) {
    const scoreW = ctx.measureText(String(game.score)).width;
    ctx.font = 'bold 17px "Trebuchet MS", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.78)';
    ctx.fillText('/ ' + L.pickups.length, sx2 + 26 + scoreW, 62);
  }
  ctx.restore();
  // level name (on its own dark pill so bright clouds can't wash it out)
  // on touch screens the pause button lives in the top-right corner, so the
  // pill slides left a little to keep out of its way
  const hudRight = IS_TOUCH ? 96 : 24;
  ctx.save();
  fillRR(ctx, CFG.W - hudRight - 306, 16, 306, 66, 18, 'rgba(10,20,36,.30)');
  ctx.font = 'bold 22px "Trebuchet MS", sans-serif';
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 8;
  ctx.fillText(L.name, CFG.W - hudRight - 12, 46);
  ctx.font = '600 14px "Trebuchet MS", sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.fillText(L.sub, CFG.W - hudRight - 12, 68);
  ctx.restore();

  // boss bar
  const b = L.boss;
  if (b && b.active && b.hp > 0) {
    const bw = 380, bx = (CFG.W - bw) / 2, by = 30;
    ctx.save();
    ctx.globalAlpha = 0.95;
    fillRR(ctx, bx - 6, by - 6, bw + 12, 34, 12, 'rgba(15,22,35,.55)');
    fillRR(ctx, bx, by, bw, 22, 8, 'rgba(255,255,255,.18)');
    const hpFrac = b.hp / CFG.bossHp;
    fillRR(ctx, bx + 2, by + 2, (bw - 4) * hpFrac, 18, 6, '#ff6b7f');
    fillRR(ctx, bx + 2, by + 2, (bw - 4) * hpFrac, 8, 5, 'rgba(255,255,255,.25)');
    ctx.font = 'bold 15px "Trebuchet MS", sans-serif';
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.fillText(bossName(b.type) + '   ' + '❤'.repeat(Math.max(0, b.hp)), CFG.W / 2, by + 17);
    ctx.restore();
  }

  // boss tip: teach the stomp rule when the fight begins, then teach the
  // one thing that makes THIS boss different. Repeating the same slogan four
  // times teaches nothing after the first level.
  if (b && b.active && b.hp > 0 && game.bossTip > 0) {
    const a = Math.min(1, game.bossTip);
    const tip = {
      boomer: 'STOMP BOOMER 3 TIMES - JUMP HIS SHOCKWAVES!',
      penguin: 'STOMP PUFFY 3 TIMES - SHE CHARGES AT YOU!',
      basketball: 'STOMP THE BALL 3 TIMES - IT BOUNCES FOREVER!',
      bear: 'STOMP BLUE BEAR 3 TIMES - JUMP HIS SWAT!'
    }[b.type] || 'JUMP ON THE BOSS 3 TIMES!';
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = 'bold 18px "Trebuchet MS", sans-serif';
    const tw = ctx.measureText(tip).width + 44;
    fillRR(ctx, CFG.W / 2 - tw / 2, 92, tw, 36, 18, 'rgba(15,22,35,.72)');
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffe9a8';
    ctx.fillText(tip, CFG.W / 2, 116);
    ctx.restore();
  }

  // mute / sound toast
  if (game.toastT > 0) {
    const a = Math.min(1, game.toastT);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = 'bold 15px "Trebuchet MS", sans-serif';
    const tw = Math.max(160, ctx.measureText(game.toast).width + 44);
    fillRR(ctx, CFG.W / 2 - tw / 2, 136, tw, 30, 15, 'rgba(12,22,38,.72)');
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.fillText(game.toast, CFG.W / 2, 156);
    ctx.restore();
  }

  // hints
  if (game.time - (game.levelStart || 0) < 5 && game.state === 'playing') {
    const a = clamp(5 - (game.time - game.levelStart), 0, 1);
    const hint = IS_TOUCH
      ? '◀ ▶ move   ·   ▲ jump   ·   ❚❚ pause'
      : '← → or A D move    ·    SPACE jump    ·    P pause';
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = 'bold 19px "Trebuchet MS", sans-serif';
    const hw = Math.min(600, ctx.measureText(hint).width + 64);
    fillRR(ctx, CFG.W / 2 - hw / 2, 8, hw, 36, 18, 'rgba(10,19,33,.72)');
    ctx.globalAlpha = a * 0.95;
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.fillText(hint, CFG.W / 2, 33);
    ctx.restore();
  }
  // first level only: teach stomping
  if (game.levelIndex === 0 && game.time - (game.levelStart || 0) < 8 && game.state === 'playing') {
    const a = clamp(8 - (game.time - game.levelStart), 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    fillRR(ctx, CFG.W / 2 - 190, 50, 380, 34, 17, 'rgba(10,19,33,.72)');
    ctx.globalAlpha = a * 0.95;
    ctx.font = 'bold 18px "Trebuchet MS", sans-serif';
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffe9a8';
    ctx.fillText('Jump on enemies to stomp them!', CFG.W / 2, 74);
    ctx.restore();
  }
}

function bossName(t) {
  return { boomer: 'BOOMER', penguin: 'PUFFY PENGUIN', basketball: 'BASKETBALL', bear: 'BLUE BEAR' }[t] || 'BOSS';
}

/* --------------------------- overlays ----------------------------- */
function drawDead() {
  const a = clamp(game.deadTimer / 0.5, 0, 1);
  ctx.fillStyle = 'rgba(10,16,28,' + (0.45 * a) + ')';
  ctx.fillRect(0, 0, CFG.W, CFG.H);
  let title = 'OH NO!';
  let sub = 'Fin ran out of hearts!';
  if (game.hearts > 0) {
    title = 'OOPS!';
    sub = {
      fall: 'Watch out for the holes!',
      water: 'Brrr! That water is freezing!',
      ice: 'Brrr! That water is freezing!',
      puddle: 'Splash! Jump over the puddles!',
      sand: 'The sand was too deep!',
      hearts: 'Fin ran out of hearts!'
    }[game.deathReason] || 'Let us try that again!';
  }
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = 'bold 64px "Trebuchet MS", sans-serif';
  ctx.fillStyle = '#ff8f9c';
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 18;
  ctx.fillText(title, CFG.W / 2, CFG.H / 2 - 20);
  ctx.font = 'bold 24px "Trebuchet MS", sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText(sub, CFG.W / 2, CFG.H / 2 + 30);
  ctx.font = 'bold 18px "Trebuchet MS", sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.fillText(IS_TOUCH ? 'Tap to try again' : 'Restarting the level...', CFG.W / 2, CFG.H / 2 + 72);
  ctx.restore();
}

function drawPause() {
  ctx.fillStyle = 'rgba(10,16,28,.62)';
  ctx.fillRect(0, 0, CFG.W, CFG.H);
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = 'bold 68px "Trebuchet MS", sans-serif';
  ctx.fillStyle = '#ffd166';
  ctx.fillText('PAUSED', CFG.W / 2, CFG.H / 2 - 70);
  if (IS_TOUCH) {
    // big tappable buttons instead of keyboard hints
    game.pauseRects = [];
    const bw = 300, bh = 64, bx = CFG.W / 2 - bw / 2;
    [['resume', 'RESUME'], ['restart', 'RESTART LEVEL'], ['quit', 'QUIT TO MENU']].forEach(([act, label], i) => {
      const by = CFG.H / 2 - 22 + i * 80;
      fillRR(ctx, bx, by, bw, bh, 20, i === 0 ? 'rgba(255,209,102,.95)' : 'rgba(255,255,255,.17)');
      if (i > 0) { ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2; rr(ctx, bx, by, bw, bh, 20); ctx.stroke(); }
      ctx.font = 'bold 24px "Trebuchet MS", sans-serif';
      ctx.fillStyle = i === 0 ? '#2a2410' : '#ffffff';
      ctx.fillText(label, CFG.W / 2, by + 41);
      game.pauseRects.push({ act, x: bx, y: by, w: bw, h: bh });
    });
    ctx.font = '16px "Trebuchet MS", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    // no M key on a phone, so give it a real button
    const mw = 210, mh = 46, mx = CFG.W / 2 - mw / 2, my = CFG.H / 2 + 220;
    fillRR(ctx, mx, my, mw, mh, 14, 'rgba(255,255,255,.14)');
    ctx.font = 'bold 19px "Trebuchet MS", sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(Sound.muted ? '♪  MUSIC OFF' : '♪  MUSIC ON', CFG.W / 2, my + 30);
    game.pauseRects.push({ act: 'music', x: mx, y: my, w: mw, h: mh });
  } else {
    ctx.font = 'bold 22px "Trebuchet MS", sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText('P / ENTER  resume      R  restart level      Q  quit to menu', CFG.W / 2, CFG.H / 2 + 20);
    ctx.font = '18px "Trebuchet MS", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.fillText('M toggles music', CFG.W / 2, CFG.H / 2 + 56);
  }
  ctx.restore();
}

function drawClear() {
  if (game.clearTimer < 0.55) return;
  const a = clamp((game.clearTimer - 0.55) / 0.6, 0, 1);
  ctx.fillStyle = 'rgba(10,18,30,' + (0.35 * a) + ')';
  ctx.fillRect(0, 0, CFG.W, CFG.H);
  ctx.save();
  ctx.globalAlpha = a;
  // dark panel so the white text stays readable over snow and ice.
  // Nearly opaque on purpose: bright pickup glows were bleeding through it.
  fillRR(ctx, CFG.W / 2 - 340, CFG.H / 2 - 152, 680, 276, 30, 'rgba(8,16,28,.92)');
  ctx.textAlign = 'center';
  const bounce = Math.sin(game.clearTimer * 3) * 6;
  // "FIN WINS" is saved for the very end, so finishing one level still feels
  // like a step on the way instead of the whole adventure being over.
  const bigText = game.levelIndex < 3 ? 'LEVEL CLEAR!' : 'FIN WINS';
  ctx.font = 'bold ' + (game.levelIndex < 3 ? 82 : 108) + 'px "Trebuchet MS", sans-serif';
  ctx.lineWidth = 12;
  ctx.strokeStyle = 'rgba(20,30,50,.85)';
  ctx.strokeText(bigText, CFG.W / 2, CFG.H / 2 - 40 + bounce);
  const g = ctx.createLinearGradient(0, CFG.H / 2 - 130, 0, CFG.H / 2 - 10);
  g.addColorStop(0, '#fff6c2'); g.addColorStop(0.55, '#ffd166'); g.addColorStop(1, '#ff9a5c');
  ctx.fillStyle = g;
  ctx.fillText(bigText, CFG.W / 2, CFG.H / 2 - 40 + bounce);
  ctx.font = 'bold 26px "Trebuchet MS", sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(game.level.name + ' cleared!', CFG.W / 2, CFG.H / 2 + 30);
  ctx.font = 'bold 20px "Trebuchet MS", sans-serif';
  ctx.fillStyle = '#ffe9a8';
  ctx.fillText('★  ' + game.levelScore + ' treasures found   ·   ' + game.score + ' total', CFG.W / 2, CFG.H / 2 + 62);
  ctx.font = 'bold 22px "Trebuchet MS", sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,' + (0.65 + Math.sin(game.clearTimer * 5) * 0.25) + ')';
  ctx.fillText(game.levelIndex < 3
    ? (IS_TOUCH ? 'Tap to play ' + LEVEL_NAMES[game.levelIndex + 1] : 'Press ENTER for ' + LEVEL_NAMES[game.levelIndex + 1])
    : (IS_TOUCH ? 'Tap to finish' : 'Press ENTER to finish'), CFG.W / 2, CFG.H / 2 + 86);
  ctx.restore();
}

function drawVictory() {
  ctx.fillStyle = 'rgba(10,18,30,.55)';
  ctx.fillRect(0, 0, CFG.W, CFG.H);
  ctx.save();
  fillRR(ctx, CFG.W / 2 - 350, 146, 700, 282, 32, 'rgba(8,16,28,.94)');
  ctx.textAlign = 'center';
  const bounce = Math.sin(game.time * 2.4) * 7;
  ctx.font = 'bold 96px "Trebuchet MS", sans-serif';
  ctx.lineWidth = 12; ctx.strokeStyle = 'rgba(20,30,50,.85)';
  ctx.strokeText('FIN WINS!', CFG.W / 2, 250 + bounce);
  const g = ctx.createLinearGradient(0, 160, 0, 280);
  g.addColorStop(0, '#fff6c2'); g.addColorStop(0.5, '#ffd166'); g.addColorStop(1, '#ff9a5c');
  ctx.fillStyle = g;
  ctx.fillText('FIN WINS!', CFG.W / 2, 250 + bounce);
  ctx.font = 'bold 32px "Trebuchet MS", sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText('All four levels complete. You are a hero!', CFG.W / 2, 316);
  ctx.font = 'bold 22px "Trebuchet MS", sans-serif';
  ctx.fillStyle = '#ffe9a8';
  ctx.fillText('★  ' + game.score + ' treasures collected', CFG.W / 2, 354);
  ctx.font = '20px "Trebuchet MS", sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.fillText(IS_TOUCH ? 'Tap to head back to the menu' : 'Press ENTER to head back to the menu', CFG.W / 2, 392);
  ctx.restore();
}

/* ============================ 11. MENUS =========================== */
const LEVEL_NAMES = ['Fall Fields', 'Antarctica', 'Rainy City', 'Sunny Beach'];
const LEVEL_EMOJI = ['🍂', '❄️', '🌧️', '🏖️'];

function drawTitle() {
  // --- sky ---
  const g = ctx.createLinearGradient(0, 0, 0, CFG.H);
  g.addColorStop(0, '#4aa8e8');
  g.addColorStop(0.6, '#bfe8fb');
  g.addColorStop(1, '#f6e9c9');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, CFG.W, CFG.H);

  // sun
  const sg = ctx.createRadialGradient(1040, 140, 10, 1040, 140, 240);
  sg.addColorStop(0, 'rgba(255,250,220,.9)');
  sg.addColorStop(1, 'rgba(255,250,220,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(1040, 140, 240, 0, TAU); ctx.fill();
  circ(ctx, 1040, 140, 54, '#fff7cf');

  // clouds
  drawCloud(ctx, 160 + Math.sin(game.time * 0.25) * 20, 110, 1.2);
  drawCloud(ctx, 620 + Math.sin(game.time * 0.2 + 2) * 18, 70, 0.9);
  drawCloud(ctx, 940 + Math.sin(game.time * 0.3 + 4) * 22, 210, 0.75);

  // rolling hills
  ctx.fillStyle = '#a9cf8a';
  ctx.beginPath(); ctx.ellipse(240, 720, 420, 190, 0, Math.PI, 0); ctx.fill();
  ctx.beginPath(); ctx.ellipse(1000, 740, 460, 210, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#8dbb6d';
  ctx.beginPath(); ctx.ellipse(640, 760, 520, 220, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#7aab5e';
  ctx.fillRect(0, 660, CFG.W, 60);

  // trees behind the menu
  drawProp(ctx, { type: 'tree', x: 1170, y: 660, kind: 'maple', scale: 1.15 }, { groundY: 660 }, game.time);
  drawProp(ctx, { type: 'tree', x: 60, y: 668, kind: 'gold', scale: 1.3 }, { groundY: 668 }, game.time);
  drawProp(ctx, { type: 'pumpkin', x: 320, y: 668, small: false }, { groundY: 668 }, game.time);
  drawProp(ctx, { type: 'pumpkin', x: 1120, y: 674, small: true }, { groundY: 674 }, game.time);
  drawProp(ctx, { type: 'sign', x: 120, y: 674, text: 'GO!' }, { groundY: 674 }, game.time);

  // --- title text ---
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = 'bold 26px "Trebuchet MS", sans-serif';
  ctx.fillStyle = 'rgba(15,35,65,.45)';
  ctx.fillText('THE ADVENTURES OF', 641, 110);
  ctx.fillStyle = '#ffffff';
  ctx.fillText('THE ADVENTURES OF', 640, 108);

  ctx.save();
  ctx.translate(640, 196);
  ctx.rotate(-0.02);
  ctx.font = 'bold 118px "Trebuchet MS", sans-serif';
  ctx.fillStyle = 'rgba(20,40,70,.6)';
  ctx.fillText('FIN', 7, 9);
  const tg = ctx.createLinearGradient(0, -90, 0, 10);
  tg.addColorStop(0, '#ffffff'); tg.addColorStop(0.5, '#ffe89a'); tg.addColorStop(1, '#f7b733');
  ctx.fillStyle = tg;
  ctx.fillText('FIN', 0, 0);
  ctx.restore();

  ctx.font = 'bold 44px "Trebuchet MS", sans-serif';
  ctx.fillStyle = 'rgba(15,35,65,.85)';
  ctx.fillText('REIMAGINED', 647, 263);
  ctx.fillStyle = '#ffffff';
  ctx.fillText('REIMAGINED', 640, 256);
  ctx.restore();

  // --- Fin mascot ---
  const demo = {
    x: 960, y: 398, w: 118, h: 150, facing: -1, anim: 'idle',
    animT: game.time, squash: 1, onGround: true, vx: 0, invuln: 0, frozen: 0
  };
  shadowEllipse(ctx, demo.x + demo.w / 2, demo.y + demo.h + 3, 74, 0.26);
  // gentle hop
  const hop = Math.abs(Math.sin(game.time * 1.6)) * -10;
  demo.y += hop;
  drawFin(ctx, demo, game.time);

  // --- menu panel ---
  const px = 300, py = 320, pw = 420;
  ctx.save();
  fillRR(ctx, px, py, pw, 326, 26, 'rgba(16,28,48,.72)');
  ctx.strokeStyle = 'rgba(255,255,255,.24)'; ctx.lineWidth = 2;
  rr(ctx, px, py, pw, 326, 26); ctx.stroke();
  ctx.restore();

  game.menuRects = [];
  const rows = [
    { y: py + 52, label: 'PLAY', value: 'Start ' + LEVEL_NAMES[game.menu.level], act: 'play' },
    { y: py + 126, label: 'LEVEL', value: (game.menu.level + 1) + '. ' + LEVEL_NAMES[game.menu.level], act: 'level' },
    { y: py + 200, label: 'DIFFICULTY', value: DIFFICULTIES[game.menu.diff].name, act: 'diff' }
  ];
  rows.forEach((r, i) => {
    const sel = game.menu.index === i;
    const rowX = px + 18, rowW = pw - 36, rowH = 62;
    if (sel) {
      fillRR(ctx, rowX, r.y - 40, rowW, rowH, 16, 'rgba(255,255,255,.16)');
      fillRR(ctx, rowX, r.y - 40, 6, rowH, 3, '#ffd166');
    }
    ctx.save();
    ctx.textAlign = 'left';
    ctx.font = 'bold 15px "Trebuchet MS", sans-serif';
    ctx.fillStyle = sel ? '#ffe9a8' : 'rgba(255,255,255,.65)';
    ctx.fillText(r.label, rowX + 22, r.y - 14);
    ctx.font = 'bold 26px "Trebuchet MS", sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(r.value, rowX + 22, r.y + 14);
    // draw the real hearts instead of a tiny "♥" character
    if (r.act === 'diff') {
      const hx = rowX + 22 + ctx.measureText(r.value).width + 22;
      const n = DIFFICULTIES[game.menu.diff].hearts;
      for (let k = 0; k < n; k++) {
        heartPath(ctx, hx + k * 19, r.y + 6, 16);
        ctx.fillStyle = '#ff6b81';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.5; ctx.stroke();
      }
    }

    if (r.act === 'level' || r.act === 'diff') {
      // little arrows
      ctx.font = 'bold 26px "Trebuchet MS", sans-serif';
      ctx.fillStyle = sel ? '#ffd166' : 'rgba(255,255,255,.55)';
      ctx.textAlign = 'center';
      ctx.fillText('◀', rowX + rowW - 64, r.y + 8);
      ctx.fillText('▶', rowX + rowW - 18, r.y + 8);
      game.menuRects.push({ x: rowX + rowW - 88, y: r.y - 34, w: 44, h: 52, act: r.act + 'L' });
      game.menuRects.push({ x: rowX + rowW - 44, y: r.y - 34, w: 44, h: 52, act: r.act + 'R' });
    }
    game.menuRects.push({ x: rowX, y: r.y - 40, w: rowW, h: rowH, act: r.act === 'play' ? 'play' : 'select' + i });
    ctx.restore();
  });

  // level pick buttons - big enough to tap on a phone
  const pipW = 82, pipH = 66, pipGap = 8;
  const pipTotal = 4 * pipW + 3 * pipGap;
  for (let i = 0; i < 4; i++) {
    const bx = px + (pw - pipTotal) / 2 + i * (pipW + pipGap);
    const by = py + 238;
    const unlocked = i < game.unlocked;
    const isSel = i === game.menu.level;
    fillRR(ctx, bx, by, pipW, pipH, 14,
      isSel ? '#ffd166' : unlocked ? 'rgba(255,255,255,.2)' : 'rgba(255,255,255,.07)');
    if (unlocked && !isSel) {
      ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 2;
      rr(ctx, bx, by, pipW, pipH, 14); ctx.stroke();
    }
    ctx.font = 'bold 24px "Trebuchet MS", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = isSel ? '#1b3b63' : unlocked ? 'rgba(255,255,255,.9)' : 'rgba(255,255,255,.45)';
    ctx.fillText(unlocked ? String(i + 1) : '🔒', bx + pipW / 2, by + 43);
    // each button is tappable
    game.menuRects.push({ x: bx, y: by, w: pipW, h: pipH, act: 'pick' + i });
  }

  // footer
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = 'bold 18px "Trebuchet MS", sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 8;
  ctx.fillText(IS_TOUCH
    ? 'Tap PLAY to start   ·   tap ◀ ▶ to change   ·   tap a level number'
    : '↑ ↓ choose   ·   ← → change   ·   ENTER play   ·   M music', 640, 676);
  ctx.font = '15px "Trebuchet MS", sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.fillText('Easy = 5 hearts   ·   Normal = 3 hearts   ·   Hard = 1 heart', 640, 700);
  ctx.restore();
}

function cycleLevel(dir) {
  const m = game.menu;
  m.level = (m.level + dir + game.unlocked) % game.unlocked;
  Sound.sfx('select');
}
function cycleDiff(dir) {
  game.menu.diff = (game.menu.diff + dir + 3) % 3;
  Sound.sfx('select');
}

function startGame(index) {
  game.difficulty = game.menu.diff;
  game.unlocked = Math.max(game.unlocked, 1);
  game.score = 0;
  game.levelScore = 0;
  game.collectedKeys = new Set();
  Sound.unlock();
  resetLevel(index);
}

function updateTitle(dt) {
  const m = game.menu;
  if (!Sound.muted) Sound.play('menu');
  if (Input.hit('up')) { m.index = (m.index + 2) % 3; Sound.sfx('select'); }
  if (Input.hit('down')) { m.index = (m.index + 1) % 3; Sound.sfx('select'); }
  if (Input.hit('left')) {
    if (m.index === 1) cycleLevel(-1);
    else if (m.index === 2) cycleDiff(-1);
  }
  if (Input.hit('right')) {
    if (m.index === 1) cycleLevel(1);
    else if (m.index === 2) cycleDiff(1);
  }
  if (Input.hit('enter') || Input.hit('jump')) {
    if (m.index === 0) startGame(m.level);
    else if (m.index === 1) cycleLevel(1);
    else cycleDiff(1);
  }
}

function handleMenuClick(x, y) {
  for (const r of game.menuRects) {
    if (x > r.x && x < r.x + r.w && y > r.y && y < r.y + r.h) {
      Sound.unlock();
      switch (r.act) {
        case 'play': startGame(game.menu.level); return;
        case 'levelL': cycleLevel(-1); game.menu.index = 1; return;
        case 'levelR': cycleLevel(1); game.menu.index = 1; return;
        case 'diffL': cycleDiff(-1); game.menu.index = 2; return;
        case 'diffR': cycleDiff(1); game.menu.index = 2; return;
        case 'level': game.menu.index = 1; cycleLevel(1); return;
        case 'diff': game.menu.index = 2; cycleDiff(1); return;
        case 'select1': game.menu.index = 1; cycleLevel(1); return;
        case 'select2': game.menu.index = 2; cycleDiff(1); return;
        default:
          if (r.act.indexOf('pick') === 0) {
            const idx = parseInt(r.act.slice(4), 10);
            if (idx < game.unlocked) { game.menu.level = idx; game.menu.index = 1; Sound.sfx('select'); }
            return;
          }
      }
    }
  }
}

canvas.addEventListener('pointerdown', e => {
  Sound.unlock();
  const p = toLogical(e.clientX, e.clientY);
  if (game.state === 'title') handleMenuClick(p.x, p.y);
  else if (game.state === 'clear' && game.clearTimer > 0.8) nextLevel();
  else if (game.state === 'victory' && game.clearTimer > 1) { game.state = 'title'; Sound.play('menu'); }
  else if (game.state === 'paused') {
    if (IS_TOUCH && game.pauseRects) {
      const hit = game.pauseRects.find(r => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h);
      if (hit) {
        if (hit.act === 'resume') game.state = 'playing';
        else if (hit.act === 'restart') resetLevel(game.levelIndex);
        else if (hit.act === 'music') Sound.toggleMute();
        else { game.state = 'title'; Sound.play('menu'); }
      }
    } else game.state = 'playing';
  }
});

/* =========================== 12. BOOT ============================= */
function render() {
  beginFrame();
  // touch buttons only show while actually playing
  if (render._lastState !== game.state) {
    render._lastState = game.state;
    document.body.classList.toggle('playing', game.state === 'playing');
  }
  if (game.state === 'title') { drawTitle(); return; }
  drawScene();
  drawHUD();

  if (game.flash > 0) {
    ctx.fillStyle = 'rgba(255,90,110,' + (game.flash * 0.22) + ')';
    ctx.fillRect(0, 0, CFG.W, CFG.H);
  }
  if (game.state === 'paused') drawPause();
  if (game.state === 'clear') drawClear();
  if (game.state === 'victory') drawVictory();
  if (game.state === 'dead') drawDead();
}

let lastT = 0, acc = 0;
const STEP = 1 / 60;
function frame(now) {
  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.25) dt = 0.25;
  acc += dt;
  let guard = 0;
  while (acc >= STEP && guard++ < 5) {
    update(STEP);
    acc -= STEP;
  }
  render();
  requestAnimationFrame(frame);
}

// tiny dev shortcut: #level=3 jumps straight into a level for testing
// add &x=3400 to start further along (handy for screenshots)
(function boot() {
  const m = location.hash.match(/level=([1-4])/);
  if (m) {
    const idx = parseInt(m[1], 10) - 1;
    game.menu.level = idx;
    game.menu.diff = 1;
    game.unlocked = 4;
    startGame(idx);
    const xm = location.hash.match(/x=(\d+)/);
    if (xm) {
      const want = parseFloat(xm[1]);
      let seg = null;
      for (const s of game.level.solids) {
        if (s.y !== game.level.groundY) continue;
        if (want >= s.x - 40 && want <= s.x + s.w + 40) { seg = s; break; }
      }
      if (!seg) {
        let bestD = Infinity;
        for (const s of game.level.solids) {
          if (s.y !== game.level.groundY) continue;
          const d = Math.abs((s.x + s.w / 2) - want);
          if (d < bestD) { bestD = d; seg = s; }
        }
      }
      if (seg) {
        player.x = clamp(want, seg.x + 30, seg.x + seg.w - 80);
        player.y = game.level.groundY - player.h - 4;
        player.invuln = 2.5;
        cam.x = clamp(player.x - CFG.W * 0.4, 0, Math.max(0, game.level.width - CFG.W));
      }
    }
  }
  Sound.play('menu');
  requestAnimationFrame(frame);
})();
